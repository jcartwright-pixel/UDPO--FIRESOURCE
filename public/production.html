<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Production Lines · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plant.css">
  <link rel="stylesheet" href="css/production.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/production-rules.js"></script>
</head>
<body class="fill plant-page pd-page">
  <!-- The TV has no desktop menu (like the Plant Performance kiosk): set before app.js builds the menu. -->
  <script>if (new URLSearchParams(location.search).get('tv') === '1') document.body.classList.add('pd-tv', 'phone');</script>
  <div class="signin" id="signin" hidden>
    <h1>Production Lines</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Plant Production</span><h1 id="page-title">Production Lines</h1></div>
      <div class="hstats" id="hstats"></div>
      <a class="lt-top" id="week-link" href="production.html?view=week" data-top>This Week</a>
      <a class="lt-top" id="tv" href="production.html?tv=1" data-top>TV Display</a>
      <a class="lt-top" href="line.html" data-top>Line Tablet</a>
      <a class="lt-top" href="linetargets.html" data-top>Line Targets</a>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view" id="view">
      <!-- ?tv=1: the TV itself (Joe 10/11, mock-up B): no app header or menu, every line in green, yellow or red. -->
      <div class="pd-tvh"><img src="img/ud-logo.webp" alt="United Dairy"><div><b id="tv-plant">PRODUCTION</b><span id="tv-shift"></span></div><div class="pd-clock" id="tv-clock"></div></div>
      <div class="pd-sub" id="sub"></div>
      <!-- Joe 10/14 (mock-up A): the kinds of line, the plant's totals; (mock-up B) one line's shift, opened by clicking its card. -->
      <div class="pd-filters chips" id="filters"></div>
      <div class="pd-totals" id="totals"></div>
      <div class="pd-tabs chips" id="tabs" hidden></div>
      <div class="pd-detail" id="detail" hidden></div>
      <!-- Joe 10/14 follow-on: the weekly line scorecard (production.html?view=week). -->
      <div class="pd-week" id="week" hidden></div>
      <div class="pd-tiles" id="tiles"></div>
      <div class="pd-legend" id="legend"><span class="g">&#9679; At or ahead</span><span class="a">&#9679; Up to 10% behind</span><span class="r">&#9679; More than 10% behind or stopped</span><span class="f">&#9679; Speed outside its range</span><span class="b">&#9679; Changeover or CIP wash</span></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, showError, shortDate, watchPerson } from './js/app.js';
    import { doc, onSnapshot, collection, query, where } from './js/firebase.js';
    import { watchProduction, lineView, fmt, shiftText } from './js/production.js';
    import { plantFor } from './js/pmaint.js';

    // Production Lines (Joe 10/11): every line this shift, made against target, stopped or running, and the speed flag (Joe: a
    // product run under or over its allowed speed). Plant Production's first page; TV Display (?tv=1) is the same board for the
    // TV on the floor, mock-up B. Read only: the line tablets enter everything.
    const L = window.UDLogic, params = new URLSearchParams(location.search), tv = params.get('tv') === '1';
    const ALL_PLANTS = L.PLANTS && L.PLANTS.length ? L.PLANTS : [{ id: 'fac_uniontown', name: 'Uniontown' }];
    const testNow = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && Date.parse(params.get('now') || '') ? Date.parse(params.get('now')) : 0;
    const started = Date.now(), now = () => testNow ? testNow + (Date.now() - started) : Date.now();
    window.udBack = () => { if (tv) { location.search = ''; return true; } return false; };
    let person = null, data = null, stop = null, db = null, plant = params.get('plant') || '', lineId = tv ? '' : params.get('line') || '', kindFilter = 'ALL';
    let weekView = !tv && params.get('view') === 'week', weekOf = params.get('week') || '', weekRuns = [], weekKey = '', stopWeek = null;
    const R = window.UDProduction, KINDS = [['ALL', 'All lines'], ['FILLER', 'Fillers'], ['HTST', 'HTST'], ['PACK', 'Boxing & Totes'], ['BLOWMOLD', 'Blow Mold'], ['ATTN', 'Needs attention']];
    // Joe 10/14: line efficiency is for managers only (not the tablets or the TV).
    const manager = () => !tv && !!person && L.hasRole(person, L.REORDER_ROLES);
    const clockOf = (iso) => { const x = Date.parse(iso || ''); return isFinite(x) ? new Date(x).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; };
    const who = (email) => String(email || '').split('@')[0];
    const latest = (v, field) => { const c = (v.run && v.run.checks) || {}; for (const k of Object.keys(c).map(Number).sort((a, b) => b - a)) if (c[k] && String(c[k][field] || '') !== '') return { value: c[k][field], at: c[k].at }; return null; };
    // A line needs attention when it is stopped, has a stop with no reason, is off its speed, more than 10% behind, has a check due or is past its CIP hours.
    const attention = (v) => v.state === 'STOPPED' || v.needReason.length > 0 || v.speedFlag === 'OVER' || v.speedFlag === 'UNDER' || (v.pct !== null && v.pct < 90) || (v.check && !v.check.done && v.state !== 'IDLE') || (v.cipHours && v.sinceCipHours !== null && v.sinceCipHours >= v.cipHours) || !!v.diverting || !!(v.machine && (v.machine.speedFlag || v.machine.tempFlag)) || !!(v.reader && v.reader.lastUpc && v.reader.lastUpc === v.reader.lastUnknownUpc);
    const plantName = (id) => (ALL_PLANTS.find(p => p.id === id) || { name: id }).name;

    function render() {
      if (!data) return;
      const t = now(), s = data.shift, views = data.lines.map(l => lineView(data, l, t));
      document.getElementById('tv').href = 'production.html?tv=1&plant=' + encodeURIComponent(plant);
      document.getElementById('week-link').href = 'production.html?view=week&plant=' + encodeURIComponent(plant);
      document.getElementById('tv-plant').textContent = plantName(plant).toUpperCase() + ' PRODUCTION';
      document.getElementById('tv-shift').textContent = shiftText(s) + ' · ' + shortDate(s.date);
      document.getElementById('tv-clock').textContent = new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      document.getElementById('sub').textContent = plantName(plant) + ' · ' + shiftText(s) + ' · ' + shortDate(s.date);
      const running = views.filter(v => v.state === 'RUNNING').length, stopped = views.filter(v => v.state === 'STOPPED').length, flagged = views.filter(v => v.speedFlag === 'OVER' || v.speedFlag === 'UNDER').length;
      const cos = views.filter(v => v.state === 'CHANGEOVER').length, cips = views.filter(v => v.state === 'CIP').length;
      document.getElementById('hstats').innerHTML = [['Lines', views.length, ''], ['Running', running, 'good'], ['Stopped', stopped, stopped ? 'bad' : ''], ['Speed off', flagged, flagged ? 'bad' : ''], ['Changeover', cos, cos ? 'blue' : ''], ['CIP wash', cips, cips ? 'blue' : '']].map(([l, n, k]) => '<div class="' + k + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
      drawTop(views, t);
      const shown = views.filter(v => kindFilter === 'ALL' || (kindFilter === 'ATTN' ? attention(v) : v.kind === kindFilter));
      document.getElementById('tiles').innerHTML = shown.map(v => {
        const word = v.state === 'IDLE' ? 'NOT STARTED' : v.state === 'STOPPED' ? 'STOPPED ' + v.stoppedMin + ' MIN' : v.state === 'CHANGEOVER' ? 'CHANGEOVER ' + v.changeover.minutes + ' MIN' : v.state === 'CIP' ? 'CIP WASH ' + v.cip.minutes + ' MIN' : v.kind === 'HTST' && v.diverting ? 'IN DIVERT' : 'RUNNING';
        const sp = v.speedFlag === 'OVER' ? 'TOO FAST ' + v.speed + '/MIN' : v.speedFlag === 'UNDER' ? 'TOO SLOW ' + v.speed + '/MIN' : v.speed !== null && v.state === 'RUNNING' ? v.speed + '/MIN' : '';
        const off = v.speedFlag === 'OVER' || v.speedFlag === 'UNDER';
        return '<div class="pd-tile ' + v.color + (off ? ' flash' : '') + '" data-line="' + escapeHtml(v.line.operationId) + '"><div class="pd-name">' + escapeHtml(v.line.name) + '</div><div class="pd-prod">' + escapeHtml(v.product || (v.state === 'IDLE' ? 'Nothing entered this shift' : 'No product picked')) + '</div>' +
          '<div class="pd-made"><b>' + fmt(v.made) + '</b><span>of ' + fmt(v.soFar) + '</span></div>' +
          '<div class="pd-foot"><span class="pd-pct">' + (v.pct === null ? '–' : v.pct + '%') + '</span>' + (sp ? '<span class="pd-speed' + (off ? ' off' : '') + '">' + sp + '</span>' : '') + '<span>' + word + '</span></div>' + (tv ? '' : more(v)) + '</div>';
      }).join('') || '<p class="pd-empty">' + (data.read.setup ? 'No production lines are set up for ' + escapeHtml(plantName(plant)) + '.' : 'Reading the lines…') + '</p>';
    }
    // The more on each desktop card (mock-up A).
    function more(v) {
      const tg = v.target, rows = [], b = (x) => '<b>' + x + '</b>';
      if (v.kind === 'HTST') {
        const temp = latest(v, 'recorder'), flow = latest(v, 'flow'), rec = latest(v, 'indicating');
        rows.push((temp ? 'Temp ' + b(escapeHtml(temp.value) + '°F') + ' &nbsp; ' : '') + (flow ? 'Flow ' + b(escapeHtml(flow.value) + ' GPM') + ' &nbsp; ' : '') + 'Diverts ' + b(v.diverts) + (temp || rec ? ' &nbsp; Recorder checked ' + b(clockOf((temp || rec).at)) : ''));
        if (v.source.from || v.source.to) rows.push(escapeHtml([v.source.from, v.source.to].filter(Boolean).join(' → ')));
      } else if (v.speed !== null || (tg && (tg.minSpeed !== null || tg.maxSpeed !== null))) {
        rows.push('Speed ' + b(v.speed === null ? '—' : v.speed + '/min') + (tg && (tg.minSpeed !== null || tg.maxSpeed !== null) ? ' (' + (tg.minSpeed !== null ? tg.minSpeed : 0) + (tg.maxSpeed !== null ? '–' + tg.maxSpeed : '+') + ')' : '') + (manager() && v.efficiency && v.efficiency.oee !== null ? ' &nbsp; Efficiency ' + b(v.efficiency.oee + '%') : ''));
      } else if (manager() && v.efficiency && v.efficiency.oee !== null) rows.push('Efficiency ' + b(v.efficiency.oee + '%'));
      // The label reader (Joe 10/14): the UPC on the jugs is not one of this line's products.
      if (v.reader && v.reader.lastUpc && v.reader.lastUpc === v.reader.lastUnknownUpc) rows.push('<b class="pd-bad">WRONG LABEL</b> UPC ' + escapeHtml(v.reader.lastUnknownUpc));
      // From the machine's controller (Joe 10/14): speed and temperature, red outside the range set on Line Targets.
      const m = v.machine;
      if (m && (m.speed !== null || m.temp !== null)) {
        const flag = (f, hi, lo) => f === 'HIGH' ? ' <b class="pd-bad">' + hi + '</b>' : f === 'LOW' ? ' <b class="pd-bad">' + lo + '</b>' : '';
        rows.push('Machine' + (m.speed !== null ? ' &nbsp; ' + escapeHtml(m.speedName) + ' ' + b(fmt(m.speed)) + flag(m.speedFlag, 'TOO FAST', 'TOO SLOW') : '') + (m.temp !== null ? ' &nbsp; Temp ' + b(fmt(m.temp) + '°F') + flag(m.tempFlag, 'TOO HOT', 'TOO COLD') : '') + (m.stale ? ' &nbsp; <b class="pd-bad">not reading</b>' : ''));
      }
      if (v.changeover) rows.push((v.kind === 'BLOWMOLD' ? 'Mold change ' : 'Changeover ') + b(v.changeover.minutes + (v.changeoverStd ? ' of ' + v.changeoverStd : '') + ' min') + (v.changeoverStd ? ' standard' : '') + ' &nbsp; Checklist ' + b(Object.keys(v.changeover.checks).length + ' of ' + (R.CHANGEOVER_CHECKS[v.kind] || []).length));
      if (v.cip) rows.push('CIP wash ' + b(v.cip.minutes + ' min') + ' since ' + clockOf(v.cip.start));
      else if (v.cipHours && v.sinceCipHours !== null) rows.push('Since CIP ' + b(v.sinceCipHours + ' of ' + v.cipHours + ' h'));
      rows.push('<span' + (v.state === 'STOPPED' ? ' class="pd-bad"' : '') + '>Stopped ' + b(v.downMin + ' min') + (v.topReason ? ' · ' + escapeHtml(v.topReason) : '') + '</span>' + (v.wasteTotal ? ' &nbsp; Waste ' + b(fmt(v.wasteTotal)) : '') + (v.kind === 'BLOWMOLD' && v.stock !== null ? ' &nbsp; Jugs ahead ' + b(fmt(v.stock)) : ''));
      if (v.check && v.state !== 'IDLE') rows.push('Quality check ' + (v.check.done ? b('done') + ' · next ' + clockOf(v.check.next) : '<b class="pd-due">due ' + clockOf(v.check.at) + '</b>'));
      if (v.crewOn.length) rows.push('Crew: ' + escapeHtml(v.crewOn.join(', ')));
      if (v.next) rows.push('<span class="pd-next">Next: ' + escapeHtml(v.next.product) + (v.next.qty ? ' · ' + fmt(v.next.qty) : '') + '</span>');
      return '<div class="pd-bar"><i class="' + (v.color || 'x') + '" style="width:' + Math.min(100, v.pct || 0) + '%"></i></div><div class="pd-more">' + rows.map(r => '<div>' + r + '</div>').join('') + '</div>';
    }
    // Filters and the plant's totals (mock-up A), or one line's tabs (mock-up B).
    function drawTop(views, t) {
      const one = !weekView && !!lineId && views.some(v => v.line.operationId === lineId);
      document.getElementById('week').hidden = !weekView;
      if (weekView) {
        ['filters', 'totals', 'tiles', 'legend', 'tabs', 'detail'].forEach(id => { document.getElementById(id).hidden = true; });
        document.getElementById('page-title').textContent = 'This Week';
        return drawWeek(t);
      }
      document.getElementById('filters').hidden = tv || one;
      document.getElementById('totals').hidden = tv || one;
      document.getElementById('tiles').hidden = one;
      document.getElementById('legend').hidden = one;
      document.getElementById('tabs').hidden = !one;
      document.getElementById('detail').hidden = !one;
      document.getElementById('page-title').textContent = one ? views.find(v => v.line.operationId === lineId).line.name : 'Production Lines';
      if (tv) return;
      if (one) return drawDetail(views.find(v => v.line.operationId === lineId), views, t);
      document.getElementById('filters').innerHTML = KINDS.filter(k => k[0] === 'ALL' || k[0] === 'ATTN' || views.some(v => v.kind === k[0]))
        .map(k => { const n = k[0] === 'ATTN' ? views.filter(attention).length : 0; return '<button type="button" data-kind="' + k[0] + '"' + (kindFilter === k[0] ? ' class="on"' : '') + '>' + escapeHtml(k[1]) + (n ? '<b>' + n + '</b>' : '') + '</button>'; }).join('');
      const sum = (f) => views.reduce((n, v) => n + (f(v) || 0), 0), effs = views.filter(v => v.efficiency && v.efficiency.oee !== null && v.efficiency.plannedMin > 0);
      const plantEff = effs.length ? Math.round(effs.reduce((n, v) => n + v.efficiency.oee * v.efficiency.plannedMin, 0) / effs.reduce((n, v) => n + v.efficiency.plannedMin, 0)) : null;
      const nextCip = views.filter(v => v.cipHours && v.lastCipAt && !v.cip).map(v => ({ v, at: Date.parse(v.lastCipAt) + v.cipHours * 3600000 })).sort((a, b) => a.at - b.at)[0];
      const boxes = [['Plant made', fmt(sum(v => v.made))], ['Target so far', fmt(sum(v => v.soFar))]];
      if (manager()) boxes.push(['Efficiency', plantEff === null ? '—' : plantEff + '%']);
      boxes.push(['Stopped', sum(v => v.downMin) + ' min'], ['Waste', fmt(sum(v => v.wasteTotal))], [nextCip ? 'Next CIP · ' + escapeHtml(nextCip.v.line.name) : 'Next CIP', nextCip ? clockOf(new Date(nextCip.at).toISOString()) : '—']);
      document.getElementById('totals').innerHTML = boxes.map(x => '<div><span>' + x[0] + '</span><b>' + x[1] + '</b></div>').join('');
    }
    // One line's shift (mock-up B): timeline, hour by hour, efficiency, changeovers, stops, waste, quality checks, CIP, crew and notes.
    function drawDetail(v, views, t) {
      const run = v.run || {}, mgr = manager();
      document.getElementById('hstats').innerHTML = [['Made', fmt(v.made), ''], ['Target so far', fmt(v.soFar), ''], mgr ? ['Efficiency', v.efficiency && v.efficiency.oee !== null ? v.efficiency.oee + '%' : '—', 'good'] : null, ['Stopped', v.downMin + ' min', v.downMin ? 'bad' : '']]
        .filter(Boolean).map(([l, n, k]) => '<div class="' + k + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
      document.getElementById('tabs').innerHTML = '<button type="button" data-tab="">All lines</button>' + views.map(x => '<button type="button" data-tab="' + escapeHtml(x.line.operationId) + '"' + (x.line.operationId === lineId ? ' class="on"' : '') + '>' + escapeHtml(x.line.name) + '</button>').join('');
      const box = (title, inner, cls) => '<section class="pd-box' + (cls ? ' ' + cls : '') + '"><h3>' + title + '</h3>' + inner + '</section>';
      // heads: [title, 1 = a number on the right, or 'w' = words that may wrap].
      const cls = (h) => h[1] === 'w' ? ' class="w"' : h[1] ? ' class="n"' : '';
      const table = (heads, rows, empty) => rows.length ? '<table class="pd-t"><thead><tr>' + heads.map(h => '<th' + cls(h) + '>' + h[0] + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => '<td' + cls(heads[i]) + '>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>' : '<p class="pd-none">' + empty + '</p>';
      // Timeline
      const segs = R.timeline(run, t), total = segs.reduce((n, x) => n + x.minutes, 0) || 1, start = Date.parse(run.shiftStart || ''), stopAt = Date.parse(run.shiftEnd || '');
      const ticks = [];
      if (start && stopAt) for (let a = Math.ceil(start / 3600000) * 3600000; a <= stopAt; a += 3600000) ticks.push('<span style="left:' + ((a - start) / (stopAt - start) * 100) + '%">' + new Date(a).toLocaleTimeString('en-US', { hour: 'numeric' }) + '</span>');
      const NAMES = { run: 'Running', stop: 'Stopped', co: 'Changeover', cip: 'CIP / sanitation', brk: 'Break', idle: 'Not started' };
      const tl = segs.length ? '<div class="pd-tl">' + segs.map(x => '<i class="' + x.kind + '" style="width:' + (x.minutes / total * 100) + '%" title="' + (NAMES[x.kind] || 'Still to come') + ' ' + clockOf(x.from) + ', ' + x.minutes + ' min"></i>').join('') + '</div><div class="pd-ticks">' + ticks.join('') + '</div><div class="pd-key">' + Object.keys(NAMES).map(k => '<span><i class="' + k + '"></i>' + NAMES[k] + '</span>').join('') + '</div>' : '<p class="pd-none">Nothing entered on this line this shift.</p>';
      // Hour by hour
      const hrs = R.hourly(run, v.targets, t).filter(x => x.past);
      const mach = v.machine, hasM = !!mach && hrs.some(x => x.speed !== null || x.temp !== null);
      const mCell = (val, lo, hi, unit) => val === null ? '–' : R.machineFlag(val, lo, hi) ? '<b class="pd-bad">' + fmt(val) + unit + '</b>' : fmt(val) + unit;
      const hourRows = hrs.map(x => [clockOf(x.from).replace(':00', '') + '–' + clockOf(x.to).replace(':00', ''), escapeHtml(x.products.join(' → ') || '—'), fmt(x.made), fmt(x.target), x.pct === null ? '–' : x.pct, x.stopped]
        .concat(hasM ? [mCell(x.speed, mach.speedLow, mach.speedHigh, ''), mCell(x.temp, mach.tempLow, mach.tempHigh, '°')] : []));
      const machBox = mach ? box('From the machine', (() => {
        const range = (lo, hi, u) => lo === null && hi === null ? 'no range set' : (lo === null ? 'up' : lo + u) + ' to ' + (hi === null ? 'any' : hi + u);
        const line = (name, now, lo, hi, mn, mx, out, f, u) => now === null && mn === null ? '' : '<p><b>' + escapeHtml(name) + ':</b> ' + (now === null ? '—' : (f ? '<b class="pd-bad">' + fmt(now) + u + '</b>' : '<b>' + fmt(now) + u + '</b>')) + ' now · shift ' + (mn === null ? '—' : fmt(mn) + u + ' to ' + fmt(mx) + u) + ' · range ' + escapeHtml(range(lo, hi, u)) + (out ? ' · <b class="pd-bad">' + out + ' min outside</b>' : '') + '</p>';
        return (mach.counter !== null ? '<p><b>Machine counter:</b> ' + fmt(mach.counter) + (v.counter === 'CONTROLLER' ? ' (the jugs made count from it)' : '') + '</p>' : '') +
          line(mach.speedName, mach.speed, mach.speedLow, mach.speedHigh, mach.speedMin, mach.speedMax, mach.speedOutMin, mach.speedFlag, '') +
          line('Temperature', mach.temp, mach.tempLow, mach.tempHigh, mach.tempMin, mach.tempMax, mach.tempOutMin, mach.tempFlag, '°F') +
          '<p class="pd-none">Read ' + (mach.stale ? '<b class="pd-bad">last at ' + clockOf(mach.at) + ', not reading now</b>' : clockOf(mach.at)) + ' from the machine\'s controller (read-only).</p>';
      })()) : '';
      const eff = v.efficiency;
      const effBox = mgr ? box('How the shift is going', eff ? '<p class="pd-eff">Running <b>' + (eff.running === null ? '—' : eff.running + '%') + '</b> of the time &nbsp; At speed <b>' + (eff.speed === null ? '—' : eff.speed + '%') + '</b> &nbsp; Good <b>' + (eff.good === null ? '—' : eff.good + '%') + '</b></p><p class="pd-oee">Line efficiency ' + (eff.oee === null ? '—' : eff.oee + '%') + '</p><p class="pd-none">Running time × speed × good product. Changeovers and stops count against running time; CIP washes and breaks do not.</p>' : '<p class="pd-none">Starts with the shift\'s first product.</p>') : '';
      const coRows = v.changeovers.map(c => [escapeHtml((c.from || '—') + ' → ' + (c.to || '—')), clockOf(c.start), c.end ? c.minutes : c.minutes + ' so far', v.changeoverStd === null ? '–' : v.changeoverStd]);
      const stopRows = (run.stops || []).map(s => { const m = Math.round(((s.end ? Date.parse(s.end) : t) - Date.parse(s.start)) / 60000); return [clockOf(s.start), s.end ? m : m + ' so far', escapeHtml(s.reason || 'No reason yet') + (s.woNumber ? ' · <a href="pmaint.html">work order ' + escapeHtml(s.woNumber) + '</a>' : ''), escapeHtml(who(s.reasonBy || s.by))]; });
      const wasteRows = Object.keys(v.waste).map(k => [escapeHtml(k), fmt(v.waste[k])]);
      const fields = R.CHECK_FIELDS[v.kind] || [], every = (R.CHECK_EVERY[v.kind] || 2) * 3600000, checks = run.checks || {};
      const checkRows = Object.keys(checks).map(Number).sort((a, b) => a - b).map(n => [clockOf(new Date(start + n * every).toISOString())].concat(fields.map(f => { const x = String(checks[n][f[0]] === undefined ? '' : checks[n][f[0]]), wf = R.weightFlag(f[0], x, { jugWeightLow: v.jugWeight.low, jugWeightHigh: v.jugWeight.high }); return /NOT OK|LATE/.test(x) || wf ? '<b class="pd-bad">' + escapeHtml(x) + (wf ? ' ' + wf : '') + '</b>' : escapeHtml(x); }), [escapeHtml(who(checks[n].by))]));
      const cipRows = v.cips.map(c => [clockOf(c.start), c.end ? clockOf(c.end) : 'washing', c.minutes, c.result === 'FAIL' ? '<b class="pd-bad">Failed</b>' : c.result ? 'Passed' : '']);
      const crew = v.crew.length ? v.crew.map(c => escapeHtml(c.name) + (c.on ? '' : ' (off)')).join(', ') : 'No one signed on.';
      const notes = '<p><b>Crew:</b> ' + crew + '</p>' + (v.prevNote ? '<p><b>From last shift' + (v.prevNoteBy ? ' (' + escapeHtml(who(v.prevNoteBy)) + ')' : '') + ':</b> ' + escapeHtml(v.prevNote) + '</p>' : '') + '<p><b>For the next shift:</b> ' + (v.note ? escapeHtml(v.note) : 'no note yet') + '</p>' +
        (v.kind === 'HTST' ? '<p><b>Silo and tanks:</b> ' + escapeHtml([v.source.from, v.source.to].filter(Boolean).join(' → ') || '—') + ' &nbsp; <b>Diverts:</b> ' + v.diverts + '</p>' : '') + (v.kind === 'BLOWMOLD' ? '<p><b>Resin lot:</b> ' + escapeHtml(v.lot || '—') + ' &nbsp; <b>Jugs ahead:</b> ' + (v.stock === null ? '—' : fmt(v.stock)) + '</p>' : '') +
        (v.next ? '<p><b>Up next:</b> ' + escapeHtml(v.next.product) + (v.next.qty ? ' · ' + fmt(v.next.qty) : '') + '</p>' : '');
      document.getElementById('detail').innerHTML = box(escapeHtml(v.line.name) + ' · this shift', tl, 'wide') +
        '<div class="pd-col">' + box('Hour by hour', table([['Hour'], ['Product', 'w'], ['Made', 1], ['Target', 1], ['%', 1], ['Stopped', 1]].concat(hasM ? [[escapeHtml(mach.speedName), 1], ['Temp', 1]] : []), hourRows, 'No hours yet this shift.')) +
        box('Stops and why', table([['From'], ['Min', 1], ['Why', 'w'], ['Who']], stopRows, 'No stops this shift.')) + box('Waste and rejects', table([['Why', 'w'], ['How many', 1]], wasteRows, 'No waste entered this shift.')) + '</div>' +
        '<div class="pd-col">' + machBox + effBox + box('Changeovers', table([['From → to', 'w'], ['Started'], ['Min', 1], ['Standard', 1]], coRows, 'No changeovers this shift.')) +
        box('CIP washes', table([['Started'], ['Done'], ['Min', 1], ['Result']], cipRows, v.lastCipAt ? 'None this shift. Last one that passed: ' + shortDate(v.lastCipAt.slice(0, 10)) + ' ' + clockOf(v.lastCipAt) + '.' : 'None this shift.')) +
        box('Crew and notes', notes) + '</div>' +
        box('Quality checks', table([['Time']].concat(fields.map(f => [escapeHtml(f[1]), f[2] === 'num' ? 1 : 0])).concat([['By']]), checkRows, 'No checks yet this shift.'), 'wide');
    }
    // The weekly line scorecard (Joe 10/14 follow-on): each line's week, Sunday to Saturday, and the plant's biggest losses.
    function weekStartOf() { return L.weekStart(weekOf || (data.shift ? data.shift.date : L.operatingDay(new Date()))); }
    function followWeek() {
      const from = weekStartOf(), dates = [0, 1, 2, 3, 4, 5, 6].map(n => L.addDays(from, n));
      if (weekKey === plant + from) return;
      weekKey = plant + from; weekRuns = [];
      if (stopWeek) stopWeek();
      stopWeek = onSnapshot(query(collection(db, 'productionRuns'), where('date', 'in', dates)), q => {
        weekRuns = q.docs.map(d => d.data()).filter(v => (String(v.facilityId || '').trim() || 'fac_uniontown') === plant);
        render();
      }, e => showError('Could not read the week (' + e.message + ').'));
    }
    function drawWeek(t) {
      followWeek();
      const from = weekStartOf(), to = L.addDays(from, 6), mgr = manager();
      const W = R.weekScore(weekRuns, data.lines, id => R.targetsFor(data.products[id] || []), data.lineInfo || {}, t);
      const hrs = (m) => m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min';
      const pctCell = (p) => p === null ? '–' : '<b class="' + (p >= 100 ? 'pd-good' : p >= 90 ? 'pd-due' : 'pd-bad') + '">' + p + '%</b>';
      document.getElementById('hstats').innerHTML = [['Made', fmt(W.lines.reduce((n, x) => n + x.made, 0)), ''], ['Stopped', hrs(W.lines.reduce((n, x) => n + x.downMin, 0)), ''], ['Waste', fmt(W.lines.reduce((n, x) => n + x.wasteTotal, 0)), ''], ['Changeovers', W.lines.reduce((n, x) => n + x.changeovers, 0), '']]
        .map(([l, n, k]) => '<div class="' + k + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
      document.getElementById('sub').textContent = plantName(plant) + ' · Week of ' + shortDate(from) + ' to ' + shortDate(to);
      const rows = W.lines.map(x => '<tr data-line="' + escapeHtml(x.operationId) + '"><td class="w"><b>' + escapeHtml(x.line) + '</b></td><td class="n">' + x.shifts + '</td><td class="n">' + fmt(x.made) + '</td><td class="n">' + fmt(x.soFar) + '</td><td class="n">' + pctCell(x.pct) + '</td>' +
        '<td class="n">' + hrs(x.downMin) + '</td><td class="w">' + (x.topReasons.length ? x.topReasons.map(r => escapeHtml(r.reason) + ' ' + hrs(r.minutes)).join(' · ') : '—') + '</td><td class="n">' + fmt(x.wasteTotal) + '</td>' +
        '<td class="n">' + (x.changeovers ? x.changeovers + ' · avg ' + x.changeoverAvg + ' min' + (x.changeoverStd ? ' (standard ' + x.changeoverStd + ')' : '') + (x.overStd ? ' · <b class="pd-bad">' + x.overStd + ' over</b>' : '') : '—') + '</td>' +
        (mgr ? '<td class="n">' + (x.oee === null ? '–' : x.oee + '%') + '</td>' : '') + '</tr>').join('');
      const losses = W.topLosses.length ? '<ol class="pd-losses">' + W.topLosses.map(r => '<li><b>' + escapeHtml(r.reason) + '</b> ' + hrs(r.minutes) + '</li>').join('') + '</ol>' : '<p class="pd-none">No stops this week.</p>';
      document.getElementById('week').innerHTML = '<div class="pd-weeknav chips"><button type="button" data-week="-7">Last Week</button><button type="button" data-week="0"' + (weekOf ? '' : ' class="on"') + '>This Week</button><button type="button" data-week="7"' + (weekOf ? '' : ' disabled') + '>Next Week</button></div>' +
        '<section class="pd-box"><h3>Biggest losses this week</h3>' + losses + '</section>' +
        '<section class="pd-box"><h3>Each line, ' + shortDate(from) + ' to ' + shortDate(to) + '</h3><table class="pd-t"><thead><tr><th>Line</th><th class="n">Shifts</th><th class="n">Made</th><th class="n">Target</th><th class="n">%</th><th class="n">Stopped</th><th class="w">Top stop reasons</th><th class="n">Waste</th><th class="n">Changeovers</th>' + (mgr ? '<th class="n">Efficiency</th>' : '') + '</tr></thead><tbody>' + rows + '</tbody></table></section>';
    }
    document.getElementById('week').addEventListener('click', e => {
      const b = e.target.closest('[data-week]');
      if (!b) return;
      const n = Number(b.dataset.week), today = L.weekStart(data.shift ? data.shift.date : L.operatingDay(new Date()));
      weekOf = n === 0 ? '' : L.addDays(weekStartOf(), n);
      if (weekOf && weekOf >= today) weekOf = '';
      history.replaceState(null, '', 'production.html?plant=' + encodeURIComponent(plant) + '&view=week' + (weekOf ? '&week=' + weekOf : '') + (testNow ? '&now=' + encodeURIComponent(params.get('now')) : ''));
      render();
    });
    document.getElementById('filters').addEventListener('click', e => { const b = e.target.closest('[data-kind]'); if (!b) return; kindFilter = b.dataset.kind; render(); });
    document.getElementById('tiles').addEventListener('click', e => {
      if (tv) return;
      const c = e.target.closest('.pd-tile[data-line]');
      if (!c) return;
      lineId = c.dataset.line;
      history.pushState(null, '', 'production.html?plant=' + encodeURIComponent(plant) + '&line=' + encodeURIComponent(lineId) + (testNow ? '&now=' + encodeURIComponent(params.get('now')) : ''));
      render(); document.getElementById('view').scrollTop = 0; window.scrollTo(0, 0);
    });
    document.getElementById('tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (!b) return;
      lineId = b.dataset.tab;
      history.replaceState(null, '', 'production.html?plant=' + encodeURIComponent(plant) + (lineId ? '&line=' + encodeURIComponent(lineId) : '') + (testNow ? '&now=' + encodeURIComponent(params.get('now')) : ''));
      render();
    });
    window.addEventListener('popstate', () => { lineId = new URLSearchParams(location.search).get('line') || ''; render(); });
    function follow() {
      if (stop) stop();
      data = null;
      stop = watchProduction(db, plant, d => { data = d; render(); }, e => showError('Could not read the lines (' + e.message + '). Check the network.'), now);
    }
    requireSignIn(async (user) => {
      ({ db } = await start());
      watchPerson(db, user, p => {
        person = p;
        // Review item 31 (Joe 10/13): no plant drop-down inside a plant. The plant is ?plant= of the link, else the plant the
        // screen was opened from (this tab), else the person's first plant (pmaint.js plantFor); its name is in the line under the title.
        if (!stop) plant = plantFor(person, params.get('plant')).id;
        if (!stop) follow(); else render();
      }, { withEmail: true });
      setInterval(render, 15000);
    });
  </script>
