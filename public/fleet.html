<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Fleet Service · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
</head>
<body class="fill issues-page fleet-page">
  <div class="signin" id="signin" hidden>
    <h1>Fleet Service</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Fleet Service &amp; Compliance</h1><small id="sub">PM, reefer service, DOT and plates. Miles come from the driver's daily inspection; work history from the garage.</small></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="due" aria-selected="true">Due · Services &amp; DOT <b id="tab-due"></b></button>
        <button type="button" role="tab" data-view="work" aria-selected="false">Work Orders <b id="tab-work"></b></button>
        <button type="button" role="tab" data-view="history" aria-selected="false">History</button>
        <button type="button" role="tab" data-view="setup" aria-selected="false">Fleet Service Setup</button>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="kpis" id="kpis"></div>
      <div class="actions" id="bar" data-top></div>
      <div class="sheet scroll-list" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, save, escapeHtml, shortDate, showError } from './js/app.js';
    import { printSaved } from './js/print-sheet.js';
    import { collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

    // The current app's Fleet Service (FleetService.html, 220_V7276_GarageFleetService.gs), Send to Garage puts a PM, reefer
    // service or DOT inspection on the Garage Station (garage.js); the setup dates, rules and technicians are still changed in the sheet.
    const L = window.UDLogic;
    const STATUS = { OVERDUE: ['Overdue', 'warn'], AT_GARAGE: ['At garage', 'yes'], DUE_SOON: ['Due soon', 'warn soon'], NO_MILES: ['No miles yet', 'no'], SET_UP: ['Needs start date', 'no'], OK: ['OK', 'yes'] };
    const JOB = { NEW: ['New', 'warn'], WORKING: ['Working', 'yes'], PARTS: ['Waiting on parts', 'warn'], DONE: ['Done', 'no'] };
    let view = ['due', 'work', 'history', 'setup'].indexOf(new URLSearchParams(location.search).get('view')) >= 0 ? new URLSearchParams(location.search).get('view') : 'due', equipment = [], setup = [], odometers = [], orders = [], techs = [], search = '', kindFilter = '';
    const num = (n) => n === '' || n == null ? '' : Number(n).toLocaleString();
    const when = (s) => { const k = String(s || '').slice(0, 10); return /^\d{4}-\d{2}-\d{2}$/.test(k) ? shortDate(k) : ''; };
    const pill = (s) => '<span class="pill ' + s[1] + '">' + escapeHtml(s[0]) + '</span>';
    const today = () => L.operatingDay(new Date());

    function units() {
      const seen = {};
      return equipment.map(e => ({ e, type: L.fleetKind(e.type) })).filter(({ e, type }) => type && e.unit && (!e.facilityId || e.facilityId === 'fac_uniontown') &&
        e.sourcePresent !== false && !L.unitLeased(e) && ['INACTIVE', 'DISABLED', 'RETIRED', 'SOLD'].indexOf(String(e.status || 'ACTIVE').toUpperCase()) < 0)
        .map(({ e, type }) => ({ unit: String(e.unit).toUpperCase(), type })).filter(u => !seen[u.unit] && (seen[u.unit] = true))
        .sort((a, b) => (a.type === b.type ? 0 : a.type === 'TRUCK' ? -1 : 1) || a.unit.localeCompare(b.unit, undefined, { numeric: true }));
    }
    function miles() {
      const out = {};
      odometers.forEach(o => { const u = String(o.unit || '').toUpperCase(); if (u && (!out[u] || String(o.at) > String(out[u].at))) out[u] = o; });
      return out;
    }
    const open = () => orders.filter(o => String(o.status || 'NEW').toUpperCase() !== 'DONE');
    // The current app's Work Orders list (FleetService.html renderWork): who sent the job in plain words, working first, then sent from
    // the office, waiting on parts, not started; newest first within each. "What they fixed" is the fix and the mechanic's note together.
    const SOURCE = { WRITE_UP: 'Driver write-up', OFFICE: 'Office · Fleet Service', TECH: 'Garage found it' };
    const cameFrom = (x) => x.source_from || SOURCE[String(x.source || '').toUpperCase()] || x.source || '';
    const JOB_RANK = (x) => { const s = String(x.status || 'NEW').toUpperCase(); return s === 'WORKING' ? 0 : s === 'PARTS' ? 2 : String(x.source).toUpperCase() === 'OFFICE' ? 1 : 3; };
    const openSorted = () => open().sort((a, b) => JOB_RANK(a) - JOB_RANK(b) || String(b.created_at || '').localeCompare(String(a.created_at || '')));
    const fixedText = (x) => [x.fixed, x.fixed_note].filter(Boolean).join(' · ');
    // A job's mechanic minutes: the saved total, else each mechanic's finished clock added up.
    const minsOf = (x) => Number(x.minutes) || (Array.isArray(x.labor) ? x.labor.reduce((n, l) => n + (l && l.end ? Number(l.minutes) || 0 : 0), 0) : 0);
    const hrs = (m) => m ? Math.round(m / 6) / 10 : '';
    const done = () => orders.filter(o => String(o.status).toUpperCase() === 'DONE').sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));
    const kpis = (list) => list.map(([n, label, c]) => '<div class="' + (c || '') + '"><b>' + n + '</b><span>' + label + '</span></div>').join('');
    const table = (cols, head, rows, empty) => '<table class="issues"><colgroup>' + cols.map(w => '<col style="width:' + w + '%">').join('') + '</colgroup><thead><tr>' +
      head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + (rows || '<tr><td colspan="' + head.length + '" class="empty">' + empty + '</td></tr>') + '</tbody></table>';

    // Joe 10/10 picked mock-up A: one row per unit, PM / Reefer, DOT and Plates side by side in colored words with a thin colored edge,
    // then Miles / hours now and Status;
    // units that need something first. Every figure the old list showed (due at, now, left, last done) is in the box or its tip.
    const RANK = { OVERDUE: 0, AT_GARAGE: 1, DUE_SOON: 2, NO_MILES: 3, SET_UP: 4, OK: 5 };
    const md = (k) => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(k || '')); return m ? Number(m[2]) + '/' + Number(m[3]) + '/' + m[1].slice(2) : ''; };
    function boxText(i) {
      if (!i) return { big: '—', small: 'Not tracked', s: 'NA' };
      const days = typeof i.left === 'string' ? parseInt(i.left, 10) : null;
      if (i.status === 'SET_UP') return { big: 'Needs start date', small: i.key === 'PM' ? 'type the last PM miles' : 'type the last date', s: 'SET_UP' };
      if (i.status === 'NO_MILES') return { big: 'No miles yet', small: 'from the daily inspection', s: 'NO_MILES' };
      if (i.status === 'AT_GARAGE') return { big: 'At garage', small: i.jobId || '', s: 'AT_GARAGE' };
      if (i.key === 'PM') { const left = Number(i.left); return { big: left < 0 ? 'Over ' + num(-left) + ' mi' : num(left) + ' mi left', small: 'due at ' + num(i.dueAt) + ' mi', s: i.status }; }
      return { big: days < 0 ? 'Overdue ' + md(i.dueAt) : (i.status === 'OK' ? md(i.dueAt) : 'Due ' + md(i.dueAt)), small: days < 0 ? Math.abs(days) + ' days late' : days + ' days', s: i.status };
    }
    function unitGrid(due, hit) {
      const by = {};
      due.units.forEach(u => { by[u.unit] = { unit: u.unit, type: u.type, c: {} }; });
      due.items.forEach(i => { const r = by[i.unit]; if (r) r.c[i.key === 'REEFER' ? 'PM' : i.key] = i; });
      const rows = Object.values(by).filter(r => hit(r.unit)).map(r => { r.worst = Object.values(r.c).reduce((w, i) => RANK[i.status] < RANK[w] ? i.status : w, 'OK'); return r; })
        .sort((a, b) => RANK[a.worst] - RANK[b.worst] || (a.type === b.type ? 0 : a.type === 'TRUCK' ? -1 : 1) || a.unit.localeCompare(b.unit, undefined, { numeric: true }));
      const need = rows.filter(r => r.worst !== 'OK').length;
      const now = (r) => { const i = r.c.PM; return i && i.now !== '' && i.now !== undefined && i.now !== null ? num(i.now) + (r.type === 'TRUCK' ? ' mi' : ' hrs') : ''; };
      const tip = (i) => !i ? '' : [i.what, 'Due ' + (i.key === 'PM' ? num(i.dueAt) + (i.dueAt !== '' ? ' mi' : '') : when(i.dueAt)), i.now !== '' && i.now !== undefined ? 'Now ' + num(i.now) : '', 'Left ' + (typeof i.left === 'number' ? num(i.left) + ' mi' : i.left), 'Last done ' + when(i.last), (STATUS[i.status] || [''])[0]].filter(Boolean).join(' · ');
      const box = (i) => { const x = boxText(i); return '<td class="gc ' + x.s + '" title="' + escapeHtml(tip(i)) + '"><b>' + escapeHtml(x.big) + '</b><small>' + escapeHtml(x.small) + '</small></td>'; };
      // Send to Garage (managers): the PM / reefer service and DOT inspection due or overdue become Garage Station jobs. Plates never go.
      const sendable = (r) => ['PM', 'DOT'].map(k => r.c[k]).filter(i => i && (i.status === 'OVERDUE' || i.status === 'DUE_SOON'));
      const send = (r) => r.worst === 'AT_GARAGE' ? '<small>at garage</small>' : !sendable(r).length ? '' : '<button type="button" class="edit" data-send="' + escapeHtml(r.unit) + '" data-type="' + r.type + '" data-keys="' + sendable(r).map(i => i.key).join(',') + '" title="Put ' + escapeHtml(sendable(r).map(i => i.what).join(' and ')) + ' on the Garage Station">Send to Garage</button>';
      return '<div class="fs-legend"><em>' + need + ' of ' + rows.length + ' units need something</em></div>' +
        table([9, 7, 17, 17, 17, 10, 10, 13], ['Unit', 'Type', 'PM / Reefer', 'DOT', 'Plates', 'Miles / hours now', 'Status', ''],
          rows.map(r => '<tr data-unit="' + escapeHtml(r.unit) + '" data-worst="' + r.worst + '"><td class="strong">' + escapeHtml(r.unit) + '</td><td>' + (r.type === 'TRAILER' ? 'Trailer' : 'Truck') + '</td>' +
            box(r.c.PM) + box(r.c.DOT) + box(r.c.PLATE) + '<td>' + now(r) + '</td><td>' + pill(STATUS[r.worst]) + '</td><td>' + send(r) + '</td></tr>').join(''), due.units.length ? 'No unit matches.' : 'No units yet.').replace('<table class="issues">', '<table class="issues fs-grid">');
    }

    // Every Uniontown truck and trailer on the fleet list, leased ones too, with the year / make / model, plate and lessor the fleet sync
    // keeps in the unit's notes ("External Fleet: year | make | model | VIN | plate | state | Lease: ...").
    function fleetInfo() {
      const out = {};
      equipment.forEach(e => {
        const type = L.fleetKind(e.type), unit = String(e.unit || '').toUpperCase();
        if (!type || !unit || out[unit] || (e.facilityId && e.facilityId !== 'fac_uniontown')) return;
        const notes = String(e.notes || ''), m = /External Fleet:\s*([^\n]*)/i.exec(notes), lease = /\bLease:\s*([^|\n]+)/i.exec(notes);
        const parts = (m ? m[1].split('|') : []).map(x => x.trim()).filter(x => x && !/^Lease:/i.test(x)), vin = parts.findIndex(x => /^[A-HJ-NPR-Z0-9]{17}$/i.test(x));
        const plate = vin >= 0 && parts[vin + 1] && !/^[A-Z]{2}$/i.test(parts[vin + 1]) ? parts[vin + 1] : '';
        out[unit] = { unit, type, lease: lease ? lease[1].trim() : 'Own', model: (vin >= 0 ? parts.slice(0, vin) : parts.slice(0, 3)).join(' '), plate };
      });
      return out;
    }
    // The unit a typed number means (the current app's unitMatch): the whole number, T- and the number for a trailer, or the last
    // few digits when exactly one unit ends that way.
    function unitMatch(typed, list) {
      const al = (v) => String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''), t = al(typed), all = [...new Set(list.filter(Boolean))];
      if (!t) return '';
      const exact = all.filter(u => al(u) === t || al(u) === 'T' + t);
      if (exact.length === 1) return exact[0];
      const ends = all.filter(u => t.length >= 2 && al(u).length > t.length && al(u).slice(-t.length) === t);
      return ends.length === 1 ? ends[0] : '';
    }
    // The History tab's unit panel (the current app's hFacts): miles, PM, DOT, plate, lease, open jobs and the year's garage hours.
    function facts(u, info, due, yearAgo) {
      if (!u) return '<small>ONE UNIT</small><h3>Type a number</h3><p class="hint">Type a truck or trailer number above (the last few digits are enough) to see its miles, service dates and everything the garage did on it.</p>';
      const i = info[u] || {}, row = due.units.find(x => String(x.unit).toUpperCase() === u) || {}, truck = (i.type || row.type || 'TRUCK') === 'TRUCK', R = L.FLEET_RULES;
      const mine = orders.filter(x => String(x.unit || '').toUpperCase() === u), live = mine.filter(x => String(x.status || 'NEW').toUpperCase() !== 'DONE');
      const year = mine.filter(x => String(x.status).toUpperCase() !== 'DONE' || String(x.completed_at || '').slice(0, 10) >= yearAgo), odo = truck ? miles()[u] : null;
      const line = (label, v) => '<p><span>' + label + '</span><b>' + escapeHtml(v === null || v === undefined || v === '' ? '—' : String(v)) + '</b></p>';
      const now = row.miles != null ? row.miles : odo ? odo.miles : null;
      return '<small>' + (truck ? 'TRUCK' : 'TRAILER') + (i.model ? ' · ' + escapeHtml(i.model.toUpperCase()) : '') + '</small><h3>' + escapeHtml(u) + '</h3>' +
        (truck ? line('Miles now', now != null ? num(now) + ' mi' : '') + line('Last PM', row.lastServiceDate || row.lastServiceMiles != null ? [when(row.lastServiceDate), row.lastServiceMiles != null ? num(row.lastServiceMiles) + ' mi' : ''].filter(Boolean).join(' · ') : '') +
            line('Next PM', row.lastServiceMiles != null ? num(row.lastServiceMiles + R.truckMiles) + ' mi' : '')
          : line('Reefer hours now', row.currentHours != null ? num(row.currentHours) : '') + line('Last reefer service', when(row.lastServiceDate)) +
            line('Next reefer service', row.lastServiceDate ? when(L.addMonths(row.lastServiceDate, R.trailerMonths)) : '')) +
        line('Next DOT inspection', when(row.dotDue)) + line('Plate expires', when(row.plateExpires)) + (i.plate ? line('Plate', i.plate) : '') + line('Lease', i.lease || '') +
        line('Open work orders', String(live.length)) + line('Garage jobs · 12 months', String(year.length)) + line('Mechanic hours · 12 months', String(hrs(year.reduce((n, x) => n + minsOf(x), 0)) || 0)) +
        (i.lease && i.lease !== 'Own' ? '<p class="hint">Leased: the lessor does its PM and DOT, so it is not on the Due list.</p>' : '');
    }

    function render() {
      const t = today(), due = L.fleetDue(units(), setup, miles(), open(), null, t), month = t.slice(0, 7), weekAgo = L.addDays(t, -7);
      const late = due.items.filter(i => i.status === 'OVERDUE').length, soon = due.items.filter(i => i.status === 'DUE_SOON').length, week = done().filter(o => String(o.completed_at || '').slice(0, 10) >= weekAgo);
      document.getElementById('tab-due').textContent = late || '';
      document.getElementById('tab-work').textContent = open().length || '';
      document.querySelectorAll('.tabs [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
      const bar = document.getElementById('bar'), sheet = document.getElementById('sheet'), foot = document.getElementById('foot'), k = document.getElementById('kpis');
      const q = search.toUpperCase(), hit = (u) => !q || String(u).toUpperCase().indexOf(q) >= 0;
      if (view === 'due') {
        k.innerHTML = kpis([[late, 'Overdue', late ? 'warn' : ''], [soon, 'Due soon', soon ? 'warn' : ''], [due.items.filter(i => i.key === 'DOT' && String(i.dueAt).slice(0, 7) === month).length, 'DOT this month'],
          [due.items.filter(i => i.key === 'PLATE' && i.dueAt && L.daysBetween(t, i.dueAt) <= 30).length, 'Plates expiring · 30 days'], [open().length, 'At the garage'], [done().filter(o => String(o.completed_at || '').slice(0, 7) === month).length, 'Done this month', 'good']]);
        bar.innerHTML = '<input type="search" id="search" placeholder="Find a truck or trailer" aria-label="Find" value="' + escapeHtml(search) + '"><span class="spacer"></span>' +
          '<button type="button" id="fs-print" class="primary">Print Fleet Service Report</button><a class="button" href="garage-station.html">Garage Station</a>';
        sheet.innerHTML = unitGrid(due, hit);
        foot.textContent = due.units.length + ' trucks and trailers at Uniontown · ' + due.items.filter(i => i.status === 'OK').length + ' items OK · PM every ' + num(L.FLEET_RULES.truckMiles) + ' miles, reefer every ' + L.FLEET_RULES.trailerMonths + ' months or ' + num(L.FLEET_RULES.trailerHours) + ' hours, DOT every ' + L.FLEET_RULES.dotMonths + ' months.';
      } else if (view === 'work') {
        const o = openSorted(), mins = week.reduce((s, x) => s + minsOf(x), 0);
        k.innerHTML = kpis([[o.length, 'Open work orders'], [o.filter(x => x.status === 'WORKING').length, 'Working now'], [o.filter(x => x.status === 'PARTS').length, 'Waiting on parts', 'warn'],
          [o.filter(x => String(x.source).toUpperCase() === 'OFFICE').length, 'Sent from office'], [week.length, 'Finished · last 7 days', 'good'], [hrs(mins) || 0, 'Mechanic hours · 7 days']]);
        bar.innerHTML = '<span class="spacer"></span><a class="button" href="garage.html">Garage Work Orders</a><a class="button" href="garage-station.html">Garage Station</a>';
        sheet.innerHTML = '<div class="fleet-split"><div><h2>Open Work Orders</h2>' + table([14, 12, 34, 14, 12, 14], ['#', 'Unit', "What's wrong", 'Came from', 'Tech', 'Status'],
          o.map(x => '<tr data-hist="' + escapeHtml(x.unit) + '" title="Show everything on ' + escapeHtml(x.unit) + '"><td class="strong">' + escapeHtml(x.work_order_id) + '</td><td class="strong">' + escapeHtml(x.unit) + '</td><td class="wrong">' + escapeHtml(x.problem || '') + '</td><td>' + escapeHtml(cameFrom(x)) +
            '</td><td>' + escapeHtml(x.techs || '') + '</td><td>' + pill(JOB[String(x.status).toUpperCase()] || [x.status, 'no']) + '</td></tr>').join(''), 'No open work orders.') +
          '</div><div><h2>What the Mechanics Did · Last 7 Days <small>' + hrs(mins) + ' hours</small></h2>' + table([12, 12, 22, 28, 14, 12], ['Date', 'Unit', 'Job', 'What they fixed', 'Tech', 'Hours'],
          week.map(x => '<tr data-hist="' + escapeHtml(x.unit) + '" title="Show everything on ' + escapeHtml(x.unit) + '"><td>' + when(x.completed_at) + '</td><td class="strong">' + escapeHtml(x.unit) + '</td><td class="wrong">' + escapeHtml(x.problem || '') + '</td><td class="wrong">' + escapeHtml(fixedText(x)) +
            '</td><td>' + escapeHtml(x.techs || '') + '</td><td>' + hrs(minsOf(x)) + '</td></tr>').join(''), 'Nothing finished in the last 7 days.') + '</div></div>';
        foot.textContent = orders.length + ' work orders from the garage list.';
      } else if (view === 'history') {
        k.innerHTML = '';
        bar.innerHTML = '<input type="search" id="search" placeholder="Type a truck or trailer number" aria-label="Find" value="' + escapeHtml(search) + '"><div class="chips">' +
          [['', 'All'], ['work', 'Work orders'], ['service', 'Services'], ['dot', 'DOT']].map(([v, l]) => '<button type="button" data-kind="' + v + '" class="' + (kindFilter === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div><span class="spacer"></span><span class="hint">Last 12 months</span>';
        const yearAgo = L.addDays(t, -365), info = fleetInfo(), u = unitMatch(search, Object.keys(info).concat(orders.map(x => String(x.unit || '').toUpperCase())));
        // Every work order, service and DOT inspection of the last 12 months, the open ones too, newest first (the current app's History).
        const stamp = (x) => String(x.completed_at || x.started_at || x.created_at || '');
        const rows = orders.filter(x => (String(x.status).toUpperCase() !== 'DONE' || String(x.completed_at || '').slice(0, 10) >= yearAgo) && (u ? String(x.unit || '').toUpperCase() === u : hit(x.unit))).map(x => {
          const kind = x.service_key === 'DOT' ? 'dot' : x.service_key ? 'service' : 'work';
          return { x, kind };
        }).filter(r => !kindFilter || r.kind === kindFilter).sort((p, q) => stamp(q.x).localeCompare(stamp(p.x)));
        sheet.innerHTML = '<div class="fs-hist"><div class="fs-facts">' + facts(u, info, due, yearAgo) + '</div><div><h2>' + escapeHtml(u ? 'Everything on ' + u : search ? 'Units matching ' + search : 'Everything in the garage') + ', newest first</h2>' +
          table([11, 10, 11, 32, 14, 8, 14], ['Date', 'Unit', 'Kind', 'What', 'Who', 'Hours', 'Result'],
          rows.map(({ x, kind }) => '<tr><td>' + when(stamp(x)) + '</td><td class="strong">' + escapeHtml(x.unit) + '</td><td>' + ({ work: 'Work order', service: 'Service', dot: 'DOT' })[kind] + '</td><td class="wrong">' +
            escapeHtml(x.problem || '') + (x.fixed_note ? '<small>' + escapeHtml(x.fixed_note) + '</small>' : '') + '</td><td>' + escapeHtml(x.techs || '') + '</td><td>' + hrs(minsOf(x)) + '</td><td>' +
            (String(x.status).toUpperCase() === 'DONE' ? escapeHtml(x.fixed || '') + (x.signed_by ? '<small>signed ' + escapeHtml(x.signed_by) + '</small>' : '') : pill(JOB[String(x.status || 'NEW').toUpperCase()] || [x.status, 'no'])) + '</td></tr>').join(''),
          search ? 'Nothing in the garage for ' + escapeHtml(search) + ' in the last 12 months.' : 'Nothing in the garage history yet.') + '</div></div>';
        foot.textContent = rows.length + ' garage jobs shown.';
      } else {
        k.innerHTML = '';
        const R = L.FLEET_RULES;
        bar.innerHTML = '<input type="search" id="search" placeholder="Find a truck or trailer" aria-label="Find" value="' + escapeHtml(search) + '"><span class="spacer"></span><span class="hint">Rules: PM every ' + num(R.truckMiles) + ' mi (warn ' + num(R.truckWarnMiles) + ' ahead) · Reefer every ' + R.trailerMonths + ' months or ' + num(R.trailerHours) + ' hrs · DOT every ' + R.dotMonths + ' months (warn ' + R.dotWarnDays + ' days) · Plates warn ' + R.plateWarnDays + ' days</span>' +
          '<a class="button" href="soon.html?what=fleet-service-setup">Change the rules</a>';
        sheet.innerHTML = '<div class="fleet-split wide-left"><div><h2>Units</h2>' + table([12, 9, 10, 13, 16, 13, 13, 14], ['Unit', 'Type', 'Track due dates', 'Last service', 'Miles / hours now', 'DOT due', 'Plate expires', 'Notes'],
          due.units.filter(u => hit(u.unit)).map(u => '<tr><td class="strong">' + escapeHtml(u.unit) + '</td><td>' + (u.type === 'TRAILER' ? 'Trailer' : 'Truck') + '</td><td>' + (u.tracked ? 'Yes' : 'No') + '</td><td>' + when(u.lastServiceDate) +
            (u.lastServiceMiles != null ? '<small>' + num(u.lastServiceMiles) + ' mi</small>' : u.lastServiceHours != null ? '<small>' + num(u.lastServiceHours) + ' hrs</small>' : '') + '</td><td>' +
            (u.miles != null ? num(u.miles) + ' mi<small>' + when(u.milesDate) + '</small>' : u.currentHours != null ? num(u.currentHours) + ' hrs' : '') + '</td><td>' + when(u.dotDue) + '</td><td>' + when(u.plateExpires) + '</td><td class="wrong">' + escapeHtml(u.notes) + '</td></tr>').join(''), 'No units.') +
          '</div><div><h2>Garage Technicians</h2>' + table([60, 40], ['Name', 'Active'], techs.map(x => '<tr><td class="strong">' + escapeHtml(x.name || '') + '</td><td>' + (L.yes(x.active === undefined ? 'TRUE' : x.active) ? pill(['Active', 'yes']) : pill(['Off', 'no'])) + '</td></tr>').join(''), 'No technicians yet.') + '</div></div>';
        foot.textContent = 'Read only here: dates, rules and technicians are changed in the current app for now. PINs are never shown.';
      }
      const s = document.getElementById('search');
      if (s) s.oninput = (e) => { search = e.target.value.trim(); const at = e.target.selectionStart; render(); const n = document.getElementById('search'); n.focus(); n.setSelectionRange(at, at); };
      const p = document.getElementById('fs-print'); if (p) p.onclick = () => printReport(due, t);
      bar.querySelectorAll('[data-kind]').forEach(b => { b.onclick = () => { kindFilter = b.dataset.kind; render(); }; });
    }

    // The one-page report (the current app's Fleet Service & Compliance Report, FleetService.html renderReport): the tiles, everything
    // overdue, due soon or at the garage, DOT inspections and plates of the next 90 days, and the last 7 days' garage work with who signed.
    function printReport(due, t) {
      let box = document.getElementById('print');
      if (!box) { box = document.createElement('div'); box.id = 'print'; document.body.appendChild(box); }
      const info = fleetInfo(), all = due.items, weekAgo = L.addDays(t, -7), month = t.slice(0, 7);
      const count = (st) => all.filter(i => i.status === st).length, overdue = count('OVERDUE');
      const in90 = (key) => all.filter(i => i.key === key && /^\d{4}-\d\d-\d\d/.test(String(i.dueAt)) && L.daysBetween(t, String(i.dueAt).slice(0, 10)) <= 90).sort((x, y) => String(x.dueAt).localeCompare(String(y.dueAt)));
      const rows = (list, cols, empty) => list.length ? list.map(x => '<tr>' + cols.map(c => '<td>' + c(x) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cols.length + '" class="fs-none">' + empty + '</td></tr>';
      const tbl = (head, body) => '<table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table>';
      const nowText = (i) => i.now === '' || i.now === undefined || i.now === null ? '—' : num(i.now) + (i.type === 'TRUCK' ? ' mi' : ' hrs');
      const left = (i) => typeof i.left === 'number' ? num(i.left) + ' mi' : escapeHtml(i.left || '—');
      const late = all.filter(i => i.status === 'OVERDUE' || i.status === 'DUE_SOON' || i.status === 'AT_GARAGE');
      const week = done().filter(o => String(o.completed_at || '').slice(0, 10) >= weekAgo);
      const day = new Date(t + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' });
      box.innerHTML = '<div class="fs-report"><div class="fs-rhead"><div><small>UNITED DAIRY · FLEET SERVICE</small><h2>Fleet Service &amp; Compliance Report</h2><b>As of ' + day + ' ' + shortDate(t) + '</b></div>' +
        '<div class="fs-rover">Overdue now<b>' + overdue + '</b></div></div>' +
        '<div class="fs-ptiles"><div><small>OVERDUE</small><b>' + overdue + '</b></div><div><small>DUE SOON</small><b>' + count('DUE_SOON') + '</b></div><div><small>AT THE GARAGE</small><b>' + open().length + '</b></div>' +
        '<div><small>FINISHED THIS MONTH</small><b>' + done().filter(o => String(o.completed_at || '').slice(0, 7) === month).length + '</b></div></div>' +
        '<h3>Overdue, due soon and at the garage</h3>' + tbl(['Unit', 'Type', "What's due", 'Due at', 'Now', 'Left', 'Status'],
          rows(late, [i => '<b>' + escapeHtml(i.unit) + '</b>', i => i.type === 'TRAILER' ? 'Trailer' : 'Truck', i => escapeHtml(i.what), i => i.key === 'PM' ? num(i.dueAt) + ' mi' : when(i.dueAt), nowText, left, i => STATUS[i.status][0]], 'Nothing is overdue or due soon.')) +
        '<div class="fs-two"><div><h3>DOT inspections · next 90 days</h3>' + tbl(['Unit', 'Due'], rows(in90('DOT'), [i => '<b>' + escapeHtml(i.unit) + '</b>', i => when(i.dueAt) + (i.status === 'OVERDUE' ? ' (overdue)' : '')], 'None due.')) + '</div>' +
        '<div><h3>Plates / license · next 90 days</h3>' + tbl(['Unit', 'Plate', 'Expires'], rows(in90('PLATE'), [i => '<b>' + escapeHtml(i.unit) + '</b>', i => escapeHtml((info[String(i.unit).toUpperCase()] || {}).plate || '—'), i => when(i.dueAt) + (i.status === 'OVERDUE' ? ' (expired)' : '')], 'None expiring.')) + '</div></div>' +
        '<h3>Work done · last 7 days (from garage work orders)</h3>' + tbl(['Date', 'Unit', 'Work done', 'By', 'Minutes', 'Signed'],
          rows(week.slice(0, 14), [x => when(x.completed_at), x => '<b>' + escapeHtml(x.unit) + '</b>', x => escapeHtml([x.problem, x.fixed, x.fixed_note].filter(Boolean).join(' · ')), x => escapeHtml(x.techs || ''), x => minsOf(x) || '', x => x.signed_by ? '&#10004; ' + escapeHtml(x.signed_by) : ''], 'No finished garage work in the last 7 days.')) +
        '<div class="fs-sign"><span>Reviewed by ______________________________</span><span>Date ______________</span></div>' +
        '<div class="fs-rfoot"><span>Miles from the driver\'s daily inspection; work history from Garage work orders. Leased tractors: service by the lessor.</span><span>Page 1 of 1</span></div></div>';
      printSaved('fleet');
    }

    document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { view = b.dataset.view; search = ''; render(); } });
    document.getElementById('sheet').addEventListener('click', async e => {
      const h = e.target.closest('tr[data-hist]');
      if (h && !e.target.closest('button, a')) { view = 'history'; search = h.dataset.hist; kindFilter = ''; render(); document.getElementById('sheet').scrollTop = 0; return; }
      const b = e.target.closest('[data-send]');
      if (!b) return;
      b.disabled = true; showError('');
      try { for (const key of b.dataset.keys.split(',')) await save('sendToGarage', { unit: b.dataset.send, unitType: b.dataset.type, serviceKey: key }); b.outerHTML = '<small>sent</small>'; }
      catch (err) { b.disabled = false; showError(err.message); }
    });
    window.udBack = () => { if (view !== 'due' || search) { view = 'due'; search = ''; render(); return true; } return false; };

    requireSignIn(async () => {
      const { db } = await start();
      const watch = (name, set) => onSnapshot(collection(db, name), s => { set(s.docs.map(d => Object.assign({}, d.data(), { id: d.id }))); render(); }, e => showError('Could not read ' + name + ': ' + e.message));
      watch('equipment', v => { equipment = v; });
      watch('fleetSetup', v => { setup = v; });
      watch('odometers', v => { odometers = v; });
      watch('workOrders', v => { orders = v; });
      watch('garageTechs', v => { techs = v; });
      render();
    });
  </script>
</body>
</html>
