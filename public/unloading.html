<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Unloading &amp; Washing · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plant.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
</head>
<body class="fill issues-page plant-page unload-page">
  <div class="signin" id="signin" hidden>
    <h1>Unloading &amp; Washing</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Plant Distribution</span><h1>Unloading &amp; Washing</h1></div>
      <div class="field">
        <label for="work-date">Return day</label>
        <div class="stepper">
          <button type="button" id="prev" aria-label="Previous day" title="Previous day">&#9664;</button>
          <input id="work-date" type="date">
          <button type="button" id="next" aria-label="Next day" title="Next day">&#9654;</button>
        </div>
      </div>
      <div class="dayname" id="dayname"></div>
      <div class="hstats" id="hstats"></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the Operations test copy</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="areas six" id="areas"></div>
      <div class="uw-tabrow" data-top><div class="tabs mode seg" role="group" aria-label="Check Off or View Only"><button type="button" data-mode="check">Check Off</button><button type="button" data-mode="view">View Only</button></div><div class="tabs seg" id="tabs"></div><button type="button" class="uw-add" id="add-open">+ Add a Trailer</button><span class="uw-scope" id="scope"></span></div>
      <div class="uw-addbox" id="addbox" hidden>
        <label>Trailer<input id="add-trailer" maxlength="60" autocomplete="off"></label>
        <label>What it needs<select id="add-kind"><option value=""></option><option value="UNLOAD">Unload it</option><option value="WASH">Wash only</option></select></label>
        <label>Route (if you know it)<select id="add-route"><option value=""></option></select></label>
        <button type="button" class="primary" id="add-save">Add</button><button type="button" id="add-cancel">Cancel</button>
      </div>
      <div id="banner"></div>
      <div class="uw-split">
        <div class="sheet scroll-list">
          <table class="loadout unload">
            <colgroup id="cols"></colgroup>
            <thead><tr><th>Route · Run</th><th>Trailer</th><th>Status</th><th id="out-head">Cases Out</th><th>Driver Said</th><th id="qty-head">Cases Returned</th><th>Lost</th><th id="counted-head" hidden>Counted</th><th>RTA</th><th>Washed</th><th data-l="Start / End"></th><th>Total Time</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <aside class="uw-side" id="side" aria-label="Department stats"></aside>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, watchPerson, save, escapeHtml, shortDate, showError, goLiveNote, maySave } from './js/app.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    import { watchWashRequests } from './js/recent-records.js';
    import * as P from './js/plant-core.js';

    const L = window.UDLogic, U = window.UDPlant;
    const params = new URLSearchParams(location.search);
    const today = () => L.operatingDay(new Date());
    let date = L.isDateKey(params.get('date')) ? params.get('date') : today();
    let area = P.AREAS.indexOf(String(params.get('area') || '').toUpperCase()) >= 0 ? String(params.get('area')).toUpperCase() : 'CASE';
    let tab = 'needs', editKey = '', mode = 'check';
    let runs = [], routes = [], journal = [], prevJournal = [], sheetWash = [], appWash = [], person = null, app = {};
    // Case counters (Joe 10/23): what the case returns counter counted on each trailer, beside the Cases In typed.
    let caseCounts = {}, returnsCounter = null, gpsDays = [];
    const counting = () => area === 'CASE' && !!(returnsCounter && returnsCounter.controller && returnsCounter.controller.ip);
    // Joe 10/27 (hg): Cases Out (loadout), Driver Said (check-in), Cases Returned (typed here) and Lost. With the counter on,
    // Trailer gives the room for the Counted column.
    const COL_WIDTHS = [10, 11, 9, 8, 7, 10, 8, 7, 9, 7, 7, 7], COUNTED_WIDTHS = [9, 10, 8, 7, 6, 9, 7, 8, 7, 8, 7, 7, 7];
    const pending = {};        // unload key -> what is shown before the server has it
    const washedNow = {};      // wash item id -> true while its Wash press is saving
    const unsubs = [];

    const canSave = () => maySave(person, L.SAVE_ROLES.concat(['PLANT_EMPLOYEE']), app, 'plantLoading');
    const check = () => mode === 'check' && canSave();

    function data() {
      const returns = P.returnsFor(runs, date, journal).map(x => (pending.returns && pending.returns[x.id] ? Object.assign({}, x, { pending: false }) : x));
      const loads = P.loadoutRows(runs, date);
      // Joe 10/27: the same order as the tablet: what today's loadout needs first, a trailer that is here ahead of one on the road.
      // Joe 10/27 (hd): yesterday's trailers nobody pressed End on come over by themselves, at the top in red.
      const carried = P.carriedUnloads(runs, date, prevJournal.concat(journal), routes);
      const rows = P.unloadOrder(P.unloadRows(runs, date, journal, returns, loads, routes).concat(carried).map(r => (pending[r.key] ? Object.assign({}, r, pending[r.key]) : r)).filter(r => !(r.dropped && (r.added || r.prior))), gpsDays);
      const prevWash = P.washItems(L.addDays(date, -1), [], [], prevJournal.concat(journal)).filter(w => /^ADDED\|/.test(w.id) && carried.some(r => r.washOnly && U.unitKey(r.trailer) === U.unitKey(w.trailer)));
      const wash = P.washItems(date, sheetWash, appWash, journal).concat(prevWash).filter(w => !washedNow[w.id]);
      return { returns, rows, wash };
    }

    function pill(r) {
      return '<span class="pill ' + (r.status === 'COMPLETE' ? 'done' : r.status === 'UNLOADING' ? 'run' : 'wait') + '">' + (r.status === 'COMPLETE' ? 'Done' : r.status === 'UNLOADING' ? 'Unloading' : 'Waiting') + '</span>';
    }

    function render() {
      const { returns, rows: all, wash } = data(), unit = P.UNLOAD_UNIT[area], name = P.UNLOAD_TILE[area];
      const c = P.unloadCounts(all), pendingReturns = returns.filter(x => x.pending);
      document.getElementById('work-date').value = date;
      document.getElementById('dayname').textContent = L.dayName(date).toUpperCase() + '  ·  ' + shortDate(date);
      document.getElementById('hstats').innerHTML = [['Trucks', c.total, ''], ['Waiting', c.waiting, ''], ['Unloading', c.unloading, 'warn'], ['Complete', c.complete, 'good'], ['Returns', pendingReturns.length, pendingReturns.length ? 'bad' : ''], ['To Wash', wash.length, wash.length ? 'wash' : '']]
        .map(([l, n, k]) => '<div class="' + k + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
      document.querySelectorAll('[data-mode]').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.mode === mode)); b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
      // Tiles: the four areas, then Returns and Washing (each opens its own screen).
      document.getElementById('areas').innerHTML = P.AREAS.map(a => {
        const ac = P.unloadCounts(all.filter(r => r.area === a)), pct = ac.total ? Math.round(ac.complete * 100 / ac.total) : 0;
        return '<button type="button" class="area' + (a === area ? ' on' : '') + '" data-area="' + a + '" style="--area:' + P.AREA[a].color + '"><span class="ring" style="--p:' + pct + '"><b>' + ac.complete + '/' + ac.total + '</b></span>' +
          '<span><strong>' + P.UNLOAD_TILE[a] + '</strong><small><b class="w">' + ac.waiting + '</b> waiting <b class="u">' + ac.unloading + '</b> unloading <b class="d">' + ac.complete + '</b> done</small></span></button>';
      }).join('') +
        '<a class="area go" href="returns.html?date=' + date + '" style="--area:#b42332"><span class="ring" style="--p:' + (pendingReturns.length ? 0 : 100) + '"><b>' + pendingReturns.length + '</b></span><span><strong>Returns &rsaquo;</strong><small><b class="r">' + pendingReturns.length + '</b> to the cooler · opens its own screen</small></span></a>' +
        '<a class="area go" href="washing.html?date=' + date + '" style="--area:#0093b5"><span class="ring" style="--p:' + (wash.length ? 0 : 100) + '"><b>' + wash.length + '</b></span><span><strong>Washing &rsaquo;</strong><small><b class="o">' + wash.length + '</b> trailers to wash · opens its own screen</small></span></a>';
      const mine = all.filter(r => r.area === area), needs = mine.filter(r => r.status !== 'COMPLETE'), rows = tab === 'all' ? mine : needs;
      document.getElementById('tabs').innerHTML = [['needs', 'Needs Unloading', needs.length], ['all', 'All Loads', mine.length]]
        .map(([k, l, n]) => '<button type="button" data-tab="' + k + '" aria-selected="' + (tab === k) + '">' + l + ' <b>' + n + '</b></button>').join('');
      document.getElementById('scope').textContent = name + ' only';
      const retLoads = mine.filter(r => r.pendingReturns.length).length;
      const prior = mine.filter(r => r.prior).length;
      document.getElementById('add-open').hidden = !check();
      if (!check()) document.getElementById('addbox').hidden = true;
      const routeBox = document.getElementById('add-route'), routeNow = routeBox.value, routeList = [...new Set(mine.filter(r => !r.added && !r.prior).map(r => r.route))];
      routeBox.innerHTML = '<option value=""></option>' + routeList.map(x => '<option' + (x === routeNow ? ' selected' : '') + '>' + escapeHtml(x) + '</option>').join('');
      document.getElementById('banner').innerHTML = (prior ? '<div class="uw-banner"><b>' + prior + ' trailer' + (prior === 1 ? '' : 's') + ' from yesterday ' + (prior === 1 ? 'was' : 'were') + ' not unloaded</b><span>They are at the top of the list. Unload them, or press Wash if they only need washing.</span></div>' : '') +
        (retLoads ? '<div class="uw-banner"><b>Product returns need attention · ' + retLoads + ' load' + (retLoads === 1 ? '' : 's') + '</b><span>Assigned product must be returned to the cooler. Do not dump.</span><a href="returns.html?date=' + date + '">Open Returns &rarr;</a></div>' : '');
      document.getElementById('out-head').textContent = unit + ' Out';
      document.getElementById('qty-head').textContent = unit + ' Returned';
      const on = counting(), ncol = on ? 13 : 12;
      document.getElementById('counted-head').hidden = !on;
      document.getElementById('cols').innerHTML = (on ? COUNTED_WIDTHS : COL_WIDTHS).map(w => '<col style="width:' + w + '%">').join('');
      // Side stats for the area.
      const ac = P.unloadCounts(mine), toWash = mine.filter(r => P.washesForRow(r, wash).length).length, washed = mine.filter(r => !P.washesForRow(r, wash).length && r.washed).length;
      const line = (l, v, k) => '<div class="line ' + (k || '') + '"><span>' + escapeHtml(l) + '</span><b>' + escapeHtml(String(v)) + '</b></div>';
      document.getElementById('side').innerHTML = '<h2>' + name + ' today</h2>' + line('Loads', ac.total) + line('Waiting', ac.waiting, 'w') + line('Unloading', ac.unloading, 'u') + line('Done', ac.complete, 'd') + '<hr>' +
        line(unit + ' out', ac.out.toLocaleString()) + line(unit + ' returned', ac.qty.toLocaleString()) + line('Lost', ac.lost.toLocaleString(), ac.lost > 0 ? 'r' : '') + line('Average time', ac.avg === null ? '—' : P.minutesText(ac.avg)) + '<hr>' + line('To the cooler', retLoads, retLoads ? 'r' : '') + line('To wash', toWash, toWash ? 'o' : '') + line('Washed', washed);
      // The table.
      const ck = check(), k = (r) => ' data-key="' + escapeHtml(r.key) + '"';
      let html = '';
      rows.forEach(r => {
        const s = r.status, washes = P.washesForRow(r, wash), hadReturn = r.returns.length > 0;
        // Joe 10/27: a drop-and-hook load shows its name (Ferry Product 1, Lancaster Transfer), never a trailer number.
        const trailer = r.dropAndHook ? '<span class="trl dh">' + escapeHtml(r.name) + '</span>' : r.trailer ? '<span class="trl">' + escapeHtml(r.trailer) + '</span>' : !ck ? '<span class="na">—</span>' : '<input data-f="trailer"' + k(r) + ' placeholder="Trailer #" aria-label="Trailer back for ' + escapeHtml(r.route) + '">';
        const qty = r.washOnly ? '<span class="na">—</span>' : r.casesIn !== '' ? '<span class="chk ok">&#10003; ' + escapeHtml(r.casesIn) + ' ' + unit.toLowerCase() + '</span>' : !ck ? '<span class="na">—</span>' :
          s === 'UNLOADING' ? '<input data-f="casesIn"' + k(r) + ' inputmode="numeric" placeholder="' + unit + '" aria-label="' + unit + ' returned for ' + escapeHtml(r.route) + '">' : '<span class="chk na">Start first</span>';
        const count = (v) => (v === '' ? '<span class="na">—</span>' : '<b>' + Number(v).toLocaleString() + '</b>');
        const lost = P.lostCases(r), lostCell = () => (lost === null ? '<span class="na">—</span>' : lost > 0 ? '<span class="lost">' + lost.toLocaleString() + ' lost</span>' : lost < 0 ? '<span class="chk ok">' + (-lost).toLocaleString() + ' extra</span>' : '<span class="chk ok">&#10003; All back</span>');
        const titleRet = r.pendingReturns.map(x => x.detail).join('; ');
        const rta = r.pendingReturns.length ? (ck ? '<button type="button" class="rta" data-do="rta"' + k(r) + ' title="Return to the cooler (RTA): ' + escapeHtml(titleRet) + '">RTA</button>' : '<span class="pill ret">Return pending</span>')
          : hadReturn ? '<span class="chk ok">&#10003; Returned</span>' : '<span class="chk na">None</span>';
        const washCell = washes.length ? (ck ? '<button type="button" class="wash" data-do="wash"' + k(r) + ' title="Mark the trailer washed">Wash</button>' : '<span class="pill washp">Wash needed</span>')
          : r.washed ? '<span class="chk ok">&#10003; Washed</span>' : '<span class="chk na">Not washed</span>';
        const mins = P.minutesTaken({ startedAt: r.startedAt, completedAt: r.completedAt });
        const stale = s === 'UNLOADING' && mins !== null && mins >= P.LONG_RUN_MINUTES;
        const time = s === 'WAITING' || mins === null ? '<span class="na">—</span>' : '<span class="' + (stale ? 'stale' : s === 'UNLOADING' ? 'running' : '') + '">' + (s === 'UNLOADING' ? P.runningText(r.startedAt, mins) : P.minutesText(mins)) + '</span>';
        const clockCell = !ck ? '' : r.washOnly ? (s === 'COMPLETE' ? '<span class="tick">&#10003;</span>' : '<span class="na">—</span>') : s === 'WAITING' ? '<button type="button" class="clock" data-do="start"' + k(r) + '>Start</button>' : s === 'UNLOADING' ? '<button type="button" class="clock end" data-do="end"' + k(r) + '>End</button>' : '<span class="tick">&#10003;</span>';
        // Joe 10/18: the route cell shows only the route (no run line under it) and the trailer cell only the trailer (no "Next:" line).
        html += '<tr' + k(r) + ' class="' + (r.prior ? 'prior ' : r.added ? 'added ' : '') + (r.pendingReturns.length ? 'needs-return ' : '') + (s === 'COMPLETE' ? 'done' : s === 'UNLOADING' ? 'loading' : '') + '"' + (titleRet ? ' title="Return: ' + escapeHtml(titleRet) + '"' : '') + '>' +
          '<td class="rr">' + routeCell(r) + '</td><td class="trlcell">' + trailer + '</td><td>' + pill(r) + '</td><td>' + count(r.casesOut) + '</td><td>' + count(r.driverSaid) + '</td><td>' + qty + '</td><td>' + lostCell(r) + '</td>' + (on ? countedCell(r) : '') + '<td>' + rta + '</td><td>' + washCell + '</td>' +
          '<td>' + clockCell + '</td><td>' + time + '</td><td>' + (ck ? '<button type="button" class="edit-row" data-do="edit"' + k(r) + '>Edit</button>' : '') + '</td></tr>';
        if (ck && editKey === r.key) {
          html += '<tr class="editrow"><td colspan="' + ncol + '"><div class="editbar"><b>Edit · ' + escapeHtml(r.route + ' ' + r.run) + '</b><span class="read">Started ' + escapeHtml(P.clock(r.startedAt) || '—') + ' · Finished ' + escapeHtml(P.clock(r.completedAt) || '—') + '</span>' +
            '<label>' + unit + ' Returned<input data-e="casesIn" inputmode="numeric" value="' + escapeHtml(r.casesIn) + '"></label><label>Trailer Back<input data-e="trailer" value="' + escapeHtml(r.trailer) + '"></label>' +
            '<label class="grow">Notes<input data-e="notes" maxlength="1200" value="' + escapeHtml(r.notes) + '"></label>' +
            ((r.added || r.prior) && !r.startedAt ? '<button type="button" data-do="drop"' + k(r) + '>Take Off the List</button>' : '') + '<button type="button" data-do="editclose">Close</button></div></td></tr>';
        }
      });
      const focused = document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.f || document.activeElement.dataset.e) ? document.activeElement : null;
      const keep = focused ? [focused.dataset.key || '', focused.dataset.f || '', focused.dataset.e || '', focused.value] : null;
      document.getElementById('rows').innerHTML = html || '<tr><td colspan="' + ncol + '" class="empty">' + (!mine.length ? 'No ' + name.toLowerCase() + ' unloading is scheduled for this date.' : 'Every load is unloaded.') + '</td></tr>';
      // Review item 23 (Joe 10/13): on a phone or a small tablet each load is a card (as on Yard Checks); every box is named on
      // the card itself by its column heading (the Start / End buttons' column has no heading on the desk, so it is named here).
      const heads = [...document.querySelectorAll('table.unload thead th')].filter(th => !th.hidden).map(th => th.textContent || th.dataset.l || '');
      document.querySelectorAll('#rows tr[data-key]').forEach(tr => [...tr.children].forEach((td, i) => { if (heads[i]) td.dataset.l = heads[i]; }));
      if (keep) {
        const el = keep[1] ? document.querySelector('input[data-f="' + keep[1] + '"][data-key="' + CSS.escape(keep[0]) + '"]') : document.querySelector('input[data-e="' + keep[2] + '"]');
        if (el) { el.value = keep[3]; el.focus(); }
      }
      document.getElementById('foot').textContent = mine.length + ' ' + name.toLowerCase() + ' loads back ' + (date === today() ? 'today' : 'on ' + shortDate(date)) + '. ' +
        (ck ? 'Start, type the count, then End. One unload at a time.' : canSave() ? 'View Only: press Check Off to work the list.' : 'View only.') + ' Changes show on every screen at once.';
      const st = L.screenState(app, 'plantLoading');
      goLiveNote(st.live && st.owner !== 'new');
      document.getElementById('mode-text').textContent = st.live ? (st.open ? 'LIVE' : 'VIEW ONLY') : 'TEST COPY';
    }

    const rowByKey = (key) => data().rows.find(r => r.key === key);
    // Joe 10/27 (hd): yesterday's trailer says the day it is from in red; one added by hand says Added or Wash only.
    const mmdd = (d) => { const p = String(d || '').split('-'); return p.length === 3 ? Number(p[1]) + '-' + Number(p[2]) : ''; };
    function routeCell(r) {
      const tag = r.prior ? '<span class="uw-tag from">From ' + escapeHtml(mmdd(r.date)) + '</span>' : r.added ? '<span class="uw-tag add">' + (r.washOnly ? 'Wash only' : 'Added') + '</span>' : '';
      return (r.added && !r.forRoute ? '' : '<b>' + escapeHtml(r.added ? r.forRoute : r.route) + '</b>') + tag;
    }

    // + Add a Trailer (Joe 10/27, hd mock-up 2): a trailer that is on no load, to unload or only to wash. It goes to the top.
    const addBox = document.getElementById('addbox'), addTrailer = document.getElementById('add-trailer'), addKind = document.getElementById('add-kind');
    function closeAdd() { addBox.hidden = true; addTrailer.value = ''; addKind.value = ''; document.getElementById('add-route').value = ''; }
    document.getElementById('add-open').onclick = () => { addBox.hidden = !addBox.hidden; if (!addBox.hidden) addTrailer.focus(); };
    document.getElementById('add-cancel').onclick = closeAdd;
    document.getElementById('add-save').onclick = () => {
      const trailer = U.trailerText(addTrailer.value), kind = addKind.value, forRoute = document.getElementById('add-route').value;
      if (!trailer) { showError('Enter the trailer number.'); addTrailer.focus(); return; }
      if (!kind) { showError('Pick what the trailer needs: Unload it or Wash only.'); addKind.focus(); return; }
      const r = { key: U.unloadKey(date, P.ADDED_ROUTE, P.addedRun(trailer)), route: P.ADDED_ROUTE, run: P.addedRun(trailer), runDocId: '', day: '', date };
      closeAdd();
      saveUnload(r, { added: kind, trailer, area, forRoute }, {});
    };
    // What the case returns counter counted on a trailer against its Cases In: counting while it unloads, then matches, short or over.
    function countedCell(r) {
      const c = caseCounts[r.key], cmp = U.caseCompare(r.casesIn, c ? c.counted : null, r.status === 'UNLOADING' ? 'RUNNING' : r.status === 'COMPLETE' ? 'DONE' : '');
      if (!cmp || (r.status === 'WAITING' && !c)) return '<td class="lo-counted"></td>';
      return '<td class="lo-counted ' + cmp.kind + '"><b>' + escapeHtml(cmp.number) + '</b><small>' + escapeHtml(cmp.word) + '</small></td>';
    }

    // One save, shown at once; if the server refuses it the row goes back and the reason shows.
    let saveNo = 0;
    const chain = {};
    async function saveUnload(r, fields, shown) {
      const mine = ++saveNo, p = pending[r.key] = Object.assign({}, pending[r.key], shown, { _no: mine });
      if (fields.returnIds) { pending.returns = pending.returns || {}; fields.returnIds.forEach(id => { pending.returns[id] = true; }); }
      render();
      // Saves on one load go to the server in the order they were made (a count typed, then End).
      const turn = (chain[r.key] || Promise.resolve()).then(() => save('saveUnloading', { date: r.date || date, route: r.route, run: r.run, runDocId: r.runDocId, day: r.day, fields }));
      chain[r.key] = turn.catch(() => {});
      try {
        await turn;
        showError('');
      } catch (e) {
        showError(r.route + ' ' + r.run + ': ' + (e.message || e));
      }
      if (pending[r.key] && pending[r.key]._no === mine) delete pending[r.key];
      if (fields.returnIds && pending.returns) fields.returnIds.forEach(id => { delete pending.returns[id]; });
      render();
      return p;
    }

    // Wash: one press per trailer closes every wash item that trailer has (the requests and the after-unloading wash).
    async function washTrailer(items) {
      const byUnit = {};
      items.forEach(w => { const u = U.unitKey(w.trailer); (byUnit[u] = byUnit[u] || []).push(w); });
      Object.keys(byUnit).forEach(u => byUnit[u].forEach(w => { washedNow[w.id] = true; }));
      render();
      for (const u of Object.keys(byUnit)) {
        const list = byUnit[u];
        try {
          await save('completeWash', { date, trailer: list[0].trailer, close: list.flatMap(w => w.refs) });
        } catch (e) {
          showError('Wash ' + list[0].trailer + ': ' + (e.message || e));
          list.forEach(w => { delete washedNow[w.id]; });
          render();
        }
      }
      // The server's answer is in the lists now; what was hidden while saving can show from them again.
      setTimeout(() => { items.forEach(w => { delete washedNow[w.id]; }); render(); }, 1500);
    }

    const rowsEl = document.getElementById('rows');
    function fieldSave(el) {
      const r = rowByKey(el.dataset.key), f = el.dataset.f;
      if (!r || !f) return;
      let v = String(el.value || '').trim();
      if (!v) return;
      if (f === 'casesIn') {
        if (!/^\d+$/.test(v.replace(/,/g, ''))) { showError('Enter a whole quantity, including zero if none.'); return; }
        v = String(Number(v.replace(/,/g, '')));
        saveUnload(r, { casesIn: v }, { casesIn: v });
      } else {
        v = U.trailerText(v);
        saveUnload(r, { trailer: v }, { trailer: v, trailerTyped: true });
      }
    }
    rowsEl.addEventListener('change', e => { if (e.target.dataset.f) fieldSave(e.target); else if (e.target.dataset.e) editSave(e.target); });
    // Review item 38 (Joe 10/13): the line edit has no Save button. Each box saves as it is left (the same saveUnloading call),
    // and Close shuts the edit line.
    function editSave(el) {
      const r = rowByKey(editKey), k = el.dataset.e;
      if (!r || !k) return;
      const v = String(el.value || '').trim();
      if (k === 'casesIn') {
        const q = v.replace(/,/g, '');
        if (q === r.casesIn) return;
        if (!/^\d+$/.test(q) && !(q === '' && r.status !== 'COMPLETE')) { showError('Enter a whole quantity, including zero if none.'); return; }
        const c = q === '' ? '' : String(Number(q));
        saveUnload(r, { casesIn: c }, { casesIn: c });
      } else if (k === 'trailer') {
        const t = U.trailerText(v);
        if (t !== r.trailer) saveUnload(r, { trailer: t }, { trailer: t, trailerTyped: !!t });
      } else if (k === 'notes') {
        if (v !== r.notes) saveUnload(r, { notes: v }, { notes: v });
      }
    }
    // Pressing a button (End right after typing the count) keeps the typing box focused, so the press is not lost to a redraw;
    // End reads the typed count itself.
    rowsEl.addEventListener('mousedown', e => { if (e.target.closest('button[data-do]') && document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.f || document.activeElement.dataset.e)) e.preventDefault(); });
    rowsEl.addEventListener('keydown', e => {
      if (e.target.dataset.e) {
        if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
        else if (e.key === 'Escape') { editKey = ''; render(); }
        return;
      }
      if (e.key === 'Enter' && e.target.dataset.f) { e.preventDefault(); e.target.blur(); }
    });
    rowsEl.addEventListener('click', e => {
      const b = e.target.closest('button[data-do]');
      if (!b || b.disabled) return;
      const a = b.dataset.do;
      // Close saves the box still being typed in first (it keeps the focus, so the box is not left before the press).
      if (a === 'editclose') { const f = document.activeElement; if (f && f.dataset && f.dataset.e) editSave(f); editKey = ''; render(); return; }
      const r = rowByKey(b.dataset.key);
      if (!r) return;
      const now = new Date().toISOString();
      if (a === 'start') {
        const active = data().rows.find(x => x.key !== r.key && x.status === 'UNLOADING');
        if (active) { showError('Stop unloading ' + active.route + ' · ' + active.run + ' before starting another.'); return; }
        saveUnload(r, { start: true }, { status: 'UNLOADING', startedAt: now });
      } else if (a === 'end') {
        const typed = rowsEl.querySelector('input[data-f="casesIn"][data-key="' + CSS.escape(r.key) + '"]');
        const v = typed && typed.value.trim();
        if (r.casesIn === '' && v && /^\d+$/.test(v)) { saveUnload(r, { casesIn: String(Number(v)) }, { casesIn: String(Number(v)) }).then(() => { const x = rowByKey(r.key); if (x) saveUnload(x, { end: true }, { status: 'COMPLETE', completedAt: new Date().toISOString() }); }); return; }
        if (r.casesIn === '') { showError('Enter the quantity before ending unloading.'); if (typed) typed.focus(); return; }
        saveUnload(r, { end: true }, { status: 'COMPLETE', completedAt: now });
      } else if (a === 'edit') {
        editKey = editKey === r.key ? '' : r.key; render();
        const first = rowsEl.querySelector('[data-e]'); if (first) first.focus();
      } else if (a === 'rta') {
        saveUnload(r, { returnIds: r.pendingReturns.map(x => x.id) }, {});
      } else if (a === 'wash') {
        washTrailer(P.washesForRow(r, data().wash));
      } else if (a === 'drop') {
        editKey = '';
        saveUnload(r, { dropped: true }, { dropped: true });
      }
    });

    document.getElementById('areas').addEventListener('click', e => {
      const b = e.target.closest('button[data-area]');
      if (!b) return;
      if (b.dataset.area !== area) { area = b.dataset.area; tab = 'needs'; editKey = ''; }
      history.replaceState(null, '', '?date=' + date + '&area=' + area);
      render();
    });
    document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { tab = b.dataset.tab; editKey = ''; render(); } });
    document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => { mode = b.dataset.mode; editKey = ''; render(); }; });
    function setDate(d) {
      if (!L.isDateKey(d) || d === date) return;
      date = d; editKey = '';
      history.replaceState(null, '', '?date=' + date + '&area=' + area);
      watch();
      render();
    }
    document.getElementById('prev').onclick = () => setDate(L.addDays(date, -1));
    document.getElementById('next').onclick = () => setDate(L.addDays(date, 1));
    document.getElementById('work-date').addEventListener('change', e => setDate(e.target.value));

    let db = null;
    function watch() {
      while (unsubs.length) unsubs.pop()();
      const weeks = [...new Set(L.weeksForLoadDate(date).concat(L.weeksForLoadDate(L.addDays(date, -1)), [L.weekStart(date), L.weekStart(L.addDays(date, -1))]))];
      const fail = (what) => (e) => showError('Could not read ' + what + ': ' + e.message);
      unsubs.push(onSnapshot(query(collection(db, 'runs'), where('weekStart', 'in', weeks)), s => { runs = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); render(); }, fail('the loads')));
      unsubs.push(onSnapshot(query(collection(db, 'plantJournal'), where('date', '==', date)), s => { journal = s.docs.map(d => d.data()); render(); }, fail('the unloading list')));
      prevJournal = [];
      unsubs.push(onSnapshot(query(collection(db, 'plantJournal'), where('date', '==', L.addDays(date, -1))), s => { prevJournal = s.docs.map(d => d.data()); render(); }, fail('yesterday\'s unloading list')));
      unsubs.push(onSnapshot(query(collection(db, 'caseCounts'), where('date', '==', date)), s => {
        caseCounts = {};
        s.docs.forEach(d => { const c = d.data(); if (c.kind === 'UNLOAD') caseCounts[c.unloadKey] = c; });
        render();
      }, () => { caseCounts = {}; }));
      // Fleet's yard leave and return per unit (here or on the road, for the order). A screen that cannot read them orders without them.
      unsubs.push(onSnapshot(query(collection(db, 'gpsDays'), where('date', 'in', [-1, 0, 1].map(n => L.addDays(date, n)))), s => { gpsDays = s.docs.map(d => d.data()); render(); }, () => { gpsDays = []; render(); }));
    }

    requireSignIn(async (user) => {
      ({ db } = await start());
      watchPerson(db, user, p => { person = p; render(); });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; render(); });
      // Route Master's Drop and Hook tick (the week's loads do not carry it).
      onSnapshot(collection(db, 'routes'), s => { routes = s.docs.map(d => Object.assign({ runId: d.id }, d.data())); render(); }, () => { routes = []; render(); });
      onSnapshot(doc(db, 'caseCounters', 'case_returns'), s => { returnsCounter = s.data() || null; render(); }, () => { returnsCounter = null; });
      watchWashRequests(db, L.weekStart(today()), r => { sheetWash = r; render(); }, e => showError('Could not read the wash list: ' + e.message), 'plantWash');
      // Joe 10/18 (screen speed): the open wash requests and the week's finished ones, not every one ever made.
      watchWashRequests(db, L.weekStart(today()), r => { appWash = r; render(); }, e => showError('Could not read the wash requests: ' + e.message));
      watch();
      // The day rolls at 6 AM; a running unload's time ticks along.
      let shown = today();
      setInterval(() => { const t = today(); if (t !== shown) { if (date === shown) setDate(t); shown = t; } if (!document.activeElement || !document.activeElement.dataset || !(document.activeElement.dataset.f || document.activeElement.dataset.e)) render(); }, 30000);
      render();
    });
  </script>
</body>
</html>
