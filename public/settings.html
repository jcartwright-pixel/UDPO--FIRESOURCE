<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dispatch Settings · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
</head>
<body class="settings-page">
  <div class="signin" id="signin" hidden>
    <h1>Dispatch Settings</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Dispatch Settings</h1><small>Dispatch Administration &rsaquo; how dispatch is set up</small></div>
      <div class="actions tiles"><a class="button" href="admin.html">Dispatch Administration</a></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="set-grid">
      <section class="set-card"><h2>Dispatch week and day</h2><table class="set"><tbody id="week"></tbody></table></section>
      <section class="set-card"><h2>Which app runs each screen</h2><table class="set"><thead><tr><th>Screen</th><th>Run from</th><th>Saves</th></tr></thead><tbody id="owners"></tbody></table></section>
      <section class="set-card"><h2>Driver and unit lists</h2><table class="set"><tbody id="lists"></tbody></table></section>
      <section class="set-card"><h2>Where the data comes from</h2><table class="set"><tbody id="data"></tbody></table></section>
    </div>
  </div>

  <script type="module">
    import { requireSignIn, escapeHtml } from './js/app.js';
    import { lists, watchLists } from './js/edit.js';

    // The current app's Dispatch Settings card ("dispatch preferences and setup information"), read here in one page.
    const L = window.UDLogic;
    const row = (k, v) => '<tr><th>' + escapeHtml(k) + '</th><td>' + escapeHtml(v) + '</td></tr>';
    function render() {
      const app = lists.app || {}, wb = !!(app.writeBack && app.writeBack.enabled === true);
      document.getElementById('week').innerHTML = row('Plant', 'Uniontown') + row('Week runs', 'Sunday to Saturday, on every screen') +
        row('Operating day', 'Starts at ' + L.DAY_ROLL_HOUR + ':00 AM New York time; before that it is still the day before') +
        row('Load order', 'The Live sheet\'s load order change first, then Route Master\'s load order') + row('Route Master times', 'Kept in GMT, shown in New York time');
      document.getElementById('owners').innerHTML = Object.keys(L.SCREENS).map(k => { const s = L.screenState(app, k);
        return '<tr><td>' + escapeHtml(L.SCREENS[k]) + '</td><td>' + (s.owner === 'new' ? 'New app' : 'Current app') + '</td><td>' + (app.mode !== 'live' ? 'Test copy only' : s.open ? 'Saved here' : 'View only here') + '</td></tr>'; }).join('');
      const cvg = (lists.ops || []).filter(o => o.active !== false).map(o => o.assignment).join(', ');
      document.getElementById('lists').innerHTML = row('Drivers offered', lists.drivers.length + ' active drivers; days off and inactive drivers only with OVR') +
        row('Trucks / trailers offered', lists.trucks.length + ' trucks and ' + lists.trailers.length + ' trailers at Uniontown that are not down; a unit on the road on another run is marked') +
        row('Other CVG / Carriers', cvg || 'none active') + row('Leased trucks', 'Not on Fleet Service; their write-ups go to the lessor');
      document.getElementById('data').innerHTML = row('Mode', app.mode === 'live' ? 'Live' : 'Test copy: saves stay in the new app') + row('Write-back to the sheets', wb ? 'On' : 'Off') +
        row('Fleet list', 'Read each night at 2 AM from the United Dairy Fleet List (read only)') + row('Route Master and Live weeks', 'Copied from the sheets; Sheet Conflicts shows anything that needs a look');
    }
    requireSignIn(async (user) => { watchLists(user, render); render(); });
  </script>
</body>
</html>
