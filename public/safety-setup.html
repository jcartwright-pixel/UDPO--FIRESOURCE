<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Checklist Setup · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/safety.css">
  <script src="js/logic.js"></script>
  <script src="js/safety-rules.js"></script>
</head>
<body class="fill safety-page setup-page">
  <div class="signin" id="signin" hidden>
    <h1>Checklist Setup</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow" id="eyebrow">Safety Walkthrough</span><h1>Checklist Setup</h1><span class="sw-counts" id="counts"></span></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the test copy</span></div>
      <a class="sw-top" href="location-areas.html" id="areas-link" data-top>Location Areas</a>
      <a class="sw-top pri" href="safety.html" data-top>Weekly Walk</a>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="notice warning" id="offline-line" role="status" hidden></div>
    <div class="view">
      <div class="sw-sheet">
        <table class="sw-grid sw-setup">
          <colgroup><col style="width:58%"><col style="width:12%"><col style="width:10%"><col style="width:20%"></colgroup>
          <thead><tr><th>What to look at</th><th>How often</th><th>On the walk</th><th>Move to</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="sw-foot" id="foot"></div>
    </div>
  </div>

  <script>window.UD_OFFLINE = true;</script>
  <script type="module">
    import { startOffline } from './js/offline-saves.js';
    import { start, requireSignIn, save, escapeHtml, showError, watchPerson } from './js/app.js';
    import { doc, onSnapshot } from './js/firebase.js';
    import { pickPlant, plantName, canSetUp, modeText, watchSetup } from './js/safety.js';

    // Checklist Setup (Joe 10/12, mock-ups A and J): the plant's own checklist, under the areas and sub-areas of its Location
    // Areas (Administration > Plant Setup, where they are added, renamed, put in walking order and turned off). It starts from
    // the researched list (safety-rules.js). Each box saves as it is left: change an item's words, Weekly or Monthly, take it
    // off the walk, Move to another sub-area, or type a new one in a sub-area's empty row. An item once used is never deleted,
    // only taken off the walk, so old walks still read. A manager or administrator.
    const S = window.UDSafety;
    const params = new URLSearchParams(location.search);
    let db = null, person = null, app = {}, plant = '', setup = null, seen = false, stop = null, chain = Promise.resolve(), pending = null;
    const areas = () => pending ? S.checklist(Object.assign({}, setup || {}, { areas: pending }), true) : S.checklist(setup, true);
    const inp = (k, v, label, ph, max) => '<input type="text" data-k="' + k + '" value="' + escapeHtml(v || '') + '" maxlength="' + (max || 60) + '" aria-label="' + escapeHtml(label) + '"' + (ph ? ' placeholder="' + escapeHtml(ph) + '"' : '') + '>';
    const offTag = '<span class="sw-pill gray">Turned off in Location Areas</span>';
    function render(force) {
      document.getElementById('mode-text').textContent = modeText(app);
      document.getElementById('eyebrow').textContent = 'Safety Walkthrough · ' + plantName(plant);
      document.getElementById('areas-link').href = 'location-areas.html?plant=' + encodeURIComponent(plant);
      const set = canSetUp(person, app), dis = set ? '' : ' disabled', list = areas(), P = S.places(list);
      const on = list.reduce((n, a) => n + (a.off ? 0 : a.items.filter(i => !i.off).length), 0);
      document.getElementById('counts').textContent = P.length + ' areas · ' + list.length + ' sub-areas · ' + on + ' items on the walk' + (setup && setup.areas ? '' : ' · the starting list');
      document.getElementById('foot').textContent = set ? 'Each box saves as you leave it. Monthly items are on the first walk of each month. Type in a sub-area\'s empty row to add an item. Areas and sub-areas are added, renamed, put in order and turned off on Location Areas.' : 'View only. A manager or administrator changes the checklist.';
      if (force !== true && document.getElementById('rows').contains(document.activeElement)) return;
      const moveTo = (ai) => '<select data-k="move" aria-label="Move to another sub-area"' + dis + '><option value="">Move to…</option>' + P.map(p => '<optgroup label="' + escapeHtml(p.name) + '">' + p.areas.map(a => { const j = list.indexOf(a); return j === ai ? '' : '<option value="' + j + '">' + escapeHtml(a.name) + (a.off ? ' (off)' : '') + '</option>'; }).join('') + '</optgroup>').join('') + '</select>';
      document.getElementById('rows').innerHTML = !seen ? '<tr><td colspan="4" class="sw-empty">Reading the checklist…</td></tr>' : P.map(p =>
        '<tr class="sw-place-row" data-place="' + escapeHtml(p.name) + '"><td colspan="4"><b>' + escapeHtml(p.name) + '</b><span class="sw-how">' + p.areas.length + ' sub-areas · ' + p.areas.reduce((n, a) => n + a.items.length, 0) + ' items</span></td></tr>' +
        p.areas.map(a => { const ai = list.indexOf(a);
          return '<tr class="sw-sub-row' + (a.off ? ' sw-off' : '') + '" data-a="' + ai + '"><td colspan="4"><div class="sw-sub-line"><b>' + escapeHtml(a.name) + '</b>' + (a.off ? offTag : '') + '</div></td></tr>' +
            a.items.map((i, ii) => '<tr data-a="' + ai + '" data-i="' + ii + '">' +
              '<td>' + (set ? inp('text', i.text, 'Item', '', 160) : escapeHtml(i.text)) + '</td>' +
              '<td><select data-k="freq" aria-label="How often"' + dis + '>' + S.FREQS.map(f => '<option value="' + f + '"' + (f === i.freq ? ' selected' : '') + '>' + (f === 'WEEKLY' ? 'Weekly' : 'Monthly') + '</option>').join('') + '</select></td>' +
              '<td><label class="sw-check"><input type="checkbox" data-k="on"' + (i.off ? '' : ' checked') + dis + '>' + (i.off ? 'Off' : 'On') + '</label></td>' +
              '<td>' + moveTo(ai) + '</td></tr>').join('') +
            (set ? '<tr class="sw-add" data-a="' + ai + '" data-new="1"><td>' + inp('text', '', 'New item in ' + a.name, 'Add an item to ' + a.name, 160) + '</td><td></td><td></td><td></td></tr>' : '');
        }).join('')).join('');
    }
    function send(list) {
      pending = list;
      const run = chain.then(() => save('saveSafetyChecklist', { facilityId: plant, areas: list.map(a => ({ place: a.place, key: a.key, name: a.name, items: a.items })) }));
      chain = run.catch(() => {});
      return run.then(() => showError(''), err => { pending = null; showError(err); render(true); });
    }
    const copy = () => JSON.parse(JSON.stringify(areas()));
    const commit = (list) => { send(list).then(() => render(true)); render(true); };
    document.getElementById('rows').addEventListener('change', e => {
      const t = e.target, tr = t.closest('tr');
      if (!tr || !canSetUp(person, app)) return;
      const list = copy(), words = String(t.value || '').trim();
      const a = list[+tr.dataset.a];
      if (!a) return;
      if (tr.dataset.new) {
        if (!words) return;
        a.items.push({ id: a.key + '_' + Date.now().toString(36), text: words, freq: 'WEEKLY', off: false });
        t.value = '';
        return commit(list);
      }
      const i = a.items[+tr.dataset.i];
      if (t.dataset.k === 'text') { if (!words) { showError('An item needs words. To take it off the walk, untick On.'); t.value = i.text; return; } i.text = words; }
      if (t.dataset.k === 'freq') i.freq = t.value;
      if (t.dataset.k === 'on') i.off = !t.checked;
      if (t.dataset.k === 'move') { const to = list[+t.value]; if (!to) return; a.items.splice(+tr.dataset.i, 1); to.items.push(i); }
      commit(list);
    });
    function follow() {
      if (stop) stop();
      seen = false; setup = null; pending = null; render(true);
      stop = watchSetup(db, plant, s => { setup = s; seen = true; if (pending && s && JSON.stringify(S.checklist(s, true)) === JSON.stringify(areas())) pending = null; render(); });
    }
    startOffline(['safety.html', 'safety-issues.html', 'extinguishers.html', 'safety-fire.html', 'safety-walks.html', 'safety-setup.html']);
    requireSignIn(async (user) => {
      ({ db } = await start());
      watchPerson(db, user, p => {
        person = p;
        if (!plant) { plant = pickPlant(person, params.get('plant')); follow(); } else render(true);
      }, { withEmail: true });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; if (plant) render(true); });
    });
  </script>
</body>
</html>
