<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Administration · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/admin-pages.css">
  <script src="js/logic.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/production-rules.js"></script>
</head>
<body class="fill admin-center-page">
  <div class="signin" id="signin" hidden>
    <h1>Administration</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <!-- Joe 10/10: like the current app's Administration tab, only better: a menu of every item on the left, and the item
         opens on the right (its table, settings or screen) without leaving the page. Nothing from the old tab is left out. -->
    <div class="adm-shell" id="shell">
      <aside class="adm-nav" aria-label="Administration items">
        <div class="adm-nav-head"><div class="adm-title-row"><h1>Administration</h1><button type="button" class="adm-repairs" id="repairs" hidden></button></div><input type="search" id="find" placeholder="Find a setting" aria-label="Find a setting"></div>
        <div class="adm-nav-list" id="nav"></div>
      </aside>
      <section class="adm-panel" id="panel" aria-live="polite"></section>
    </div>
  </div>

  <script type="module">
    import { requireSignIn, start, escapeHtml, ICON, callServer, watchPerson } from './js/app.js';
    import { ADMIN_GROUPS, adminItem } from './js/admin-items.js';
    import { PAGES } from './js/admin-pages.js';
    import { TOOL_PAGES } from './js/admin-tools.js';
    import { renderGoLive } from './js/admin-golive.js';
    import { renderCaseCounters } from './js/admin-counters.js';
    import { renderMachineConnections } from './js/admin-machines.js';
    const L = window.UDLogic;
    const testEmail = new URLSearchParams(location.search).get('testEmail');
    // Pages built here (js/admin-pages.js), not a separate screen: they go through the server, Administrators only.
    const PANELS = Object.assign({}, PAGES, TOOL_PAGES, { switch: renderGoLive, 'case-counters': renderCaseCounters, 'machine-connections': renderMachineConnections });
    let admin = null, find = '', current = ADMIN_GROUPS[0][2][0][0];
    // Review item 54 (Joe 10/13): ?item=<key> opens that item first (Phone Screens' one line points to Links & Codes this way).
    { const want = new URLSearchParams(location.search).get('item'); if (want && adminItem(want)) current = want; }
    // Joe 10/26: the "?" opens the help for the item that is open (the page it shows, or the item's own part).
    window.udHelpFor = () => { const it = current && adminItem(current); return it && it.page ? it.page : 'administration.html' + (it ? '?item=' + it.key : ''); };
    const icon = (k) => /\.webp$/.test(k) ? '<img src="img/library/' + k + '" alt="">' : '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICON[k] || ICON.gear) + '</svg>';
    const withTest = (href) => testEmail ? href + (href.indexOf('?') >= 0 ? '&' : '?') + 'testEmail=' + encodeURIComponent(testEmail) : href;
    const state = (it) => it.page ? 'ready' : PANELS[it.key] ? 'inline' : 'soon';
    const PILL = { ready: '', inline: '', soon: 'Being built' };

    function renderNav() {
      const q = find.trim().toLowerCase();
      document.getElementById('nav').innerHTML = ADMIN_GROUPS.map(([group, , items]) => {
        // Batch 8 (10/23): an item that moved onto the Dispatch Administration page shows here only when searched for or open.
        const shown = items.map(i => adminItem(i[0])).filter(it => q ? (it.title + ' ' + it.what + ' ' + group).toLowerCase().indexOf(q) >= 0 : !it.moved || it.key === current);
        if (!shown.length) return '';
        return '<div class="adm-nav-group"><h2>' + escapeHtml(group) + '</h2>' + shown.map(it => {
          const st = state(it);
          // Review item 51 (Joe 10/13): menus are words only, so the side menu has no icons (the open item's title keeps its picture).
          return '<button type="button" class="adm-item ' + st + (it.key === current ? ' on' : '') + '" data-key="' + it.key + '"' + (it.key === current ? ' aria-current="true"' : '') + '>' +
            '<span class="adm-name">' + escapeHtml(it.title) + '</span>' + (PILL[st] ? '<em>' + PILL[st] + '</em>' : '') + '</button>';
        }).join('') + '</div>';
      }).join('') || '<p class="adm-none">Nothing matches. Try another word.</p>';
    }

    function renderPanel() {
      const panel = document.getElementById('panel'), it = adminItem(current), st = state(it);
      const head = '<header class="adm-panel-head"><span class="adm-ic big">' + icon(it.icon) + '</span><div><h2>' + escapeHtml(it.title) + '</h2><small>' + escapeHtml(it.group) + ' &middot; ' + escapeHtml(it.what) + '</small></div>' +
        '<div class="adm-actions">' + (st === 'ready' ? '<a class="button" id="full" href="' + withTest(it.page) + '">Open full screen</a>' : st === 'soon' ? '<span class="adm-state soon">' + PILL[st] + '</span>' : '') + '</div></header>';
      if (st === 'ready') {
        panel.innerHTML = head + '<iframe class="adm-frame" id="frame" title="' + escapeHtml(it.title) + '" src="' + withTest(it.page) + '"></iframe>';
      } else if (st === 'inline') {
        panel.innerHTML = head + '<div class="adm-view" id="view"><p class="adm-loading">Loading&hellip;</p></div>';
        PANELS[it.key](document.getElementById('view'), CTX);
      } else {
        panel.innerHTML = head + '<div class="adm-view"><div class="adm-soon"><h3>Being built in Operations</h3><p>' + escapeHtml(it.what) + '</p>' +
          '<p class="muted">In the current app this is under Administration &rsaquo; ' + escapeHtml(it.group) + '. It opens right here as soon as it is ready; nothing in Operations opens the old program.</p></div></div>';
      }
    }

    // What a page may ask of Administration: open another item, and update the "Repairs · N" count.
    const CTX = {
      open: (key) => { current = key; renderNav(); renderPanel(); },
      repairs: (n) => { const b = document.getElementById('repairs'); b.textContent = 'Repairs \u00b7 ' + n; b.hidden = !(n > 0); }
    };
    document.getElementById('repairs').addEventListener('click', () => CTX.open('repair-items'));

    function render() {
      const shell = document.getElementById('shell');
      if (admin === null) { shell.hidden = true; return; }
      if (!admin) {
        shell.hidden = false;
        shell.innerHTML = '<section class="soon-card"><h2>Administrators only</h2><p>Administration is for Administrators. Ask an administrator if you need something changed.</p></section>';
        return;
      }
      shell.hidden = false;
      renderNav();
      renderPanel();
      callServer('admin', { op: 'repairCount' }).then(r => CTX.repairs(r.count)).catch(() => {});
    }
    document.getElementById('nav').addEventListener('click', e => {
      const b = e.target.closest('[data-key]');
      if (!b || b.dataset.key === current) return;
      current = b.dataset.key;
      renderNav();
      renderPanel();
    });
    document.getElementById('find').addEventListener('input', e => { find = e.target.value; renderNav(); });
    requireSignIn(async (user) => {
      const { db } = await start();
      // Machine Connections reads each plant's machines itself, for the plants this person may see.
      CTX.db = db;
      watchPerson(db, user, p => {
        CTX.person = p;
        const was = admin;
        admin = L.isAdmin(p);
        if (was !== admin) render();
      });
    });
  </script>
</body>
</html>
