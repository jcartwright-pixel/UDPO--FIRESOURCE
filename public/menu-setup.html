<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Menu Setup · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/menu-setup.css">
  <script src="js/logic.js"></script>
</head>
<body class="fill menu-setup-page">
  <div class="signin" id="signin" hidden>
    <h1>Menu Setup</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Administration · Plant Setup · <span id="plant-name"></span></span><h1>Menu Setup</h1></div>
      <div class="actions in-head">
        <button type="button" class="ms-btn" id="reset">Start Over From the Standard Menu</button>
        <select id="plant" class="ms-pick" aria-label="Plant"></select>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view ms-view">
      <div class="ms-cols" id="cols"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">import './js/app.js'; import './js/menu-setup-page.js';</script>
</body>
</html>
