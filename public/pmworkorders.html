<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Plant Work Orders · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pmaint.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/pmaint-rules.js"></script>
</head>
<body class="fill issues-page pm-page pmw-page">
  <div class="signin" id="signin" hidden>
    <h1>Plant Work Orders</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Plant Maintenance · <span id="plant-name"></span></span><h1>Work Orders</h1></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Mechanics work them on the Maintenance Station</span></div>
      <div class="actions in-head">
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="actions">
        <div class="chips" id="filters"></div>
        <input type="search" id="search" placeholder="Find a machine, problem or mechanic" aria-label="Find">
      </div>
      <div class="sheet scroll-list">
        <table class="issues">
          <colgroup><col style="width:9%"><col style="width:14%"><col style="width:9%"><col style="width:22%"><col style="width:8%"><col style="width:10%"><col style="width:12%"><col style="width:16%"></colgroup>
          <thead><tr><th>Work Order</th><th>Machine</th><th>From</th><th>Problem</th><th>Line Down</th><th>Status</th><th>Mechanics</th><th>Fixed / Completed</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, shortDate, showError, goLiveNote } from './js/app.js';
    import { doc, onSnapshot } from './js/firebase.js';
    import { watchMaint, plantFor } from './js/pmaint.js';

    // Plant Work Orders (Joe 10/12: like the Garage Work Orders, for the plant's machinery). Made from a Maintenance Request on
    // the Maintenance Center, from a PM sent to maintenance, or by a mechanic on the Maintenance Station; worked and finished on
    // the Maintenance Station. NEW, WORKING and PARTS are open.
    const L = window.UDLogic, R = window.UDPlantMaint;
    const params = new URLSearchParams(location.search);
    const STATUS = { NEW: ['New', 'warn'], WORKING: ['Being worked', 'yes'], PARTS: ['Waiting on parts', 'warn'], DONE: ['Done', 'no'] };
    const FROM = { SHIFT_NOTES: 'Request', PM: 'PM', MAINTENANCE: 'Maintenance' };
    const FILTERS = [['open', 'Open'], ['parts', 'Waiting on parts'], ['done', 'Done'], ['all', 'All']];
    let plant = params.get('plant') || '', filter = 'open', search = '', person = null, app = {}, data = null, db = null, stop = null;
    const when = (s) => { const t = Date.parse(s || ''); return isFinite(t) ? shortDate(new Date(t).toLocaleDateString('en-CA', { timeZone: 'America/New_York' })) : ''; };
    const hm = (m) => m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' m' : m + ' m';

    function render() {
      const pl = plantFor(person, plant);
      if (plant !== pl.id) { plant = pl.id; const u = new URL(location.href); u.searchParams.set('plant', plant); history.replaceState(null, '', u); }
      document.getElementById('plant-name').textContent = pl.name;
      const st = L.screenState(app, 'plant');
      goLiveNote(st.live && st.owner !== 'new');
      document.getElementById('mode-text').textContent = st.live ? 'LIVE' : 'TEST COPY';
      const orders = data ? data.workOrders : [];
      // Review item 44 (Joe 10/13): no count tiles; the filter buttons below already carry the counts.
      const match = (o, k) => k === 'all' || (k === 'open' ? R.isOpen(o) : k === 'parts' ? o.status === 'PARTS' : o.status === 'DONE');
      document.getElementById('filters').innerHTML = FILTERS.map(([k, label]) => '<button type="button" data-filter="' + k + '" class="' + (filter === k ? 'on' : '') + '">' + label + '<b>' + orders.filter(o => match(o, k)).length + '</b></button>').join('');
      const q = search.toUpperCase();
      const list = orders.filter(o => match(o, filter) && (!q || [o.woNumber, o.machine, o.area, o.problem, o.fixedNote, o.completedBy, o.onNow, (o.labor || []).map(x => x && x.name).join(' ')].join(' ').toUpperCase().indexOf(q) >= 0))
        .sort((a, b) => (R.isOpen(b) - R.isOpen(a)) || String(b.completedAt || b.createdAt || '').localeCompare(String(a.completedAt || a.createdAt || '')));
      document.getElementById('rows').innerHTML = list.map(o => {
        const s = STATUS[o.status] || [o.status, 'no'], down = R.isOpen(o) && o.lineDown === 'YES';
        const labor = {}; (Array.isArray(o.labor) ? o.labor : []).forEach(x => { if (x && x.end) labor[x.name] = (labor[x.name] || 0) + (Number(x.minutes) || 0); });
        const crew = Object.keys(labor).map(n => escapeHtml(n) + ' ' + hm(labor[n])).join(', ') + (o.onNow && R.isOpen(o) ? (Object.keys(labor).length ? ' · ' : '') + 'on now: ' + escapeHtml(o.onNow) : '');
        const fix = o.status === 'DONE' ? escapeHtml(o.fixedNote || '') + '<small>' + when(o.completedAt) + (o.minutes ? ' · ' + escapeHtml(o.minutes) + ' min' : '') + (o.completedBy ? ' · ' + escapeHtml(o.completedBy) : '') + '</small>' : '';
        return '<tr' + (down ? ' class="review"' : '') + '><td class="strong">' + escapeHtml(o.woNumber || '') + '<small>' + when(o.createdAt) + '</small></td><td class="strong">' + escapeHtml(o.machine || 'Plant') + (o.area ? '<small>' + escapeHtml(o.area) + '</small>' : '') + '</td>' +
          '<td>' + escapeHtml(FROM[o.source] || o.source || '') + (o.urgency ? '<small>' + escapeHtml(o.urgency) + '</small>' : '') + '</td><td class="wrong">' + escapeHtml(o.problem || '') + '</td>' +
          '<td><span class="pill ' + (o.lineDown === 'YES' ? 'warn">YES' : 'yes">NO') + '</span></td><td><span class="pill ' + s[1] + '">' + escapeHtml(s[0]) + '</span></td>' +
          '<td>' + (crew ? '<small>' + crew + '</small>' : '') + '</td><td class="wrong">' + fix + '</td></tr>';
      }).join('') || '<tr><td colspan="8" class="empty">' + (!data || !data.read.workOrders ? 'Loading the work orders&hellip;' : orders.length ? 'No work orders match.' : 'No work orders yet. Make Work Order on the Maintenance Center, Send to Maintenance on the PM Schedule, or Report on the Maintenance Station makes one.') + '</td></tr>';
      document.getElementById('foot').textContent = orders.length + ' plant work orders. Shaded rows: the line is down until it is fixed.';
    }

    document.getElementById('filters').addEventListener('click', e => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; render(); } });
    document.getElementById('search').addEventListener('input', e => { search = e.target.value.trim(); render(); });
    window.udBack = () => { if (filter !== 'open' || search) { filter = 'open'; search = ''; document.getElementById('search').value = ''; render(); return true; } return false; };

    function follow() {
      if (stop) stop();
      data = null;
      render();
      stop = watchMaint(db, plant, d => { data = d; render(); }, e => showError('Could not read the work orders (' + e.message + '). Check the network and reload the page.'), { noJournal: true });
    }
    requireSignIn(async (user) => {
      ({ db } = await start());
      onSnapshot(doc(db, 'users', String(user.email).toLowerCase()), s => { person = s.exists() ? Object.assign({ email: user.email }, s.data()) : null; if (!stop) follow(); else render(); });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; render(); });
    });
  </script>
</body>
</html>
