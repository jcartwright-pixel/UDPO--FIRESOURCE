<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Labeling Room · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pmaint.css">
  <link rel="stylesheet" href="css/labeling.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/production-rules.js"></script>
</head>
<body class="fill pm-page mach-page lr-page">
  <div class="signin" id="signin" hidden>
    <h1>Labeling Room</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Debag / Labeling Room · <span id="plant-name"></span></span><h1>Labeling Room</h1></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the test copy</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <!-- Joe 10/31 (mock-up 3, "United Dairy End Zone"): one panel for each filler the Labeling Room labels for: the label going on
           now, how many are left to label, the bottles on the belt, what is next, and "I switched". A filler's Hold labels shows here. -->
      <div class="lr-lanes" id="lanes"><p class="lr-wait">Reading the fillers…</p></div>
      <p class="lr-note" id="note"></p>
    </div>
  </div>

  <script type="module">import './js/app.js'; import './js/labeling-page.js';</script>
</body>
</html>
