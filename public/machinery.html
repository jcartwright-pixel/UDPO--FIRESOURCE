<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Machinery · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pmaint.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/pmaint-rules.js"></script>
</head>
<body class="fill pm-page mach-page">
  <div class="signin" id="signin" hidden>
    <h1>Machinery</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Plant Maintenance · <span id="plant-name"></span></span><h1>Machinery</h1></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the test copy</span></div>
      <div class="actions in-head">
        <button type="button" class="pm-btn pri" id="add">+ Add Machine</button>
        <select id="area" class="pm-pick" aria-label="Area"></select>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="mach-split">
        <section class="pm-panel" aria-label="Machinery list">
          <div class="pm-scroll">
            <table class="pm-table">
              <thead><tr><th>Area</th><th>Machine</th><th>Make / Model</th><th>Status</th><th class="num">Open</th><th>Next PM</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <section class="pm-panel mach-card" id="card" aria-label="Machine"></section>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">import './js/app.js'; import './js/machinery-page.js';</script>
</body>
</html>
