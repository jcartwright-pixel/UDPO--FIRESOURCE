<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Home · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/home.css">
  <script src="js/logic.js"></script>
</head>
<body class="launch-page">
  <div class="signin" id="signin" hidden>
    <h1>Operations</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar"><span class="who" id="who"></span><button id="signout" type="button">Sign out</button></div>
    <div class="launch-title"><h1 id="plant-name">Uniontown Operations</h1><p>Select the department you want to open.</p><span id="today">-</span></div>
    <div class="notice error" id="error" hidden></div>
    <!-- Joe 10/10: like the old app's home, one big picture per side; each opens its side, whose menu lists only its own screens. -->
    <section class="launch-grid six" id="sides"></section>
  </div>
  <script type="module">
    import { start, requireSignIn, shortDate, SIDES, GROUPS, groupSides, ICON, escapeHtml, watchPerson } from './js/app.js';
    import { WALK_ROLES } from './js/walk-bar.js';
    import { watchIssueRecords, watchHubWorkOrders } from './js/recent-records.js';
    const L = window.UDLogic;
    // Joe 10/11: Plant Production and Plant Maintenance carry an UNDER CONSTRUCTION banner across their picture.
    const art = (s) => s.pic ? '<img src="img/library/' + s.pic + '" alt="' + (s.bannerInPic ? 'Under Construction' : '') + '">' : '<svg class="launch-icon" viewBox="0 0 24 24" aria-hidden="true">' + ICON[s.icon] + '</svg>';
    // Joe 10/26 (1E): four cards: Plant Operations and Route Distribution (each opens its own page of department cards) and Reports
    // and Safety Walkthrough. Under each card's Open button, straight down: each department in dark blue with its main screens under
    // it in light blue (Reports: its four report groups; Safety Walkthrough: its main screens). Administration is the header button.
    const bld = (s) => s.building ? ' building' : '';
    const sub = (s, [label, href]) => '<a class="hq-sub' + bld(s) + (s.buildingSections && /inventory\.html/.test(href) ? ' building' : '') + '" data-side="' + s.key + '" href="' + href + '">' + escapeHtml(label) + '</a>';
    const dept = (s) => '<a class="hq-main' + bld(s) + '" data-side="' + s.key + '" href="' + s.home + '">' + escapeHtml(s.name) + '</a>' + (s.quick || []).map(q => sub(s, q)).join('') +
      (s.key === 'fleet' || s.key === 'garage' ? '<span class="hq-note" data-note="' + s.key + '" hidden></span>' : '');
    // Joe 10/28: departments with no screens of their own under them sit two to a row, so the card still fits.
    const solo = (s) => !!s && !(s.quick || []).length && s.key !== 'fleet' && s.key !== 'garage';
    const pairUp = (list) => {
      let html = '';
      for (let i = 0; i < list.length; i++) {
        if (solo(list[i]) && solo(list[i + 1])) { html += '<div class="hq-pair">' + dept(list[i]) + dept(list[i + 1]) + '</div>'; i++; } else html += dept(list[i]);
      }
      return html;
    };
    const groupCard = (g) => '<div class="launch-card hq-card" data-group="' + g.key + '"><a class="launch-art" href="' + g.home + '" tabindex="-1">' + art(g) + '</a><strong>' + escapeHtml(g.name) + '</strong>' +
      '<a class="open-text" href="' + g.home + '">Open ' + escapeHtml(g.name) + ' &rarr;</a><div class="hq-list">' + pairUp(groupSides(g.key).filter(s => !s.menuOnly)) + '</div></div>';
    const sideCard = (s) => '<div class="launch-card hq-card' + bld(s) + (s.bannerInPic ? ' banner-pic' : '') + '" data-card-side="' + s.key + '"><a class="launch-art" data-side="' + s.key + '" href="' + s.home + '" tabindex="-1">' + art(s) + (s.building && !s.bannerInPic ? '<span class="uc-banner">Under Construction</span>' : '') + '</a>' +
      '<strong>' + escapeHtml(s.name) + '</strong><a class="open-text" data-side="' + s.key + '" href="' + s.home + '">Open ' + escapeHtml(s.short || s.name) + ' &rarr;</a>' +
      (s.building ? '<b class="uc-admin-only">Administrators only while it is being built</b>' : '') + '<div class="hq-list">' + (s.quick || []).map(q => sub(s, q)).join('') + '</div></div>';
    const cards = GROUPS.map(groupCard).concat(SIDES.filter(s => !s.group && !s.menuOnly).map(sideCard));
    document.getElementById('sides').innerHTML = cards.join('');
    document.getElementById('sides').classList.add('seven', 'hq-grid');
    // The side picked here is the side its screens' menu shows.
    // Joe 10/11: an Under Construction card opens only for an Administrator; anyone else stays on this page.
    document.getElementById('sides').addEventListener('click', e => {
      const a = e.target.closest('[data-side]');
      if (a && a.classList.contains('building') && !document.body.classList.contains('is-admin')) { e.preventDefault(); return; }
      if (a) { try { sessionStorage.setItem('udSide', a.dataset.side); } catch (x) { /* no storage */ } return; }
      // Anywhere else on a card opens the card's own page.
      const c = !e.target.closest('a') && e.target.closest('.hq-card'), open = c && c.querySelector('.open-text');
      if (open && getComputedStyle(open).display !== 'none') open.click();
    });
    // Joe 10/26: a little of each fleet department's numbers under its buttons (open truck issues, open garage work orders).
    const note = (k, n, words) => { const el = document.querySelector('[data-note="' + k + '"]'); if (el) { el.innerHTML = '<b>' + n + '</b> ' + words; el.hidden = false; el.classList.toggle('bad', n > 0); } };
    // Joe 10/11: someone who sees more than one plant goes straight to the all-plants overview, without Uniontown's home
    // showing first. Known from this tab's last visit at once; otherwise the page stays blank until the Users list says.
    let picked0 = '', multi0 = '';
    try { picked0 = sessionStorage.getItem('udPlant') || ''; multi0 = sessionStorage.getItem('udMulti') || ''; } catch (e) { /* no storage */ }
    if (multi0 === '1' && !picked0) location.replace('company.html' + location.search);
    if (multi0 !== '0' && !picked0) document.body.classList.add('deciding');
    const decided = () => document.body.classList.remove('deciding');
    setTimeout(decided, 5000);
    requireSignIn(async (user) => {
      const today = L.operatingDay(new Date());
      document.getElementById('today').textContent = L.dayName(today) + ' ' + shortDate(today);
      const { db } = await start();
      watchIssueRecords(db, r => { const n = L.issueNumbers(L.issueRows(r, 'TRUCK', Date.now()), Date.now()).open; note('fleet', n, n === 1 ? 'open truck issue' : 'open truck issues'); }, () => {});
      watchHubWorkOrders(db, L.weekStart(L.operatingDay(new Date())), r => { const n = r.filter(o => String(o.status || 'NEW').toUpperCase() !== 'DONE').length; note('garage', n, n === 1 ? 'work order open' : 'work orders open'); }, () => {});
      watchPerson(db, user, person => {
        const plants = L.plantsFor(person);
        let picked = '';
        try { picked = sessionStorage.getItem('udPlant') || ''; } catch (e) { /* no storage */ }
        // Someone who sees more than one plant starts on the all-plants overview; a one-plant person (Joe: a supervisor
        // such as Brian Bircher) only ever sees their plant's home.
        if (plants.length > 1 && !picked) { location.replace('company.html' + location.search); return; }
        // Joe 10/15: a manager who signs in on a phone or tablet starts on the manager's three choices (Manager Walkthrough,
        // Loading, Unloading); "Open the full Operations app" there comes back here (?full=1, kept for this tab).
        let full = new URLSearchParams(location.search).get('full') === '1';
        try { if (full) sessionStorage.setItem('udFull', '1'); else full = sessionStorage.getItem('udFull') === '1'; } catch (e) { /* no storage */ }
        const handheld = window.matchMedia('(pointer: coarse) and (max-width: 1100px)').matches;
        if (handheld && !full && L.hasRole(person, WALK_ROLES)) { location.replace('walkthrough.html?view=home'); return; }
        decided();
        const plant = L.PLANTS.find(p => p.id === (plants.indexOf(picked) >= 0 ? picked : plants[0])) || L.PLANTS[0];
        document.getElementById('plant-name').textContent = plant.name + ' Operations';
      }, { withEmail: true });
    });
  </script>
</body>
</html>
