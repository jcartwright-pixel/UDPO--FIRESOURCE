<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
</head>
<body class="launch-page">
  <div class="signin" id="signin" hidden>
    <h1>New Plant Operations</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar"><span class="who" id="who"></span><button id="signout" type="button">Sign out</button></div>
    <div class="launch-title"><h1>Uniontown Operations</h1><p>Select the department you want to open.</p><span id="today">-</span></div>
    <div class="notice error" id="error" hidden></div>
    <!-- Joe 10/10: like the old app's home, one big picture per side; each opens its side, whose menu lists only its own screens. -->
    <section class="launch-grid" id="sides"></section>
  </div>
  <script type="module">
    import { requireSignIn, shortDate, SIDES, escapeHtml } from './js/app.js';
    const L = window.UDLogic;
    document.getElementById('sides').innerHTML = SIDES.map(s => '<a class="launch-card" data-side="' + s.key + '" href="' + s.home + '">' +
      '<span class="launch-art"><img src="img/library/' + s.pic + '" alt=""></span><strong>' + escapeHtml(s.name) + '</strong><small>' + escapeHtml(s.note) + '</small>' +
      '<b>Open ' + escapeHtml(s.name.replace(/^Route /, '').replace(/ Operations$/, '')) + ' &rarr;</b></a>').join('');
    // The side picked here is the side its screens' menu shows.
    document.getElementById('sides').addEventListener('click', e => { const a = e.target.closest('[data-side]'); if (a) try { sessionStorage.setItem('udSide', a.dataset.side); } catch (x) { /* no storage */ } });
    requireSignIn(async () => {
      const today = L.operatingDay(new Date());
      document.getElementById('today').textContent = L.dayName(today) + ' ' + shortDate(today);
    });
  </script>
</body>
</html>
