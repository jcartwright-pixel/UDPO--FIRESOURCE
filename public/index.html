<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Home · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/home.css">
  <script src="js/logic.js"></script>
</head>
<body class="launch-page">
  <div class="signin" id="signin" hidden>
    <h1>Operations</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar"><span class="who" id="who"></span><button id="signout" type="button">Sign out</button></div>
    <div class="launch-title"><h1 id="plant-name">Uniontown Operations</h1><p>Select the department you want to open.</p><span id="today">-</span></div>
    <div class="notice error" id="error" hidden></div>
    <!-- Joe 10/10: like the old app's home, one big picture per side; each opens its side, whose menu lists only its own screens. -->
    <section class="launch-grid six" id="sides"></section>
  </div>
  <script type="module">
    import { start, requireSignIn, shortDate, SIDES, ICON, escapeHtml, watchPerson } from './js/app.js';
    import { doc, onSnapshot } from './js/firebase.js';
    const L = window.UDLogic;
    // Joe 10/11: Plant Production and Plant Maintenance carry an UNDER CONSTRUCTION banner across their picture.
    const art = (s) => s.pic ? '<img src="img/library/' + s.pic + '" alt="' + (s.bannerInPic ? 'Under Construction' : '') + '">' : '<svg class="launch-icon" viewBox="0 0 24 24" aria-hidden="true">' + ICON[s.icon] + '</svg>';
    const card = (s) => '<a class="launch-card' + (s.building ? ' building' : '') + (s.bannerInPic ? ' banner-pic' : '') + '" data-side="' + s.key + '" href="' + s.home + '">' +
      '<span class="launch-art">' + art(s) + (s.building && !s.bannerInPic ? '<span class="uc-banner">Under Construction</span>' : '') + '</span><strong>' + escapeHtml(s.name) + '</strong><small>' + escapeHtml(s.note) + '</small>' +
      '<b class="open-text">Open ' + escapeHtml(s.short || s.name.replace(/^Route /, '').replace(/ Operations$/, '')) + ' &rarr;</b>' +
      (s.building ? '<b class="uc-admin-only">Administrators only while it is being built</b>' : '') + '</a>';
    // Joe 10/11: six cards (the plant's three, Route Distribution, Fleet & Maintenance, Reports); Administration is the header button.
    document.getElementById('sides').innerHTML = SIDES.map(card).join('');
    // Joe 10/12: a seventh card (Safety Walkthrough) next to Reports; four cards a row so all seven fit one screen (mock-up A).
    document.getElementById('sides').classList.toggle('seven', SIDES.length > 6);
    // The side picked here is the side its screens' menu shows.
    // Joe 10/11: an Under Construction card opens only for an Administrator; anyone else stays on this page.
    document.getElementById('sides').addEventListener('click', e => {
      const a = e.target.closest('[data-side]');
      if (a && a.classList.contains('building') && !document.body.classList.contains('is-admin')) { e.preventDefault(); return; }
      if (a) try { sessionStorage.setItem('udSide', a.dataset.side); } catch (x) { /* no storage */ }
    });
    // Joe 10/11: someone who sees more than one plant goes straight to the all-plants overview, without Uniontown's home
    // showing first. Known from this tab's last visit at once; otherwise the page stays blank until the Users list says.
    let picked0 = '', multi0 = '';
    try { picked0 = sessionStorage.getItem('udPlant') || ''; multi0 = sessionStorage.getItem('udMulti') || ''; } catch (e) { /* no storage */ }
    if (multi0 === '1' && !picked0) location.replace('company.html' + location.search);
    if (multi0 !== '0' && !picked0) document.body.classList.add('deciding');
    const decided = () => document.body.classList.remove('deciding');
    setTimeout(decided, 5000);
    requireSignIn(async (user) => {
      const today = L.operatingDay(new Date());
      document.getElementById('today').textContent = L.dayName(today) + ' ' + shortDate(today);
      const { db } = await start();
      watchPerson(db, user, person => {
        const plants = L.plantsFor(person);
        let picked = '';
        try { picked = sessionStorage.getItem('udPlant') || ''; } catch (e) { /* no storage */ }
        // Someone who sees more than one plant starts on the all-plants overview; a one-plant person (Joe: a supervisor
        // such as Brian Bircher) only ever sees their plant's home.
        if (plants.length > 1 && !picked) { location.replace('company.html' + location.search); return; }
        decided();
        const plant = L.PLANTS.find(p => p.id === (plants.indexOf(picked) >= 0 ? picked : plants[0])) || L.PLANTS[0];
        document.getElementById('plant-name').textContent = plant.name + ' Operations';
      }, { withEmail: true });
    });
  </script>
</body>
</html>
