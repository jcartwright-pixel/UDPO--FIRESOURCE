<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Maintenance Station · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stations.css">
  <link rel="stylesheet" href="css/pmaint.css">
</head>
<body class="fill phone gs-page ms-page">
  <div id="screen">
    <!-- Joe 10/10: a tablet screen on every screen size: a slim header with Back and Home, no desktop side menu. -->
    <div class="topbar">
      <button type="button" class="gs-nav" id="go-back" title="Back one screen">&#8249; Back</button>
      <button type="button" class="gs-nav" id="go-home" title="Home">Home</button>
      <button type="button" class="gs-nav" id="ms-change" hidden>Release</button>
      <span class="gs-people" id="people"></span>
      <button id="gs-signout" type="button" hidden>Sign Out</button>
    </div>
    <div class="head">
      <div class="title"><h1 id="title">Maintenance Station</h1><small>Plant machinery. Tap a work order, then your name and login ID to start, stop or complete it. No email needed.</small></div>
    </div>
    <div class="view">
      <div class="gs">
        <p class="gs-msg" id="gs-message" role="alert" hidden></p>
        <div id="ms-release" hidden></div>

        <!-- Work orders: the first screen, no sign-in (Joe 10/10). -->
        <section id="view-jobs" class="gs-stack">
          <div class="gs-bar"><h2 id="jobs-title">Work Orders</h2><button type="button" class="gs-btn red" id="to-report">+ Report a Problem</button><button type="button" class="gs-btn dark" id="to-breakdown">Record a Breakdown</button></div>
          <div class="gs-strip" id="strip" aria-label="Mechanics"></div>
          <div class="gs-jobs" id="jobs"></div>
        </section>
        <!-- One work order, Who are you? and Complete's two steps come here from js/job-station.js (shared with the Garage
             Station, review item 74). -->

        <!-- Report a Problem: a work order for maintenance. -->
        <section id="view-report" class="gs-stack" hidden>
          <div class="gs-bar"><button type="button" class="gs-btn dark" data-go="jobs">&larr; Work Orders</button><h2>Report a Problem</h2></div>
          <div class="gs-report">
            <div class="gs-card">
              <div class="gs-label">1. Which machine?</div>
              <div class="gs-cats ms-machines" id="report-machines"></div>
            </div>
            <div class="gs-card">
              <div class="gs-label">2. What's wrong?</div>
              <textarea class="gs-note ms-text" id="report-note" maxlength="300" placeholder="Water leaking under the pasteurizer"></textarea>
              <div class="gs-label">3. Is the line down?</div>
              <div class="gs-yesno"><button type="button" class="gs-btn line" data-down="yes">Yes, it's down</button><button type="button" class="gs-btn green" data-down="no">No, it runs</button></div>
              <button type="button" class="gs-btn red" id="send-report">Send</button>
            </div>
          </div>
        </section>

        <!-- Record a Breakdown: a big one fixed on the spot, on the shift log and the machine's history (Joe 10/12). -->
        <section id="view-breakdown" class="gs-stack" hidden>
          <div class="gs-bar"><button type="button" class="gs-btn dark" data-go="jobs">&larr; Work Orders</button><h2>Record a Breakdown</h2></div>
          <div class="gs-report">
            <div class="gs-card">
              <div class="gs-label">1. Which machine?</div>
              <div class="gs-cats ms-machines" id="brk-machines"></div>
            </div>
            <div class="gs-card">
              <div class="ms-times"><label class="gs-label">2. Down at<input type="time" class="gs-note" id="brk-down"></label><label class="gs-label">Back up at<input type="time" class="gs-note" id="brk-up"></label></div>
              <div class="gs-label">3. What happened?</div>
              <textarea class="gs-note ms-text" id="brk-cause" maxlength="1000" placeholder="Valve 14 blew a seal"></textarea>
              <div class="gs-label">4. What fixed it?</div>
              <textarea class="gs-note ms-text" id="brk-fix" maxlength="1000" placeholder="Replaced the seal"></textarea>
              <button type="button" class="gs-btn red" id="send-breakdown">Record</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { start, escapeHtml } from './js/app.js';
    import { httpsCallable } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js';
    import { askRelease, lockStation } from './js/station-code.js';
    import { mountJobStation, rid } from './js/job-station.js';

    /*
     * Plant Maintenance's Maintenance Station (Joe 10/12, mock-up E): the Garage Station for the plant's machinery, with the
     * same technicians and login IDs. Record a Breakdown logs a big one fixed on the spot (on Shift Notes and the machine's
     * history); + Report a Problem makes a work order. The screens it shares with the Garage Station (work orders, one work
     * order, Who are you?, Complete) are js/job-station.js (review item 74); here are the plant's own.
     */
    const $ = (id) => document.getElementById(id);
    const PLANT = new URLSearchParams(location.search).get('plant') || (() => { try { return sessionStorage.getItem('udPlant') || ''; } catch (e) { return ''; } })() || 'fac_uniontown';
    // No plant picker: the plant shows in the title (Joe 10/12).
    document.getElementById('title').textContent = 'Maintenance Station · ' + ({ fac_uniontown: 'Uniontown', fac_charleston: 'Charleston', fac_martins_ferry: 'Martins Ferry' }[PLANT] || PLANT);
    let machines = [];
    let machinePick = '', downPick = null, reportDraft = null, brkPick = '', brkDraft = null;

    const fn = async () => httpsCallable((await start()).functions, 'garage');
    async function call(op, fields) { return (await (await fn())(Object.assign({ op, facilityId: PLANT, maint: true }, fields || {}))).data; }

    const S = mountJobStation({
      call, views: ['breakdown'], forms: ['report', 'breakdown'], safeYes: 'Yes, safe to run', officeSource: 'PM', downWord: 'LINE DOWN', unitClass: 'unit ms-unit',
      emptyJobs: 'No open work orders right now. Requests the plant sends and PMs come in here.',
      noTechs: 'No mechanics yet. The office adds them in Fleet Service Setup (Garage Technicians); they sign in here with the same login ID.',
      hideEmptyStrip: true,
      board: () => call('pmBoard'),
      onBoard: (r) => { machines = r.machines; },
      jobKey: (j) => j.id,
      jobLine: (j) => [j.woNumber, j.from, j.urgency ? 'can wait: ' + j.urgency.toLowerCase() : ''].filter(Boolean).join(' · '),
      problem: (j) => j.problem,
      jobHead: (j) => j.woNumber + ' · ' + j.unit,
      jobLabel: (j) => (j.from || '') + (j.area ? ' · ' + j.area : ''),
      asks: { breakdown: () => ['Record a Breakdown', 'Who is recording it? Tap your name, then your login ID.'] },
      step: (who, job, op) => call('pmStep', { tokens: [who.token], step: op, id: job.id, requestId: rid() }),
      completeName: (j) => j.woNumber + ' ' + j.unit,
      safeQ: (j) => 'Is ' + j.unit + ' safe to run?',
      safeWord: 'Safe to run?',
      complete: (j, who, f) => call('pmStep', Object.assign({ tokens: [who.token], step: 'DONE', id: j.id, requestId: rid() }, f)),
      doneText: (j, who, safe, r) => safe ? j.woNumber + ' ' + j.unit + ' completed by ' + who.name + '.' + (r.pm ? ' Next PM due ' + r.pm.nextDue + '.' : '') : j.unit + ' stays open: not safe to run yet.',
      purposes: { report: sendReport, breakdown: sendBreakdown }
    });

    /* ---------- Report a Problem and Record a Breakdown ---------- */
    const machineButtons = (pick) => machines.map(m => '<button type="button" class="gs-btn' + (m.id === pick ? ' pick-on' : '') + '" data-m="' + escapeHtml(m.id) + '">' + escapeHtml(m.name) + (m.area ? '<small>' + escapeHtml(m.area) + '</small>' : '') + '</button>').join('') ||
      '<p class="gs-hint">No machines yet. They are added on Plant Maintenance, Machinery.</p>';
    function drawReport() {
      $('report-machines').innerHTML = machineButtons(machinePick);
      document.querySelectorAll('[data-down]').forEach(b => b.classList.toggle('pick-on', downPick !== null && (b.dataset.down === 'yes') === downPick));
    }
    $('to-report').addEventListener('click', () => { machinePick = ''; downPick = null; $('report-note').value = ''; S.message(''); drawReport(); S.view('report'); });
    $('report-machines').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { machinePick = b.dataset.m; drawReport(); } });
    document.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => { downPick = b.dataset.down === 'yes'; drawReport(); }));
    $('send-report').addEventListener('click', () => {
      if (!machinePick) { S.message('Tap the machine.'); return; }
      if (!$('report-note').value.trim()) { S.message('Type what\'s wrong.'); return; }
      if (downPick === null) { S.message('Tap Yes or No for "Is the line down?".'); return; }
      reportDraft = { machineId: machinePick, problem: $('report-note').value.trim(), lineDown: downPick };
      S.ask('report', null);
    });
    async function sendReport(who) {
      S.busy = true; S.message('Saving…', true);
      try {
        const r = await call('pmStep', Object.assign({ tokens: [who.token], step: 'REPORT', requestId: rid() }, reportDraft));
        S.message(r.message, true);
        reportDraft = null; S.view('jobs'); await S.load();
      } catch (err) { S.message(err.message); S.view('report'); }
      finally { S.busy = false; S.signOut(who.token); }
    }

    const nowTime = () => new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'America/New_York' });
    function drawBreakdown() { $('brk-machines').innerHTML = machineButtons(brkPick); }
    $('to-breakdown').addEventListener('click', () => { brkPick = ''; ['brk-cause', 'brk-fix', 'brk-up'].forEach(k => { $(k).value = ''; }); $('brk-down').value = nowTime(); S.message(''); drawBreakdown(); S.view('breakdown'); });
    $('brk-machines').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { brkPick = b.dataset.m; drawBreakdown(); } });
    $('send-breakdown').addEventListener('click', () => {
      if (!brkPick) { S.message('Tap the machine.'); return; }
      if (!$('brk-down').value) { S.message('Enter when it went down.'); return; }
      if (!$('brk-cause').value.trim()) { S.message('Type what happened.'); return; }
      brkDraft = { machineId: brkPick, downAt: $('brk-down').value, upAt: $('brk-up').value, cause: $('brk-cause').value.trim(), fix: $('brk-fix').value.trim() };
      S.ask('breakdown', null);
    });
    async function sendBreakdown(who) {
      S.busy = true; S.message('Saving…', true);
      try {
        const r = await call('pmStep', Object.assign({ tokens: [who.token], step: 'BREAKDOWN', requestId: rid() }, brkDraft));
        S.message(r.message + ' It shows on Shift Notes and the machine\'s history.', true);
        brkDraft = null; S.view('jobs'); await S.load();
      } catch (err) { S.message(err.message); S.view('breakdown'); }
      finally { S.busy = false; S.signOut(who.token); }
    }

    // Review item 49 (Joe 10/13): the Maintenance Station is a station, so it locks like the others: no Back, Home or Sign out,
    // only the Release bar at the bottom. Release asks for the plant's manager release code (when the plant has one), then
    // goes back to the screen it was opened from (Home when it was opened on its own).
    lockStation($('ms-change'), true);
    $('ms-change').addEventListener('click', async () => {
      const ok = await askRelease($('ms-release'), { status: () => call('release', { step: 'status' }), release: (code) => call('release', { step: 'release', code }), onError: S.message,
        why: 'A manager must type the manager release code to take this tablet off the Maintenance Station.' });
      if (!ok) return;
      let from = '';
      try { from = document.referrer && new URL(document.referrer).origin === location.origin ? document.referrer : ''; } catch (e) { /* no referrer */ }
      location.href = from && !/maint-station\.html/.test(from) ? from : 'index.html';
    });

    S.view('jobs');
    S.load().catch(err => S.message(err.message));
  </script>
</body>
</html>
