<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Joe 10/12: installed from here ("Driver Station"), it opens full screen in its own window, no browser bars. -->
  <link rel="manifest" href="driver-station.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Driver Station">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/driver-station/apple-touch-icon.png">
  <title>Driver Station · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stations.css">
  <script src="js/logic.js"></script>
  <script src="js/board-rules.js"></script>
  <!-- Joe 10/13: with no signal the station opens from the tablet and shows the last board it had (js/offline-saves.js). -->
  <script>window.UD_OFFLINE = true;</script>
</head>
<body class="fill phone ds-page">
  <div class="signin" id="signin" hidden>
    <h1>Driver Station</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <!-- Joe 10/10: the Driver Room kiosk opens full screen like the phone and tablet screens: a slim header, no desktop menu. -->
    <div class="topbar">
      <button type="button" class="gs-nav" id="go-back" title="Back one screen">&#8249; Back</button>
      <button type="button" class="gs-nav" id="go-home" title="Home">Home</button>
      <button type="button" class="gs-nav" id="change" hidden>Release</button>
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <!-- Joe 10/12: the TV screen has no buttons, so a small Exit in the corner unattaches it (manager release code). -->
    <button type="button" class="ds-exit" id="tv-exit" hidden>Exit</button>
    <div class="head">
      <div class="title"><span class="eyebrow" id="eyebrow">Driver Loadout &amp; Pickup</span><h1><span id="plant">Uniontown</span> Loadout <span class="ds-day" id="weekday"></span></h1></div>
      <p class="ds-welcome" id="welcome" hidden></p>
      <button type="button" id="tv" data-top>Driver's Kiosk Station</button><button type="button" id="refresh" data-top>&#8635; Refresh</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <!-- Joe 10/12: once Administration > Driver Station Codes has kiosk codes, the kiosk types its code once. -->
      <div id="release-box" hidden></div>
      <section id="code-box" hidden></section>
      <div class="ds-grid" id="ds-grid">
        <section class="ds-board" aria-label="Today's loadout">
          <div class="ds-row ds-headrow"><span>ROUTE</span><span>RUN</span><span>DRIVER</span><span>TRAILER</span><span>CASES</span><span>LOAD STATUS</span><span>PICKUP</span></div>
          <div class="ds-scroll" id="board-scroll"><div id="board"></div></div>
        </section>
        <aside class="ds-weather" id="weather" hidden><span class="sym" id="weather-sym" aria-hidden="true">&#9728;</span><b>LOCAL WEATHER</b><h3 id="weather-plant">Uniontown</h3><p class="now" id="weather-now">Reading the weather…</p><p id="weather-today"></p><p class="next" id="weather-next"></p></aside>
        <section class="ds-week" aria-label="Driver weekly schedule">
          <div class="ds-week-title"><b>DRIVER WEEKLY SCHEDULE</b><span id="week-of"></span></div>
          <div class="ds-scroll" id="week-scroll"><table class="ds-week-table"><thead id="week-head"></thead><tbody id="week-rows"></tbody></table></div>
        </section>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, shortDate, showError, goBack, callServer } from './js/app.js';
    import { startOffline } from './js/offline-saves.js';
    import { collection, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
    import * as W from './js/weather.js';
    import { resolveStation, askCode, askRelease, remember, lockStation } from './js/station-code.js';

    // The current app's Driver Room board and TV (DriverLoadoutPickup.html, 052_V749). Read only. In the new app it opens with a
    // United Dairy sign-in (no branch code); "Driver Room TV" is the old DISPLAY mode: dark, no menu, notes shown, both lists roll.
    const L = window.UDLogic, B = window.UDBoard;
    const params = new URLSearchParams(location.search);
    // Joe 10/10: the Driver Room board opens as the old Driver Room display: both lists roll and the weather window sits on the
    // right. ?tv=1 is the TV itself (no header); ?view=desk is the plain list for the office.
    const full = params.get('tv') === '1', tv = full || params.get('view') !== 'desk';
    document.body.classList.toggle('ds-tv', tv);
    document.body.classList.toggle('ds-full', full);
    // Joe 10/12: a kiosk with a code stays put; Back and Home ask for the manager release code first (see leave()).
    document.getElementById('go-back').addEventListener('click', async () => { if (await leave()) goBack(); });
    document.getElementById('go-home').addEventListener('click', async () => { if (await leave()) location.href = 'index.html'; });
    document.getElementById('tv').textContent = tv ? 'Desk view' : 'Driver Room display';
    document.getElementById('eyebrow').textContent = tv ? "Driver's Kiosk Station" : 'Driver Loadout & Pickup';
    document.getElementById('weather').hidden = !tv;
    let runs = [], pickups = [], drivers = [], sig = '', weekSig = '', date = L.operatingDay(new Date()), updated = null;

    const overflows = (id) => { const el = document.getElementById(id); return el.scrollHeight > el.clientHeight + 2; };
    const fmt = (k) => shortDate(k);
    function render() {
      date = L.operatingDay(new Date());
      const rows = B.loadoutBoardRows(runs, pickups, date), dayName = L.DAY_NAMES[L.DAYS.indexOf(L.dayPrefix(date))];
      document.getElementById('weekday').textContent = dayName.charAt(0) + dayName.slice(1).toLowerCase();
      if (tv) {
        const h = new Date().getHours(), w = document.getElementById('welcome');
        w.hidden = false; w.innerHTML = '<i></i><b>Good ' + (h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening') + ', Uniontown drivers.</b> ' + fmt(date) + ' · Work safely and have a strong day.';
      }
      const one = rows.map(r => '<div class="ds-row ' + r.state.toLowerCase() + '">' + (r.streamId ? '<span class="rt span2">' + escapeHtml(r.streamId) + '</span>' : '<span class="rt">' + escapeHtml(r.route) + '</span><span>' + escapeHtml(r.run) + '</span>') +
        '<span>' + escapeHtml(r.driver || '—') + '</span><span class="strong">' + escapeHtml(r.trailer || '—') + '</span><span>' + escapeHtml(r.cases === '' ? '—' : String(r.cases)) + '</span><span class="st">' + r.state + '</span>' +
        '<span class="' + (r.pickup ? 'pu-yes' : '') + '">' + (r.pickup ? 'YES' : '—') + '</span>' +
        (r.pickup ? '<span class="ds-strip pu"><b>PICKUP</b> ' + escapeHtml(r.pickupText) + '</span>' : '') + (tv && r.notes ? '<span class="ds-strip note"><b>NOTE</b> ' + escapeHtml(r.notes) + '</span>' : '') + '</div>').join('');
      const s = JSON.stringify(rows.map(r => [r.route, r.run, r.driver, r.trailer, r.cases, r.state, r.pickupText, tv ? r.notes : '']));
      if (s !== sig) {
        sig = s;
        const box = document.getElementById('board');
        box.innerHTML = one || '<p class="empty">No routes scheduled today.</p>';
        // On the TV a list longer than the screen rolls: a second copy follows an END OF LIST and a START OF LIST band.
        if (tv && one && overflows('board-scroll')) box.innerHTML = one + '<div class="ds-band end">&#9632; END OF LIST</div><div class="ds-band start">&#9660; START OF LIST</div>' + one;
      }
      const wk = B.weeklySchedule(runs, drivers, date), ws = JSON.stringify(wk);
      if (ws !== weekSig) {
        weekSig = ws;
        document.getElementById('week-of').textContent = 'Week of ' + fmt(wk.weekStart);
        document.getElementById('week-head').innerHTML = '<tr><th>DRIVER</th>' + wk.dates.map((d, i) => '<th>' + L.DAY_NAMES[i].slice(0, 3).toUpperCase() + '<small>' + fmt(d) + '</small></th>').join('') + '</tr>';
        const body = wk.rows.map(r => '<tr><td class="strong">' + escapeHtml(r.driver) + '</td>' + r.cells.map(c => c.length ? '<td>' + escapeHtml(c.join(', ')) + '</td>' : '<td class="off">—</td>').join('') + '</tr>').join('');
        const wr = document.getElementById('week-rows');
        wr.innerHTML = body || '<tr><td colspan="8" class="empty">No weekly driver assignments are available.</td></tr>';
        if (tv && body && overflows('week-scroll')) wr.innerHTML = body + '<tr class="ds-band end"><td colspan="8">&#9632; END OF LIST</td></tr><tr class="ds-band start"><td colspan="8">&#9660; START OF LIST</td></tr>' + body;
      }
      document.getElementById('foot').textContent = 'Uniontown · ' + (navigator.onLine ? 'Updated ' : 'No signal · last board from ') + (updated || new Date()).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · ' + rows.length + ' route' + (rows.length === 1 ? '' : 's') + ', ' + B.remaining(rows) + ' not loaded · UNITED DAIRY ▪ QUALITY MILK & ICE CREAM PRODUCTS';
    }

    // TV: both lists roll on their own when they are longer than the screen (1 px every 45 ms and 50 ms, as on the old TV).
    function roll(id, ms) {
      setInterval(() => {
        const el = document.getElementById(id);
        if (!tv || document.hidden || !el.querySelector('.ds-band')) return;
        el.scrollTop += 1;
        if (el.scrollTop >= el.scrollHeight / 2) el.scrollTop = 0;
      }, ms);
    }
    roll('board-scroll', 45); roll('week-scroll', 50);

    // The weather window: Open-Meteo (free, no key) every 15 minutes; the last reading stays if one read fails.
    async function weather() {
      const set = (id, t) => { document.getElementById(id).textContent = t; };
      try {
        const res = await fetch(W.forecastUrl(W.PLANTS.Uniontown));
        const w = res.ok ? W.summary(await res.json()) : null;
        if (!w) throw new Error('no forecast');
        set('weather-sym', w.symbol); set('weather-now', w.now); set('weather-today', w.today); set('weather-next', w.tomorrow);
      } catch (e) {
        if (/Reading/.test(document.getElementById('weather-now').textContent)) set('weather-now', 'The weather is not available right now.');
      }
    }
    if (tv) { weather(); setInterval(weather, 15 * 60000); }

    document.getElementById('tv').addEventListener('click', () => { location.search = tv ? '?view=desk' : ''; });
    document.getElementById('refresh').addEventListener('click', () => { sig = ''; weekSig = ''; render(); });
    window.udBack = () => { if (full) { location.search = ''; return true; } return false; };

    // The kiosk from its code (Administration > Driver Station Codes): a plant can have more than one kiosk and TV.
    const CODE_KEY = 'udKioskCode', stationCall = (op, f) => callServer('stationRelease', Object.assign({ op }, f));
    const eyebrow = document.getElementById('eyebrow').textContent;
    let kiosk = null;
    async function gate(msg) {
      const r = msg !== undefined ? { needCode: true, message: msg } : await resolveStation('KIOSK', CODE_KEY, stationCall);
      const show = (asking) => { document.getElementById('code-box').hidden = !asking; document.getElementById('ds-grid').hidden = asking; document.getElementById('foot').hidden = asking; };
      if (r.needCode) {
        kiosk = null; lockStation(document.getElementById('change'), false); show(true);
        kiosk = await askCode(document.getElementById('code-box'), { kind: 'KIOSK', storeKey: CODE_KEY, call: stationCall, title: 'Enter this station\'s code',
          hint: 'Type the code of the Driver\'s Kiosk Station (the TV) or the Driver Room Check-In Station (the drivers\' tablet) from Administration > Driver Station Codes. It remembers it after this.', message: r.message });
      } else kiosk = r.station || null;
      // Joe 10/12: one Driver Station link; the code decides the screen. A TV's code opens the TV display (no buttons, both
      // lists rolling), also when the TV reopens the plain link later.
      if (kiosk && kiosk.type === 'TV' && !full) { location.replace(location.pathname + '?tv=1'); return; }
      // Joe 10/12 "it should use my existing link and just be directed to only those pages": the Driver Room tablet's code (a
      // Driver Room Check-In station) opens the drivers' phone screens (View Loadout, DVIR, Check-In), not the TV board.
      // Reopening this link goes straight back there; Release there (with the release code) forgets both.
      if (kiosk && kiosk.type === 'DRIVER') { remember('udRoomStation', kiosk); location.replace('route.html?room=1'); return; }
      show(false);
      // Joe 10/12: a coded Driver Room screen (the TV too) has no Back, Home or Sign out; Release at the bottom is the only way out.
      lockStation(document.getElementById('change'), !!kiosk);
      document.getElementById('eyebrow').textContent = kiosk ? kiosk.name + ' · ' + kiosk.plant : eyebrow;
      sig = ''; weekSig = ''; render();
    }
    const release = (why) => askRelease(document.getElementById('release-box'), { why, status: () => stationCall('status', { facilityId: kiosk ? kiosk.facilityId : 'fac_uniontown' }),
      release: (code) => stationCall('release', { facilityId: kiosk ? kiosk.facilityId : 'fac_uniontown', code }), onError: showError, mustHave: true });
    // Leaving a coded kiosk unattaches it: the manager release code (when the plant has one), then the code is forgotten.
    async function leave() {
      if (!kiosk) return true;
      if (!(await release('A manager must type the manager release code to take this screen off the Driver Room.'))) return false;
      kiosk = null; remember(CODE_KEY, null); return true;
    }
    document.getElementById('change').addEventListener('click', async () => {
      if (!(await release())) return;
      kiosk = null; remember(CODE_KEY, null);
      // The TV goes to the plain Driver Station link (the code screen, with Back and Home).
      if (full) { location.replace(location.pathname); return; }
      gate().catch(err => showError(err.message));
    });
    // A TV with no code: Exit goes to the plain Driver Station link. A coded TV leaves only by Release at the bottom.
    document.getElementById('tv-exit').hidden = !full;
    document.getElementById('tv-exit').addEventListener('click', async () => { if (await leave()) location.replace(location.pathname); });

    // The time the board last came from the server (kept on the tablet), not when it was read from the tablet with no signal.
    function lastLive(s) {
      try {
        if (!s.metadata.fromCache) { localStorage.setItem('udBoardLive', String(Date.now())); return new Date(); }
        const t = Number(localStorage.getItem('udBoardLive')); return t ? new Date(t) : updated;
      } catch (e) { return new Date(); }
    }
    window.addEventListener('online', () => render()); window.addEventListener('offline', () => render());
    startOffline(['driver-station.html'], { scopes: ['driver-station'], device: 'tablet', files: [] });
    requireSignIn(async () => {
      const { db } = await start();
      await gate().catch(err => showError('Could not check this kiosk\'s code: ' + (err.message || err)));
      // A new code or a removed kiosk sends it back to the code screen (checked every 5 minutes).
      setInterval(async () => {
        if (!kiosk) return;
        try { const r = await stationCall('check', { kind: 'KIOSK', key: kiosk.key, version: kiosk.version }); if (!r.ok) { remember(CODE_KEY, null); gate(r.message).catch(() => {}); } } catch (e) { /* offline: keep the kiosk */ }
      }, 300000);
      const week = L.weekStart(date), err = (what) => (e) => showError('Could not read ' + what + ': ' + e.message);
      // The board updates the moment Dispatch or the plant saves (no 10-minute wait).
      onSnapshot(query(collection(db, 'runs'), where('weekStart', 'in', [week, L.addDays(week, 7)])), s => { runs = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); updated = lastLive(s); render(); }, err('the loads'));
      // Review item 73 (Joe 10/13): only pickups from yesterday on (the board is today's loads), not every pickup ever made.
      onSnapshot(query(collection(db, 'pickups'), where('date', '>=', L.addDays(date, -1))), s => { pickups = s.docs.map(d => d.data()); render(); }, err('the pickups'));
      onSnapshot(collection(db, 'drivers'), s => { drivers = s.docs.map(d => d.data()); render(); }, err('the drivers'));
      setInterval(render, 60000);
    });
  </script>
</body>
</html>
