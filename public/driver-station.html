<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Joe 10/12: installed from here ("Driver Station"), it opens full screen in its own window, no browser bars. -->
  <link rel="manifest" href="driver-station.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Driver Station">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/driver-station/apple-touch-icon.png">
  <title>Driver Station · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stations.css">
  <script src="js/logic.js"></script>
  <script src="js/board-rules.js"></script>
  <!-- Joe 10/13: with no signal the station opens from the tablet and shows the last board it had (js/offline-saves.js). -->
  <script>window.UD_OFFLINE = true;</script>
</head>
<body class="fill phone ds-page">
  <div class="signin" id="signin" hidden>
    <h1>Driver Station</h1>
    <p id="signin-text">Sign in with your United Dairy Google account.</p>
    <!-- Joe 10/16 (Fire Stick): on the TV link (?tv=1) the Driver's Kiosk Station TV's code alone signs the TV in; Google's
         sign-in does not open in a TV's kiosk browser. -->
    <form class="st-code" id="tvacct" hidden>
      <label>Driver's Kiosk Station code <input id="tvacct-code" maxlength="12" autocomplete="off" autocapitalize="characters" inputmode="text"></label>
      <button type="submit">OPEN THE BOARD</button>
      <span class="st-code-msg" id="tvacct-msg"></span>
    </form>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <!-- Joe 10/10: the Driver Room kiosk opens full screen like the phone and tablet screens: a slim header, no desktop menu. -->
    <div class="topbar">
      <button type="button" class="gs-nav" id="go-back" title="Back one screen">&#8249; Back</button>
      <button type="button" class="gs-nav" id="go-home" title="Home">Home</button>
      <button type="button" class="gs-nav" id="change" hidden>Release</button>
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <!-- Joe 10/12: the TV screen has no buttons, so a small Exit in the corner unattaches it (manager release code). -->
    <button type="button" class="ds-exit" id="tv-exit" hidden>Exit</button>
    <div class="head">
      <div class="title"><span class="eyebrow" id="eyebrow">Driver Loadout &amp; Pickup</span><h1><span id="plant">Uniontown</span> Loadout <span class="ds-day" id="weekday"></span></h1></div>
      <p class="ds-welcome" id="welcome" hidden></p>
      <!-- Joe 10/27: on the TV the weather sits in the top bar; its old window takes turns with live weather and the Scorecard. -->
      <p class="ds-wx" id="wx" hidden><span class="sym" id="wx-sym" aria-hidden="true"></span><b id="wx-now"></b><span id="wx-today"></span></p>
      <button type="button" id="tv" data-top>Driver's Kiosk Station</button><button type="button" id="refresh" data-top>Refresh</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <!-- Joe 10/12: once Administration > Driver Station Codes has kiosk codes, the kiosk types its code once. -->
      <div id="release-box" hidden></div>
      <section id="code-box" hidden></section>
      <div class="ds-grid" id="ds-grid">
        <section class="ds-board" aria-label="Today's loadout">
          <div class="ds-row ds-headrow"><span>ROUTE</span><span>RUN</span><span>DRIVER</span><span>TRAILER</span><span>CASES</span><span>LOAD STATUS</span><span>PICKUP</span></div>
          <div class="ds-scroll" id="board-scroll"><div id="board"></div></div>
        </section>
        <!-- Joe 10/27: the TV's right-hand box takes turns: 30 seconds of FOX Weather live (no sound), then 30 seconds of the
             Driver Scorecard. With no live picture the weather turn shows the local weather. -->
        <aside class="ds-weather" id="weather" hidden>
          <div class="ds-turn ds-wcard" id="turn-weather"><span class="sym" id="weather-sym" aria-hidden="true"></span><b>LOCAL WEATHER</b><h3 id="weather-plant">Uniontown</h3><p class="now" id="weather-now">Reading the weather…</p><p id="weather-today"></p><p class="next" id="weather-next"></p><p class="next" id="live-note" hidden></p></div>
          <div class="ds-turn ds-live" id="turn-live" hidden><div id="live-player"></div><span class="ds-live-tag">LIVE</span><span class="ds-live-cap">FOX Weather · live, no sound</span></div>
          <div class="ds-turn ds-sc" id="turn-score" hidden><div class="ds-sc-title"><b>DRIVER SCORECARD</b><span id="sc-label"></span></div><div class="ds-sc-scroll" id="sc-scroll"><table><tbody id="sc-rows"></tbody></table></div></div>
        </aside>
        <section class="ds-week" aria-label="Driver weekly schedule">
          <div class="ds-week-title"><b>DRIVER WEEKLY SCHEDULE</b><span id="week-of"></span></div>
          <div class="ds-scroll" id="week-scroll"><table class="ds-week-table"><thead id="week-head"></thead><tbody id="week-rows"></tbody></table></div>
        </section>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, shortDate, showError, goBack, callServer, tvCodeSignIn, signOutHere, lockDevice, STATION_DEVICE, appVersion } from './js/app.js';
    import { startOffline } from './js/offline-saves.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    import * as W from './js/weather.js';
    import { resolveStation, askCode, askRelease, remember, lockStation } from './js/station-code.js';
    import { fullScreenOnTap } from './js/full-screen.js';
    import { keepScreenAwake } from './js/keep-awake.js';

    fullScreenOnTap();

    // The current app's Driver Room board and TV (DriverLoadoutPickup.html, 052_V749). Read only. In the new app it opens with a
    // United Dairy sign-in (no branch code); "Driver Room TV" is the old DISPLAY mode: dark, no menu, notes shown, both lists roll.
    const L = window.UDLogic, B = window.UDBoard;
    const params = new URLSearchParams(location.search);
    // Joe 10/10: the Driver Room board opens as the old Driver Room display: both lists roll and the weather window sits on the
    // right. ?tv=1 is the TV itself (no header); ?view=desk is the plain list for the office.
    const full = params.get('tv') === '1', tv = full || params.get('view') !== 'desk', forRoom = params.get('for') === 'room';
    // The code screen's own heading (setUp('') puts the loadout heading back once the code is in).
    const loadHead = document.querySelector('.head .title h1').innerHTML;
    function setUp(which) {
      document.getElementById('eyebrow').textContent = which ? 'Set up this screen' : tv ? "Driver's Kiosk Station" : 'Driver Loadout & Pickup';
      document.querySelector('.head .title h1').innerHTML = which ? escapeHtml(which) : loadHead;
      ['tv', 'refresh'].forEach(id => { document.getElementById(id).hidden = !!which; });
    }
    document.body.classList.toggle('ds-tv', tv);
    document.body.classList.toggle('ds-full', full);
    // Joe 10/12: a kiosk with a code stays put; Back and Home ask for the manager release code first (see leave()).
    document.getElementById('go-back').addEventListener('click', async () => { if (await leave()) goBack(); });
    document.getElementById('go-home').addEventListener('click', async () => { if (await leave()) location.href = 'index.html'; });
    document.getElementById('tv').textContent = tv ? 'Desk view' : 'Driver Room display';
    document.getElementById('eyebrow').textContent = tv ? "Driver's Kiosk Station" : 'Driver Loadout & Pickup';
    document.getElementById('weather').hidden = !tv;
    let runs = [], pickups = [], drivers = [], sig = '', weekSig = '', date = L.operatingDay(new Date()), updated = null;

    const overflows = (id) => { const el = document.getElementById(id); return el.scrollHeight > el.clientHeight + 2; };
    function render() {
      date = L.operatingDay(new Date());
      const rows = B.loadoutBoardRows(runs, pickups, date, { carry: true }), dayName = L.DAY_NAMES[L.DAYS.indexOf(L.dayPrefix(date))];
      document.getElementById('weekday').textContent = dayName.charAt(0) + dayName.slice(1).toLowerCase();
      if (tv) {
        const h = new Date().getHours(), w = document.getElementById('welcome');
        w.hidden = false; w.innerHTML = '<i></i><b>Good ' + (h < 12 ? 'morning' : h < 17 ? 'afternoon' : 'evening') + ', Uniontown drivers.</b> ' + shortDate(date) + ' · Work safely and have a strong day.';
      }
      // Joe 10/31 ("a dedicated separation line between yesterday's loads and today's loads... people are getting confused"):
      // when loads are left over from yesterday, a labeled line goes above them and another above today's loads.
      const hasPrior = rows.some(r => r.prior), yday = L.addDays(date, -1);
      const dayText = (d) => { const n = L.DAY_NAMES[L.DAYS.indexOf(L.dayPrefix(d))]; return n.charAt(0) + n.slice(1).toLowerCase() + ' ' + shortDate(d); };
      const split = (r, i) => !hasPrior || (i && rows[i - 1].prior === r.prior) ? '' : r.prior
        ? '<div class="ds-split prior"><b>Yesterday\'s loads</b> <span>' + escapeHtml(dayText(yday)) + ' · not loaded yet</span></div>'
        : '<div class="ds-split today"><b>Today\'s loads</b> <span>' + escapeHtml(dayText(date)) + '</span></div>';
      const one = rows.map((r, i) => split(r, i) + '<div class="ds-row ' + r.state.toLowerCase() + '">' + (r.streamId ? '<span class="rt span2">' + escapeHtml(r.streamId) + '</span>' : '<span class="rt">' + escapeHtml(r.route) + '</span><span>' + escapeHtml(r.run) + '</span>') +
        '<span>' + escapeHtml(r.driver || '—') + '</span><span class="strong">' + escapeHtml(r.trailer || '—') + '</span><span>' + escapeHtml(r.cases === '' ? '—' : String(r.cases)) + '</span><span class="st">' + r.state + '</span>' +
        '<span class="' + (r.pickup ? 'pu-yes' : '') + '">' + (r.pickup ? 'YES' : '—') + '</span>' +
        (r.pickup ? '<span class="ds-strip pu"><b>PICKUP</b> ' + escapeHtml(r.pickupText) + '</span>' : '') + (tv && r.notes ? '<span class="ds-strip note"><b>NOTE</b> ' + escapeHtml(r.notes) + '</span>' : '') + '</div>').join('');
      const s = JSON.stringify(rows.map(r => [r.route, r.run, r.driver, r.trailer, r.cases, r.state, r.pickupText, tv ? r.notes : '', r.prior]));
      if (s !== sig) {
        sig = s;
        const box = document.getElementById('board');
        box.innerHTML = one || '<p class="empty">No routes scheduled today.</p>';
        // On the TV a list longer than the screen rolls: a second copy follows an END OF LIST and a START OF LIST band.
        if (tv && one && overflows('board-scroll')) box.innerHTML = one + '<div class="ds-band end">&#9632; END OF LIST</div><div class="ds-band start">&#9660; START OF LIST</div>' + one;
      }
      const wk = B.weeklySchedule(runs, drivers, date), ws = JSON.stringify(wk);
      if (ws !== weekSig) {
        weekSig = ws;
        document.getElementById('week-of').textContent = 'Week of ' + shortDate(wk.weekStart);
        document.getElementById('week-head').innerHTML = '<tr><th>DRIVER</th>' + wk.dates.map((d, i) => '<th>' + L.DAY_NAMES[i].slice(0, 3).toUpperCase() + '<small>' + shortDate(d) + '</small></th>').join('') + '</tr>';
        const body = wk.rows.map(r => '<tr><td class="strong">' + escapeHtml(r.driver) + '</td>' + r.cells.map(c => c.length ? '<td>' + escapeHtml(c.join(', ')) + '</td>' : '<td class="off">—</td>').join('') + '</tr>').join('');
        const wr = document.getElementById('week-rows');
        wr.innerHTML = body || '<tr><td colspan="8" class="empty">No weekly driver assignments are available.</td></tr>';
        if (tv && body && overflows('week-scroll')) wr.innerHTML = body + '<tr class="ds-band end"><td colspan="8">&#9632; END OF LIST</td></tr><tr class="ds-band start"><td colspan="8">&#9660; START OF LIST</td></tr>' + body;
        if (tv) fitCells(wr);
      }
      document.getElementById('foot').textContent = 'Uniontown · ' + (navigator.onLine ? 'Updated ' : 'No signal · last board from ') + (updated || new Date()).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · ' + rows.length + ' route' + (rows.length === 1 ? '' : 's') + ', ' + B.remaining(rows) + ' not loaded · UNITED DAIRY ▪ QUALITY MILK & ICE CREAM PRODUCTS';
    }

    // Joe 10/28 (TV schedule as big as the Loadout): a name or route too wide for its cell even when wrapped is made
    // smaller, a step at a time, until it fits (never below 16px), so nothing is cut off.
    function fitCells(box) {
      box.querySelectorAll('td').forEach(td => {
        td.style.fontSize = '';
        for (let px = parseFloat(getComputedStyle(td).fontSize); td.scrollWidth > td.clientWidth && px > 16; px--) td.style.fontSize = (px - 1) + 'px';
      });
    }

    // TV: both lists roll on their own when they are longer than the screen (1 px every 45 ms and 50 ms, as on the old TV).
    // Joe 10/27 (Raspberry Pi on the Driver Room TV): the roll stopped. The position is now kept here, not read back from the
    // list (a screen that rounds to whole screen dots dropped every 1 px step), the TV link keeps rolling even when the
    // browser says it is in the background, and a list that grows past the screen after the page opens (the screen size
    // changing, the kiosk going full screen) is redrawn so it starts to roll.
    function roll(id, ms) {
      let pos = 0;
      setInterval(() => {
        const el = document.getElementById(id);
        if (!tv || (document.hidden && !full)) return;
        if (!el.querySelector('.ds-band')) { pos = 0; return; }
        if (Math.abs(el.scrollTop - pos) > 2) pos = el.scrollTop;
        pos += 1;
        if (pos >= el.scrollHeight / 2) pos = 0;
        el.scrollTop = pos;
      }, ms);
    }
    roll('board-scroll', 45); roll('week-scroll', 50);
    const redraw = () => { sig = ''; weekSig = ''; render(); };
    window.addEventListener('resize', () => { if (tv && sig) redraw(); });
    setInterval(() => {
      if (!tv) return;
      const grew = (id, rows) => !document.querySelector('#' + id + ' .ds-band') && document.querySelector(rows) && overflows(id);
      if (grew('board-scroll', '#board .ds-row') || grew('week-scroll', '#week-rows td.strong')) redraw();
    }, 5000);

    // The weather window: Open-Meteo (free, no key) every 15 minutes; the last reading stays if one read fails.
    async function weather() {
      const set = (id, t) => { document.getElementById(id).textContent = t; };
      try {
        const res = await fetch(W.forecastUrl(W.PLANTS.Uniontown));
        const w = res.ok ? W.summary(await res.json()) : null;
        if (!w) throw new Error('no forecast');
        document.getElementById('weather-sym').innerHTML = W.iconSvg(w.icon); set('weather-now', w.now); set('weather-today', w.today); set('weather-next', w.tomorrow);
        document.getElementById('wx-sym').innerHTML = W.iconSvg(w.icon); set('wx-now', w.now); set('wx-today', w.today); document.getElementById('wx').hidden = false;
      } catch (e) {
        if (/Reading/.test(document.getElementById('weather-now').textContent)) set('weather-now', 'The weather is not available right now.');
      }
    }
    if (tv) { weather(); setInterval(weather, 15 * 60000); }

    // Joe 10/27 (Driver Room TV): the right-hand box takes turns, 30 seconds each: FOX Weather's free live stream on YouTube
    // (no sound), then the Driver Scorecard: each driver's overall score, best first (the server's copy, scorecard/kiosk, which
    // the TV's own code may read). With no live picture (no internet, YouTube refuses) the weather turn shows the local
    // weather; with no scores yet the box stays on the weather. The weekly schedule stays as it is.
    // Joe 10/28 ("not showing weather"): the server reads which video is live on FOX Weather's YouTube page every 15 minutes
    // (live-weather.js, scorecard/kiosk: live). 10/29: YouTube answers the server with its robot check, but the page still
    // names FOX Weather's channel (the number below), so the TV asks YouTube for that channel's live stream itself. When a
    // live picture will not play, the next one on the list is tried (AccuWeather), and when none
    // plays the local weather shows with one line saying why, so the reason can be read off the TV.
    // Joe 10/29 (6.72, "it says not allowed"): tried for real on YouTube, FOX Weather does not let other sites show its live
    // stream, and the AccuWeather NOW video had ended (AccuWeather has no live stream most of the day). So after FOX Weather and
    // AccuWeather's channel (both kept in case they open up or go live), the box shows the National Weather Service's live
    // radar loop for the Pittsburgh radar (it covers Uniontown), refreshed every 5 minutes; only if that will not load either
    // does the local weather show.
    const TURN = 30000, FOX_CHANNEL = 'UC1FbPiXx59_ltnFVx7IxWow', ACCU_CHANNEL = 'UCuYqi3hOfz6-3Hdp6tEJjAg';
    const RADAR = 'https://radar.weather.gov/ridge/standard/KPBZ_loop.gif';
    let player = null, liveOk = false, scores = null, turn = 'weather', turnTimer = 0, liveSig = '', liveIdx = 0, liveList = [], liveWhy = [];
    let retryTimer = 0, liveTrying = false, liveSeen = 0, radarOk = false, radarTimer = 0;
    // The live pictures to try, in order.
    function liveChoices() {
      const l = (scores && scores.live) || {}, out = [];
      if (l.video && l.live !== false && l.embed !== false) out.push({ key: String(l.video), name: 'FOX Weather' });
      out.push({ key: 'channel:' + (/^UC[\w-]{22}$/.test(l.channel || '') ? l.channel : FOX_CHANNEL), name: 'FOX Weather' });
      out.push({ key: 'channel:' + ACCU_CHANNEL, name: 'AccuWeather' });
      return out;
    }
    const YT_WHY = { 2: 'would not play', 5: 'would not play', 100: 'has nothing live right now', 101: 'is not showing on other sites', 150: 'is not showing on other sites', 153: 'does not let other sites show it' };
    function liveNote(text) { const n = document.getElementById('live-note'); n.textContent = text; n.hidden = !text; }
    // No live picture: the video is taken away (a hidden video would still keep the Pi busy) and the local weather shows.
    function stopLive() {
      clearTimeout(retryTimer); clearInterval(radarTimer); liveOk = false; liveTrying = false; radarOk = false; player = null; document.getElementById('live-player').innerHTML = ''; liveTag('LIVE'); showTurn();
    }
    function liveTag(text) { document.querySelector('#turn-live .ds-live-tag').textContent = text; }
    // No live video: the live radar loop, a fresh copy every 5 minutes; if it will not load, the local weather.
    function startRadar() {
      const img = new Image(), load = () => { img.src = RADAR + '?t=' + Date.now(); };
      img.id = 'live-radar'; img.alt = 'Live weather radar, Pittsburgh';
      img.onload = () => { if (!radarOk) { radarOk = true; liveTag('RADAR'); document.querySelector('#turn-live .ds-live-cap').textContent = 'Weather radar · Pittsburgh · live loop'; showTurn(); } };
      img.onerror = () => { clearInterval(radarTimer); radarOk = false; img.remove(); showTurn(); };
      document.getElementById('live-player').appendChild(img);
      load(); radarTimer = setInterval(load, 300000);
    }
    // A picture that will not play: the next one is tried; with none left, the local weather and why, and the list is tried
    // again in 10 minutes (Joe 10/28: a stream that is down for a while comes back by itself).
    function failLive(why) {
      const c = liveList[liveIdx];
      if (c) liveWhy.push(c.name + ' ' + why);
      stopLive();
      if (++liveIdx < liveList.length) { startLive(); return; }
      liveNote('Live weather not showing: ' + liveWhy.join('; ') + '.');
      startRadar();
      retryTimer = setTimeout(() => { liveIdx = 0; liveWhy = []; stopLive(); startLive(); }, 600000);
    }
    function startLive() {
      const c = liveList[liveIdx];
      if (!c) return;
      // Joe 10/28: YouTube refuses to play an embedded video when it is not told which site it is on (its "Error 153"), and
      // Operations tells other sites nothing (Referrer-Policy: same-origin in firebase.json). The video's own frame sends
      // just the site's address (no page, no sign-in) to YouTube.
      clearTimeout(retryTimer); liveOk = false; liveTrying = true; liveSeen = 0;
      document.querySelector('#turn-live .ds-live-cap').textContent = c.name + ' · live, no sound';
      document.getElementById('live-player').innerHTML = '<iframe id="live-frame" title="' + escapeHtml(c.name) + ' live" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/' +
        (c.key.startsWith('channel:') ? 'live_stream?channel=' + encodeURIComponent(c.key.slice(8)) + '&' : encodeURIComponent(c.key) + '?') + 'autoplay=1&mute=1&controls=0&disablekb=1&fs=0&rel=0&playsinline=1&enablejsapi=1&origin=' + encodeURIComponent(location.origin) + '"></iframe>';
      const ready = () => {
        player = new window.YT.Player('live-frame', { events: {
          onReady: (e) => { e.target.mute(); try { e.target.playVideo(); } catch (err) { /* it plays by itself */ } },
          // The picture counts only once it is actually playing (a stream that is off the air loads but never plays).
          onStateChange: (e) => { if (e.data === 1 && !liveOk) { liveOk = true; liveTrying = false; liveNote(''); showTurn(); } },
          onError: (e) => failLive(YT_WHY[e && e.data] || 'would not play') } });
      };
      if (window.YT && window.YT.Player) ready();
      else {
        window.onYouTubeIframeAPIReady = ready;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        tag.onerror = () => { liveIdx = liveList.length - 1; failLive('could not be reached (YouTube)'); };
        document.head.appendChild(tag);
      }
      showTurn();
    }
    // Joe 10/29 (6.71, "it still doesn't work"): the video was started inside the hidden live box and only shown once playing,
    // but YouTube will not play a video it cannot see (a hidden player has no size), so it never started. The video now starts
    // in view during the weather turn. A Pi takes a while to start a video: 40 seconds in view with no picture counts as none
    // (the Scorecard's turns do not count).
    setInterval(() => {
      if (!liveTrying || liveOk || document.getElementById('turn-live').hidden) return;
      if ((liveSeen += 1000) >= 40000) failLive('did not start');
    }, 1000);
    // The live picture plays only on the TV link (?tv=1), not on a computer opening the board.
    function followLive() {
      if (!full) return;
      const list = liveChoices(), sig = list.map(c => c.key).join('|');
      if (sig === liveSig) return;
      liveSig = sig; liveList = list; liveIdx = 0; liveWhy = [];
      stopLive(); startLive();
    }
    function showTurn() {
      const score = turn === 'score' && scores && scores.rows && scores.rows.length, live = !score && (liveOk || liveTrying || radarOk);
      document.getElementById('turn-score').hidden = !score;
      document.getElementById('turn-live').hidden = !live;
      document.getElementById('turn-weather').hidden = score || live;
      document.getElementById('weather').classList.toggle('ds-boxed', !!(score || live));
      if (player && (liveOk || liveTrying) && player.playVideo) { try { live ? player.playVideo() : player.pauseVideo(); } catch (e) { /* the player came and went */ } }
      if (score) document.getElementById('sc-scroll').scrollTop = 0;
    }
    function nextTurn() { clearTimeout(turnTimer); turn = SCORE_TURNS && turn === 'weather' ? 'score' : 'weather'; showTurn(); turnTimer = setTimeout(nextTurn, TURN); }
    window.udTurn = nextTurn;
    function drawScores() {
      const k = scores || {}, areas = (k.areas || []);
      document.getElementById('sc-label').textContent = (k.label || '') + (k.through ? ' · through ' + shortDate(k.through) : '');
      document.getElementById('sc-rows').innerHTML = (k.rows || []).map(r => '<tr><td class="rk">' + escapeHtml(String(r.rank)) + '</td><td class="nm">' + escapeHtml(r.driver) + '</td>' +
        areas.map(a => '<td class="ar"><span class="g g-' + escapeHtml((r.areas || {})[a] || 'none') + '">' + escapeHtml((r.areas || {})[a] || '–') + '</span></td>').join('') +
        '<td class="ov"><span class="g g-' + escapeHtml(r.grade) + '">' + escapeHtml(String(r.score)) + ' ' + escapeHtml(r.grade) + '</span></td></tr>').join('');
      showTurn();
    }
    // Joe 10/29 ("take the driver scorecard off of there for now ... just keep the weather up in that panel"): the Scorecard
    // turn is off until he makes it look better; the box shows only the weather. Set SCORE_TURNS back to true to bring it back.
    const SCORE_TURNS = false;
    // A list longer than the box rolls slowly during the turn.
    setInterval(() => { const el = document.getElementById('sc-scroll'); if (turn !== 'score' || el.scrollHeight <= el.clientHeight + 2) return; if (el.scrollTop + el.clientHeight < el.scrollHeight - 1) el.scrollTop += 1; }, 60);
    function startTurns(db) {
      if (turnTimer) return;
      onSnapshot(doc(db, 'scorecard', 'kiosk'), s => { scores = s.exists() ? s.data() : null; drawScores(); followLive(); }, () => { scores = null; showTurn(); followLive(); });
      turnTimer = setTimeout(nextTurn, TURN);
    }

    document.getElementById('tv').addEventListener('click', () => { location.search = tv ? '?view=desk' : ''; });
    document.getElementById('refresh').addEventListener('click', () => { sig = ''; weekSig = ''; render(); });
    window.udBack = () => { if (full) { location.search = ''; return true; } return false; };

    // Joe 10/16 (Fire Stick): the TV link asks for the TV's code instead of a Google sign-in (a United Dairy account can still
    // sign in below it). Signed in this way the TV keeps its sign-in through power and signal losses; nothing is retyped.
    if (full) {
      document.getElementById('tvacct').hidden = false;
      document.getElementById('signin-text').textContent = 'Type this TV\'s Driver\'s Kiosk Station code from Administration > Driver Station Codes. No United Dairy account is needed.';
      document.getElementById('signin-button').textContent = 'Or sign in with a United Dairy account';
      document.getElementById('tvacct').addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const msg = document.getElementById('tvacct-msg');
        msg.textContent = 'Checking…';
        try { const out = await tvCodeSignIn(document.getElementById('tvacct-code').value); msg.textContent = out.ok ? '' : out.message; } catch (err) { msg.textContent = String(err.message || err); }
      });
    }

    // The kiosk from its code (Administration > Driver Station Codes): a plant can have more than one kiosk and TV.
    // A TV signed in by its code alone (signedTv) asks the open stationSignIn call, not the signed-in one.
    let signedTv = null;
    const CODE_KEY = 'udKioskCode', stationCall = (op, f) => callServer(signedTv ? 'stationSignIn' : 'stationRelease', Object.assign({ op }, f, signedTv ? { tv: true } : {}));
    const eyebrow = document.getElementById('eyebrow').textContent;
    let kiosk = null;
    // Joe 10/28 "you need to block that exact same way": once a code has opened the TV or the Driver Room tablet here, it is a
    // Driver Room screen: it opens no other screen (app.js), and its code screen has no Back, Home or Sign out either.
    let deviceLocked = STATION_DEVICE === 'KIOSK';
    async function gate(msg) {
      // A TV signed in by its code: the code it was signed in with is the station; a new code or Remove signs it out.
      if (signedTv && msg === undefined && navigator.onLine) {
        const c = await stationCall('check', { kind: 'KIOSK', key: signedTv.key, version: signedTv.version }).catch(() => null);
        if (c && !c.ok) msg = c.message;
      }
      if (signedTv && msg !== undefined) { await signOutHere(); location.replace(location.pathname + '?tv=1'); return; }
      const r = signedTv ? { station: signedTv } : msg !== undefined ? { needCode: true, message: msg } : await resolveStation('KIOSK', CODE_KEY, stationCall);
      const show = (asking) => { document.getElementById('code-box').hidden = !asking; document.getElementById('ds-grid').hidden = asking; document.getElementById('foot').hidden = asking; };
      if (r.needCode) {
        kiosk = null; lockStation(document.getElementById('change'), false); document.body.classList.toggle('station-locked', deviceLocked); show(true);
        // Joe 10/13: the code screen is only for setting a screen up. It names only the station the link is for (the TV, the
        // Driver Room tablet, or either on the plain link), with no loadout title, Desk view or Refresh.
        const which = forRoom ? 'Driver Room Check-In Station' : full ? 'Driver\'s Kiosk Station' : 'Driver Station';
        setUp(which);
        kiosk = await askCode(document.getElementById('code-box'), { kind: 'KIOSK', storeKey: CODE_KEY, call: stationCall, title: 'Enter this station\'s code',
          hint: forRoom ? 'Type the Driver Room Check-In Station code (the drivers\' tablet) from Administration > Driver Station Codes. It remembers it after this.'
            : full ? 'Type the Driver\'s Kiosk Station code (the TV) from Administration > Driver Station Codes. It remembers it after this.'
            : 'Type this screen\'s code from Administration > Driver Station Codes. It remembers it after this.', message: r.message });
        setUp('');
      } else kiosk = r.station || null;
      if (kiosk) { deviceLocked = true; lockDevice('KIOSK'); }
      // Joe 10/12: one Driver Station link; the code decides the screen. A TV's code opens the TV display (no buttons, both
      // lists rolling), also when the TV reopens the plain link later.
      if (kiosk && kiosk.type === 'TV' && !full) { location.replace(location.pathname + '?tv=1'); return; }
      // Joe 10/12 "it should use my existing link and just be directed to only those pages": the Driver Room tablet's code (a
      // Driver Room Check-In station) opens the drivers' phone screens (View Loadout, DVIR, Check-In), not the TV board.
      // Reopening this link goes straight back there; Release there (with the release code) forgets both.
      if (kiosk && kiosk.type === 'DRIVER') { remember('udRoomStation', kiosk); location.replace('route.html?room=1'); return; }
      show(false);
      // Joe 10/12: a coded Driver Room screen (the TV too) has no Back, Home or Sign out; Release at the bottom is the only way out.
      lockStation(document.getElementById('change'), !!kiosk);
      document.body.classList.toggle('station-locked', !!kiosk || deviceLocked);
      document.getElementById('eyebrow').textContent = kiosk ? kiosk.name + ' · ' + kiosk.plant : eyebrow;
      sig = ''; weekSig = ''; render();
    }
    const release = (why) => askRelease(document.getElementById('release-box'), { why, status: () => stationCall('status', { facilityId: kiosk ? kiosk.facilityId : 'fac_uniontown' }),
      release: (code) => stationCall('release', { facilityId: kiosk ? kiosk.facilityId : 'fac_uniontown', code }), onError: showError, mustHave: true });
    // Leaving a coded kiosk unattaches it: the manager release code (when the plant has one), then the code is forgotten.
    async function leave() {
      if (!kiosk) return true;
      if (!(await release('A manager must type the manager release code to take this screen off the Driver Room.'))) return false;
      kiosk = null; remember(CODE_KEY, null);
      if (signedTv) { signedTv = null; await signOutHere(); }
      return true;
    }
    document.getElementById('change').addEventListener('click', async () => {
      if (!(await release())) return;
      kiosk = null; remember(CODE_KEY, null);
      if (signedTv) { signedTv = null; await signOutHere(); location.replace(location.pathname + '?tv=1'); return; }
      // Joe 10/28: Release goes back to the code screen only ("the only thing it's allowed"), not the Home menu.
      gate().catch(err => showError('Could not check this kiosk\'s code: ' + (err.message || err)));
    });
    // A TV with no code: Exit goes to the plain Driver Station link. A coded TV leaves only by Release at the bottom.
    document.getElementById('tv-exit').hidden = !full;
    document.getElementById('tv-exit').addEventListener('click', async () => { if (await leave()) location.replace(location.pathname); });

    // The time the board last came from the server (kept on the tablet), not when it was read from the tablet with no signal.
    function lastLive(s) {
      try {
        if (!s.metadata.fromCache) { liveSinceLoad = true; localStorage.setItem('udBoardLive', String(Date.now())); return new Date(); }
        const t = Number(localStorage.getItem('udBoardLive')); return t ? new Date(t) : updated;
      } catch (e) { return new Date(); }
    }
    window.addEventListener('online', () => render()); window.addEventListener('offline', () => render());
    // Joe 10/16 (Fire Stick TV): the TV comes back by itself after a power or internet loss. If it started with no signal
    // (power back before the Wi-Fi), it reloads once the signal returns; a TV left on reloads at the 6 a.m. day roll so the
    // week's loads never go stale. The code and sign-in are kept on the Fire Stick, so nothing is retyped.
    let liveSinceLoad = false;
    const loadedDay = date;
    // Joe 10/23 (LG TV, its own Web Browser): the TV's screen saver turned the board off after a few minutes. LG keeps the screen
    // saver away only while a video plays, so the TV link plays a silent video the board's own color behind the whole screen,
    // over and over. MP4 for the TV; WebM for a browser with no MP4.
    // Joe 10/27: a Raspberry Pi on the TV's HDMI needs no video (the TV's screen saver never runs over a plugged-in device),
    // and playing one costs the small computer for nothing, so a Pi skips it.
    const onPi = /Linux (aarch64|arm)/.test(navigator.userAgent) && !/Web0S|webOS|SmartTV|Android/.test(navigator.userAgent);
    if (full && !onPi) {
      const awake = document.createElement('video');
      awake.id = 'ds-awake';
      Object.assign(awake, { muted: true, loop: true, autoplay: true, playsInline: true });
      awake.setAttribute('muted', ''); awake.setAttribute('aria-hidden', 'true');
      awake.innerHTML = '<source src="img/keep-awake.mp4" type="video/mp4"><source src="img/keep-awake.webm" type="video/webm">';
      document.body.prepend(awake);
      document.body.classList.add('ds-awake');
      const play = () => { if (awake.paused) awake.play().catch(() => {}); };
      play(); awake.addEventListener('pause', () => setTimeout(play, 1000)); setInterval(play, 30000);
      document.addEventListener('visibilitychange', play);
    }
    // Joe 10/29: every Driver Room screen keeps the tablet's or TV's screen on (after the TV's own video, which it then uses).
    keepScreenAwake();
    if (full) {
      window.addEventListener('online', () => { if (!liveSinceLoad) setTimeout(() => location.reload(), 5000); });
      setInterval(() => { if (navigator.onLine && L.operatingDay(new Date()) !== loadedDay) location.reload(); }, 60000);
      // Joe 10/28 (the TV still showed the old board after a release): nobody is there to press the Update ready banner's
      // Refresh and nothing is typed on the TV, so a new version published reloads the board by itself (checked every 3 minutes).
      const newVersion = async () => {
        const first = await appVersion(), now = await fetch('version.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
        if (first && first.commit && now && now.commit && now.commit !== first.commit) location.reload();
      };
      setInterval(newVersion, 180000);
      window.udTvVersionCheck = newVersion;
    }
    startOffline(['driver-station.html'], { scopes: ['driver-station'], device: 'tablet', files: [] });
    requireSignIn(async (user) => {
      const { db } = await start();
      if (user.station && user.station.tv) signedTv = user.station;
      await gate().catch(err => showError('Could not check this kiosk\'s code: ' + (err.message || err)));
      // A new code or a removed kiosk sends it back to the code screen (checked every 5 minutes).
      setInterval(async () => {
        if (!kiosk) return;
        try { const r = await stationCall('check', { kind: 'KIOSK', key: kiosk.key, version: kiosk.version }); if (!r.ok) { remember(CODE_KEY, null); gate(r.message).catch(() => {}); } } catch (e) { /* offline: keep the kiosk */ }
      }, 300000);
      const week = L.weekStart(date), err = (what) => (e) => showError('Could not read ' + what + ': ' + e.message);
      // The board updates the moment Dispatch or the plant saves (no 10-minute wait). Last week's runs too: a load left over
      // from Saturday (delivered Saturday) still shows on Sunday morning until it is loaded (Joe 10/30).
      onSnapshot(query(collection(db, 'runs'), where('weekStart', 'in', [L.addDays(week, -7), week, L.addDays(week, 7)])), s => { runs = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); updated = lastLive(s); render(); }, err('the loads'));
      // Review item 73 (Joe 10/13): only pickups from yesterday on (the board is today's loads), not every pickup ever made.
      onSnapshot(query(collection(db, 'pickups'), where('date', '>=', L.addDays(date, -1))), s => { pickups = s.docs.map(d => d.data()); render(); }, err('the pickups'));
      onSnapshot(collection(db, 'drivers'), s => { drivers = s.docs.map(d => d.data()); render(); }, err('the drivers'));
      if (tv) startTurns(db);
      setInterval(render, 60000);
    });
  </script>
</body>
</html>
