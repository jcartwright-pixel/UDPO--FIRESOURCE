<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Phone Screens · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stations.css">
  <script src="js/logic.js"></script>
</head>
<body>
  <div class="signin" id="signin" hidden>
    <h1>Phone Screens</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Phone Screens</h1></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <!-- Review item 54 (Joe 10/13): this page listed the same links as Administration > Links & Codes, so the list is gone and
         the page (kept so an old bookmark still lands somewhere) points there in one line. -->
    <div class="view">
      <p class="pss-moved">Every phone, tablet and kiosk link is in <a id="links" href="administration.html?item=app-links">Administration &rsaquo; Links &amp; Codes</a>.</p>
    </div>
  </div>

  <script type="module">
    import { requireSignIn } from './js/app.js';
    const testEmail = new URLSearchParams(location.search).get('testEmail');
    if (testEmail) document.getElementById('links').href += '&testEmail=' + encodeURIComponent(testEmail);
    requireSignIn(() => {});
  </script>
</body>
</html>
