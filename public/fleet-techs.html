<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Garage Technicians · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
</head>
<body class="fill issues-page fleet-page">
  <div class="signin" id="signin" hidden>
    <h1>Garage Technicians</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Garage Technicians</h1><small>The mechanics on the Garage Station. Each one taps their name and types their login ID there.</small></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="actions" data-top><a class="button" href="fleet.html?view=setup">Fleet Service Setup</a><a class="button" href="garage-station.html">Garage Station</a><span class="spacer"></span><span class="hint" id="saved"></span><button type="button" class="primary" id="add">+ Add Technician</button></div>
      <form class="fs-edit" id="tech-form" hidden>
        <strong id="form-title">New technician</strong>
        <label class="wide">Name<input id="t-name" maxlength="40" placeholder="LAST First" autocomplete="off"></label>
        <label>Login ID<input id="t-login" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="6 numbers" autocomplete="off"></label>
        <label>Active<select id="t-active"><option value="YES">Yes</option><option value="NO">No (turned off)</option></select></label>
        <button type="submit" class="primary">Save</button><button type="button" id="t-cancel">Cancel</button>
        <small id="t-hint" class="fs-edit-hint"></small>
      </form>
      <div class="sheet scroll-list">
        <table class="issues"><colgroup><col style="width:40%"><col style="width:20%"><col style="width:25%"><col style="width:15%"></colgroup>
          <thead><tr><th>Name</th><th>Active</th><th>Last changed</th><th></th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, save, escapeHtml, showError } from './js/app.js';
    import { collection, doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

    // The current app's Fleet Service Setup technicians (220_V7276 TECH), Joe 10/11 review item 26: add a mechanic, turn one
    // off, set the login ID the Garage Station asks for (numbers only, leading zeros kept). The login ID is never shown:
    // only a hash of it is kept (fleet.js / garage.js).
    const L = window.UDLogic, MANAGERS = ['ADMINISTRATOR', 'ADMIN', 'MANAGER'];
    let techs = [], person = null, editing = null, loaded = false;
    const $ = (id) => document.getElementById(id);
    const can = () => L.hasRole(person, MANAGERS);
    const on = (t) => L.yes(t.active === undefined || t.active === '' ? 'YES' : t.active);
    const when = (s) => { const d = new Date(s || ''); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', year: 'numeric' }); };
    function render() {
      const list = techs.filter(t => t.tech_id && (!t.facility_id || t.facility_id === 'fac_uniontown')).sort((a, b) => (on(b) - on(a)) || String(a.name).localeCompare(String(b.name)));
      $('rows').innerHTML = list.map(t => '<tr' + (on(t) ? '' : ' class="off"') + '><td class="strong">' + escapeHtml(t.name || '') + '</td><td><span class="pill ' + (on(t) ? 'yes">Active' : 'no">Off') + '</span></td><td>' +
        when(t.updated_at) + (t.updated_by ? '<small>' + escapeHtml(t.updated_by) + '</small>' : '') + '</td><td>' + (can() ? '<button type="button" class="edit" data-tech="' + escapeHtml(t.tech_id) + '">Edit</button>' : '') + '</td></tr>').join('') ||
        '<tr><td colspan="4" class="empty">' + (loaded ? 'No technicians yet. Add the first one.' : 'Loading the technicians&hellip;') + '</td></tr>';
      $('add').hidden = !can();
      $('foot').textContent = list.filter(on).length + ' active technicians. ' + (can() ? 'Login IDs are never shown: type a new one to change it.' : 'Only managers and administrators change the technicians.');
    }
    function open(t) {
      editing = t || null;
      $('form-title').textContent = t ? 'Edit ' + t.name : 'New technician';
      $('t-name').value = t ? t.name || '' : '';
      $('t-login').value = '';
      $('t-login').placeholder = t ? 'leave empty to keep' : '6 numbers';
      $('t-active').value = t && !on(t) ? 'NO' : 'YES';
      $('t-hint').textContent = t ? 'Type a new login ID only to change it.' : 'The login ID is 6 numbers (leading zeros are kept).';
      $('tech-form').hidden = false; $('t-name').focus();
    }
    $('add').addEventListener('click', () => open(null));
    $('rows').addEventListener('click', e => { const b = e.target.closest('[data-tech]'); if (b) open(techs.find(t => t.tech_id === b.dataset.tech)); });
    $('t-cancel').addEventListener('click', () => { editing = null; $('tech-form').hidden = true; });
    $('t-login').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
    $('tech-form').addEventListener('submit', async e => {
      e.preventDefault();
      const b = e.target.querySelector('[type=submit]');
      b.disabled = true; showError('');
      try {
        const r = await save('saveGarageTech', { techId: editing ? editing.tech_id : '', name: $('t-name').value.trim(), loginId: $('t-login').value.trim(), active: $('t-active').value === 'YES' });
        $('saved').textContent = 'Saved ' + r.name + (r.loginSet ? ' with the new login ID.' : '.');
        editing = null; $('tech-form').hidden = true;
      } catch (err) { showError(err.message); }
      finally { b.disabled = false; }
    });
    window.udBack = () => { if (!$('tech-form').hidden) { $('t-cancel').click(); return true; } return false; };

    requireSignIn(async (user) => {
      const { db } = await start();
      onSnapshot(collection(db, 'garageTechs'), s => { techs = s.docs.map(d => d.data()); loaded = true; render(); }, e => showError('Could not read the technicians: ' + e.message));
      onSnapshot(doc(db, 'users', String(user.email).toLowerCase()), s => { person = s.exists() ? s.data() : null; render(); }, () => {});
      render();
    });
  </script>
</body>
</html>
