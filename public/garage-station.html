<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Joe 10/12: installed from here ("Garage Station"), it opens full screen in its own window, no browser bars. -->
  <link rel="manifest" href="garage-station.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Garage Station">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/garage-station/apple-touch-icon.png">
  <title>Garage Station · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/stations.css">
  <!-- Joe 10/13: with no signal the station opens from the tablet and its steps wait on it (js/offline-saves.js). -->
  <script>window.UD_OFFLINE = true;</script>
</head>
<body class="fill phone gs-page">
  <!-- Joe 10/12 "all my stations will have a United Dairy login, then a code to direct it to the correct place": the garage
       tablet signs in with a United Dairy Google account first; then its station code. Mechanics still sign each job. -->
  <div class="signin" id="signin" hidden>
    <h1>Garage Station</h1>
    <p>Sign in with the tablet's United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <!-- Joe 10/28: the garage's tablet has no Back, Home or mechanics in its header; Release (bottom right) is the only way out. -->
    <div class="topbar">
      <button type="button" class="gs-nav" id="gs-change" hidden>Release</button>
    </div>
    <div class="head">
      <div class="title"><h1 id="title">Garage Station</h1></div>
    </div>
    <div class="view">
      <div class="gs">
        <p class="offline-line" id="offline-line" role="status" hidden></p>
        <p class="gs-msg" id="gs-message" role="alert" hidden></p>
        <!-- Joe 10/12: once Administration > Garage Station Codes has a code, the tablet types its station's code once. -->
        <div id="gs-release" hidden></div>
        <section id="view-code" hidden></section>

        <!-- Joe 10/28 (mock-up 1): the first screen is three big cards, Trucks, Trailers and Fork trucks, each with its open work
             orders; no sign-in. -->
        <section id="view-home" class="gs-stack">
          <p class="gs-hint">Tap a card to see its open work orders.</p>
          <div class="gs-cards" id="cards"></div>
        </section>
        <!-- One card's open work orders. -->
        <section id="view-jobs" class="gs-stack" hidden>
          <div class="gs-bar"><button type="button" class="gs-btn gs-back" id="to-home">&larr; All work orders</button><h2 id="jobs-title">Work Orders</h2></div>
          <div class="gs-jobs" id="jobs"></div>
        </section>
        <!-- One work order (Start Work, Pause, Waiting on Parts, Complete), Who are you? and Complete's two steps come here from
             js/job-station.js (shared with the Maintenance Station, review item 74). -->

      </div>
    </div>
  </div>

  <script type="module">
    import { start, escapeHtml, requireSignIn, currentPlant, lockDevice, STATION_DEVICE } from './js/app.js';
    import { startOffline, offlineCall, isNoConnection, onWaitingChange } from './js/offline-saves.js';
    import { httpsCallable } from './js/firebase.js';
    import { resolveStation, askCode, askRelease, remember, lockStation } from './js/station-code.js';
    import { mountJobStation, rid, names, first } from './js/job-station.js';
    import { fullScreenOnTap } from './js/full-screen.js';

    fullScreenOnTap();

    /*
     * The Garage Station: the fleet's work orders (trucks, trailers, fork trucks and pallet jacks). Joe 10/28 (mock-up 1, "set it
     * up like for the garage"): three big cards, Trucks, Trailers and Fork trucks, each with its open work orders; a card shows its
     * list; a work order has Start Work, Pause, Waiting on Parts and Complete, notes typed or spoken, and a service's checklist.
     * No mechanics row and no Report a Problem. The screens it shares with the Maintenance Station (one work order, Who are you?,
     * Complete) are js/job-station.js (review item 74, cfg.simple); here are the garage's own: the tablet's sign-in and station
     * code, the cards, and (Joe 10/13) steps kept on the tablet with no signal.
     */
    const $ = (id) => document.getElementById(id);

    const fn = async () => httpsCallable((await start()).functions, 'garage');
    // The garage station this tablet opened with its code (Administration > Garage Station Codes) goes with every call; a new
    // code or a removed station sends the tablet back to the code screen.
    const CODE_KEY = 'udGarageStationCode';
    let station = null, deviceLocked = STATION_DEVICE === 'GARAGE';
    async function call(op, fields) {
      try { return (await (await fn())(Object.assign({ op, udPlant: currentPlant() }, fields || {}, station ? { station: { key: station.key, version: station.version } } : {}))).data; } catch (err) {
        const m = /STATION_CODE: (.*)$/.exec(String(err.message || ''));
        if (!m) throw err;
        station = null; remember(CODE_KEY, null); if (S.shownView() !== 'code') gate(m[1].replace(/\s*\[\d{3}\]\s*$/, '')).catch(() => {});
        throw new Error('');
      }
    }
    const stationCall = (step, f) => call('station', Object.assign({ step }, f));
    // Which station this tablet is: its code's station, the code screen, or (no garage codes yet) open straight away.
    async function gate(msg) {
      const r = msg !== undefined ? { needCode: true, message: msg } : await resolveStation('GARAGE', CODE_KEY, stationCall);
      if (r.needCode) {
        station = null; lockStation($('gs-change'), false); document.body.classList.toggle('station-locked', deviceLocked); $('title').textContent = 'Garage Station'; S.view('code');
        station = await askCode($('view-code'), { kind: 'GARAGE', storeKey: CODE_KEY, call: stationCall, title: 'Enter this tablet\'s station code',
          hint: 'A manager gives each garage station its code (Administration > Garage Station Codes). The tablet remembers its station after this.', message: r.message });
        S.view('home');
      } else station = r.station || null;
      // Joe 10/12: a coded station has no Back or Home; Release at the bottom (manager release code) is the only way out.
      lockStation($('gs-change'), !!station);
      // Joe 10/28: once a code has opened it, this tablet is a Garage Station tablet: it opens no other screen (app.js), and its
      // code screen has no Back or Home either.
      if (station) { deviceLocked = true; lockDevice('GARAGE'); }
      document.body.classList.toggle('station-locked', !!station || deviceLocked);
      if (station) $('title').textContent = station.name + ' · ' + station.plant;
      S.message('');
      return S.load();
    }
    $('gs-change').addEventListener('click', async () => {
      const ok = await askRelease($('gs-release'), { status: () => call('release', { step: 'status' }), release: (code) => call('release', { step: 'release', code }), onError: S.message, mustHave: true });
      if (!ok) return;
      // Joe 10/28: Release goes back to the code screen only ("the only thing it's allowed"), not the Home menu.
      station = null; remember(CODE_KEY, null); gate().catch(err => S.message(err.message));
    });
    const TYPE = { TRUCK: 'Truck', TRAILER: 'Trailer', FORK_TRUCK: 'Fork truck' };
    // The three cards, in Joe's order.
    const CARDS = [['TRUCK', 'Trucks'], ['TRAILER', 'Trailers'], ['FORK_TRUCK', 'Fork trucks']];
    let pick = 'TRUCK', board = [];

    // One step: sent now with the mechanic's sign-in, or (no signal) kept on the tablet with their name and login ID, sent in
    // order once the signal is back and checked then (Joe 10/13). Each step keeps its requestId, so it is saved once.
    function stepCall(who, fields) {
      return offlineCall('garage', Object.assign({ op: 'step', tokens: who.token ? [who.token] : [], signIn: { techId: who.id, loginId: who.loginId }, requestId: rid() }, fields,
        station ? { station: { key: station.key, version: station.version } } : {}));
    }
    // A unit's line with 2 or more write-ups (Joe 10/28): Start makes one work order for all of them.
    const onJob = (job) => ({ id: job.id || '', writeUp: job.id ? '' : job.writeUp, also: job.id ? [] : (job.writeUps || []).slice(1) });

    const S = mountJobStation({
      call, views: ['code', 'home'], forms: [], simple: true, safeYes: 'Yes, safe', officeSource: 'OFFICE', downWord: 'CAN\'T RUN', unitClass: 'unit',
      filter: (j) => (TYPE[j.type] ? j.type : 'TRUCK') === pick,
      jobsTitle: (list) => CARDS.find(c => c[0] === pick)[1] + ' · ' + list.length + ' open',
      emptyJobs: () => 'No open work orders for ' + CARDS.find(c => c[0] === pick)[1].toLowerCase() + ' right now.',
      noTechs: 'No mechanics yet. The office adds them on Fleet Service Setup.',
      // Joe 10/13: with no signal the station shows the last list it had (kept on the tablet).
      board: async () => {
        try { const r = await call('board'); try { localStorage.setItem('udGarageBoard', JSON.stringify(r)); } catch (e) { /* full */ } return r; }
        catch (err) { const kept = isNoConnection(err) ? JSON.parse(localStorage.getItem('udGarageBoard') || 'null') : null; if (!kept) throw err; return kept; }
      },
      onBoard: (r) => { board = r.jobs || []; drawCards(); },
      jobKey: (j) => j.id || j.writeUp,
      jobLine: (j) => (TYPE[j.type] || 'Truck') + ' · ' + (j.more && j.more.length ? (j.more.length + 1) + ' write-ups' : (j.from || '')),
      problem: (j) => j.problem || j.category,
      jobHead: (j) => j.unit + ' · ' + (TYPE[j.type] || 'Truck'),
      jobLabel: (j) => j.source === 'SERVICE' ? 'Service due (Fleet Service)' : j.source === 'OFFICE' ? 'Sent by the office' : j.source === 'TECH' ? 'Reported at the garage' :
        j.more && j.more.length ? (j.more.length + 1) + ' write-ups' : 'From ' + (j.from || 'a write-up'),
      // Joe 10/13: with no signal the name and login ID go with each step kept on the tablet and are checked when it is sent.
      signIn: async (picked, typed) => {
        try { return Object.assign(await call('signIn', { techId: picked.id, loginId: typed, tokens: [] }), { loginId: typed }); }
        catch (err) { if (isNoConnection(err)) return { id: picked.id, name: picked.name, loginId: typed, offline: true }; throw err; }
      },
      step: (who, job, op, extra) => stepCall(who, Object.assign({ step: op }, onJob(job), extra || {})),
      // A service (it has a checklist) needs no "What did you fix?": it is the service.
      serviceFix: (j) => j.checklist ? (j.serviceKey === 'DOT' ? 'Annual inspection' : 'Oil / PM service') : '',
      completeName: (j) => j.unit,
      safeQ: (j) => 'Is ' + j.unit + ' safe to ' + (j.type === 'FORK_TRUCK' ? 'use' : 'drive') + '?',
      safeWord: 'Safe to drive?',
      complete: async (j, who, f) => {
        // A write-up nobody started becomes its work order first.
        if (!j.id) { const s = await stepCall(who, Object.assign({ step: 'START' }, onJob(j))); if (s.job) j.id = s.job.id; }
        return stepCall(who, Object.assign({ step: 'DONE', id: j.id || '', writeUp: j.id ? '' : j.writeUp }, f));
      },
      doneText: (j, who, safe) => safe ? j.unit + ' completed by ' + who.name + '.' : j.unit + ' stays open: not safe yet.'
    });

    /* ---------- the three cards (Joe 10/28) ---------- */
    function drawCards() {
      $('cards').innerHTML = CARDS.map(([type, name]) => {
        const list = board.filter(j => (TYPE[j.type] ? j.type : 'TRUCK') === type), down = list.filter(j => !j.canRun && j.status !== 'PARTS').length;
        const working = list.filter(j => j.onNow.length), parts = list.filter(j => j.status === 'PARTS').length;
        const lines = [down ? '<small class="red">' + down + ' can\'t run</small>' : '',
          working.length ? '<small class="green">' + escapeHtml(working.map(j => names(j.onNow.map(p => first(p.name))) + ' on ' + j.unit).join(' · ')) + '</small>' : '',
          parts ? '<small>' + parts + ' waiting on parts</small>' : ''].filter(Boolean);
        return '<button type="button" class="gs-bigcard" data-type="' + type + '"><b>' + list.length + '</b><span>' + name + '</span><small>open work order' + (list.length === 1 ? '' : 's') + '</small>' + lines.join('') + '</button>';
      }).join('');
    }
    $('cards').addEventListener('click', e => { const b = e.target.closest('[data-type]'); if (!b) return; pick = b.dataset.type; S.message(''); S.closeJob(); S.redraw(); S.view('jobs'); S.load().catch(() => {}); });
    $('to-home').addEventListener('click', () => { S.message(''); S.view('home'); });
    // Back on the tablet (Android's own Back button): the list goes back to the cards.
    const backOne = window.udBack;
    window.udBack = () => { if (S.shownView() === 'jobs') { S.view('home'); return true; } return backOne(); };
    // Left on a list or a work order for 10 minutes, the tablet goes back to the cards (what is typed stays on the tablet).
    let touched = Date.now();
    ['pointerdown', 'keydown'].forEach(t => document.addEventListener(t, () => { touched = Date.now(); }, true));
    setInterval(() => { if (['jobs', 'job'].indexOf(S.shownView()) >= 0 && Date.now() - touched > 10 * 60000 && !S.busy) { S.closeJob(); S.view('home'); } }, 30000);

    S.view('home');
    startOffline(['garage-station.html'], { scopes: ['garage-station'], device: 'tablet', files: [] });
    // Once what waited on the tablet has gone, the list is read again (and the "saved on this tablet" note goes).
    let waited = 0;
    onWaitingChange(list => { if (waited && !list.length && navigator.onLine) { if (/saved on this tablet/.test($('gs-message').textContent)) S.message(''); if (!S.busy) S.load().catch(() => {}); } waited = list.length; });
    let opened = false;
    requireSignIn(() => { if (opened) return; opened = true; gate().catch(err => S.message(err.message)); });
  </script>
</body>
</html>
