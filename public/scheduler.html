<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Shipping &amp; Receiving · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plant.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/scan-rules.js"></script>
</head>
<body class="fill issues-page plant-page sched-page">
  <div class="signin" id="signin" hidden>
    <h1>Shipping &amp; Receiving</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <!-- Joe 10/10: Shipping / Receiving right beside the dates, a little apart, the one in use lit. Review item 37 (Joe 10/13): no date
           box; This week (or Today, This month) and the arrows on the right move the dates. -->
      <div class="title"><span class="eyebrow">Shipping &amp; Receiving · <b id="lane-name">Shipping</b></span>
        <!-- Joe 11/1: Shipping and Receiving are separate screens (the left menu has each), so there is no Shipping | Receiving switch. -->
        <div class="sc-titleline"><h1 id="range">Shipping &amp; Receiving</h1></div></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the Operations test copy</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="sc-ctrl" data-top>
        <!-- Joe 10/10: the buttons first, the same size, then the filters, all in the top line (data-top). -->
        <button type="button" class="sc-btn primary" id="add">＋ Add Load</button>
        <button type="button" class="sc-btn" id="print">Print Monthly</button>
        <div class="tabs seg" id="views" role="tablist" aria-label="Schedule view"><button type="button" data-view="day">Day</button><button type="button" data-view="week">Week</button><button type="button" data-view="month">Month</button><button type="button" data-view="history" id="v-history" hidden>History</button></div>
        <div class="stepper">
          <button type="button" id="prev" aria-label="Previous" title="Previous">&#9664;</button>
          <button type="button" id="today" class="sc-today">This month</button>
          <button type="button" id="next" aria-label="Next" title="Next">&#9654;</button>
        </div>
      </div>
      <!-- Joe 10/10: the counts and the holiday colour key sit in a slim strip under the top line, so the month title and the
           buttons keep their room. -->
      <div class="sc-strip"><div class="hstats" id="hstats"></div>
        <!-- Joe 11/1 (mock-up 2): Receiving's Calendar and Suppliers & Products, where the plant adds, edits and removes its suppliers and
             the products each one sends (in this strip, so the top line keeps its room). -->
        <div class="tabs seg sc-rtabs" id="rtabs" role="tablist" aria-label="Receiving" hidden><button type="button" data-rtab="calendar">Calendar</button><button type="button" data-rtab="products" id="suppliers">Suppliers &amp; Products</button></div><span class="sc-grow"></span><span class="sc-legend" id="legend" aria-label="Who delivers the load"><span class="sc-by ut"><i></i>Uniontown truck</span><span class="sc-by branch"><i></i>Branch</span><span class="sc-by carrier"><i></i>Carrier</span></span><span class="sc-key"><i></i>Holiday</span></div>
      <div class="sc-body" id="body"></div>
    </div>
  </div>

  <div class="modal-back" id="modal-back" hidden></div>
  <section class="modal wide-modal sc-modal" id="modal" role="dialog" aria-labelledby="modal-title" hidden></section>

  <script type="module">
    import { start, requireSignIn, save, escapeHtml, shortDate, showError, goLiveNote, printInFrame, maySave, watchPerson } from './js/app.js';
    import { collection, doc, query, where, onSnapshot, getDocs } from './js/firebase.js';
    import * as P from './js/plant-core.js';
    import { watchLoads as watchRunDays } from './js/recent-records.js';
    import { listenForScans, beep } from './js/scan-input.js';

    const L = window.UDLogic, R = window.UDPlant, S = window.UDScan;
    const params = new URLSearchParams(location.search);
    const today = () => L.operatingDay(new Date());
    const DAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
    let lane = R.lane(params.get('lane')), view = ['day', 'week', 'month', 'history', 'products'].indexOf(params.get('view')) >= 0 ? params.get('view') : (window.matchMedia('(max-width: 760px)').matches ? 'day' : 'month'); // a phone opens on the day: a month of boxes is too small to read
    let date = L.isDateKey(params.get('date')) ? params.get('date') : today();
    let loads = { SHIPPING: [], RECEIVING: [] }, seen = { SHIPPING: false, RECEIVING: false }, supplierDocs = [], routeDocs = [], person = null, app = {}, db = null, search = '';
    const pending = {};           // load id -> the load as saved (or {deleted: true}) while its save is on its way
    const pendingSuppliers = [];  // suppliers added while their save is on its way
    // Joe 11/1 (mock-up 2): Receiving's products (receivingItems), the supplier picked on Suppliers & Products, the product line being
    // edited there ('' none, 'new' a new one), and the calendar view to go back to.
    let items = [], pickSup = '', editProd = '', calView = view === 'products' ? 'month' : view;
    const canSave = () => maySave(person, L.SAVE_ROLES.concat(['PLANT_EMPLOYEE']), app, 'plant');
    const who = () => lane === 'RECEIVING' ? 'Supplier' : 'Customer';

    /* ---------- dates ---------- */
    const at = (key) => new Date(key + 'T12:00:00');
    const monthStart = (key) => key.slice(0, 8) + '01';
    function monthEnd(key) { const d = at(monthStart(key)); d.setMonth(d.getMonth() + 1, 0); return key.slice(0, 8) + String(d.getDate()).padStart(2, '0'); }
    function range() {
      if (view === 'history') return { start: '0000-01-01', end: L.addDays(today(), -1) }; // every Receiving load before today
      if (view === 'products') return { start: monthStart(date), end: monthEnd(date) };
      if (view === 'day') return { start: date, end: date };
      if (view === 'week') { const s = L.weekStart(date); return { start: s, end: L.addDays(s, 6) }; }
      return { start: monthStart(date), end: monthEnd(date) };
    }
    function step(dir) {
      if (view === 'history' || view === 'products') return date;
      if (view === 'day') return L.addDays(date, dir);
      if (view === 'week') return L.addDays(L.weekStart(date), 7 * dir);
      const d = at(monthStart(date)); d.setMonth(d.getMonth() + dir, 1);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
    }
    const md = (key) => { const p = String(key || '').split('-'); return p.length === 3 ? Number(p[1]) + '-' + Number(p[2]) : String(key || ''); };
    function rangeTitle() {
      const r = range();
      if (view === 'history') return 'Receiving History';
      if (view === 'products') return 'Suppliers & Products';
      // Review item 60 (Joe 10/13): the month reads Oct 26 (its 3-letter name and 2-digit year).
      if (view === 'month') return at(date).toLocaleDateString('en-US', { month: 'short' }) + ' ' + String(at(date).getFullYear()).slice(-2);
      if (view === 'week') return shortDate(r.start) + ' – ' + shortDate(r.end);
      return L.dayName(date) + ' ' + shortDate(date);
    }
    const longDay = (key) => L.dayName(key) + ' ' + shortDate(key);
    // 06:00 shows as 6:00 AM.
    function clock(t) { const m = /^(\d{2}):(\d{2})$/.exec(t || ''); if (!m) return t || ''; const h = Number(m[1]); return (h % 12 || 12) + ':' + m[2] + (h < 12 ? ' AM' : ' PM'); }

    /* ---------- the lists ---------- */
    function entries() {
      const list = R.scheduleEntries(loads[lane], lane).filter(x => !pending[x.id]);
      Object.keys(pending).forEach(id => { const p = pending[id]; if (p.lane === lane && !p.deleted) list.push(p); });
      list.sort((a, b) => a.date.localeCompare(b.date) || (a.pickupTime || '99:99').localeCompare(b.pickupTime || '99:99'));
      // Joe 10/14: a customer's loads on one delivery day are numbered by pickup time (Load 1, Load 2, ...).
      // Joe 10/20: a Shipping load shows the dispatch sheet's time for its run and day once the Live week has it.
      const out = R.numberLoads(list, catalog());
      return lane === 'RECEIVING' ? out : R.withDispatchTimes(out, liveRuns);
    }
    function catalog() {
      if (lane === 'RECEIVING') { const real = R.scheduleSuppliers(supplierDocs); return real.concat(pendingSuppliers.filter(p => !real.some(r => r.routeId === p.routeId))); }
      return R.scheduleCustomers(routeDocs);
    }
    function routeFor(x) {
      return catalog().find(r => x.runId ? r.runId === x.runId : r.routeId === x.routeId && r.run === x.run) || {};
    }
    const entryName = (x) => R.loadNumberName(String(routeFor(x).name || x.run || x.route || 'Plant pickup'), x.loadNo);
    function titleCase(t) { t = String(t || '').trim(); if (!t || /[a-z]/.test(t)) return t; return t.split(/(\s+)/).map(w => /^\s+$/.test(w) ? w : w.toLowerCase() === 'and' ? 'and' : w.length <= 2 || /[0-9/&]/.test(w) ? w : w.charAt(0) + w.slice(1).toLowerCase()).join(''); }
    // The day list's run name: the customer's short name plus what the run adds to it (as the current app shows it).
    function runName(x) { return R.loadNumberName(runNameOnly(x), x.loadNo); }
    function runNameOnly(x) {
      const short = String(routeFor(x).name || '').trim(), run = String(x.run || '').trim();
      if (!short) return titleCase(run) || x.route || 'Plant pickup';
      if (!run || run.length <= short.length) return short;
      const words = short.toUpperCase().split(/[\s-]+/).filter(Boolean);
      const rest = run.split(/[\s-]+/).filter(w => { const u = w.toUpperCase(); return u && !words.some(s => s.indexOf(u) === 0 || u.indexOf(s) === 0); }).join(' ');
      return rest ? short + ' ' + titleCase(rest) : short;
    }
    // Joe 10/12: each load is colored by who delivers it. A load marked Carrier on the load itself is a carrier; otherwise the
    // run's Route Master coverage_type says it: BRANCH is a branch, OUTSIDE CARRIER (or another outside name) a carrier, and
    // UNITED DAIRY or blank our own Uniontown truck. Receiving's suppliers have no Route Master line: the load's type decides.
    const HAULERS = { ut: 'Uniontown truck', branch: 'Branch', carrier: 'Carrier' };
    function hauler(x) {
      if (x.scheduleType === 'CARRIER') return 'carrier';
      if (lane === 'RECEIVING') return 'ut';
      const r = routeDocs.find(d => d.runId === x.runId) || routeDocs.find(d => x.routeId && d.routeId === x.routeId) || {};
      const t = String(r.coverageType || '').trim().toUpperCase();
      return t === 'BRANCH' ? 'branch' : t && t !== 'UNITED DAIRY' ? 'carrier' : 'ut';
    }
    const byDate = (list) => { const m = {}; list.forEach(x => { (m[x.date] = m[x.date] || []).push(x); }); return m; };

    /* ---------- drawing ---------- */
    function render() {
      if ((view === 'history' || view === 'products') && lane !== 'RECEIVING') view = 'month';
      document.getElementById('v-history').hidden = lane !== 'RECEIVING';
      document.getElementById('rtabs').hidden = lane !== 'RECEIVING';
      document.querySelectorAll('[data-rtab]').forEach(b => b.setAttribute('aria-selected', String((b.dataset.rtab === 'products') === (view === 'products'))));
      document.body.classList.toggle('sc-prod', view === 'products');
      document.querySelector('.sc-ctrl .stepper').hidden = view === 'history';
      watchLoads(); watchRuns();
      const ck = canSave(), r = range(), list = entries(), inRange = list.filter(x => x.date >= r.start && x.date <= r.end);
      document.body.classList.toggle('sc-recv', lane === 'RECEIVING');
      document.getElementById('lane-name').textContent = lane === 'RECEIVING' ? 'Receiving' : 'Shipping';
      document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
      document.getElementById('range').lastChild.textContent = rangeTitle();
      document.getElementById('today').textContent = view === 'month' ? 'This month' : view === 'week' ? 'This week' : 'Today';
      // The arrows say what they step through.
      const unit = view === 'month' ? 'month' : view === 'week' ? 'week' : 'day';
      [['prev', 'Previous '], ['next', 'Next ']].forEach(([id, w]) => { const b = document.getElementById(id); b.title = w + unit; b.setAttribute('aria-label', w + unit); });
      document.getElementById('print').textContent = 'Print ' + (view === 'history' ? 'History' : view === 'week' ? 'Weekly' : view === 'day' ? 'Daily' : 'Monthly');
      document.getElementById('add').hidden = !ck;
      let tiles;
      if (view === 'history') { const sup = new Set(inRange.map(x => x.runId || x.run)).size, wks = new Set(inRange.map(x => L.weekStart(x.date))).size; tiles = [[inRange.length, inRange.length === 1 ? 'Past load' : 'Past loads'], [sup, sup === 1 ? 'Supplier' : 'Suppliers'], [wks, wks === 1 ? 'Week' : 'Weeks']]; }
      else if (view === 'day') { const c = inRange.filter(x => x.scheduleType === 'CARRIER').length; tiles = [[inRange.length, inRange.length === 1 ? 'Load' : 'Loads'], [c, 'Carrier'], [inRange.length - c, 'United Dairy Delivery']]; }
      else { let hol = 0; for (let d = r.start; d <= r.end; d = L.addDays(d, 1)) if (R.holidayName(d)) hol++; const days = new Set(inRange.map(x => x.date)).size; tiles = [[inRange.length, inRange.length === 1 ? 'Load' : 'Loads'], [days, 'Days booked'], [hol, hol === 1 ? 'Holiday' : 'Holidays']]; }
      document.getElementById('hstats').innerHTML = tiles.map(([n, l]) => '<div><b>' + n + '</b><span>' + l + '</span></div>').join('');
      const body = document.getElementById('body');
      body.className = 'sc-body sc-v-' + view;
      // A product line being typed keeps what was typed when a save elsewhere redraws the screen.
      const typed = {};
      body.querySelectorAll('#pedit input, #pedit select').forEach(el => { typed[el.id] = el.value; });
      body.innerHTML = view === 'products' ? productsHtml(ck) : view === 'history' ? historyHtml(inRange) : view === 'month' ? monthHtml(list) : view === 'week' ? weekHtml(list, ck) : dayHtml(list, ck);
      Object.keys(typed).forEach(id => { const el = document.getElementById(id); if (el) el.value = typed[id]; });
      const s = body.querySelector('#who-search');
      if (s) { s.value = search; s.oninput = () => { search = s.value; filterWho(); }; filterWho(); }
      const hs = body.querySelector('#hist-search');
      if (hs) { hs.value = search; hs.oninput = () => { search = hs.value; filterHistory(); }; filterHistory(); }
      const st = L.screenState(app, 'plant');
      goLiveNote(st.live && st.owner !== 'new');
      document.getElementById('mode-text').textContent = st.live ? (st.open ? 'LIVE' : 'VIEW ONLY') : 'TEST COPY';
      if (!document.getElementById('modal').hidden && openDay) drawDay(openDay);
    }
    function filterWho() {
      const q = search.trim().toLowerCase();
      document.querySelectorAll('.sc-who').forEach(row => { row.hidden = !!q && String(row.dataset.text || '').indexOf(q) < 0; });
    }
    function filterHistory() {
      const q = search.trim().toLowerCase();
      document.querySelectorAll('tr[data-text]').forEach(row => { row.hidden = !!q && row.dataset.text.indexOf(q) < 0; });
    }
    // Joe 10/11: Receiving keeps its loads in the app (no Live sheet); History lists every past load, newest first.
    function historyHtml(rows) {
      rows = rows.slice().sort((a, b) => b.date.localeCompare(a.date) || sortTime(a, b));
      const cell = (v, cls) => { v = String(v == null ? '' : v).trim(); return '<td' + (cls ? ' class="' + cls + '"' : '') + (v ? ' title="' + escapeHtml(v) + '"' : '') + '>' + (v ? escapeHtml(v) : '—') + '</td>'; };
      return '<div class="sc-histbar"><input id="hist-search" type="search" placeholder="Search suppliers, PO, product, trailer…" aria-label="Search the history"></div>' +
        '<div class="sheet scroll-list"><table class="sc-table"><colgroup><col style="width:8%"><col style="width:5%"><col style="width:14%"><col style="width:7%"><col style="width:11%"><col style="width:6%"><col style="width:7%"><col style="width:7%"><col style="width:5%"><col style="width:11%"><col style="width:13%"><col style="width:6%"></colgroup>' +
        '<thead><tr><th>Delivery</th><th>Code</th><th>Supplier</th><th>Time</th><th>Type</th><th>Load Date</th><th>Trailer</th><th>PO</th><th>Cases</th><th>Product</th><th>Notes</th><th></th></tr></thead><tbody>' +
        (rows.map(x => '<tr data-text="' + escapeHtml([entryName(x), x.route, x.run, x.poNumber, x.product, x.trailer, x.notes, x.date].join(' ').toLowerCase()) + '">' + cell(DAYS[at(x.date).getDay()] + ' ' + md(x.date) + '/' + x.date.slice(2, 4)) + cell(x.route) + cell(runName(x), 'run') + cell(clock(x.pickupTime)) +
          cell(x.scheduleType === 'CARRIER' ? 'Carrier' : 'United Dairy Delivery') + cell(x.loadDate ? md(x.loadDate) : '') + cell(x.trailer) + cell(x.poNumber) + cell(x.cases) + cell(x.product, 'txt') + cell(x.notes, 'txt') +
          '<td><button type="button" class="sc-btn small" data-edit="' + escapeHtml(x.id) + '">' + (canSave() ? 'Edit' : 'View') + '</button></td></tr>').join('') ||
          '<tr><td colspan="12" class="empty">' + (seen[lane] ? 'No past Receiving loads yet.' : 'Loading the schedule&hellip;') + '</td></tr>') + '</tbody></table></div>';
    }
    const sortTime = (a, b) => (a.pickupTime || '99:99').localeCompare(b.pickupTime || '99:99');
    function monthHtml(list) {
      const first = at(monthStart(date)), start = L.addDays(monthStart(date), -first.getDay()), t = today(), map = byDate(list), month = date.slice(0, 7);
      const weeks = Math.ceil((first.getDay() + Number(monthEnd(date).slice(8))) / 7);
      let h = '<div class="sc-month" style="--weeks:' + weeks + '">' + DAYS.map(d => '<div class="sc-wd">' + d + '</div>').join('');
      for (let i = 0; i < weeks * 7; i++) {
        const key = L.addDays(start, i), items = (map[key] || []).slice().sort(sortTime), hol = R.holidayName(key);
        h += '<button type="button" class="sc-day' + (key.slice(0, 7) !== month ? ' other' : '') + (key === t ? ' today' : '') + (hol ? ' holiday' : '') + '" data-day="' + key + '"' + (hol ? ' title="' + escapeHtml(hol) + '"' : '') + '>' +
          '<span class="sc-dn"><b>' + Number(key.slice(8)) + '</b>' + (hol ? '<em class="sc-hol">' + escapeHtml(hol) + '</em>' : '') + (items.length ? '<em class="sc-badge">' + items.length + ' load' + (items.length === 1 ? '' : 's') + '</em>' : '') + '</span>' +
          items.slice(0, 3).map(x => '<small class="by-' + hauler(x) + (x.scheduleType === 'CARRIER' ? ' car' : '') + '" title="' + HAULERS[hauler(x)] + '"><strong>' + escapeHtml(entryName(x)) + (x.pickupTime ? ' · ' + escapeHtml(clock(x.pickupTime)) : '') + '</strong></small>').join('') +
          (items.length > 3 ? '<small class="sc-more">+' + (items.length - 3) + ' more</small>' : '') + '</button>';
      }
      return h + '</div>';
    }
    // Joe 10/20: Shipping's customers in alphabetical order by name (Receiving's suppliers stay in the order they were added).
    const whoList = () => lane === 'RECEIVING' ? catalog() : catalog().slice().sort((a, b) => String(a.name || a.run || a.route || '').localeCompare(String(b.name || b.run || b.route || ''), undefined, { sensitivity: 'base', numeric: true }));
    const idAttrs = (r) => ' data-route-id="' + escapeHtml(r.routeId || '') + '" data-run-id="' + escapeHtml(r.runId || '') + '"';
    function weekHtml(list, ck) {
      const s = L.weekStart(date), t = today(), map = byDate(list), days = [0, 1, 2, 3, 4, 5, 6].map(i => L.addDays(s, i));
      const addDate = days.indexOf(t) >= 0 ? t : s, w = who();
      const side = '<aside class="sc-whos"><h3>' + w + 's' + (lane === 'RECEIVING' && ck ? '<button type="button" class="sc-btn small" id="supplier-add">＋ New</button>' : '') + '</h3>' +
        '<input id="who-search" type="search" placeholder="Search ' + w.toLowerCase() + 's…" aria-label="Search ' + w.toLowerCase() + 's"><div class="sc-wholist">' +
        (whoList().map(r => { const name = r.name || r.run || r.route || ''; return '<div class="sc-who" data-text="' + escapeHtml([name, r.route, r.run].join(' ').toLowerCase()) + '"><span><strong>' + escapeHtml(name) + '</strong><small>' + escapeHtml([r.route, r.run].filter(Boolean).join(' · ')) + '</small></span>' +
          (ck && lane === 'RECEIVING' && !r.temp ? '<button type="button" class="sc-btn small sc-supedit" data-supplier="' + escapeHtml(r.routeId) + '" aria-label="Edit ' + escapeHtml(name) + '">Edit</button>' : '') +
          (ck ? '<button type="button" class="sc-plus" data-new="' + addDate + '"' + idAttrs(r) + ' aria-label="Add load for ' + escapeHtml(name) + '">＋</button>' : '') + '</div>'; }).join('') || '<p class="sc-none">No ' + w.toLowerCase() + 's on the list.</p>') + '</div></aside>';
      const counts = days.map(d => { const hol = R.holidayName(d); return '<div class="sc-count' + (d === t ? ' today' : '') + (hol ? ' holiday' : '') + '"' + (hol ? ' title="' + escapeHtml(hol) + '"' : '') + '><span>' + DAYS[at(d).getDay()] + ' ' + md(d) + '</span><strong>' + (map[d] || []).length + '</strong></div>'; }).join('');
      const cols = days.map(d => {
        const items = (map[d] || []).slice().sort(sortTime);
        // Joe 10/25: a week card shows only the load's name and time; the PO, trailer and load/deliver dates are in the box it opens.
        return '<div class="sc-col' + (d === t ? ' today' : '') + '">' + (items.length ? items.map(x =>
          '<button type="button" class="sc-load by-' + hauler(x) + (x.scheduleType === 'CARRIER' ? ' car' : '') + '" title="' + HAULERS[hauler(x)] + '" data-edit="' + escapeHtml(x.id) + '"><strong>' + escapeHtml(entryName(x)) + '</strong><span>' +
            escapeHtml(clock(x.pickupTime)) + '</span></button>'
        ).join('') : '<p class="sc-none">No loads</p>') + (ck ? '<button type="button" class="sc-add" data-new="' + d + '">＋ Add</button>' : '') + '</div>';
      }).join('');
      return side + '<div class="sc-weekgrid">' + counts + cols + '</div>';
    }
    function dayHtml(list, ck) {
      const rows = list.filter(x => x.date === date).sort(sortTime);
      const cell = (v, cls) => { v = String(v == null ? '' : v).trim(); return '<td' + (cls ? ' class="' + cls + '"' : '') + (v ? ' title="' + escapeHtml(v) + '"' : '') + '>' + (v ? escapeHtml(v) : '—') + '</td>'; };
      return '<div class="sheet scroll-list"><table class="sc-table"><colgroup><col style="width:7%"><col style="width:14%"><col style="width:7%"><col style="width:11%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:6%"><col style="width:12%"><col style="width:14%"><col style="width:7%"></colgroup>' +
        '<thead><tr><th>' + (lane === 'RECEIVING' ? 'Code' : 'Route') + '</th><th>' + (lane === 'RECEIVING' ? 'Supplier' : 'Run') + '</th><th>Time</th><th>Type</th><th>Load Date</th><th>Trailer</th><th>PO</th><th>Cases</th><th>Product</th><th>Notes</th><th></th></tr></thead><tbody>' +
        (rows.map(x => '<tr class="by-' + hauler(x) + '" title="' + HAULERS[hauler(x)] + '">' + cell(x.route) + cell(runName(x), 'run') + cell(clock(x.pickupTime)) + cell(x.scheduleType === 'CARRIER' ? 'Carrier' : 'United Dairy Delivery') + cell(x.loadDate ? md(x.loadDate) : '') + cell(x.trailer) + cell(x.poNumber) + cell(x.cases) +
          cell(x.product, 'txt') + cell(x.notes, 'txt') + '<td><button type="button" class="sc-btn small" data-edit="' + escapeHtml(x.id) + '">' + (ck ? 'Edit' : 'View') + '</button></td></tr>').join('') ||
          (seen[lane] ? '<tr><td colspan="11" class="empty">No plant schedule entries for this date.</td></tr>' : '<tr><td colspan="11" class="empty">Loading the schedule&hellip;</td></tr>')) + '</tbody></table></div>' +
        (ck ? '<div class="sc-dayadd"><button type="button" class="sc-btn primary" data-new="' + date + '">＋ Add ' + (lane === 'RECEIVING' ? 'Load' : 'Route') + '</button></div>' : '');
    }

    /* ---------- Suppliers & Products (Joe 11/1, mock-up 2) ---------- */
    // Pick a supplier on the left; its products are on the right, each with Edit. ＋ Add Product opens a new line at the top of
    // the list (no pop-up). A product the Boxing tablet named from a barcode, with no supplier yet, is under "No supplier yet".
    const NO_SUP = '__none';
    const supName = (r) => r ? r.name || r.run || r.route || '' : '';
    const productsOf = (supId) => supId === NO_SUP ? items.filter(i => !catalog().some(s => s.routeId === i.supplierId)).sort((a, b) => String(a.name).localeCompare(String(b.name), undefined, { sensitivity: 'base', numeric: true })) : R.supplierProducts(items, supId);
    const num = (n) => n === null || n === undefined || n === '' ? '' : Number(n).toLocaleString('en-US');
    const opts = (list, cur, blank) => (blank ? '<option value="">' + blank + '</option>' : '') + list.map(v => '<option' + (v === cur ? ' selected' : '') + '>' + escapeHtml(v) + '</option>').join('');
    function productsHtml(ck) {
      const sups = catalog(), loose = productsOf(NO_SUP);
      if (pickSup !== NO_SUP && !sups.some(r => r.routeId === pickSup)) pickSup = sups.length ? sups[0].routeId : NO_SUP;
      if (pickSup === NO_SUP && !loose.length && sups.length) pickSup = sups[0].routeId;
      const n = (k) => k + ' product' + (k === 1 ? '' : 's');
      const left = '<aside class="sc-sups"><h3>Suppliers' + (ck ? '<span><button type="button" class="sc-btn small" id="supplier-list">Add a List</button><button type="button" class="sc-btn small primary" id="supplier-add">＋ Supplier</button></span>' : '') + '</h3>' +
        (listNote ? '<p class="sc-supnote">' + escapeHtml(listNote) + '</p>' : '') + '<div class="sc-suppick">' +
        sups.map(r => '<button type="button" data-pick="' + escapeHtml(r.routeId) + '" aria-selected="' + (r.routeId === pickSup) + '"><strong>' + escapeHtml(supName(r)) + '</strong><small>' + (r.temp ? 'Saving&hellip;' : n(R.supplierProducts(items, r.routeId).length)) + '</small></button>').join('') +
        (loose.length ? '<button type="button" data-pick="' + NO_SUP + '" aria-selected="' + (pickSup === NO_SUP) + '"><strong>No supplier yet</strong><small>' + n(loose.length) + '</small></button>' : '') +
        (sups.length || loose.length ? '' : '<p class="sc-none">No suppliers on the list.</p>') + '</div></aside>';
      const sup = sups.find(r => r.routeId === pickSup) || null, list = productsOf(pickSup), title = sup ? supName(sup) : pickSup === NO_SUP ? 'No supplier yet' : '';
      const row = (i) => editProd === i.id && ck ? editRow(i) : '<tr class="' + (R.inventoryLow(i) ? 'low' : '') + '"><td class="strong">' + escapeHtml(i.name) + '</td><td>' + escapeHtml(i.kind || '—') + '</td><td>' + escapeHtml(i.unit || '—') + '</td>' +
        '<td class="num">' + (num(i.low) || '—') + '</td><td class="num strong">' + num(R.shouldHave(i)) + '</td><td class="num">' + ((i.barcodes || []).length || '—') + '</td>' +
        '<td>' + (ck ? '<button type="button" class="sc-btn small" data-prod="' + escapeHtml(i.id) + '">Edit</button>' : '') + '</td></tr>';
      const right = '<section class="sc-prods">' + (title ? '<h3><span>' + escapeHtml(title) + '</span>' + (ck && sup && !sup.temp ? '<button type="button" class="sc-btn small" data-supplier="' + escapeHtml(sup.routeId) + '">Edit supplier</button>' : '') +
          '<span class="sc-grow"></span>' + (ck && sup && !sup.temp ? '<button type="button" class="sc-btn primary" id="prod-add">＋ Add Product for ' + escapeHtml(title) + '</button>' : '') + '</h3>' : '') +
        '<div class="notice error sc-err" id="p-error" hidden></div>' +
        '<div class="sheet scroll-list"><table class="sc-table sc-prodtable"><colgroup><col style="width:30%"><col style="width:13%"><col style="width:13%"><col style="width:10%"><col style="width:11%"><col style="width:8%"><col style="width:15%"></colgroup>' +
        '<thead><tr><th>Product</th><th>Kind</th><th>Counted in</th><th class="num">Low mark</th><th class="num">Should have</th><th class="num">Barcodes</th><th></th></tr></thead><tbody>' +
        (editProd === 'new' && ck && sup ? editRow(null) : '') + list.map(row).join('') +
        (list.length || editProd === 'new' ? '' : '<tr><td colspan="7" class="empty">' + (title ? 'No products for ' + escapeHtml(title) + ' yet.' + (ck && sup ? ' Press ＋ Add Product.' : '') : 'Add a supplier first.') + '</td></tr>') +
        '</tbody></table></div><p class="sc-prodnote">Should have = the last count on Inventory, plus what came in since. Red: below its low mark.</p></section>';
      return '<div class="sc-prodsplit">' + left + right + '</div>';
    }
    // The line being added or edited: drop-downs start blank on a new product.
    function editRow(i) {
      const v = (k) => i ? i[k] : '';
      const supPick = i ? '<label class="sc-movesup">Supplier <select id="p-sup">' + catalog().filter(r => !r.temp).map(r => '<option value="' + escapeHtml(r.routeId) + '"' + (r.routeId === (i.supplierId || '') ? ' selected' : '') + '>' + escapeHtml(supName(r)) + '</option>').join('') +
        (catalog().some(r => r.routeId === i.supplierId) ? '' : '<option value="" selected>No supplier yet</option>') + '</select></label>' : '';
      return '<tr class="edit" id="pedit"><td><input id="p-name" maxlength="120" placeholder="Product name" aria-label="Product name" value="' + escapeHtml(v('name') || '') + '">' + supPick + '</td>' +
        '<td><select id="p-kind" aria-label="Kind">' + opts(R.INVENTORY_KINDS, v('kind'), 'Pick one') + '</select></td>' +
        '<td><select id="p-unit" aria-label="Counted in">' + opts(R.INVENTORY_UNITS, v('unit'), 'Pick one') + '</select></td>' +
        '<td class="num"><input id="p-low" inputmode="numeric" maxlength="7" placeholder="Optional" aria-label="Low mark" value="' + escapeHtml(v('low') === null || v('low') === undefined ? '' : String(v('low'))) + '"></td>' +
        '<td class="num">' + (i ? num(R.shouldHave(i)) : '0') + '</td>' +
        '<td class="num">' + ((i && (i.barcodes || []).length) || '—') + '</td>' +
        '<td><div class="acts"><button type="button" class="sc-btn small primary" id="p-save">Save</button><button type="button" class="sc-btn small" id="p-cancel">Cancel</button>' +
        (i ? '<button type="button" class="sc-btn small danger" id="p-remove">Remove</button>' : '') + '</div></td></tr>';
    }
    function prodError(t) { const b = document.getElementById('p-error'); if (b) { b.textContent = t; b.hidden = !t; } }
    async function saveProduct() {
      const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const name = val('p-name').replace(/\s+/g, ' '), low = val('p-low').replace(/,/g, '');
      if (!name) return prodError('Type the product name.');
      if (low && !/^[0-9]{1,7}$/.test(low)) return prodError('The low mark must be a whole number.');
      const others = items.filter(i => i.id !== editProd);
      if (others.some(i => String(i.name).toUpperCase() === name.toUpperCase())) return prodError(name + ' is already on the list.');
      const req = { lane: 'RECEIVING', op: editProd === 'new' ? 'addProduct' : 'editProduct', itemId: editProd === 'new' ? '' : editProd, name,
        supplierId: editProd === 'new' ? pickSup : val('p-sup'), kind: val('p-kind'), unit: val('p-unit'), low };
      document.querySelectorAll('#pedit button, #pedit input, #pedit select').forEach(b => { b.disabled = true; });
      document.getElementById('p-save').textContent = 'Saving…';
      try {
        await save('savePlantSchedule', req);
        showError('');
        if (req.supplierId && editProd !== 'new') pickSup = req.supplierId;
        editProd = ''; render();
      } catch (e) {
        document.querySelectorAll('#pedit button, #pedit input, #pedit select').forEach(b => { b.disabled = false; });
        document.getElementById('p-save').textContent = 'Save';
        prodError('Not saved (' + (e.message || e) + ').');
      }
    }
    async function removeProduct(btn) {
      if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = 'Press again to remove'; return; }
      btn.disabled = true;
      try { await save('savePlantSchedule', { lane: 'RECEIVING', op: 'removeProduct', itemId: editProd }); showError(''); editProd = ''; render(); }
      catch (e) { btn.disabled = false; prodError('Not removed (' + (e.message || e) + ').'); }
    }

    /* ---------- dialogs ---------- */
    const modal = document.getElementById('modal'), back = document.getElementById('modal-back');
    let openDay = null;
    // Joe 11/1 (no overlays): on Receiving every box opens in the page, in place of the calendar; Cancel, Close or Back returns.
    document.querySelector('#screen .view').appendChild(modal);
    function openModal(html) {
      stopScan();
      const paged = lane === 'RECEIVING';
      modal.innerHTML = html; modal.hidden = false; back.hidden = paged;
      modal.classList.toggle('sc-pagebox', paged);
      document.body.classList.toggle('sc-paged', paged);
      if (paged) { modal.removeAttribute('aria-modal'); const sc = document.querySelector('.content-shell') || document.scrollingElement; if (sc) sc.scrollTop = 0; }
    }
    function closeModal() { stopScan(); modal.hidden = true; back.hidden = true; modal.innerHTML = ''; openDay = null; document.body.classList.remove('sc-paged'); }
    let scanStop = null;
    function stopScan() { if (scanStop) { scanStop(); scanStop = null; } }
    back.onclick = closeModal;
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

    // A day on the month: its loads, each with Edit, and Add a Route.
    function drawDay(key) {
      openDay = key;
      const rows = entries().filter(x => x.date === key).sort(sortTime), hol = R.holidayName(key), ck = canSave();
      openModal('<h2 id="modal-title">' + escapeHtml(longDay(key)) + '</h2>' + (hol ? '<p class="sc-holnote">' + escapeHtml(hol) + '</p>' : '') +
        '<div class="sc-daylist">' + (rows.length ? '<div class="sc-dayhead"><span>Run</span><span>Time</span><span>Trailer</span><span>Product</span><span>Cases</span><span></span></div>' + rows.map(x =>
          '<div class="sc-dayrow by-' + hauler(x) + '"><span class="run" title="' + escapeHtml(runName(x)) + '">' + escapeHtml(runName(x)) + '</span><span>' + escapeHtml(clock(x.pickupTime) || '—') + '</span><span class="sc-trl">' + (R.loadTrailer(x) ? '<b class="trl">' + escapeHtml(R.loadTrailer(x)) + '</b>' : '—') + '</span><span title="' + escapeHtml(x.product) + '">' + escapeHtml(x.product || '—') + '</span><span>' + escapeHtml(x.cases || '—') + '</span>' +
          '<button type="button" class="sc-btn small" data-edit="' + escapeHtml(x.id) + '">' + (ck ? 'Edit' : 'View') + '</button></div>').join('') : '<p class="sc-none">No ' + (lane === 'RECEIVING' ? 'loads' : 'routes') + ' scheduled for this day.</p>') + '</div>' +
        '<div class="modal-actions"><button type="button" data-close>Close</button>' + (ck ? '<button type="button" class="primary" data-new="' + key + '">＋ Add a ' + (lane === 'RECEIVING' ? 'Load' : 'Route') + '</button>' : '') + '</div>');
    }

    function dialogTitle(id, key) { const d = at(key); return (id ? 'Edit' : 'Add') + ' Load · ' + (isNaN(d) ? key : d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + shortDate(key)); }
    // Add / Edit Load, as the current app's (Route / Run or Supplier, type, load and delivery dates, pickup time, trailer, PO, cases, product, notes).
    function openLoad(key, id, pick) {
      openDay = null;
      const x = id ? entries().find(e => e.id === id) || null : null;
      if (id && !x) return;
      const ck = canSave(), list = catalog(), dis = ck ? '' : ' disabled';
      const sel = x ? { routeId: x.routeId, runId: x.runId } : pick || {};
      const loadDate = x ? (x.loadDate || x.date) : L.addDays(key, -1);
      const options = (x && !list.some(r => r.runId === x.runId && r.routeId === x.routeId) ? [{ routeId: x.routeId, runId: x.runId, route: x.route, run: x.run, name: '(no longer on the list)' }] : []).concat(list);
      // Joe 10/14: Shipping's Load Type starts as the picked run's Route Master type (Boxes when it has none) and can be changed.
      const ship = lane !== 'RECEIVING', kind = x ? R.scheduleArea(x, list) : sel.runId ? R.routeLoadType(list, sel.runId) : '';
      openModal('<h2 id="modal-title">' + escapeHtml(dialogTitle(x ? x.id : '', key)) + '</h2><div class="modal-grid sc-form">' +
        (ship ? '<div class="wide sc-top">' : '') +
        '<label>' + (lane === 'RECEIVING' ? 'Supplier' : 'Route / Run') + '<select id="f-route"' + dis + '>' + (sel.runId ? '' : '<option value="">Pick one…</option>') + options.map((r, i) => '<option value="' + i + '"' + (r.runId === sel.runId && r.routeId === sel.routeId ? ' selected' : '') + '>' + escapeHtml([r.route, r.run, r.name].filter(Boolean).join(' · ')) + '</option>').join('') + '</select></label>' +
        '<label>Schedule Type<select id="f-type"' + dis + '><option value="ROUTE">United Dairy Delivery</option><option value="CARRIER"' + (x && x.scheduleType === 'CARRIER' ? ' selected' : '') + '>Carrier</option></select></label>' +
        (ship ? '<label>Load Type<select id="f-kind"' + dis + '>' + (kind ? '' : '<option value=""></option>') + R.LOAD_TYPES.map(([v, t]) => '<option value="' + v + '"' + (v === kind ? ' selected' : '') + '>' + t + '</option>').join('') + '</select></label></div>' : '') +
        '<div class="wide sc-three"><label>Load Date<input id="f-load" type="date" value="' + escapeHtml(loadDate) + '"' + dis + '></label><label>Delivery Date<input id="f-date" type="date" value="' + escapeHtml(x ? x.date : key) + '"' + dis + '><small>The day you clicked</small></label>' +
        '<label>Pickup Time<input id="f-time" type="time" value="' + escapeHtml(x ? x.pickupTime : '') + '"' + dis + '><small id="f-time-note">' + (x && x.fromDispatch ? 'From the dispatch sheet' : '') + '</small></label></div>' +
        '<label>Trailer<input id="f-trailer" list="f-trailers" autocomplete="off" maxlength="24" placeholder="Pick or type a trailer" value="' + escapeHtml(x ? x.trailer : '') + '"' + dis + '><datalist id="f-trailers"></datalist><small id="f-trailer-note">Pick from the list or type one</small></label>' +
        '<label>PO Number<input id="f-po" maxlength="40" placeholder="Needed for a carrier load" value="' + escapeHtml(x ? x.poNumber : '') + '"' + dis + '></label>' +
        (ship ? '<label>Cases<input id="f-cases" inputmode="numeric" maxlength="6" placeholder="Optional" value="' + escapeHtml(x ? x.cases : '') + '"' + dis + '></label>' +
        '<label>Product<input id="f-product" maxlength="80" placeholder="Optional" value="' + escapeHtml(x ? x.product : '') + '"' + dis + '></label>' : '') +
        (ship ? '' : linesBox(x, ck)) + '<label class="wide">Notes<textarea id="f-notes"' + dis + '>' + escapeHtml(x ? x.notes : '') + '</textarea></label></div>' +
        '<div class="notice error sc-err" id="f-error" hidden></div>' +
        '<div class="modal-actions">' + (x && ck ? '<button type="button" class="danger sc-left" id="f-delete">Delete Load</button>' : '') + '<button type="button" data-close>' + (ck ? 'Cancel' : 'Close') + '</button>' + (ck ? '<button type="button" class="primary" id="f-save">Save Load</button>' : '') +
        (!ship && x && ck && !x.received ? '<button type="button" class="primary sc-receive" id="f-receive">Mark Received</button>' : '') + '</div>');
      if (!ship) startLines(x, ck, options);
      const loadIn = document.getElementById('f-load'), dateIn = document.getElementById('f-date'), kindIn = document.getElementById('f-kind');
      if (kindIn) document.getElementById('f-route').addEventListener('change', ev => {
        const r = options[Number(ev.target.value)];
        if (!r) return;
        kindIn.value = R.routeLoadType(list, r.runId);
        const blank = kindIn.querySelector('option[value=""]'); if (blank) blank.remove();
      });
      loadIn.onchange = () => trailers(loadIn.value);
      // Joe 10/20: a new Shipping load's time starts as the run's time for the delivery day (the dispatch sheet's, else Route
      // Master's), and follows a change of run or day until a time is typed.
      const timeIn = document.getElementById('f-time'), note = document.getElementById('f-time-note');
      let filled = '';
      const fillTime = () => {
        if (x || !ship || (timeIn.value && timeIn.value !== filled)) return;
        const r = options[Number(document.getElementById('f-route').value)];
        const t = r ? R.defaultLoadTime(r.runId, dateIn.value, routeDocs, liveRuns) : '';
        timeIn.value = filled = t;
        note.textContent = !t ? '' : R.dispatchClock({ runId: r.runId, date: dateIn.value }, liveRuns) ? 'From the dispatch sheet' : 'Route Master time';
      };
      timeIn.addEventListener('input', () => { note.textContent = ''; });
      document.getElementById('f-route').addEventListener('change', fillTime);
      dateIn.onchange = () => { document.getElementById('modal-title').textContent = dialogTitle(x ? x.id : '', dateIn.value); fillTime(); };
      fillTime();
      trailers(loadIn.value || key);
      if (!ck) return;
      document.getElementById('f-save').onclick = () => saveLoad(x, options);
      const rcv = document.getElementById('f-receive');
      if (rcv) rcv.onclick = () => markReceived(x, options);
      // The cursor starts in the first box of a new load; Enter in any box but Notes saves.
      if (!x) document.getElementById('f-route').focus();
      modal.querySelector('.sc-form').addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); document.getElementById('f-save').click(); } });
      const del = document.getElementById('f-delete');
      if (del) del.onclick = () => confirmDelete(x);
    }

    /* ---------- a Receiving load's products, and checking it in (Joe 11/1) ---------- */
    // "one trailer could have multiple items on it ... a quantity of this many caps, a quantity of that many caps"; "when I'm receiving,
    // I'm going to check in ... the supplier and then everything that's supposed to be on that trailer ... hook it up to a scanner".
    // Each line: the product (the picked supplier's products first), what was ordered and, once the load is here, what came in.
    // A scan adds to its product's Received (a pallet label its whole count); a barcode the app does not know asks which product
    // it is once. Mark Received puts the received counts into Inventory.
    let formLines = [], formLoad = null, formOptions = [], unknownScan = '';
    const boxValue = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const itemById = (id) => items.find(i => i.id === id) || null;
    function linesBox(x, ck) {
      const old = x && !(x.lines || []).length && (x.product || x.cases) ? '<p class="sc-oldprod">Booked before products were listed: ' + escapeHtml([x.product, x.cases ? x.cases + ' cases' : ''].filter(Boolean).join(' · ')) + '</p>' : '';
      const got = x && x.received ? '<p class="sc-gotnote">Received ' + escapeHtml(shortDate(L.operatingDay(new Date(x.received.at)))) + ' ' + escapeHtml(new Date(x.received.at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })) + ' by ' + escapeHtml(String(x.received.by || '').split('@')[0]) + '. Its products are in Inventory.</p>' : '';
      const scan = x && ck && !x.received ? '<div class="sc-scanbar"><label>Check in: scan each label<input id="f-scan" placeholder="Scan a label (or type the barcode and press Enter)" aria-label="Scan a label"></label><span id="f-scan-note" class="sc-scannote" aria-live="polite"></span></div>' +
        '<div class="sc-unknown" id="f-unknown" hidden><b>New barcode.</b> Which product is it?<select id="f-unknown-pick" aria-label="Which product is it"></select><button type="button" class="sc-btn small primary" id="f-unknown-save">Save</button><button type="button" class="sc-btn small" id="f-unknown-skip">Skip</button></div>' : '';
      return '<div class="wide sc-lines">' + got + old + scan + '<table class="sc-linetable"><thead><tr><th>Products on this load</th><th>Counted in</th><th class="num">Ordered</th>' + (x ? '<th class="num">Received</th>' : '') + '<th></th></tr></thead><tbody id="f-lines"></tbody></table>' +
        '<div class="sc-linefoot">' + (ck && !(x && x.received) ? '<button type="button" class="sc-btn small" id="f-addline">＋ Add a product</button>' : '') + '<span id="f-linetot"></span></div></div>';
    }
    function startLines(x, ck, options) {
      formLoad = x; formOptions = options; unknownScan = '';
      formLines = x && (x.lines || []).length ? x.lines.map(l => Object.assign({}, l)) : [];
      if (!formLines.length && ck && !(x && x.received)) formLines.push({ itemId: '', ordered: null, received: null });
      drawLines();
      const add = document.getElementById('f-addline');
      if (add) add.onclick = () => { formLines.push({ itemId: '', ordered: null, received: null }); drawLines(); const sel = document.querySelectorAll('#f-lines select'); if (sel.length) sel[sel.length - 1].focus(); };
      const route = document.getElementById('f-route');
      if (route) route.addEventListener('change', drawLines);
      const box = document.getElementById('f-scan');
      if (box) {
        scanStop = listenForScans({ box, onScan });
        document.getElementById('f-unknown-save').onclick = linkUnknown;
        document.getElementById('f-unknown-skip').onclick = () => { unknownScan = ''; document.getElementById('f-unknown').hidden = true; scanNote(''); box.focus(); };
      }
    }
    const pickedSupplier = () => { const sel = document.getElementById('f-route'); return (sel && formOptions[Number(sel.value)]) || null; };
    // The product drop-down: the supplier's products, then every other product.
    function productOptions(cur) {
      const sup = pickedSupplier(), mine = sup ? R.supplierProducts(items, sup.routeId) : [], rest = items.filter(i => mine.indexOf(i) < 0).sort((a, b) => String(a.name).localeCompare(String(b.name)));

      const gone = cur && !itemById(cur) ? '<option value="' + escapeHtml(cur) + '" selected>' + escapeHtml((formLines.find(l => l.itemId === cur) || {}).name || 'Product no longer on the list') + '</option>' : '';

    function confirmSupplierRemove(sup, back) {
      openModal('<h2 id="modal-title">Remove this supplier?</h2><dl class="sc-dl"><dt>Supplier</dt><dd>' + escapeHtml(sup.run) + '</dd><dt>Code</dt><dd>' + escapeHtml(sup.route || '—') + '</dd></dl>' +
        '<p class="sc-supnote">It comes off the list for new loads. Loads already booked keep it.</p><div class="notice error sc-err" id="f-error" hidden></div>' +
        '<div class="modal-actions"><button type="button" id="s-keep">Keep it</button><button type="button" class="danger" id="s-go">Remove Supplier</button></div>');
      document.getElementById('s-keep').onclick = () => openSupplier(sup, back);
      document.getElementById('s-go').onclick = () => changeSupplier({ op: 'removeSupplier', id: sup.routeId }, 'Remove Supplier', back ? openSuppliers : closeModal);
    }
    // An edit or remove waits for the save (the list shows it when it lands), then goes back to the Suppliers list.
    async function changeSupplier(req, what, done) {
      modal.querySelectorAll('button').forEach(b => { b.disabled = true; });
      const go = document.getElementById('s-save') || document.getElementById('s-go');
      if (go) go.textContent = 'Saving…';
      try {
        await save('savePlantSchedule', Object.assign({ lane: 'RECEIVING' }, req));
        showError('');
        done();
      } catch (e) {
        modal.querySelectorAll('button').forEach(b => { b.disabled = false; });
        if (go) go.textContent = req.op === 'removeSupplier' ? 'Remove Supplier' : 'Save Supplier';
        formError(what + ': ' + (e.message || e));
      }
    }

    // One listener for every button on the page and in the boxes.
    document.addEventListener('click', e => {
      const t = e.target.closest('button, [data-day]');
      if (!t) return;
      if (t.hasAttribute('data-close')) return closeModal();
      if (t.dataset.day) return drawDay(t.dataset.day);
      if (t.dataset.edit) { const x = entries().find(y => y.id === t.dataset.edit); if (x) openLoad(x.date, x.id); return; }
      if (t.dataset.new) {
        if (t.dataset.runId !== undefined) return openLoad(t.dataset.new, '', { routeId: t.dataset.routeId, runId: t.dataset.runId });
        return openLoad(t.dataset.new, '');
      }
      if (t.dataset.rtab) { listNote = ''; return setView(t.dataset.rtab === 'products' ? 'products' : calView || 'month'); }
      if (t.dataset.pick) { pickSup = t.dataset.pick; editProd = ''; return render(); }
      if (t.id === 'prod-add') { editProd = 'new'; render(); const n = document.getElementById('p-name'); if (n) n.focus(); return; }
      if (t.dataset.prod) { editProd = t.dataset.prod; render(); const n = document.getElementById('p-name'); if (n) n.focus(); return; }
      if (t.id === 'p-save') return saveProduct();
      if (t.id === 'p-cancel') { editProd = ''; return render(); }
      if (t.id === 'p-remove') return removeProduct(t);
      if (t.id === 'supplier-add') return openSupplier();
      if (t.id === 'suppliers') { listNote = ''; return openSuppliers(); }
      if (t.id === 'supplier-new') return openSupplier(null, true);
      if (t.id === 'supplier-list') { listNote = ''; return openSupplierList(); }
      if (t.dataset.supplier) { const sup = catalog().find(r => r.routeId === t.dataset.supplier); if (sup) openSupplier(sup, !!t.closest('#modal')); return; }
      if (t.dataset.view) { setView(t.dataset.view); return; }
    });
    function push() { history.replaceState(null, '', '?' + new URLSearchParams(Object.assign({ view, date }, lane === 'RECEIVING' ? { lane: 'receiving' } : {})).toString()); }
    function setView(v) {
      // Leaving the month that holds today for a week or day shows today (as the current app).
      const t = today();
      if (view === 'month' && v !== 'month' && date.slice(0, 7) === t.slice(0, 7)) date = t;
      if (view === 'week' && v !== 'week' && t >= L.weekStart(date) && t <= L.addDays(L.weekStart(date), 6)) date = t;
      if (v !== 'products') calView = v;
      editProd = '';
      view = v; push(); render();
    }
    // Back: a box open on Receiving closes first; Suppliers & Products goes back to the calendar.
    window.udBack = () => { if (!modal.hidden) { closeModal(); render(); return true; } if (view === 'products') { setView(calView || 'month'); return true; } return false; };
    // Enter in a product line saves it; Escape cancels it.
    document.getElementById('body').addEventListener('keydown', e => {
      if (!e.target.closest('#pedit')) return;
      if (e.key === 'Enter') { e.preventDefault(); saveProduct(); }
      if (e.key === 'Escape') { editProd = ''; render(); }
    });
    function setDate(d) { if (!L.isDateKey(d)) return; date = d; push(); render(); }
    document.getElementById('prev').onclick = () => setDate(step(-1));
    document.getElementById('next').onclick = () => setDate(step(1));
    document.getElementById('today').onclick = () => setDate(today());
    document.getElementById('add').onclick = () => { const r = range(), t = today(); if (view === 'history') return openLoad(t, ''); openLoad(t >= r.start && t <= r.end ? t : view === 'day' ? date : r.start, ''); };
    document.getElementById('print').onclick = printView;

    // Print: a landscape page in a hidden frame, so the screen stays where it is.
    function printHtml(html) { printInFrame(html, { id: 'print-frame' }); }
    function printView() {
      const head = 'United Dairy · Plant Operations Schedule' + (lane === 'RECEIVING' ? ' · Receiving' : ''), list = entries();
      const css = '@page{size:landscape;margin:.25in}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#112f53}.top{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}h1{margin:0;font-size:22px}.sub{font-size:13px}' +
        '.cal{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid #7890a8}.wd{background:#0b5596;color:#fff;padding:6px;text-align:center;font-size:10px;font-weight:800}.d{min-height:1.05in;padding:5px;border-right:1px solid #b9c7d4;border-top:1px solid #b9c7d4;font-size:12px}' +
        '.d:nth-child(7n){border-right:0}.d.other{background:#f3f5f7;color:#6e7f8e}.d.hol{background:#fff1d6}.d b{display:block;font-size:12px;margin-bottom:4px}.d b i{font-style:normal;color:#8a4b00;font-size:9px;margin-left:4px}.d small{display:block;font-size:11.5px;line-height:1.25;margin-top:3px;color:#1d4468}' +
        '.d small{border-left:4px solid #0b5596;padding-left:4px}.by-branch{border-left-color:#15803d!important}.by-carrier{border-left-color:#7e3fbf!important}tr.by-ut td:first-child{border-left:5px solid #0b5596}tr.by-branch td:first-child{border-left:5px solid #15803d}tr.by-carrier td:first-child{border-left:5px solid #7e3fbf}' +
        '.legend{display:flex;gap:14px;font-size:12px;font-weight:700;margin:0 0 8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}' +
        'table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #9fb3c6;padding:4px 6px;text-align:left}th{background:#0b5596;color:#fff}@media print{body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}';
      const detail = (x) => [entryName(x), clock(x.pickupTime), x.scheduleType === 'CARRIER' ? 'CARRIER' : '', x.poNumber ? 'PO ' + x.poNumber : '', x.cases ? x.cases + ' cases' : '', x.product, x.trailer ? 'Trailer ' + x.trailer : '',
        x.loadDate && x.loadDate !== x.date ? 'Load ' + md(x.loadDate) : ''].filter(Boolean).join(' · ') + (x.notes ? ' — ' + x.notes : '');
      let inner;
      if (view === 'month') {
        const first = at(monthStart(date)), start = L.addDays(monthStart(date), -first.getDay()), map = byDate(list), weeks = Math.ceil((first.getDay() + Number(monthEnd(date).slice(8))) / 7);
        inner = '<div class="cal">' + DAYS.map(d => '<div class="wd">' + d + '</div>').join('');
        for (let i = 0; i < weeks * 7; i++) { const k = L.addDays(start, i), hol = R.holidayName(k); inner += '<section class="d' + (k.slice(0, 7) !== date.slice(0, 7) ? ' other' : '') + (hol ? ' hol' : '') + '"><b>' + Number(k.slice(8)) + (hol ? ' <i>' + escapeHtml(hol) + '</i>' : '') + '</b>' + (map[k] || []).slice().sort(sortTime).map(x => '<small class="by-' + hauler(x) + '">' + escapeHtml(detail(x)) + '</small>').join('') + '</section>'; }
        inner += '</div>';
      } else {
        const r = range(), rows = list.filter(x => x.date >= r.start && x.date <= r.end);
        if (view === 'history') rows.sort((a, b) => b.date.localeCompare(a.date) || sortTime(a, b));
        inner = '<table><thead><tr><th>Delivery</th><th>' + who() + '</th><th>Route · Run</th><th>Time</th><th>Type</th><th>Load Date</th><th>Trailer</th><th>PO</th><th>Cases</th><th>Product</th><th>Notes</th></tr></thead><tbody>' +
          (rows.map(x => '<tr class="by-' + hauler(x) + '"><td>' + escapeHtml(DAYS[at(x.date).getDay()] + ' ' + md(x.date) + (view === 'history' ? '/' + x.date.slice(2, 4) : '')) + '</td><td>' + escapeHtml(entryName(x)) + '</td><td>' + escapeHtml([x.route, x.run].filter(Boolean).join(' · ')) + '</td><td>' + escapeHtml(clock(x.pickupTime)) + '</td><td>' + (x.scheduleType === 'CARRIER' ? 'Carrier' : 'United Dairy Delivery') + '</td><td>' +
            escapeHtml(x.loadDate ? md(x.loadDate) : '') + '</td><td>' + escapeHtml(x.trailer) + '</td><td>' + escapeHtml(x.poNumber) + '</td><td>' + escapeHtml(x.cases) + '</td><td>' + escapeHtml(x.product) + '</td><td>' + escapeHtml(x.notes) + '</td></tr>').join('') ||
            '<tr><td colspan="11">No loads scheduled.</td></tr>') + '</tbody></table>';
      }
      printHtml('<!doctype html><html><head><title>Plant Schedule · ' + escapeHtml(rangeTitle()) + '</title><style>' + css + '</style></head><body><div class="top"><h1>' + escapeHtml(head) + '</h1><div class="sub">' + escapeHtml(rangeTitle()) + '</div></div>' +
        '<div class="legend"><span><i style="background:#0b5596"></i>Uniontown truck</span><span><i style="background:#15803d"></i>Branch</span><span><i style="background:#7e3fbf"></i>Carrier</span></div>' + inner + '</body></html>');
    }

    // Joe 10/18 (screen speed): each lane's loads from a week before the shown month, week or day on (the month's calendar
    // starts on the Sunday before its first day), not every load ever made, so the screen does not slow down as the schedule
    // grows. Receiving History reads every load. A load is one record (the server keeps one per load), so a load moved to
    // another day is still never shown twice. Read again only when the shown range leaves what is read.
    // Joe 10/20: the Live week's runs for the days shown (their dispatch times), read as one small record per run and day.
    let liveRuns = [], runsKey = '', runsUnsub = null;
    function watchRuns() {
      if (!db) return;
      const r = range(), from = r.start > L.addDays(today(), -7) ? r.start : L.addDays(today(), -7), dates = [];
      for (let d = from; d <= r.end && dates.length < 30; d = L.addDays(d, 1)) dates.push(d);
      const key = lane === 'RECEIVING' ? '' : dates.join(',');
      if (key === runsKey) return;
      runsKey = key;
      if (runsUnsub) { runsUnsub(); runsUnsub = null; }
      liveRuns = [];
      if (key) runsUnsub = watchRunDays(db, dates, list => { liveRuns = list; render(); }, () => { liveRuns = []; });
    }
    let loadsFrom = null, loadsUnsubs = [];
    function watchLoads() {
      if (!db) return;
      const want = view === 'history' ? '' : L.addDays(L.weekStart(range().start), -7);
      if (loadsFrom !== null && (loadsFrom === '' || (want && want >= loadsFrom && L.daysBetween(loadsFrom, want) <= 62))) return;
      loadsFrom = want;
      loadsUnsubs.splice(0).forEach(u => u());
      seen.SHIPPING = seen.RECEIVING = false;
      const fail = (what) => (e) => showError('Could not read ' + what + ' (' + e.message + '). Check the network and reload the page.');
      ['SHIPPING', 'RECEIVING'].forEach(l => loadsUnsubs.push(onSnapshot(query(collection(db, 'plantJournal'), where('type', '==', R.LOAD_TYPE[l]), ...(want ? [where('date', '>=', want)] : [])),
        s => { loads[l] = s.docs.map(d => d.data()); seen[l] = true; render(); }, fail(l === 'SHIPPING' ? 'the Shipping schedule' : 'the Receiving schedule'))));
    }

    requireSignIn(async (user) => {
      ({ db } = await start());
      watchPerson(db, user, p => { person = p; render(); });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; render(); });
      const fail = (what) => (e) => showError('Could not read ' + what + ' (' + e.message + '). Check the network and reload the page.');
      watchLoads();
      onSnapshot(query(collection(db, 'plantJournal'), where('type', '==', R.SUPPLIER_TYPE)), s => { supplierDocs = s.docs.map(d => d.data()); render(); if (!modal.hidden && modal.querySelector('.sc-suptable')) openSuppliers(); }, fail('the suppliers'));
      // Joe 11/1: Receiving's products (the same list the Boxing tablet names barcodes into), with what Inventory says each should have.
      onSnapshot(query(collection(db, 'receivingItems'), where('status', '==', 'ACTIVE')), s => { items = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); if (document.getElementById('f-lines')) drawLines(); }, fail('the products'));
      onSnapshot(collection(db, 'routes'), s => { routeDocs = s.docs.map(d => Object.assign({ runId: d.id }, d.data())); render(); }, fail('Route Master'));
      render();
    });
  </script>
</body>
</html>
