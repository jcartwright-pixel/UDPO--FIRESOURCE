<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Plant Material Trailers · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pmaint.css">
  <link rel="stylesheet" href="css/jug-trailers.css">
  <script src="js/logic.js"></script>
  <script src="js/jug-rules.js"></script>
</head>
<body class="fill pm-page mach-page jt-page">
  <div class="signin" id="signin" hidden>
    <h1>Plant Material Trailers</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow">Shipping &amp; Receiving · Inventory · <span id="plant-name"></span></span><h1>Plant Material Trailers</h1></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the test copy</span></div>
      <div class="actions in-head">
        <button type="button" class="pm-btn" id="edit-lists">Edit Lists</button>
        <button type="button" class="pm-btn pri" id="add">+ Add Trailer</button>
        <select id="show" class="pm-pick" aria-label="Show">
          <option value="">All trailers</option><option value="LOADED">Loaded</option><option value="HALF">Half Full</option><option value="EMPTY">Empty</option>
        </select>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <!-- Joe 10/28 (mock-up 2): how many trailers are in the lot and how full; the list on the left, the trailer picked on the right.
           Joe 11/1 (mock-up 2): Trailer Company and Unit first; Location; Edit Lists. -->
      <div class="jt-sum" id="sum"></div>
      <div class="mach-split">
        <section class="pm-panel" aria-label="Trailers in the lot">
          <div class="pm-scroll">
            <table class="pm-table">
              <thead><tr><th>Trailer Company</th><th>Unit</th><th>Status</th><th>What Is on It</th><th>Location</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
        <section class="pm-panel mach-card jt-card" id="card" aria-label="Trailer"></section>
      </div>
    </div>
  </div>

  <script type="module">import './js/app.js'; import './js/jug-trailers-page.js';</script>
</body>
</html>
