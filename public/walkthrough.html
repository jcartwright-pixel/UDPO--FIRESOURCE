<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <!-- Joe 10/18: opened from the Plant Managers link (?app=1), adding it to the home screen installs "Plant Managers" with its
       own icon, opening on the managers' start screen. -->
  <script>if (new URLSearchParams(location.search).get('app') === '1') { document.querySelector('link[rel="manifest"]').href = 'plant-managers.webmanifest'; document.querySelector('link[rel="apple-touch-icon"]').href = 'img/app-icon/plant-managers/apple-touch-icon.png'; document.write('<meta name="apple-mobile-web-app-title" content="Plant Managers"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">'); }</script>
  <title>Manager Walkthrough · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plant.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
</head>
<body class="fill issues-page plant-page walk-page">
  <div class="signin" id="signin" hidden>
    <h1>Manager Walkthrough</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><span class="eyebrow" id="eyebrow">Plant Distribution · Phone and Tablet</span><h1 id="title">Manager Walkthrough</h1></div>
      <div class="dayname" id="dayname"></div>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the Operations test copy</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <!-- Joe 10/15: managers only. A manager on a phone or tablet starts on three choices (view=home): Manager Walkthrough,
         Loading and Unloading. The walkthrough is Yard, Coolers, Production, each a big tile with what it holds, opening that screen,
         and beside it a DONE / DUE / PAST DUE button in green, yellow or red (Joe 10/18). -->
    <div class="view wk-view">
      <div id="code-box" hidden></div>
      <h2 class="wk-ask" id="ask"></h2>
      <div class="wk-list" id="list" aria-live="polite"></div>
      <p class="wk-last" id="last"></p>
      <div class="notice warning" id="not-manager" hidden>The manager's phone screens are for managers. <a href="index.html?full=1">Open Operations</a></div>
      <a class="wk-full" id="full" href="index.html?full=1" hidden>Open the full Operations app</a>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, shortDate, showError, shortTime, watchPerson, callServer } from './js/app.js';
    import { watchRound } from './js/autosave.js';
    import { resolveStation, askCode } from './js/station-code.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    import * as P from './js/plant-core.js';
    import { WALK_ROLES } from './js/walk-bar.js';
    import { savePicture, removePicture, watchPictures, cameraInput, thumbsHtml, wireCaptions, keepCaretIn } from './js/walk-photos.js';
    import { plantFor } from './js/pmaint.js';

    const L = window.UDLogic, U = window.UDPlant;
    const params = new URLSearchParams(location.search), home = params.get('view') === 'home';
    // Joe 10/18: the Plant Managers app (Administration > Links & Codes > Plant Managers App): the manager's sign-in, then the
    // plant's Plant Managers code once (the phone remembers it). The app keeps itself across the screens it opens.
    try { if (params.get('app') === '1') sessionStorage.setItem('udPlantManagers', '1'); } catch (e) { /* private window */ }
    const appMode = (() => { try { return params.get('app') === '1' || sessionStorage.getItem('udPlantManagers') === '1'; } catch (e) { return params.get('app') === '1'; } })();
    let codeOk = !appMode;
    const today = () => L.operatingDay(new Date());
    let date = today(), app = {}, person = null;
    const data = { runs: [], journal: [], setup: [], tempLocs: [], sensors: [], lineStatus: [], lastReport: '', pics: [] }, loaded = { runs: false, journal: false };
    // The person who made a check, from their sign-in (mike.adams@… reads Mike Adams).
    const personName = (v) => String(v || '').split('@')[0].split(/[._-]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(' ');

    // One big choice: its number, the line under it and its colour (red flashes while a check is past due). Joe 10/15 (later):
    // under it, what it holds (each trailer, cooler or line, problems first in red), as much as is useful on a phone.
    // Joe 10/18: beside each walkthrough card, a button in its colour: green DONE, yellow DUE (2 hours), red PAST DUE (3 hours),
    // and under the card who did its newest check and when ("Done automatically" when nothing needs checking).
    const SHOW = 5, STATE = { ok: 'DONE', due: 'DUE', late: 'PAST DUE' };
    const whoOf = (z) => z.auto ? 'Done automatically' : z.lastCheck ? 'Last ' + shortTime(Date.parse(z.lastCheck.at)) + (z.lastCheck.by ? ' · ' + personName(z.lastCheck.by) : '') : 'Not checked yet';
    const row = (state, href, html) => '<div class="wk-row">' + html + '<a class="wk-act ' + state + '" href="' + href + '">' + STATE[state] + '</a></div>';
    function choice(href, num, title, desc, n, line, kind, items, who) {
      const list = items ? '<ul class="wk-items">' + (items.length ? items.slice(0, SHOW).map(z => '<li class="' + z.kind + '"><b>' + escapeHtml(z.name) + '</b> ' + escapeHtml(z.detail) + '</li>').join('') +
        (items.length > SHOW ? '<li class="more">+ ' + (items.length - SHOW) + ' more</li>' : '') : '<li class="ok">Nothing to check</li>') + '</ul>' : '';
      return '<a class="wk-choice ' + kind + '" href="' + href + '">' + (num ? '<span class="wk-num">' + num + '</span>' : '') +
        '<span class="wk-t"><b>' + escapeHtml(title) + '</b><span>' + escapeHtml(desc) + '</span></span>' +
        '<span class="wk-n"><b>' + escapeHtml(String(n)) + '</b><span>' + escapeHtml(line) + '</span></span>' + (who ? '<span class="wk-who">' + escapeHtml(who) + '</span>' : '') + list + '</a>';
    }
    // Joe 10/23 (pictures, option 1): the 4th stop. TAKE PICTURE opens the camera; the pictures go with the next Send Current Report
    // and never again after that (kept 30 days). A picture not sent yet can be removed.
    let taking = false;
    const myPics = () => data.pics.filter(p => (p.facilityId || 'fac_uniontown') === plantFor(person, null).id);
    function picRow() {
      const pics = myPics();
      return '<div class="wk-row"><div class="wk-choice plain wp-choice"><span class="wk-num">4</span><span class="wk-t"><b>Pictures</b><span>Anything worth showing in the report</span></span>' +
        '<span class="wk-n"><b>' + pics.length + '</b><span>' + (pics.length ? 'waiting for the next report' : 'none waiting') + '</span></span>' +
        '<div class="wp-box">' + thumbsHtml(pics, { remove: true, none: 'Pictures you take go with the next report.' }) + '</div></div>' +
        '<button type="button" class="wk-act take"' + (taking ? ' disabled' : '') + '>' + (taking ? 'SAVING…' : 'TAKE PICTURE') + '</button></div>';
    }
    const camera = cameraInput(async (file) => {
      taking = true; render();
      try { await savePicture(file, { facilityId: plantFor(person, null).id }); showError(''); }
      catch (e) { showError('The picture was not saved: ' + (e.message || e)); }
      finally { taking = false; render(); }
    });
    wireCaptions(document.getElementById('list'), e => showError('The caption was not saved: ' + (e.message || e)));
    document.getElementById('list').addEventListener('click', async (e) => {
      if (e.target.closest('.wk-act.take')) { if (!taking) camera.click(); return; }
      const rm = e.target.closest('.wp-remove');
      if (!rm) return;
      rm.disabled = true;
      try { await removePicture(rm.dataset.photo); } catch (err) { rm.disabled = false; showError('The picture was not removed: ' + (err.message || err)); }
    });
    // A step's tile: red when past due or out of range, amber when due, green "OK" when all checked.
    const kindOf = (z) => z.late || z.out ? 'bad' + (z.late ? ' late' : '') : z.due ? 'due' : 'good';
    const lineOf = (z, what) => z.out ? z.out + ' out of range' : z.late ? z.late + ' past due' : z.due ? what : z.auto || 'all checked';

    function render() {
      document.getElementById('dayname').textContent = L.dayName(date).toUpperCase() + '  ·  ' + shortDate(date);
      const st = L.screenState(app, 'plant');
      document.getElementById('mode-text').textContent = st.live ? (st.open ? 'LIVE' : 'VIEW ONLY') : 'TEST COPY';
      // Joe 10/15: for managers only; anyone else is told so and sees none of it.
      const manager = !person || L.hasRole(person, WALK_ROLES);
      document.getElementById('not-manager').hidden = manager;
      ['list', 'last', 'ask'].forEach(id => { document.getElementById(id).hidden = !manager || !codeOk; });
      if (!manager || !codeOk || !loaded.runs || !loaded.journal) return;
      const now = Date.now(), journal = data.journal;
      const yard = U.yardQueue(data.runs, journal, date, now, data.gps);
      const temps = U.tempRows(U.withTempLocations(data.setup, data.tempLocs), journal, now, data.sensors);
      const lines = U.qualityLines(data.setup, journal, data.lineStatus, now);
      const W = U.managerWalk(yard, temps, lines, now);
      const C = W.coolers, Q = W.quality, Y = W.yard;
      let html;
      if (home) {
        // Joe 10/15 (later): the manager's phone: the walkthrough (Yard, Coolers, Quality), then Loading and Unloading.
        const walk = { due: Y.due + C.due + Q.due, late: Y.late + C.late + Q.late, out: C.out }, state = [Y, C, Q].some(z => z.state === 'late') ? 'late' : [Y, C, Q].some(z => z.state === 'due') ? 'due' : 'ok';
        const todays = journal.filter(d => d.date === date), loads = P.loadoutRows(data.runs, date), done = P.counts(loads);
        const open = loads.filter(r => r.state !== 'DONE'), noTrailer = open.filter(r => !String(r.trailer || '').trim()).length;
        const uc = P.unloadCounts(P.unloadRows(data.runs, date, todays, P.returnsFor(data.runs, date, todays), loads));
        const area = (name, z, what) => ({ name, detail: z.out ? z.out + ' out of range' + (z.late ? ' · ' + z.late + ' past due' : '') : z.late ? z.late + ' past due' : z.due ? z.due + ' ' + what : z.auto || 'all checked', kind: z.out || z.late ? 'bad' : z.due ? 'warn' : 'ok' });
        html = row(state, 'walkthrough.html', choice('walkthrough.html', '', 'Manager Walkthrough', 'Yard, Coolers and Production', walk.due, walk.due ? 'due' : walk.out ? walk.out + ' out of range' : 'all checked', kindOf(walk),
          [area('Yard', Y, 'to check'), area('Coolers', C, 'to check'), area('Production', Q, 'lines due')])) +
          choice('loadout.html', '', 'Loading', 'Loadout Center · today\'s loads', done.done, 'of ' + done.total + ' loaded', done.total && done.done === done.total ? 'good' : 'plain',
            [{ name: done.waiting + ' waiting', detail: '· ' + done.loading + ' loading' + (done.paused ? ' · ' + done.paused + ' paused' : ''), kind: 'plain' }]) +
          choice('unloading.html', '', 'Unloading', 'Trucks back in · cases and returns', uc.complete, 'of ' + uc.total + ' unloaded', uc.total && uc.complete === uc.total ? 'good' : 'plain',
            [{ name: uc.waiting + ' waiting', detail: '· ' + uc.unloading + ' unloading', kind: 'plain' }]) +
          // Joe 10/18: Send Report: the Plant Update email Manager Center's Send Current Report sends, to the Plant Managers group.
          // It opens that report (what goes out, a note box and Send), so the manager sees it before it goes.
          choice('manager.html?report=1', '', 'Send Report', 'Plant Update email to the Plant Managers group', data.lastReport ? shortTime(Date.parse(data.lastReport)) : 'None', 'last sent', 'plain',
            [{ name: 'Tap to see the report and send it', detail: '', kind: 'plain' }]) +
          // Joe 10/19: Trailer Assignment: the Trailer Assignments screen (which trailer goes on each load still to go).
          choice('trailers.html', '', 'Trailer Assignment', 'Which trailer goes on each load', open.length - noTrailer, 'of ' + open.length + ' assigned', open.length && !noTrailer ? 'good' : 'plain',
            [{ name: noTrailer + ' need a trailer', detail: '', kind: noTrailer ? 'warn' : 'plain' }]);
      } else {
        html = row(Y.state, 'yard.html?walk=1', choice('yard.html?walk=1', '1', 'Yard', 'Loaded trailers on the yard', Y.due, lineOf(Y, 'to check'), kindOf(Y), Y.items, whoOf(Y))) +
          row(C.state, 'temps.html?walk=1', choice('temps.html?walk=1', '2', 'Coolers', 'Cooler and freezer temperatures', C.due, lineOf(C, 'to check'), kindOf(C), C.items, whoOf(C))) +
          row(Q.state, 'quality.html?walk=1', choice('quality.html?walk=1', '3', 'Production', 'Production line checks', Q.due, Q.total ? 'of ' + Q.total + ' · ' + lineOf(Q, 'lines due') : lineOf(Q, 'lines due'), kindOf(Q), Q.items, whoOf(Q))) + picRow();
      }
      const list = document.getElementById('list');
      keepCaretIn(list, () => { list.innerHTML = html; });
      document.getElementById('last').textContent = W.last ? 'Last walkthrough check: ' + shortTime(Date.parse(W.last.at)) + ' · ' + personName(W.last.by) : 'No walkthrough checks yet today.';
    }

    document.getElementById('title').textContent = home ? (appMode ? 'Plant Managers' : 'Operations') : 'Manager Walkthrough';
    document.getElementById('ask').textContent = home ? 'What are you doing?' : 'Walk in this order';
    document.getElementById('full').hidden = !home;
    if (home) document.title = appMode ? 'Plant Managers' : 'Manager · Operations';

    // The Plant Managers code (Administration > Links & Codes > Plant Managers App), asked once on this phone.
    let gating = false;
    async function gate() {
      if (gating || codeOk) return;
      gating = true;
      const box = document.getElementById('code-box'), call = (op, f) => callServer('stationRelease', Object.assign({ op }, f));
      try {
        const r = await resolveStation('MANAGER', 'udPlantManagersCode', call);
        if (r.needCode) {
          box.hidden = false;
          await askCode(box, { kind: 'MANAGER', storeKey: 'udPlantManagersCode', call, title: 'Enter the Plant Managers code', label: 'Plant Managers code', button: 'Open Plant Managers',
            hint: 'Type the Plant Managers code from Administration > Links &amp; Codes > Plant Managers App. This phone remembers it after this.', message: r.message });
          box.hidden = true;
        }
        codeOk = true;
        render();
      } catch (e) { showError('Could not check the Plant Managers code: ' + e.message); }
      finally { gating = false; }
    }

    requireSignIn(async (user) => {
      const { db } = await start();
      const fail = (what) => (e) => showError('Could not read ' + what + ': ' + e.message);
      let timer = null;
      const later = () => { if (!timer) timer = setTimeout(() => { timer = null; render(); }, 50); };
      watchPerson(db, user, p => { person = p || { roles: [] }; later(); if (appMode && !codeOk && L.hasRole(person, WALK_ROLES)) gate(); }, { withEmail: true });
      watchRound(db, at => { data.lastReport = at; later(); });
      watchPictures(db, pics => { data.pics = pics; later(); });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; later(); });
      onSnapshot(collection(db, 'plantSetup'), s => { data.setup = s.docs.map(d => d.data()); later(); }, fail('the plant set-up'));
      onSnapshot(collection(db, 'tempLocations'), s => { data.tempLocs = s.docs.map(d => d.data()); later(); }, () => {});
      onSnapshot(collection(db, 'sensors'), s => { data.sensors = s.docs.map(d => d.data()); later(); }, () => {});
      // Joe 10/22: a loaded trailer whose GPS temperature is in range needs no yard check (the same rule as Yard Checks).
      onSnapshot(collection(db, 'gpsReefer'), s => { data.gps = {}; s.docs.forEach(d => { const r = d.data(); data.gps[U.yardTrailer(r.trailer || d.id)] = r; }); later(); }, () => {});
      onSnapshot(collection(db, 'plantLineStatus'), s => { data.lineStatus = s.docs.map(d => d.data()); later(); }, fail('the line status'));
      const unsubs = [];
      const watch = () => {
        date = today();
        unsubs.splice(0).forEach(u => u());
        loaded.runs = loaded.journal = false;
        const weeks = [...new Set(L.weeksForLoadDate(date).concat(L.weeksForLoadDate(L.addDays(date, -1)), [L.weekStart(date)]))];
        unsubs.push(onSnapshot(query(collection(db, 'runs'), where('weekStart', 'in', weeks)), s => { data.runs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); loaded.runs = true; later(); }, fail('the loads')));
        unsubs.push(onSnapshot(query(collection(db, 'plantJournal'), where('date', 'in', [L.addDays(date, -1), date])), s => { data.journal = s.docs.map(d => d.data()); loaded.journal = true; later(); }, fail('the plant journal')));
      };
      watch();
      // The 2-hour cycles move with the clock; the day rolls at 6 AM.
      setInterval(() => { if (today() !== date) watch(); render(); }, 60000);
      render();
    });
  </script>
</body>
</html>
