<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Being built · New Plant Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
</head>
<body class="soon-page">
  <div class="signin" id="signin" hidden>
    <h1>Being built</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1 id="title">Being built</h1><small id="sub">This screen is being built in the new app</small></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <section class="soon-card"><h2 id="what"></h2><p id="why"></p><p class="muted">It opens here, in the new app, as soon as it is ready. Nothing in the new app opens the old program.</p>
      <div class="actions tiles"><a class="button" id="go" href="index.html">Home</a></div></section>
  </div>

  <script type="module">
    import { requireSignIn } from './js/app.js';
    import { adminItem } from './js/admin-items.js';

    // Joe 10/10: a screen not built yet opens this page inside the new app, never the old program.
    const SCREENS = {
      'garage-station': ['Garage Station', 'The garage tablet where technicians sign in with their PIN to start and finish jobs. Meanwhile Garage Work Orders shows what is open and finished.', 'garage.html', 'Garage Work Orders'],
      'trucks-today': ['Trucks Today', 'Where every truck is today, from Verizon Connect. It is finished once Verizon turns on Fleet API access (see GPS Setup).', 'gps.html', 'GPS Setup'],
      'fleet-service-setup': ['Fleet Service Setup', 'Changing the service rules (PM miles, reefer months, DOT and plate warnings).', 'fleet.html', 'Fleet Service'],
      // Phone and tablet screens of the old app not built yet (Joe 10/10; list in PHONE_LINKS.md).
      'driver-dvir': ['Driver DVIR', 'The drivers\' pre-trip and post-trip inspection on the phone: odometer, truck and trailer checks, extra trailers, notes and signature. Meanwhile drivers report truck and trailer problems on the phone Check-In.', 'checkins.html', 'Driver Check-ins'],
      'driver-loadout': ['View Loadout (drivers)', 'The drivers\' phone board of which loads are loaded and ready. Meanwhile the Loadout Center shows the same loads.', 'loadout.html', 'Loadout Center'],
      'plant-station': ['Plant Station tablet', 'The plant floor tablet opened with a station code: Loading, Unloading, Washing and Returns for that station only. Meanwhile the same work is done on the Loadout, Unloading, Washing and Returns screens.', 'plant.html', 'Plant Departments'],
      'trailer-assignments': ['Trailer Assignments', 'The phone picker for which trailer goes on which load. Meanwhile trailers are set on Daily Dispatch.', 'daily.html', 'Daily Dispatch']
    };
    // Administration items not built yet come back to the Administration Center.
    const key = new URLSearchParams(location.search).get('what') || '', a = /^admin-/.test(key) && adminItem(key.slice(6));
    if (a) SCREENS[key] = [a.title, a.what, 'administration.html', 'Administration'];
    // A plant with no data source yet (Joe 10/10: Charleston and Martins Ferry on the all-plants overview).
    const plant = /^plant-/.test(key) && window.UDLogic.PLANTS.find(p => p.id === 'fac_' + key.slice(6));
    if (plant) SCREENS[key] = [plant.name + ' Operations', plant.name + ' is not connected to the new app yet. Its loads, unloading and maintenance show here once its sheets are added.', 'company.html', 'All plants'];
    const s = SCREENS[key] || ['This screen', 'It is next on the build list.', 'index.html', 'Home'];
    document.title = s[0] + ' · New Plant Operations';
    document.getElementById('title').textContent = s[0];
    document.getElementById('what').textContent = s[0] + ' is being built in the new app';
    document.getElementById('why').textContent = s[1];
    const go = document.getElementById('go'); go.href = s[2]; go.textContent = s[3];
    requireSignIn(async () => {});
  </script>
</body>
</html>
