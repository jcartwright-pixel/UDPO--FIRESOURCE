<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Operations Overview · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/company.css">
  <script src="js/logic.js"></script>
  <script src="js/board-rules.js"></script>
  <script src="js/plant-rules.js"></script>
</head>
<body class="company-page">
  <div class="signin" id="signin" hidden>
    <h1>Operations Overview</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <!-- Joe 10/10: the current app's all-plants home, for Administrators and the people he picks: every plant at a glance,
         then pick a plant. Someone who sees only one plant never comes here. -->
    <section class="co-hero">
      <!-- Review item 19 (Joe 10/13): no filler line under the title. -->
      <div><h1>Operations Overview</h1></div>
      <div class="co-date"><small>Today</small><b id="today">-</b></div>
    </section>
    <div class="notice error" id="error" hidden></div>
    <!-- Review item 19 (Joe 10/13): the six top tiles repeated Uniontown's card, so they are gone; the plant cards stay. -->
    <section class="co-plants" id="plants"></section>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, showError, shortDate, watchPerson } from './js/app.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    import * as P from './js/plant-core.js';
    const L = window.UDLogic;
    const today = () => L.operatingDay(new Date());
    let date = today(), person = null, ready = false;
    // Joe 10/26: "This home screen just reads the live data from the three locations". Each plant's numbers come from that
    // plant's own database; nothing here is shared between plants.
    const byPlant = {};
    const dataOf = (id) => (byPlant[id] = byPlant[id] || { runs: [], journal: [], pickups: [], maintenance: [] });
    const live = (p) => p.status === 'ACTIVE';

    // A plant's numbers, worked out the same way as the plant screens (Loadout Center, Unloading, Manager Center).
    function plantNumbers(data) {
      const loads = P.loadoutRows(data.runs, date), c = P.counts(loads), todays = data.journal.filter(d => d.date === date);
      const returns = P.returnsFor(data.runs, date, todays), uc = P.unloadCounts(P.unloadRows(data.runs, date, todays, returns, loads));
      const pickups = P.withNotePickups(loads, data.pickups).filter(P.pickupOpen).filter(p => loads.some(r => P.pickupsFor(r, [p]).length)).length;
      const issues = ['TRUCK', 'TRAILER', 'FORK_TRUCK'].reduce((n, k) => n + L.issueRows(data.maintenance, k, Date.now()).length, 0);
      const loading = loads.find(r => r.state === 'LOADING'), next = loads.find(r => r.state === 'WAITING');
      const last = loads.filter(r => r.state === 'DONE' && r.completedAt).sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)))[0];
      return { total: c.total, done: c.done, loading: c.loading, unloaded: uc.complete, waiting: uc.waiting, pickups, issues, loadingRow: loading, lastRow: last, nextRow: next };
    }
    const unit = (r) => [r.truck, r.trailer].filter(Boolean).join(' / ') || 'No truck yet';
    // Joe 10/16: the route and the truck / trailer sit together under the line's name, each kept whole (no "T-" / "993" split).
    const act = (label, r, time) => '<div class="co-act"><span>' + label + '</span>' + (r ? '<div class="co-what"><b>' + escapeHtml([r.route, r.run].filter(Boolean).join(' · ')) + '</b><i>' + escapeHtml(unit(r)) + '</i></div><time>' + escapeHtml(time || '') + '</time>' : '<b class="none">None</b>') + '</div>';
    // Joe 10/12: a click anywhere on a plant's tile (its numbers and lines too) opens that plant's home, so the numbers no
    // longer open their own screens here.
    const cell = (label, value, cls) => '<div class="co-cell' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><b>' + value + '</b></div>';

    function render() {
      if (!ready) return;
      const plants = L.plantsFor(person);
      // Someone who sees one plant never lands here; if they open it, it shows their plant only.
      document.getElementById('plants').innerHTML = L.PLANTS.filter(p => plants.indexOf(p.id) >= 0).map(p => {
        // Joe 10/12: picking a plant opens its home with all its cards (Plant Distribution, Plant Production, ...); the
        // Plant Distribution card there opens the Manager Center.
        const u = live(p) ? plantNumbers(dataOf(p.id)) : null, href = u ? 'index.html' : 'soon.html?what=plant-' + p.id.replace(/^fac_/, '');
        const head = '<header><i class="dot"></i><a href="' + href + '"><strong>' + escapeHtml(p.name) + '</strong></a><em class="' + (p.status === 'ACTIVE' ? 'on' : '') + '">' + p.status + '</em><span aria-hidden="true">&rarr;</span></header>';
        if (!u) {
          // Review item 20 (Joe 10/13): a plant not connected yet is its title and one short "being built" line, not a big empty box.
          return '<div class="co-plant planned" data-plant="' + p.id + '" data-card="' + href + '">' + head + '<p class="co-soon"><b>Being built</b> &middot; not connected to Operations yet</p></div>';
        }
        return '<div class="co-plant" data-plant="' + p.id + '" data-card="' + href + '">' + head + '<div class="co-grid">' +
          cell('Scheduled', u.total, '') + cell('Completed', u.done, 'good') + cell('Unloaded', u.unloaded, '') + cell('Loaded', u.done + ' / ' + u.total, '') +
          cell('Loading', u.loading, '') + cell('Waiting', u.waiting, '') + cell('Pickups', u.pickups, u.pickups ? 'bad' : '') + cell('Maintenance', u.issues, u.issues ? 'warn' : '') + '</div>' +
          '<div class="co-recent"><h3>Recent Activity</h3>' + act('Route Being Loaded', u.loadingRow, u.loadingRow && P.clock(u.loadingRow.startedAt)) +
          act('Last Route Loaded', u.lastRow, u.lastRow && P.clock(u.lastRow.completedAt)) + act('Next in Line', u.nextRow, u.nextRow && P.timeOfDay(u.nextRow.dispatchTime)) + '</div>' +
          '<footer><span>&#128666; Next Loadout <b>' + escapeHtml(u.nextRow ? P.timeOfDay(u.nextRow.dispatchTime) || '--:--' : '--:--') + '</b></span><a href="' + href + '">View Details &rarr;</a></footer></div>';
      }).join('');
    }
    // Picking a plant opens that plant's home (all its cards).
    document.getElementById('plants').addEventListener('click', e => { const a = e.target.closest('[data-plant]'); if (a) try { sessionStorage.setItem('udPlant', a.dataset.plant); } catch (x) { /* no storage */ } });
    try { sessionStorage.removeItem('udPlant'); } catch (e) { /* no storage */ }

    requireSignIn(async (user) => {
      document.getElementById('today').textContent = L.dayName(date) + ' ' + shortDate(date);
      const { db, dbOf } = await start();
      const fail = (what) => e => showError('Could not read ' + what + ' (' + e.message + '). Check the network and reload the page.');
      const unsubs = [];
      let watching = '';
      // Each working plant the person has, from its own database (Uniontown's is the first one, as before).
      const watch = () => {
        date = today();
        // The header rolls with the operating day (6 a.m.), with the numbers.
        document.getElementById('today').textContent = L.dayName(date) + ' ' + shortDate(date);
        const mine = L.PLANTS.filter(p => live(p) && L.plantsFor(person).indexOf(p.id) >= 0);
        const key = date + '|' + mine.map(p => p.id).join(',');
        if (key === watching) return;
        watching = key;
        unsubs.splice(0).forEach(u => u());
        const weeks = [...new Set(L.weeksForLoadDate(date).concat(L.weeksForLoadDate(L.addDays(date, -1)), [L.weekStart(date)]))];
        mine.forEach(p => {
          const pdb = dbOf(p.id), data = dataOf(p.id), at = (what) => fail(p.name + "'s " + what);
          // Review item 73 (Joe 10/13): Home counts open write-ups only, so it reads only those not finished or removed (the
          // finished ones are what grows every day); the Maintenance number stays the same.
          unsubs.push(onSnapshot(query(collection(pdb, 'maintenance'), where('status', 'not-in', ['COMPLETE', 'COMPLETED', 'CLOSED', 'RESOLVED', 'REPAIRED', 'REMOVED'])), s => { data.maintenance = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); render(); }, at('maintenance list')));
          unsubs.push(onSnapshot(query(collection(pdb, 'runs'), where('weekStart', 'in', weeks)), s => { data.runs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, at('loads')));
          unsubs.push(onSnapshot(query(collection(pdb, 'plantJournal'), where('date', 'in', [L.addDays(date, -1), date])), s => { data.journal = s.docs.map(d => d.data()); render(); }, at('plant journal')));
          unsubs.push(onSnapshot(query(collection(pdb, 'pickups'), where('date', 'in', [L.addDays(date, -1), date, L.addDays(date, 1)])), s => { data.pickups = s.docs.map(d => d.data()); render(); }, at('pickups')));
        });
      };
      watchPerson(db, user, p => { person = p; ready = true; watch(); render(); }, { withEmail: true, onError: fail('your user record') });
      setInterval(() => { if (person) watch(); render(); }, 60000);
    });
  </script>
</body>
</html>
