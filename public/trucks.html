<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Trucks Today · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/issues.css">
  <script src="js/logic.js"></script>
</head>
<body class="fill issues-page trucks-page">
  <div class="signin" id="signin" hidden>
    <h1>Trucks Today</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Trucks Today</h1><small id="sub">From Verizon Connect Fleet</small></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="today" aria-selected="true">Today's Routes</button>
        <button type="button" role="tab" data-mode="units" aria-selected="false">All Fleet Units</button>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="kpis" id="kpis"></div>
      <div class="sheet scroll-list" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, showError, shortDate } from './js/app.js';
    import { watchLists, lists } from './js/edit.js';
    import { collection, doc, onSnapshot, query, where } from './js/firebase.js';
    import { NO_SIGNAL_MINUTES, unitKey, gpsIndex, truckState, workingToday } from './js/gps-state.js';

    // Trucks Today (the current app's screen A, Joe 10/9): every route on today's Daily Dispatch with where its truck is now,
    // read from Verizon Connect Fleet every 5 minutes (functions/src/fleetgps.js) and its miles today (every 15 minutes).
    const L = window.UDLogic;
    let mode = 'today', runs = [], gps = [], days = [], alerts = [], routeSleeper = {}, temps = {};
    // Equipment Master location ("CHARLESTON") or plant (fac_martins_ferry), written as a name: Charleston, Martins Ferry.
    const nameCase = (s) => String(s || '').replace(/_/g, ' ').trim().toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase());
    const homeOf = (e) => nameCase(e.location) || nameCase(String(e.facilityId || '').replace(/^fac_/, ''));
    const opened = new Set(); // Alerts drop-downs left open, by Daily Dispatch line (kept through the 1-minute redraw)
    // Where each unit is now: js/gps-state.js (shared with the Route Distribution home's Manager card).
    const key = unitKey, index = () => gpsIndex(gps), state = truckState;
    const nyDate = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
    const clock = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }) : ''; };
    const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return isNaN(m) ? '' : m < 1 ? 'now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min ago' : (m < 2880 ? '1 day ago' : Math.floor(m / 1440) + ' days ago'); };
    const timeOfDay = (min) => min === null || min === undefined || min === '' ? '' : L.timeText(min);

    // Fleet sends an address as "US|15401|Pennsylvania|Uniontown|Union St": shown as "Union St, Uniontown, PA 15401".
    const STATES = { ALABAMA: 'AL', ALASKA: 'AK', ARIZONA: 'AZ', ARKANSAS: 'AR', CALIFORNIA: 'CA', COLORADO: 'CO', CONNECTICUT: 'CT', DELAWARE: 'DE', 'DISTRICT OF COLUMBIA': 'DC', FLORIDA: 'FL', GEORGIA: 'GA', HAWAII: 'HI', IDAHO: 'ID', ILLINOIS: 'IL', INDIANA: 'IN', IOWA: 'IA', KANSAS: 'KS', KENTUCKY: 'KY', LOUISIANA: 'LA', MAINE: 'ME', MARYLAND: 'MD', MASSACHUSETTS: 'MA', MICHIGAN: 'MI', MINNESOTA: 'MN', MISSISSIPPI: 'MS', MISSOURI: 'MO', MONTANA: 'MT', NEBRASKA: 'NE', NEVADA: 'NV', 'NEW HAMPSHIRE': 'NH', 'NEW JERSEY': 'NJ', 'NEW MEXICO': 'NM', 'NEW YORK': 'NY', 'NORTH CAROLINA': 'NC', 'NORTH DAKOTA': 'ND', OHIO: 'OH', OKLAHOMA: 'OK', OREGON: 'OR', PENNSYLVANIA: 'PA', 'RHODE ISLAND': 'RI', 'SOUTH CAROLINA': 'SC', 'SOUTH DAKOTA': 'SD', TENNESSEE: 'TN', TEXAS: 'TX', UTAH: 'UT', VERMONT: 'VT', VIRGINIA: 'VA', WASHINGTON: 'WA', 'WEST VIRGINIA': 'WV', WISCONSIN: 'WI', WYOMING: 'WY' };
    function address(a) {
      const p = String(a || '').split('|').map(x => x.trim());
      if (p.length < 4) return String(a || '');
      const [, zip, state, city, ...street] = p, st = STATES[String(state).toUpperCase()] || state;
      return [street.join(' ').trim(), city, (st + ' ' + zip).trim()].filter(Boolean).join(', ');
    }
    const placeCell = (t) => { if (!t) return ''; const a = address(t.address); return escapeHtml(t.place || a) + (t.place && a ? '<small>' + escapeHtml(a) + '</small>' : ''); };
    // Today's miles and first move count from the app's first read that day; when that read came after the morning (the day
    // GPS was turned on) they say so instead of showing a first move that looks wrong.
    const late = (d) => { if (!d || !d.since) return false; const h = Number(new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: 'numeric', hourCycle: 'h23' }).format(new Date(d.since))); return h >= 5; };
    const firstMoveCell = (d) => !d ? '' : late(d) ? (d.firstMove && Date.parse(d.firstMove) - Date.parse(d.since) > 15 * 60000 ? clock(d.firstMove) : '<small>before ' + clock(d.since) + '</small>') : d.firstMove ? clock(d.firstMove) : '';
    const milesCell = (d) => !d ? '' : (Number(d.miles) || 0).toLocaleString() + (late(d) ? '<small>since ' + clock(d.since) + '</small>' : '');
    // Joe 10/14 (mock-up B): everything Verizon sent today for the driver's truck, in time order, with the yard leave and return.
    const ALERT_NAMES = { SPEEDING: 'Speeding', HARSH_BRAKING: 'Harsh braking', HARSH_ACCEL: 'Harsh acceleration', HARSH_TURN: 'Harsh cornering', IDLE: 'Excessive idling',
      SEATBELT: 'Seatbelt', FAULT: 'Engine code', DVIR_FAILED: 'DVIR failed', HOS: 'Hours of service' };
    function alertName(a) {
      const c = String(a.condition || '').trim();
      if (a.type === 'SPEEDING' && /\b80\b/.test(c)) return 'Speeding over 80';
      if (a.type === 'HOS' && c) return 'Hours of service · ' + c;
      return ALERT_NAMES[a.type] || c || 'Alert';
    }
    function alertDetail(a) {
      if (a.type === 'SPEEDING' && a.speedMph) return Math.round(a.speedMph) + (a.limitMph ? ' in a ' + Math.round(a.limitMph) : '') + ' mph';
      if (a.type === 'IDLE' && a.minutes) return a.minutes + ' min';
      if (a.type === 'FAULT' && a.code) return a.code + (a.fmiText ? ' · ' + a.fmiText : '');
      if (a.type === 'SEATBELT' && a.speedMph) return 'at ' + Math.round(a.speedMph) + ' mph';
      return '';
    }
    function events(t, trip, today) {
      const list = t ? alerts.filter(a => key(a.tag) === key(t.tag)).map(a => ({ at: a.at, name: alertName(a), detail: alertDetail(a), where: a.place || address(a.address), alert: true })) : [];
      if (trip.out) list.push({ at: trip.out, name: 'Left the yard' + (nyDate(new Date(trip.out)) !== today ? ' ' + shortDate(nyDate(new Date(trip.out))) : ''), detail: '', where: '' });
      if (trip.back) list.push({ at: trip.back, name: 'Back in the yard', detail: '', where: '' });
      return list.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    }
    // Joe 10/14: Time out (in place of the route) = from leaving the yard until back in it, or until now while still out. A
    // sleeper route (e.g. Jersey) leaves one day and comes back the next, so it counts from the day it left, across midnight.
    // Fleet keeps each New York day's first yard leave (yardOut) and last return (yardIn) per truck (gpsDays).
    function tripOf(r, t, dayBy, today) {
      if (!t) return {};
      const k = key(t.tag), dLeft = dayBy[r.leaves + '|' + k], dNow = r.leaves === today ? dLeft : dayBy[today + '|' + k];
      const out = dLeft && dLeft.yardOut;
      if (!out) return {};
      const back = [dLeft.yardIn, dNow && dNow.yardIn].filter(x => x && x > out).sort()[0] || '';
      return { out, back };
    }
    function span(trip) {
      if (!trip.out) return '';
      const m = Math.max(0, Math.round(((trip.back ? Date.parse(trip.back) : Date.now()) - Date.parse(trip.out)) / 60000));
      return (m >= 60 ? Math.floor(m / 60) + ' h ' : '') + (m % 60) + ' m';
    }
    const tripCell = (trip, today) => !trip.out ? '<small>not out yet</small>' : span(trip) + '<small>' + (trip.back ? 'back ' + clock(trip.back)
      : nyDate(new Date(trip.out)) !== today ? 'since yesterday' : 'still out') + '</small>';
    const pill = (s) => '<span class="tt-pill tt-' + s[0] + '">' + s[1] + '</span>';

    function render() {
      const find = index(), today = nyDate(new Date());
      const dayBy = {}; days.forEach(d => { dayBy[d.date + '|' + key(d.tag)] = d; });
      const sheet = document.getElementById('sheet'), kpis = document.getElementById('kpis'), foot = document.getElementById('foot');
      const newest = gps.reduce((m, t) => t.updatedAt > m ? t.updatedAt : m, '');
      document.getElementById('sub').textContent = 'From Verizon Connect Fleet · ' + shortDate(today) + (newest ? ' · read ' + clock(newest) : ' · not read yet');
      document.querySelectorAll('.tabs [data-mode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
      if (!gps.length) {
        kpis.innerHTML = '';
        sheet.innerHTML = '<div class="empty">No GPS data yet. A manager saves the Verizon Connect Fleet login in <a href="gps.html">GPS Setup</a>, presses Test connection, then Pull now.</div>';
        foot.textContent = '';
        return;
      }
      if (mode === 'today') {
        const rows = workingToday(L, runs, today, { sleeper: (r, run, day) => !!(day.sleeper || run.sleeper || routeSleeper[r.runId]) });
        // Joe 10/14: a driver with two runs on the same truck (RUGG, DONALD: 855 at 8:00 AM, 856 at 3:00 PM) is one line with
        // both dispatch times, so his truck's miles, alerts and time out count once (and once in the counts above).
        const groups = [], byKey = {};
        rows.forEach(r => { const tk = String(r.truck || '').trim(), k = tk ? String(r.driver || '').trim().toUpperCase() + '|' + key(tk) : r.id;
          if (byKey[k]) byKey[k].push(r); else groups.push(byKey[k] = [r]); });
        const list = groups.map(g => { const r = g[0], t = String(r.truck || '').trim() ? find(r.truck) : null, d = t ? dayBy[today + '|' + key(t.tag)] : null, s = state(t, r.truck);
          let trip = tripOf(r, t, dayBy, today);
          if (trip.back && (s[0] === 'road' || s[0] === 'stopped')) trip = { out: trip.out }; // back once, out again on the next run
          const ev = events(t, trip, today); return { r, g, t, s, d, trip, ev, n: ev.filter(e => e.alert).length, open: opened.has(r.id) }; });
        const count = (k) => list.filter(x => x.s[0] === k).length;
        kpis.innerHTML = [['Dispatched today', list.length], ['Driving', count('road')], ['Stopped or parked', count('stopped')], ['In yard', count('yard')], ['No signal', count('nosignal')], ['Not in Fleet', count('nogps')], ['No truck', count('notruck')]]
          .map(k => '<div><b>' + k[1] + '</b><span>' + k[0] + '</span></div>').join('');
        // Joe 10/13: the driver and the truck are evaluated together (the driver Daily Dispatch put on that truck), so they
        // lead; then the time out on the route (in place of the route number) and the Alerts drop-down (Joe 10/14, mock-up B).
        sheet.innerHTML = '<table class="issues tt-board"><colgroup><col style="width:13%"><col style="width:7%"><col style="width:9%"><col style="width:18%"><col style="width:9%"><col style="width:9%"><col style="width:7%"><col style="width:11%"><col style="width:10%"><col style="width:7%"></colgroup>' +
          '<thead><tr><th>Driver</th><th>Truck</th><th>Status</th><th>Where now</th><th>Miles today</th><th>First move</th><th>Dispatch</th><th>Last report</th><th>Time out</th><th>Alerts</th></tr></thead><tbody>' +
          (list.map(x => '<tr class="tt-' + x.s[0] + '"><td class="strong">' + escapeHtml(x.r.driver || '') + '</td><td class="strong">' + escapeHtml(x.r.truck || '') + '</td>' +
            '<td>' + pill(x.s) + '</td><td>' + placeCell(x.t) + '</td><td>' + milesCell(x.d) + '</td><td>' + firstMoveCell(x.d) + '</td>' +
            '<td>' + x.g.map(r => escapeHtml(timeOfDay(r.dispatchTime))).filter(Boolean).join('<br>') + '</td><td>' + (x.t && x.t.lastReport ? clock(x.t.lastReport) + '<small>' + ago(x.t.lastReport) + '</small>' : '') + '</td><td>' + tripCell(x.trip, today) + '</td>' +
            '<td><button type="button" class="tt-alerts' + (x.n ? ' has' : '') + '" data-open="' + escapeHtml(x.r.id) + '" aria-expanded="' + x.open + '" title="What Verizon sent today for this driver\'s truck">' + x.n + (x.open ? ' ▴' : ' ▾') + '</button></td></tr>' +
            (x.open ? '<tr class="tt-events"><td colspan="10">' + (x.ev.length ? '<table><thead><tr><th>Time</th><th>Verizon</th><th>Detail</th><th>Where</th></tr></thead><tbody>' +
              x.ev.map(e => '<tr><td>' + clock(e.at) + '</td><td>' + escapeHtml(e.name) + '</td><td>' + escapeHtml(e.detail) + '</td><td>' + escapeHtml(e.where) + '</td></tr>').join('') + '</tbody></table>'
              : '<div class="tt-none">' + (x.t ? 'Nothing from Verizon yet today for truck ' + escapeHtml(x.t.tag) + '.' : 'No Fleet truck on this line, so no Verizon alerts.') + '</div>') + '</td></tr>' : '')).join('') ||
            '<tr><td colspan="10" class="empty">No Daily Dispatch runs leave with one of our drivers on ' + escapeHtml(shortDate(today)) + '.</td></tr>') + '</tbody></table>';
        foot.textContent = 'In yard = at the Fleet place Uniontown Branch, Uniontown Plant or Loading Dock · Parked = engine off elsewhere · No signal = engine on and no report for ' + NO_SIGNAL_MINUTES + ' minutes, or nothing for a day · Not in Fleet = Fleet has no unit with that number · miles and first move come from the odometer, read every 5 minutes · a driver with two runs on one truck is one line with both dispatch times · Time out = from the first yard leave until back, or until now; a sleeper route counts from the day it left · Alerts = Verizon Fleet alerts today for that truck; click the number to see them with the yard leave and return times.';
        return;
      }
      // All Fleet units, matched to Equipment Master's trucks and trailers at every plant (Joe 10/20: Charleston's and Martins
      // Ferry's read "not in Equipment" when only Uniontown's were matched). A trailer written "935" in Equipment Master is
      // Fleet's T-935. Location = the unit's Equipment Master location (else its plant).
      const ours = {};
      (lists.equipmentAll || []).forEach(e => {
        const type = e.type === 'TRUCK' ? 'Truck' : e.type === 'TRAILER' ? 'Trailer' : '';
        if (!type) return;
        const k = key(e.unit), v = { type, where: homeOf(e) };
        if (k && !ours[k]) ours[k] = v;
        if (type === 'Trailer' && /^\d+$/.test(k) && !ours['T' + k]) ours['T' + k] = v;
      });
      const units = gps.slice().sort((a, b) => String(a.tag).localeCompare(String(b.tag), undefined, { numeric: true }))
        .map(t => { const o = ours[key(t.tag)] || null; return { t, ours: o ? o.type : '', where: o ? o.where : '', s: state(t, t.tag), d: dayBy[key(t.tag)], temp: (temps[t.tag] || temps[key(t.tag)] || null) }; });
      const matched = units.filter(u => u.ours).length;
      kpis.innerHTML = [['Fleet units', units.length], ['Our trucks', units.filter(u => u.ours === 'Truck').length], ['Our trailers', units.filter(u => u.ours === 'Trailer').length],
        ['Other units', units.length - matched], ['Reported today', units.filter(u => u.t.lastReport && nyDate(new Date(u.t.lastReport)) === today).length], ['No signal', units.filter(u => u.s[0] === 'nosignal').length]]
        .map(k => '<div><b>' + k[1] + '</b><span>' + k[0] + '</span></div>').join('');
      // Joe 10/20: the trailer's temperature from the GPS in place of Last report; rows one line where they fit.
      const tempCell = (x) => !x || x.tempF === null || x.tempF === undefined ? '' : '<span title="' + escapeHtml('GPS reading ' + clock(x.at) + ', ' + ago(x.at)) + '">' + escapeHtml(String(Math.round(x.tempF * 10) / 10)) + '°</span>';
      const whereLine = (t) => { const a = address(t.address); return escapeHtml(t.place && a ? t.place + ' · ' + a : t.place || a); };
      sheet.innerHTML = '<table class="issues tt-board tt-units"><colgroup><col style="width:8%"><col style="width:10%"><col style="width:12%"><col style="width:9%"><col style="width:30%"><col style="width:8%"><col style="width:8%"><col style="width:8%"><col style="width:7%"></colgroup>' +
        '<thead><tr><th>Fleet unit</th><th>Location</th><th>Ours</th><th>Status</th><th>Where now</th><th>Temp (°F)</th><th>Miles today</th><th>Odometer</th><th>Engine hours</th></tr></thead><tbody>' +
        units.map(u => '<tr class="tt-' + u.s[0] + '"><td class="strong">' + escapeHtml(u.t.tag) + '</td><td>' + escapeHtml(u.where) + '</td><td>' + (u.ours || '<span class="tt-muted">not in Equipment</span>') + '</td><td>' + pill(u.s) + '</td>' +
          '<td class="tt-where" title="' + escapeHtml(u.t.lastReport ? 'Last report ' + ago(u.t.lastReport) : '') + '">' + whereLine(u.t) + '</td><td>' + tempCell(u.temp) + '</td>' +
          '<td>' + milesCell(u.d) + '</td><td>' + (u.t.odometerMiles != null ? Math.round(u.t.odometerMiles).toLocaleString() : '') + '</td><td>' + (u.t.engineHours != null ? Math.round(u.t.engineHours).toLocaleString() : '') + '</td></tr>').join('') +
        '</tbody></table>';
      foot.textContent = 'Every unit Verizon Connect Fleet shows, all plants. Location is the plant Equipment Master lists. Temp is the trailer\'s GPS temperature when Fleet sends one. Hold the mouse on Where now for the last report.';
    }

    document.getElementById('sheet').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; const k = b.dataset.open; if (opened.has(k)) opened.delete(k); else opened.add(k); render(); });
    document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; render(); } });
    window.udBack = () => { if (mode !== 'today') { mode = 'today'; render(); return true; } return false; };
    setInterval(render, 60000); // "min ago" stays true between reads

    requireSignIn(async (user) => {
      const { db } = await start();
      watchLists(user, render);
      const NAMES = { runs: 'the dispatch runs', gpsTrucks: 'the GPS positions', gpsDays: 'the GPS miles', gpsAlerts: 'the Verizon alerts', routes: 'Route Master' };
      const watch = (name, set, q) => onSnapshot(q || collection(db, name), s => { set(s.docs.map(d => Object.assign({ id: d.id }, d.data()))); render(); }, e => showError('Could not read ' + NAMES[name] + ' (' + e.message + '). Check the network and reload the page.'));
      watch('gpsTrucks', v => { gps = v; });
      // Joe 10/20: the trailers' GPS temperatures (functions/src/fleetgps.js pullTemps), one record for every trailer.
      onSnapshot(doc(db, 'gpsTemps', 'now'), s => { temps = (s.exists() && s.data().units) || {}; render(); }, () => {});
      watch('routes', v => { routeSleeper = {}; v.forEach(r => { if (r.sleeper) routeSleeper[r.id] = true; }); });
      // Joe 10/18: only the days this screen uses, read again when the day changes (it was every run ever). workingToday
      // looks at loads from 3 days ago to tomorrow, and a load delivers 0 to 6 days after it loads, so those load dates' weeks.
      let watchedDay = '', stops = [];
      const watchDay = () => {
        const today = nyDate(new Date());
        if (today === watchedDay) return;
        watchedDay = today; stops.forEach(f => f());
        const weeks = [...new Set([-3, -2, -1, 0, 1].flatMap(n => L.weeksForLoadDate(L.addDays(today, n))))];
        stops = [watch('runs', v => { runs = v; }, query(collection(db, 'runs'), where('weekStart', 'in', weeks))),
          // Today's and yesterday's miles and yard times (the collection keeps every day); yesterday is for sleepers still out.
          watch('gpsDays', v => { days = v; }, query(collection(db, 'gpsDays'), where('date', 'in', [L.addDays(today, -1), today]))),
          watch('gpsAlerts', v => { alerts = v; }, query(collection(db, 'gpsAlerts'), where('date', '==', today)))];
      };
      watchDay(); setInterval(watchDay, 60000);
    });
  </script>
</body>
</html>
