<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Over the Road · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/otr.css">
  <script src="js/logic.js"></script>
  <script src="js/otr-core.js"></script>
</head>
<body class="fill issues-page otr-page">
  <div class="signin" id="signin" hidden>
    <h1>Over the Road</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Over the Road Runs</h1><small id="sub">OTR report and cost per gallon</small></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-view="dash" aria-selected="true">Today</button>
        <button type="button" role="tab" data-view="bydate" aria-selected="false">By Date</button>
        <button type="button" role="tab" data-view="figures" aria-selected="false">Recap</button>
        <button type="button" role="tab" data-view="report" aria-selected="false">Month Recap</button>
        <button type="button" role="tab" data-view="cpg" aria-selected="false">Cost Per Gallon</button>
        <button type="button" role="tab" data-view="routes" aria-selected="false">OTR Routes Setup</button>
      </div>
      <!-- Joe 10/13: the import button sits in the tab row, on the far right, where it is seen. -->
      <div class="actions in-head otr-head-act" id="head-act"></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="actions" id="bar" data-top></div>
      <div class="sheet scroll-list" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, showError, save } from './js/app.js';
    import { watchLists, forScreen, modeLabel, canManage, saveOptimistic, lists } from './js/edit.js';
    import { collection, onSnapshot, query, where } from './js/firebase.js';

    // The current app's Over the Road module (OverTheRoad.html, 221/222_V7276): every run of a route ticked for the report is one
    // mark for its destination on its delivery day. Counts come from the copied Live weeks; a count typed by hand wins.
    forScreen('otr');
    const L = window.UDLogic, O = window.UDOtr, CORE = O.OTR_CORE;
    const q = new URLSearchParams(location.search);
    // Joe 10/11: the tabs are his OTR Trips workbook's four sheets (By Date, Recap, Month Recap, Cost Per Gallon), each laid out
    // like the sheet, with the year-to-date answers and a trend picture on top (his pick B).
    let view = ['dash', 'bydate', 'figures', 'report', 'cpg', 'routes'].indexOf(q.get('view')) >= 0 ? q.get('view') : 'dash';
    let compareLY = (() => { try { return localStorage.getItem('otrCompareLY') === '1'; } catch (e) { return false; } })();
    let routes = [], picks = {}, pendingRoutes = {}, extraCols = [], colPanel = false, colFor = '', renaming = '', milesFor = '', pendingMiles = {}, runs = [], daily = [], monthly = [], monthRuns = [], comments = [], year = Number(L.operatingDay(new Date()).slice(0, 4)), copied = '';
    let ym = L.operatingDay(new Date()).slice(0, 7);
    const money = (v) => v == null ? '' : '$' + Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
    const cents = (v) => v == null ? '–' : '$' + Number(v).toFixed(3);
    const n0 = (v) => v == null ? '' : Number(v).toLocaleString();
    // Joe 10/13: money in the Recap boxes reads $732,421.45; gallons and other counts get commas.
    const dollars = (v) => v == null || v === '' || !Number.isFinite(Number(v)) ? '' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const commas = (v) => v == null || v === '' || !Number.isFinite(Number(v)) ? '' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });

    // Joe 10/10: the run is the destination; the setup only says who takes it (a carrier picks it up, or United Dairy delivers).
    // Joe 10/18: a third kind, Transfer (a load to another branch or plant); Month Recap groups its trips by these.
    const DELIVERED_BY = ['Carrier Pickup', 'United Dairy Delivered', 'Transfer'];
    const RECAP_GROUPS = [['United Dairy Delivered', 'Uniontown Delivered'], ['Transfer', 'Transfers'], ['Carrier Pickup', 'Carriers']];
    // Joe 10/13: By Date columns of his own (an outside carrier such as Darden) come after the workbook's, in the order added.
    const DESTS = () => CORE.DESTINATIONS.concat(extraCols.map(c => c.name).filter(n => CORE.DESTINATIONS.indexOf(n) < 0));
    function otrRoutes() {
      return O.otrRouteList_(routes.filter(r => L.masterActive(r)).map(r => {
        const p = picks[r.id] || {}, miles = {};
        L.DAYS.forEach(d => { miles[d] = r.days && r.days[d] ? r.days[d].miles : ''; });
        // The By Date column the run counts in: picked in OTR Routes Setup, else the column named like the run ("PECK" counts as Peck).
        const named = O.otrNormDest_(r.run);
        return { runId: r.id, route: r.route, run: r.run, include: p.include ? 'TRUE' : '', destination: p.destination || (DESTS().indexOf(named) >= 0 ? named : ''), miles, days: r.days || {} };
      })).map(x => Object.assign(x, { deliveredBy: (picks[x.runId] || {}).deliveredBy || '' }));
    }
    // Each date in the copied Live weeks, counted the current app's way (otrCountDay_).
    function liveCounts(list) {
      const byDate = {};
      runs.forEach(run => L.DAYS.forEach((p, i) => {
        const day = run.days && run.days[p]; if (!day) return;
        const date = L.addDays(run.weekStart, i);
        (byDate[date] = byDate[date] || []).push({ runId: run.runId, route: run.route, run: run.run, routeStatus: run.routeStatus, active: run.active === false ? 'FALSE' : '', runs: day.runs ? 'TRUE' : '', driver: day.driver || '', truck: day.tractor || day.truck || '', dispatchTime: day.dispatchTime || '' });
      }));
      const out = {};
      Object.keys(byDate).forEach(d => { out[d] = O.otrCountDay_(d, byDate[d], list); });
      return out;
    }

    // Replacing the page can blur a typed box, whose save asks for a redraw while this one is still running: that one waits its turn.
    let painting = false, again = false;
    // A box being typed in keeps its place, and its typing, when the page redraws (data-fk names it).
    function render() {
      needDays();
      if (painting) { again = true; return; }
      painting = true;
      const a = document.activeElement, fk = a && a.dataset && a.dataset.fk, typed = fk ? a.value : null;
      try { paint(); } finally { painting = false; }
      if (fk) { const b = document.querySelector('[data-fk="' + CSS.escape(fk) + '"]'); if (b) { if (b.value !== typed) b.value = typed; b.focus(); } }
      if (again) { again = false; render(); }
    }
    function paint() {
      const list = otrRoutes(), live = liveCounts(list), merged = O.otrMergeDaily_(daily, live), today = L.operatingDay(new Date());
      const todayCount = live[today] || { date: today, total: 0, byDestination: {}, runs: [] };
      const byRun = {}, byDest = {};
      list.forEach(r => { byRun[r.route + '|' + r.run] = r.deliveredBy; if (r.include && r.deliveredBy) { const c = byDest[r.destination] = byDest[r.destination] || {}; c[r.deliveredBy] = (c[r.deliveredBy] || 0) + 1; } });
      const edit = canManage();
      { const ml = modeLabel(edit ? '' : 'View only'); document.getElementById('sub').textContent = (ml ? ml.charAt(0) + ml.slice(1).toLowerCase() + ' · ' : '') + 'Counts from the dispatch sheet'; }
      document.querySelectorAll('.tabs [data-view]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === view)));
      document.getElementById('head-act').innerHTML = view === 'bydate' ? importBar('Import Workbook') : view === 'figures' ? importBar('Import From Accounting') : '';
      const bar = document.getElementById('bar'), sheet = document.getElementById('sheet'), foot = document.getElementById('foot');
      if (view === 'dash') {
        const dash = O.otrDashboard_(today, merged, todayCount, monthly), c = dash.costPerGallon;
        bar.innerHTML = '<span class="hint">' + escapeHtml(dash.todayLabel) + ' · ' + dash.monthToDate + ' OTR runs in ' + escapeHtml(dash.monthLabel) + '</span><span class="spacer"></span>' + (copied ? '<span class="hint">' + escapeHtml(copied) + '</span>' : '') +
          '<button type="button" id="copy">Copy Daily Count</button>';
        // Review item 16 (Joe 10/13): no Month Recap and OTR Routes Setup buttons here; both are tabs right above.
        sheet.innerHTML = '<div class="otr-dash"><section class="otr-card"><h2>Today</h2><div class="otr-big">' + todayCount.total + '</div><p>OTR runs today</p>' +
          '<table class="issues"><thead><tr><th>Route</th><th>Run</th><th>Delivered By</th><th>Driver</th></tr></thead><tbody>' + (todayCount.runs.map(r => '<tr><td class="strong">' + escapeHtml(r.route) + '</td><td>' + escapeHtml(r.run) + '</td><td>' + escapeHtml(byRun[r.route + '|' + r.run] || '') + '</td><td>' + escapeHtml(r.driver) + '</td></tr>').join('') || '<tr><td colspan="4" class="empty">No OTR runs today' + (list.some(r => r.include) ? '' : ': tick routes in OTR Routes Setup') + '.</td></tr>') + '</tbody></table></section>' +
          '<section class="otr-card"><h2>Cost Per Gallon' + (c ? ' · ' + escapeHtml(c.label) : '') + '</h2><div class="otr-big">' + (c ? cents(c.cpg) : '–') + '</div><p>' + (c ? (c.lastYearCpg != null ? 'Last year ' + cents(c.lastYearCpg) : 'No figures for last year') + (c.employeeCpg != null ? ' · Employee ' + cents(c.employeeCpg) : '') + (c.fuelCpg != null ? ' · Fuel ' + cents(c.fuelCpg) : '') : 'Type a month\'s delivery cost and gallons in Recap') + '</p>' +
          '<button type="button" data-go="figures">Enter Month Figures</button></section>' +
          '<section class="otr-card wide"><h2>This Week</h2><div class="otr-week">' + dash.week.map(d => '<div class="' + (d.today ? 'today' : '') + '"><b>' + d.day + '</b><small>' + d.label + '</small><span>' + (d.total == null ? '–' : d.total) + '</span></div>').join('') + '</div></section></div>';
        foot.textContent = list.filter(r => r.include).length + ' runs ticked for the report · counts for days outside the copied Live weeks come from typed fixes or imports.';
        document.getElementById('copy').onclick = async () => { const t = O.otrDailyCountText_(todayCount); try { await navigator.clipboard.writeText(t); copied = 'Copied: ' + t; } catch (e) { copied = t; } render(); };
      } else if (view === 'bydate') {
        // The By Date tab: a row a day, a column for each of the workbook's destinations, a Total and the Comment.
        const [yy, mm] = ym.split('-').map(Number), last = new Date(yy, mm, 0).getDate(), first = firstMonth(), dis = edit ? '' : ' disabled';
        const months = []; for (let k = today.slice(0, 7); k >= first; k = prevMonth(k)) months.push(k);
        if (months.indexOf(ym) < 0) months.push(ym);
        const keys = []; for (let d = 1; d <= last; d++) keys.push(O.otrDateKey_(yy, mm, d));
        const extra = []; keys.forEach(k => Object.keys(merged[k] || {}).forEach(n => { if (DESTS().indexOf(n) < 0 && extra.indexOf(n) < 0 && merged[k][n]) extra.push(n); }));
        const cols = DESTS().concat(extra), note = {}, tot = cols.map(() => 0);
        comments.forEach(c => { if (c.date && c.date.slice(0, 7) === ym) note[c.date] = c.text || ''; });
        const monthTotal = (k) => Object.keys(merged).reduce((s, d) => d.slice(0, 7) === k && d <= today ? s + O.otrSum_(Object.values(merged[d])) : s, 0);
        const lastYear = (yy - 1) + '-' + String(mm).padStart(2, '0'), shownTotal = monthTotal(ym), lyTotal = monthTotal(lastYear);
        bar.innerHTML = '<select id="ym" aria-label="Month">' + months.map(k => '<option value="' + k + '"' + (k === ym ? ' selected' : '') + '>' + monthLabel(k) + '</option>').join('') + '</select>' +
          '<span class="hint">Today\'s row fills from the dispatch board. Type a number to fix a day; it saves by itself.</span><span class="spacer"></span>' + importHint() + '<button type="button" id="print-sheet-otr">Print</button>';
        const rows = keys.map(k => {
          const v = merged[k] || {}, future = k > today, sum = O.otrSum_(cols.map(n => v[n] || 0));
          cols.forEach((n, i) => { tot[i] += v[n] || 0; });
          const cells = cols.map(n => {
            const x = v[n] || 0;
            if (!edit || future || DESTS().indexOf(n) < 0) return '<td class="' + (x ? '' : 'z') + '">' + (x || '') + '</td>';
            return '<td><input class="otr-day" inputmode="numeric" data-fk="d|' + k + '|' + escapeHtml(n) + '" data-date="' + k + '" data-dest="' + escapeHtml(n) + '" value="' + (x || '') + '" aria-label="' + escapeHtml(n + ' ' + O.otrShortDate_(k)) + '"></td>';
          }).join('');
          return '<tr class="' + (O.otrWeekday_(k) === 0 && k.slice(8) !== '01' ? 'wk ' : '') + (k === today ? 'today' : '') + '"><td class="l"><b>' + ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][O.otrWeekday_(k)] + '</b> ' + dash(k) + '</td>' + cells +
            '<td class="strong">' + (future && !sum ? '' : sum) + '</td><td class="l note">' + (edit ? '<input class="otr-note" data-fk="n|' + k + '" data-date="' + k + '" value="' + escapeHtml(note[k] || '') + '" aria-label="Comment ' + O.otrShortDate_(k) + '"' + dis + '>' : escapeHtml(note[k] || '')) + '</td></tr>';
        }).join('');
        sheet.innerHTML = importPreview() + '<div id="otr-sheet-print">' + cardRow([
          card(monthLabel(ym) + (ym === today.slice(0, 7) ? ' so far' : ''), n0(shownTotal), 'vs ' + n0(lyTotal) + ' in ' + monthLabel(lastYear), chg(shownTotal - lyTotal, n0, false)),
          card('Busiest this month', (cols.map((n, i) => [n, tot[i]]).filter(x => x[1]).sort((a, b) => b[1] - a[1])[0] || ['–'])[0], '')]) +
          '<h2 class="otr-print-title">Over the Road Runs · By Date · ' + monthLabel(ym) + '</h2><table class="otr-sheet otr-bydate"><colgroup><col style="width:124px">' + cols.map(() => '<col>').join('') + '<col style="width:58px"><col style="width:190px"></colgroup><thead><tr><th class="l">Date</th>' +
          cols.map(n => '<th class="vh-th"><span class="vh">' + escapeHtml(n) + '</span></th>').join('') + '<th>Total</th><th class="l">Comment</th></tr></thead><tbody>' + rows +
          '<tr class="tot"><td class="l">' + escapeHtml(monthLabel(ym)) + '</td>' + tot.map(x => '<td>' + x + '</td>').join('') + '<td>' + O.otrSum_(tot) + '</td><td></td></tr></tbody></table></div>';
        foot.textContent = 'Days in the copied Live weeks count from the dispatch board; older days come from your OTR Trips workbook. A typed number wins over both.';
        document.getElementById('ym').onchange = (e) => { ym = e.target.value; render(); };
        wireImport(); wirePrint();
        sheet.querySelectorAll('.otr-day').forEach(inp => { inp.onchange = () => {
          const date = inp.dataset.date, destination = inp.dataset.dest, raw = inp.value.trim(), n = raw === '' ? 0 : Number(raw);
          if (!Number.isInteger(n) || n < 0 || n > 99) { showError('Type a whole number of runs for ' + destination + ' on ' + O.otrShortDate_(date) + '.'); render(); return; }
          showError('');
          let rec = daily.find(x => x.date === date && x.destination === destination); const before = rec ? Object.assign({}, rec) : null;
          saveOptimistic('saveOtr', { op: 'day', date, destination, runs: n },
            () => { if (!rec) { rec = { date, destination }; daily.push(rec); } rec.runs = n; rec.source = 'MANUAL'; },
            () => { if (before) Object.assign(rec, before); else daily.splice(daily.indexOf(rec), 1); }, render);
        }; });
        sheet.querySelectorAll('.otr-note').forEach(inp => { inp.onchange = () => {
          const date = inp.dataset.date, text = inp.value.trim().slice(0, 200);
          let rec = comments.find(x => x.date === date); const before = rec ? Object.assign({}, rec) : null;
          saveOptimistic('saveOtr', { op: 'comment', date, text },
            () => { if (!rec) { rec = { date }; comments.push(rec); } rec.text = text; rec.source = 'MANUAL'; },
            () => { if (before) Object.assign(rec, before); else comments.splice(comments.indexOf(rec), 1); }, render);
        }; });
      } else if (view === 'report') {
        // The Month Recap tab: trips per destination, last December then January to December, this year beside last year.
        const r = O.otrMonthRecap_(year, today, merged, monthRuns, monthly, DESTS()), M = CORE.MONTHS;
        bar.innerHTML = '<button type="button" class="primary" id="print-sheet-otr">Print</button><span class="hint">Counted from By Date, nothing to type. Prints on one landscape page.</span><span class="spacer"></span>' + yearPick([0, -1, -2]);
        const pair = (p, i) => (i ? '<td class="gap"></td>' : '') + '<td class="' + (p[0] === 0 ? 'z' : '') + '">' + (p[0] == null ? '' : p[0]) + '</td><td class="ly">' + (p[1] == null ? '' : p[1]) + '</td>';
        const head = '<tr><th class="l" rowspan="2">Trip</th>' + r.months.map((m, i) => (i ? '<th class="gap" rowspan="2"></th>' : '') + '<th colspan="2">' + m.label + '</th>').join('') + '</tr><tr class="sub">' + r.months.map(m => '<th>' + m.y + '</th><th>' + m.py + '</th>').join('') + '</tr>';
        // Joe 10/18: three groups, each under its own heading and line: Uniontown Delivered, Transfers, Carriers. A trip goes in the
        // group most of its ticked runs are set to in OTR Routes Setup; a trip with none ticked stays with Uniontown Delivered.
        const groupOf = (name) => { const c = byDest[name] || {}; let best = RECAP_GROUPS[0][0]; RECAP_GROUPS.forEach(g => { if ((c[g[0]] || 0) > (c[best] || 0)) best = g[0]; }); return best; };
        const span = 1 + r.months.length * 3 - 1;
        const body = RECAP_GROUPS.map(g => {
          const rows = r.rows.filter(d => groupOf(d.name) === g[0]);
          return '<tr class="grp"><td class="l" colspan="' + span + '">' + g[1] + '</td></tr>' + (rows.length ? rows.map(d => '<tr><td class="l">' + escapeHtml(d.name) + '</td>' + d.cells.map(pair).join('') + '</tr>').join('')
            : '<tr><td class="l empty" colspan="' + span + '">No trips set to ' + escapeHtml(g[0]) + ' in OTR Routes Setup yet.</td></tr>');
        }).join('') +
          '<tr class="tot"><td class="l">Totals</td>' + r.totals.map(pair).join('') + '</tr>' +
          '<tr class="tot"><td class="l">Difference</td>' + r.diff.map((v, i) => (i ? '<td class="gap"></td>' : '') + '<td colspan="2" class="' + (v < 0 ? 'neg' : v > 0 ? 'pos' : '') + '">' + (v == null ? '' : v) + '</td>').join('') + '</tr>';
        const thru = r.ytd.through ? 'Jan to ' + M[r.ytd.through - 1] + ' ' + year : 'No months yet in ' + year;
        sheet.innerHTML = '<div id="otr-sheet-print">' + cardRow([
          card('Trips ' + thru, n0(r.ytd.current), 'vs ' + n0(r.ytd.prior) + ' in ' + (year - 1), r.ytd.through ? chg(r.ytd.current - r.ytd.prior, n0, false) : null),
          card(r.latest ? r.latest.label : 'Latest month', r.latest ? n0(r.latest.current) : '–', r.latest ? 'vs ' + n0(r.latest.prior) + ' in ' + (year - 1) : '', r.latest ? chg(r.latest.current - r.latest.prior, n0, false) : null),
          card('Busiest destination ' + year, r.busiest[0] || '–', r.busiest.length > 1 ? 'then ' + r.busiest.slice(1).join(', ') : '')]) +
          '<div id="otr-report"><h2 class="otr-print-title">Over the Road Runs · Month Recap · ' + year + ' vs ' + (year - 1) + '</h2><table class="otr-sheet otr-mrecap"><colgroup><col style="width:150px">' + r.months.map((m, i) => (i ? '<col style="width:8px">' : '') + '<col><col>').join('') + '</colgroup><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div></div>';
        // Joe 10/18: no Fuel Used, Miles Driven and Tank fills rows and no note about them at the bottom (Recap has them).
        foot.textContent = '';
        wireYear(); wirePrint();
      } else if (view === 'cpg') {
        // The Cost Per Gallon tab, from the Recap numbers, with the workbook's own signs (a saving shows positive).
        const c = O.otrCostSheet_(year, monthly), Y = c.ytd, F = c.fuel;
        bar.innerHTML = '<button type="button" class="primary" id="print-sheet-otr">Print</button><span class="hint">Built from Recap, nothing to type. Year to date counts the months with numbers in both years.</span><span class="spacer"></span>' + yearPick([0, -1, -2]);
        const g = (v) => v == null ? '' : n0(Math.round(v)), pg = (v) => v == null ? '' : paren(v, x => n0(Math.round(x)));
        const pm = (v) => v == null ? '' : paren(v, x => '$' + n0(Math.round(x))), c5 = (v) => v == null ? '' : '$' + v.toFixed(5);
        const v5 = (v) => v == null ? '' : (v < 0 ? '-$' : '$') + Math.abs(v).toFixed(5), f3 = (v) => v == null ? '' : v.toFixed(3), pf = (v) => v == null ? '' : paren(v, x => x.toFixed(3));
        const neg = (v) => v != null && v < 0 ? ' class="neg"' : '';
        const row = (label, m, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="l">' + label + '</td><td>' + g(m.gal[0]) + '</td><td>' + g(m.gal[1]) + '</td><td' + neg(m.galDiff) + '>' + pg(m.galDiff) + '</td><td class="gap"></td><td>' + g(m.cost[0]) + '</td><td>' + g(m.cost[1]) + '</td><td' + neg(m.costDiff) + '>' + pm(m.costDiff) + '</td><td class="gap"></td><td>' + c5(m.cpg[0]) + '</td><td>' + c5(m.cpg[1]) + '</td><td' + neg(m.vari) + '>' + v5(m.vari) + '</td><td' + neg(m.costDiffMoney) + '>' + pm(m.costDiffMoney) + '</td></tr>';
        const gap = '<th class="gap" rowspan="2"></th>';
        const main = '<table class="otr-sheet otr-cpg"><colgroup><col style="width:130px"><col><col><col><col style="width:10px"><col><col><col><col style="width:10px"><col><col><col><col></colgroup><thead><tr><th class="l" rowspan="2">Month</th><th colspan="2">Gallons Sold</th><th rowspan="2">Difference</th>' + gap + '<th colspan="2">Dist. Cost</th><th rowspan="2">Difference</th>' + gap + '<th colspan="2">Cost Per Gallon</th><th rowspan="2">Var</th><th rowspan="2">Cost Diff</th></tr><tr class="sub"><th>' + c.year + '</th><th>' + c.prior + '</th><th>' + c.year + '</th><th>' + c.prior + '</th><th>' + c.year + '</th><th>' + c.prior + '</th></tr></thead><tbody>' +
          c.months.map(m => row(m.label, m)).join('') + (Y ? row('Year To Date', Object.assign({}, Y, { cpg: Y.cpg }), 'tot') : '<tr class="tot"><td class="l">Year To Date</td><td colspan="12"></td></tr>') + '</tbody></table>';

      const b = document.getElementById('print-sheet-otr'); if (!b) return;
      b.onclick = () => {
        let box = document.getElementById('print'); if (!box) { box = document.createElement('div'); box.id = 'print'; document.body.appendChild(box); }
        box.innerHTML = document.getElementById('otr-sheet-print').innerHTML; box.className = 'otr-print'; window.print();
      };
    }
    // Cost per gallon by month, this year against last year (the trend picture on top of Cost Per Gallon).
    function trend(c) {
      const pts = c.months.map(m => m.cpg), vals = [].concat(...pts).filter(v => v != null);
      if (vals.length < 2) return '<div class="otr-trend empty">The trend picture shows once Recap has gallons and delivery cost.</div>';
      const W = 560, H = 230, lo = Math.floor(Math.min(...vals) * 100 - 1) / 100, hi = Math.ceil(Math.max(...vals) * 100 + 1) / 100;
      const x = (i) => 56 + i * ((W - 76) / 11), y = (v) => H - 34 - (v - lo) / (hi - lo) * (H - 74);
      const line = (k, cls) => { let d = '', dots = ''; pts.forEach((p, i) => { if (p[k] == null) return; d += (d ? ' L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1); dots += '<circle class="' + cls + '" cx="' + x(i).toFixed(1) + '" cy="' + y(p[k]).toFixed(1) + '" r="5"><title>' + CORE.MONTHS[i] + ' ' + (k ? c.prior : c.year) + ': $' + p[k].toFixed(5) + '</title></circle>'; }); return '<path class="' + cls + '" d="' + d + '"/>' + dots; };
      const ticks = []; for (let v = lo; v <= hi + 1e-9; v += Math.max(0.01, Math.round((hi - lo) / 3 * 100) / 100)) ticks.push(v);
      return '<svg class="otr-trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Cost per gallon by month, ' + c.year + ' and ' + c.prior + '"><text x="14" y="24" class="t">Cost per gallon by month</text>' +
        '<text x="' + (W - 150) + '" y="24" class="k cur">■ ' + c.year + '</text><text x="' + (W - 72) + '" y="24" class="k ly">■ ' + c.prior + '</text>' +
        ticks.map(v => '<line x1="52" x2="' + (W - 14) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="4" y="' + (y(v) + 5).toFixed(1) + '" class="a">' + v.toFixed(2) + '</text>').join('') +
        CORE.MONTHS.map((m, i) => '<text x="' + (x(i) - 14).toFixed(1) + '" y="' + (H - 8) + '" class="a">' + m + '</text>').join('') + line(1, 'ly') + line(0, 'cur') + '</svg>';
    }
    // Import (By Date: Import Workbook; Recap: Import From Accounting) - the same reader takes the OTR Trips workbook or the accounting zip.
    function importBar(label) {
      const edit = canManage();
      return imp && imp.merged ? '<button type="button" class="primary" id="imp-use"' + (imp.busy || !edit ? ' disabled' : '') + '>' + (imp.busy || 'Use These Numbers') + '</button><button type="button" id="imp-cancel"' + (imp.busy ? ' disabled' : '') + '>Cancel</button>'
        : '<button type="button" id="imp-pick"' + (edit && !(imp && imp.busy) ? '' : ' disabled') + '>' + (imp && imp.busy ? escapeHtml(imp.busy) : label) + '</button><input type="file" id="imp-file" accept=".zip,.xlsx,.xls" hidden>';
    }
    function importHint() { return imp && imp.merged ? '<span class="hint">Check what was found in ' + escapeHtml(imp.file) + ', then press Use These Numbers.</span>' : ''; }
    function importPreview() {
      return imp && imp.merged ? '<div class="otr-import"><b>Found in ' + escapeHtml(imp.file) + '</b>' + (imp.merged.summary.length ? '<table><tbody>' + imp.merged.summary.map(l => '<tr><td class="strong">' + escapeHtml(l.what) + '</td><td>' + escapeHtml(l.count) + '</td><td>' + escapeHtml(l.from) + ' – ' + escapeHtml(l.to) + '</td><td>' + (l.changed ? l.changed + ' differ from what is saved' : l.total != null ? n0(l.total) + ' runs' : '') + '</td></tr>').join('') + '</tbody></table>' : '<p>Nothing was found in this file. Use your OTR Trips workbook (By Date, Recap) or the accounting package zip (P&amp;L Expenses by Dept, Gallon Comparison).</p>') + '</div>' : '';
    }
    function wireImport() {
      const pick = document.getElementById('imp-pick'), fileIn = document.getElementById('imp-file');
      if (pick) pick.onclick = () => fileIn.click();
      if (fileIn) fileIn.onchange = async () => {
        const f = fileIn.files[0]; if (!f) return;
        imp = { file: f.name, busy: 'Reading ' + f.name + '…' }; showError(''); render();
        try { imp = { file: f.name, merged: await readImport(f), busy: '' }; } catch (e) { imp = null; showError('Could not read ' + f.name + ': ' + (e.message || e)); }
        render();
      };
      if (document.getElementById('imp-use')) { document.getElementById('imp-use').onclick = applyImport; document.getElementById('imp-cancel').onclick = () => { imp = null; render(); }; if (imp.merged.summary.length === 0) document.getElementById('imp-use').disabled = true; }
    }

    // Day counts go back to 2016 (about 19,000): the screen reads only from the oldest day it shows (Month Recap's December two
    // years back, or an older By Date month), and reads further back when one is picked.
    let dbRef = null, dailyFrom = '', stopDaily = null;
    function needDays() {
      if (!dbRef) return;
      const from = [(year - 2) + '-12-01', ym + '-01'].sort()[0];
      if (dailyFrom && dailyFrom <= from) return;
      dailyFrom = from;
      if (stopDaily) stopDaily();
      stopDaily = onSnapshot(query(collection(dbRef, 'otrDaily'), where('date', '>=', from)), s => { daily = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, e => showError('Could not read otrDaily: ' + e.message));
    }
    const pendingFigures = [];
    // Import From Accounting (the current app's OverTheRoad.html import card): drop the accounting package zip or an Excel workbook
    // (P&L Expenses by Dept, Gallon Comparison, OTR Trips By Date / Recap). The files are read here, checked, then saved together.
    let imp = null;
    const loadScript = (src) => new Promise((ok, bad) => { if ([...document.scripts].some(x => x.src === src)) return ok(); const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => bad(new Error('Could not load the Excel reader')); document.head.appendChild(el); });
    async function readImport(file) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      let books = [{ name: file.name, data: await file.arrayBuffer() }];
      if (/\.zip$/i.test(file.name)) {
        await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
        const zip = await window.JSZip.loadAsync(books[0].data);
        books = await Promise.all(Object.keys(zip.files).filter(n => /\.xlsx?$/i.test(n) && !/^__MACOSX\//.test(n) && !zip.files[n].dir).map(async n => ({ name: n, data: await zip.files[n].async('arraybuffer') })));
      }
      const parts = [];
      books.forEach(b => {
        const wb = window.XLSX.read(b.data, { type: 'array', cellDates: true });
        wb.SheetNames.forEach(tab => {
          // Dates as local midnight, the way the current app's Sheets read gives them.
          const values = window.XLSX.utils.sheet_to_json(wb.Sheets[tab], { header: 1, raw: true, defval: '', blankrows: true })
            .map(row => row.map(v => v instanceof Date ? new Date(v.getFullYear(), v.getMonth(), v.getDate() + (v.getHours() >= 12 ? 1 : 0)) : v));
          const m = (tab + ' ' + b.name).match(/(20\d{2})/);
          const parsed = O.otrParseImport_(values, m ? Number(m[1]) : year, tab);
          parsed.tab = b.name.replace(/^.*\//, '') + ' · ' + String(tab).trim();
          parts.push(parsed);
        });
      });
      const merged = O.otrMergeImport_(parts);
      merged.summary = O.otrImportSummary_(merged, monthly);
      return merged;
    }
    async function applyImport() {
      const merged = imp.merged;
      imp = Object.assign({}, imp, { busy: 'Saving…' }); render();
      try {
        // A long history (188 months of gallons, years of day counts) goes in several saves the server takes one at a time.
        const batches = O.otrImportBatches_(merged);
        for (let i = 0; i < batches.length; i++) {
          if (batches.length > 1) { imp = Object.assign({}, imp, { busy: 'Saving ' + (i + 1) + ' of ' + batches.length + '…' }); render(); }
          try { await save('saveOtr', Object.assign({ op: 'import' }, batches[i])); }
          catch (e) { throw new Error((i ? 'Saved ' + i + ' of ' + batches.length + ' parts, then: ' : '') + (e.message || e)); }
        }
        const yrs = merged.figures.map(f => f.year);
        if (yrs.length) year = Math.max(...yrs);
        imp = null; showError('');
      } catch (e) { imp = Object.assign({}, imp, { busy: '' }); showError(e.message || String(e)); }
      render();
    }
    document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { if (b.dataset.view !== view) showError(''); view = b.dataset.view; render(); } });
    window.udBack = () => { if (view !== 'dash') { view = 'dash'; render(); return true; } return false; };

    requireSignIn(async (user) => {
      const { db } = await start();
      watchLists(user, render);
      const watch = (name, set) => onSnapshot(collection(db, name), s => { set(s.docs.map(d => Object.assign({ id: d.id }, d.data()))); render(); }, e => showError('Could not read ' + name + ': ' + e.message));
      // Miles still saving stay on screen when a Route Master update lands first.
      watch('routes', v => { routes = v; Object.keys(pendingMiles).forEach(id => { const r = routes.find(x => x.id === id); if (r) { r.days = Object.assign({}, r.days); Object.keys(pendingMiles[id]).forEach(d => { r.days[d] = Object.assign({}, r.days[d], { miles: pendingMiles[id][d] }); }); } }); });
      watch('runs', v => { runs = v; });
      watch('otrRoutes', v => { picks = {}; v.forEach(p => { picks[p.runId] = { include: p.include === true, destination: p.destination || '', deliveredBy: p.deliveredBy || '' }; }); Object.keys(pendingRoutes).forEach(id => { picks[id] = pendingRoutes[id]; }); });
      dbRef = db; needDays();
      watch('otrMonthly', v => { monthly = v; pendingFigures.forEach(put => put()); });
      watch('otrMonthRuns', v => { monthRuns = v; });
      watch('otrComments', v => { comments = v; });
      watch('otrColumns', v => { extraCols = v.filter(c => c.name).sort((a, b) => String(a.createdAt || '') < String(b.createdAt || '') ? -1 : 1); });
    });
  </script>
</body>
