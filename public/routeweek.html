<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Route Week Override · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/routeweek.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
</head>
<body class="fill routeweek-page">
  <div class="signin" id="signin" hidden>
    <h1>Route Week Override</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Route Week Override</h1><small>Which days each route runs this one week; the normal week stays in Route Master</small></div>
      <!-- Joe 10/28: the same two tabs as Route Days: Normal Week opens Route Days, Holiday Week is this screen. -->
      <div class="tabs week-tabs" role="tablist" aria-label="Which week">
        <button type="button" role="tab" aria-selected="false" id="tab-normal">Normal Week</button>
        <button type="button" role="tab" aria-selected="true" id="tab-holiday">Holiday Week</button>
      </div>
      <div class="badge-test"><b id="mode-text">TEST COPY, READ ONLY</b><span>Each click saves at once</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view rw-shell">
      <div class="sheet rw-grid scroll-list">
        <table class="rw">
          <colgroup><col style="width:8%"><col style="width:20%"><col span="7" style="width:10.28%"></colgroup>
          <thead><tr id="heads"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <aside class="rw-side">
        <div class="rw-week">
          <button type="button" id="prev" aria-label="Previous week">&#9664;</button>
          <div><b id="week-label">-</b><small id="week-kind"></small></div>
          <button type="button" id="next" aria-label="Next week">&#9654;</button>
        </div>
        <label class="rw-reason" id="hol-pick-box" hidden>Holiday this week<select id="hol-pick"></select></label>
        <label class="rw-reason">Reason for this week's changes<textarea id="reason" maxlength="300" rows="2" placeholder="Holiday week, plant shutdown, customer closed..."></textarea></label>
        <div class="rw-counts"><div><b id="n-over">0</b><span>Overrides this week</span></div><div><b id="n-routes">0</b><span>Routes affected</span></div></div>
        <div class="tabs rw-filter" id="rw-filter" role="tablist">
          <button type="button" role="tab" data-show="all" aria-selected="true">All Routes</button>
          <button type="button" role="tab" data-show="changed" aria-selected="false">Changed Only</button>
        </div>
        <div class="rw-list" id="change-list"></div>
        <!-- Joe 10/22: in a holiday week the side lists every load on the holiday, each with where it moves to. -->
        <div class="rw-hol-head" id="hol-head" hidden></div>
        <div class="rw-list rw-hol-list" id="hol-list" hidden></div>
        <button type="button" class="warn" id="reset" data-top>Reset Week to Normal</button>
      </aside>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, shortDate, showError, save } from './js/app.js';
    import { lists, watchLists, canSave, saveRunChange, forScreen, modeLabel } from './js/edit.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    forScreen('weeklyDispatch');

    const L = window.UDLogic, R = window.UDPlant;
    const NAME = (p) => L.DAY_NAMES[L.DAYS.indexOf(p)];
    // Opened from Weekly: the week Weekly was showing (?week=), as in the current app (RouteWeekOverride.html).
    const asked = (() => { const w = new URLSearchParams(location.search).get('week'); return L.isDateKey(w) ? L.weekStart(w) : ''; })();
    let db = null, week = '', weeks = [], runs = [], routes = {}, weekDoc = null, show = 'all', stopRuns = null, stopWeek = null, typing = false;
    let holPick = '';
    const getRuns = () => runs;
    // The normal week: Route Master's day switches for the run (routes/{runId}).
    const normal = (r) => { const m = routes[r.runId]; return m && m.days ? m.days : null; };
    const normalOn = (r, p) => { const n = normal(r); return n ? !!(n[p] && n[p].active) : !!(r.days[p] && r.days[p].runs); };
    const isOver = (r, p) => !!(r.days[p] && r.days[p].runs) !== normalOn(r, p);
    const overRow = (r) => L.DAYS.some(p => isOver(r, p));

    // Joe 10/22: the week's holidays, from the same list the Scheduler's calendar marks. The first one is picked unless
    // the Holiday drop-down says another.
    const weekHolidays = () => L.DAYS.map((p, i) => ({ p, i, key: L.addDays(week, i), name: R.holidayName(L.addDays(week, i)) })).filter(h => h.name);
    const holiday = () => { const list = weekHolidays(); return list.find(h => h.p === holPick) || list[0] || null; };
    const runsOn = (r, p) => !!(r.days[p] && r.days[p].runs);
    // Where a load moved off the holiday went: the other day changed to run (blank: not running).
    const movedTo = (r, h) => L.DAYS.find(p => p !== h.p && isOver(r, p) && runsOn(r, p)) || '';
    const dayText = (p) => NAME(p).slice(0, 3) + ' ' + shortDate(L.addDays(week, L.DAYS.indexOf(p)));

    function shown() {
      // Every run Weekly shows for the week, in Weekly's order.
      const ids = new Set(L.weeklyRows(runs, week).map(x => x.runDocId));
      return runs.filter(r => ids.has(r.id)).sort((a, b) => (a.weekOrder ?? 999999) - (b.weekOrder ?? 999999) || String(a.route).localeCompare(String(b.route), undefined, { numeric: true }));
    }

    function render() {
      const edit = canSave(), list = shown(), over = list.filter(overRow);
      document.getElementById('mode-text').textContent = modeLabel(edit ? 'TEST COPY: SAVES STAY IN OPERATIONS' : 'TEST COPY, READ ONLY');
      const live = lists.app.liveWeeks || {};
      document.getElementById('week-label').textContent = week ? 'Week of ' + shortDate(week) : '-';
      document.getElementById('week-kind').textContent = week === live.current ? 'This week' : week === live.next ? 'Next week' : week === live.previous ? 'Last week' : '';
      document.getElementById('prev').disabled = weeks.indexOf(week) <= 0;
      document.getElementById('next').disabled = weeks.indexOf(week) >= weeks.length - 1;
      const hol = holiday(), hp = hol ? hol.p : '';
      document.getElementById('heads').innerHTML = '<th>Route</th><th>Load / Trip</th>' + L.DAYS.map((p, i) => '<th' + (p === hp ? ' class="hol" title="' + escapeHtml(hol.name) + '"><span class="hol-word">Holiday</span>' : '>') + NAME(p).slice(0, 3).toUpperCase() + '<small>' + shortDate(L.addDays(week, i)).replace(/\/\d{4}$/, '') + ' · ' + list.filter(r => r.days[p] && r.days[p].runs).length + ' run</small></th>').join('');
      // A holiday week lists its own changes in the side (no All Routes / Changed Only there), so the grid shows every route.
      const rows = show === 'changed' && !hol ? over : list;
      let prior = '';
      document.getElementById('rows').innerHTML = rows.map(r => {
        const first = r.route !== prior; prior = r.route;
        const need = hp && runsOn(r, hp), cls = [first ? 'first' : '', need ? 'hol-need' : ''].filter(Boolean).join(' ');
        return '<tr data-id="' + escapeHtml(r.id) + '"' + (cls ? ' class="' + cls + '"' : '') + '><td class="strong">' + (first ? escapeHtml(r.route) : '') + '</td><td>' + escapeHtml(r.run || r.routeName || '') + '</td>' +
          L.DAYS.map(p => { const on = !!(r.days[p] && r.days[p].runs), o = isOver(r, p);
            return '<td' + (p === hp ? ' class="hol-col"' : '') + '><button type="button" class="rw-day' + (on ? '' : ' off') + (o ? ' over' : '') + (on && p === hp ? ' hol-need' : '') + '" data-day="' + p + '"' + (edit ? '' : ' disabled') + ' title="' + (o ? 'Changed from the normal week (normal: ' + (normalOn(r, p) ? 'runs' : 'does not run') + ')' : 'Normal week') + '">' + (on ? '&#10003; RUNS' : 'OFF') + '</button></td>'; }).join('') + '</tr>';
      }).join('') || '<tr><td colspan="9" class="empty">' + (show === 'changed' ? 'Every route runs its normal week.' : 'No routes for this week.') + '</td></tr>';
      document.getElementById('n-over').textContent = over.reduce((a, r) => a + L.DAYS.filter(p => isOver(r, p)).length, 0);
      document.getElementById('n-routes').textContent = new Set(over.map(r => r.route)).size;
      document.getElementById('change-list').innerHTML = over.map(r => L.DAYS.filter(p => isOver(r, p)).map(p => { const on = r.days[p].runs;
        return '<div><span><b>' + escapeHtml(r.route) + '</b> &middot; ' + escapeHtml(r.run || '') + '</span><span>' + NAME(p).slice(0, 3) + ' <em class="' + (on ? 'on' : 'off') + '">' + (on ? 'RUNS' : 'DOES NOT RUN') + '</em></span></div>'; }).join('')).join('') || '<div class="empty">Every route runs its normal week.</div>';
      document.querySelectorAll('[data-show]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.show === show)));
      const box = document.getElementById('reason');
      box.disabled = !edit;
      if (!typing) box.value = weekDoc && weekDoc.overrideReason || '';
      document.getElementById('reset').disabled = !edit || !over.length;
      renderHoliday(list, hol, edit);
    }

    // The holiday list: each load on the holiday (red until moved) and each one moved off it (green), with a Move to drop-down:
    // a day that route does not already run, or Not running.
    function renderHoliday(list, hol, edit) {
      const pickBox = document.getElementById('hol-pick-box'), head = document.getElementById('hol-head'), box = document.getElementById('hol-list');
      pickBox.hidden = head.hidden = box.hidden = !hol;
      document.getElementById('rw-filter').hidden = document.getElementById('change-list').hidden = !!hol;
      if (!hol) return;
      document.getElementById('hol-pick').innerHTML = weekHolidays().map(h => '<option value="' + h.p + '"' + (h.p === hol.p ? ' selected' : '') + '>' + escapeHtml(h.name) + ' &middot; ' + dayText(h.p) + '</option>').join('');
      const rows = list.filter(r => runsOn(r, hol.p) || isOver(r, hol.p)), left = rows.filter(r => runsOn(r, hol.p)).length;
      head.textContent = 'Move ' + hol.name + ' loads to' + (rows.length ? ' · ' + (left ? left + ' left' : 'all moved') : '');
      box.innerHTML = rows.map(r => {
        const on = runsOn(r, hol.p), to = on ? null : movedTo(r, hol);
        const opts = '<option value=""></option>' + L.DAYS.filter(p => p !== hol.p && (!runsOn(r, p) || p === to)).map(p => '<option value="' + p + '"' + (p === to ? ' selected' : '') + '>' + dayText(p) + '</option>').join('') +
          '<option value="off"' + (to === '' ? ' selected' : '') + '>Not running</option>';
        return '<div class="' + (on ? 'need' : 'done') + '" data-id="' + escapeHtml(r.id) + '"><span><b>' + escapeHtml(r.route) + '</b> &middot; ' + escapeHtml(r.run || r.routeName || '') + '</span><select aria-label="Move to"' + (edit ? '' : ' disabled') + '>' + opts + '</select></div>';
      }).join('') || '<div class="empty">No loads run on ' + escapeHtml(hol.name) + '.</div>';
    }

    function toggle(r, p) {
      const on = !(r.days[p] && r.days[p].runs);
      return saveRunChange(getRuns, r.id, p, 'setRuns', { runs: on }, x => { x.runs = on; x.routeOverride = 'TRUE'; }, render);
    }

    document.getElementById('rows').addEventListener('click', e => {
      const b = e.target.closest('button[data-day]');
      if (!b) return;
      const r = runs.find(x => x.id === b.closest('tr').dataset.id);
      if (r) toggle(r, b.dataset.day);
    });
    document.getElementById('tab-normal').onclick = () => { location.href = 'routes.html' + (week ? '?week=' + encodeURIComponent(week) : ''); };
    document.getElementById('hol-pick').onchange = (e) => { holPick = e.target.value; render(); };
    // Move to: the load comes off the holiday and runs on the day picked (Not running: off only). Changing it again puts
    // the old day back first; the blank choice puts the load back on the holiday. One save per day changed, as the boxes do.
    // Picks made quickly one after another are worked out one at a time, each from the load as it is shown then (a second pick
    // read the load while the first was still saving, and the blank choice could leave it Not running).
    let holChain = Promise.resolve();
    const setDay = (id, p, on) => { const r = runs.find(x => x.id === id); return r && runsOn(r, p) !== on ? toggle(r, p) : Promise.resolve(); };
    document.getElementById('hol-list').addEventListener('change', (e) => {
      const sel = e.target.closest('select'), hol = holiday();
      const id = sel && hol && sel.closest('[data-id]').dataset.id;
      if (!id || !runs.some(x => x.id === id) || !canSave()) return;
      const want = sel.value;
      holChain = holChain.then(() => movePick(id, hol, want)).catch(() => {});
    });
    async function movePick(id, hol, want) {
      const now = () => runs.find(x => x.id === id);
      if (!now()) return;
      const was = runsOn(now(), hol.p) ? null : movedTo(now(), hol);
      try {
        if (was && was !== want) await setDay(id, was, false);
        if (want === '') { await setDay(id, hol.p, true); return; }
        await setDay(id, hol.p, false);
        if (want !== 'off') await setDay(id, want, true);
      } catch (err) { return; /* the save puts the day back and shows why */ }
      // The week's reason, when none is typed yet, becomes the holiday's name.
      if (weekDoc && !weekDoc.overrideReason && !typing) {
        weekDoc.overrideReason = hol.name; render();
        try { await save('setWeekReason', { weekStart: week, reason: hol.name }); } catch (err) { weekDoc.overrideReason = ''; render(); showError('The week reason was not saved (' + (err.message || String(err)) + '). Type it in the Reason box.'); }
      }
    }
    document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { show = b.dataset.show; render(); });
    // Reset Week to Normal: every changed day goes back to Route Master's normal week, one save each.
    // A second click within 6 seconds confirms, as on the current screen (the button says so, nothing pops up).
    const RESET = 'Reset Week to Normal';
    let resetArmed = null, resetTimer = null;
    function disarm() { resetArmed = null; clearTimeout(resetTimer); const b = document.getElementById('reset'); b.textContent = RESET; b.classList.remove('armed'); }
    document.getElementById('reset').onclick = async (e) => {
      const b = e.currentTarget;
      if (resetArmed !== week) {
        resetArmed = week; b.textContent = 'Click Again: Reset Week'; b.classList.add('armed');
        clearTimeout(resetTimer); resetTimer = setTimeout(disarm, 6000);
        return;
      }
      disarm();
      const work = [];
      shown().forEach(r => L.DAYS.forEach(p => { if (isOver(r, p)) work.push([r, p]); }));
      for (const [r, p] of work) await toggle(r, p);
    };
    const box = document.getElementById('reason');
    box.addEventListener('focus', () => { typing = true; });
    box.addEventListener('blur', async () => {
      typing = false;
      const was = weekDoc && weekDoc.overrideReason || '', now = box.value.trim();
      if (now === was) return;
      if (weekDoc) weekDoc.overrideReason = now;
      try { await save('setWeekReason', { weekStart: week, reason: now }); } catch (e) { if (weekDoc) weekDoc.overrideReason = was; render(); showError('The week reason was not saved (' + (e.message || String(e)) + '). Type it again and click outside the box to retry.'); }
    });
    function setWeek(w) {
      if (w !== week) { disarm(); holPick = ''; }
      week = w;
      if (stopRuns) stopRuns();
      if (stopWeek) stopWeek();
      stopRuns = onSnapshot(query(collection(db, 'runs'), where('weekStart', '==', week)), s => { runs = s.docs.map(d => Object.assign({ id: d.id }, d.data())); render(); }, e => showError('Could not read the week (' + e.message + '). Check the network and reload the page.'));
      stopWeek = onSnapshot(doc(db, 'weeks', week), s => { weekDoc = s.exists() ? s.data() : null; render(); }, e => showError('Could not read the week reason (' + e.message + '). Reload the page.'));
      render();
    }
    document.getElementById('prev').onclick = () => { const i = weeks.indexOf(week); if (i > 0) setWeek(weeks[i - 1]); };
    document.getElementById('next').onclick = () => { const i = weeks.indexOf(week); if (i < weeks.length - 1) setWeek(weeks[i + 1]); };

    requireSignIn(async (user) => {
      db = (await start()).db;
      watchLists(user, () => {
        const live = lists.app.liveWeeks || {}, list = [live.previous, live.current, live.next].filter(Boolean);
        if (!list.length && !week) setWeek(asked || L.weekStart(L.operatingDay(new Date())));
        if (list.length && list.join() !== weeks.join()) { weeks = list; if (!week || weeks.indexOf(week) < 0) setWeek(weeks.indexOf(asked) >= 0 ? asked : live.next || live.current || L.weekStart(L.operatingDay(new Date()))); }
        render();
      });
      onSnapshot(collection(db, 'routes'), s => { routes = {}; s.docs.forEach(d => { const r = d.data(); routes[r.id || d.id] = r; }); render(); });
    });
  </script>
</body>
</html>
