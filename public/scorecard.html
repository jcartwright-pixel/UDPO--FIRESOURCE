<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Driver Scorecard · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/logic.js"></script>
  <script src="js/sc-core.js"></script>
</head>
<body class="fill issues-page score-page">
  <div class="signin" id="signin" hidden>
    <h1>Driver Scorecard</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <div class="title"><h1>Driver Scorecard</h1><small id="sub">Every driver starts the month at 100</small></div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-mode="month" aria-selected="true">Month</button>
        <button type="button" role="tab" data-mode="week" aria-selected="false">Week</button>
        <button type="button" role="tab" data-mode="year" aria-selected="false">Year</button>
        <button type="button" role="tab" data-mode="settings" aria-selected="false">Settings</button>
      </div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="view">
      <div class="kpis" id="kpis"></div>
      <div class="actions" id="bar" data-top></div>
      <div class="sheet scroll-list" id="sheet"></div>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, escapeHtml, showError, shortDate } from './js/app.js';
    import { watchLists, forScreen, modeLabel, canManage, saveOptimistic } from './js/edit.js';
    import { collection, doc, onSnapshot, query, where, limit } from './js/firebase.js';

    // The current app's Driver Scorecard (screen A, 224/225_V7279): one table of every driver for the month or the year.
    // Days come from every week the app keeps (the copied Live weeks, the weeks Publish moved on, and the current app's DISPATCH WEEK
    // HISTORY archive: check-ins, cases out vs in) and the plant journal (inspections, route check-ins).
    forScreen('scorecard');
    const L = window.UDLogic, S = window.UDScore, CORE = S.SC_CORE;
    let mode = 'month', runs = [], events = [], drivers = [], exceptions = [], saved = {}, open = '';
    const today = () => L.operatingDay(new Date());
    let year = Number(today().slice(0, 4)), month = Number(today().slice(5, 7)), weekStart = S.scWeekRange_(S.scAddDays_(today(), -1)).start;
    // ?month=2026-10 or ?week=2026-10-04 opens that period (links and the browser checks).
    { const q = new URLSearchParams(location.search), m = /^(\d{4})-(\d{2})$/.exec(q.get('month') || ''), w = q.get('week') || '';
      if (m) { year = +m[1]; month = +m[2]; }
      if (/^\d{4}-\d{2}-\d{2}$/.test(w)) { weekStart = S.scWeekRange_(w).start; mode = 'week'; } }
    // Joe 10/13: Verizon Connect Fleet GPS for the period on screen (gpsDays: miles, yard times, fuel; gpsAlerts: speeding, hard stops, idling).
    let gpsDays = [], gpsAlerts = [], alertsEver = null, gpsSub = null, gpsKey = '', dbRef = null;

    function names() { const out = {}; drivers.forEach(d => { if (!d.name) return; if (d.id) out[S.scPersonKey_(d.id)] = d.name; out[S.scPersonKey_(d.name)] = d.name; }); return out; }
    // Every day in the copied Live weeks, built the current app's way (scBuildDay_).
    function allDays(routeMiles) {
      const byDate = {}, ev = {};
      events.forEach(e => { (ev[e.date] = ev[e.date] || []).push({ eventType: e.type, payload: { route: e.route, run: e.run, checks: e.defect ? ['Defect found'] : [] } }); });
      runs.forEach(run => L.DAYS.forEach((p, i) => {
        const d = run.days && run.days[p]; if (!d) return;
        const date = L.addDays(run.weekStart, i);
        (byDate[date] = byDate[date] || []).push({ runId: run.runId, route: run.route, run: run.run, runs: d.runs ? 'TRUE' : '', driver: d.driver || '', driverId: d.driverId || '',
          casesOut: d.casesOut, plantCaseReturn: d.plantCaseReturn, driverCaseReturn: d.driverCaseReturn, checkedIn: !!d.checkinCompletedAt,
          truck: d.truck || '', startTime: d.startTime || '' });
      }));
      const out = {}, gd = {}, ga = {};
      gpsDays.forEach(g => { (gd[g.date] = gd[g.date] || []).push(g); });
      gpsAlerts.forEach(a => { (ga[a.date] = ga[a.date] || []).push(a); });
      unassigned = {};
      Object.keys(byDate).concat(Object.keys(ga)).forEach(date => {
        if (out[date]) return;
        const p = L.DAYS[S.scWeekday_(date)], rows = byDate[date] || [];
        // A check-in typed on Driver Check-ins counts like the phone's ROUTE_CHECKIN event.
        const dayEv = (ev[date] || []).concat(rows.filter(r => r.checkedIn).map(r => ({ eventType: 'ROUTE_CHECKIN', payload: { route: r.route, run: r.run } })));
        // Each truck's GPS and alerts go to the driver Daily Dispatch put in it that day; the rest wait under No driver dispatched.
        const m = S.scMatchGps_(date, S.scBuildDay_(date, rows, dayEv, routeMiles[p] || {}), gd[date] || [], ga[date] || []);
        out[date] = m.records;
        if (m.unassigned.length) unassigned[date] = m.unassigned;
      });
      return out;
    }
    let unassigned = {};
    function period() {
      if (mode === 'week') return S.scWeekRange_(weekStart);
      if (mode === 'year') return { start: year + '-01-01', end: year + '-12-31' };
      return S.scMonthRange_(year, month);
    }
    // Reads only the period's GPS, again when the period changes.
    function watchGps() {
      if (!dbRef || mode === 'settings') return;
      const p = period(), key = p.start + '|' + p.end;
      if (key === gpsKey) return;
      gpsKey = key;
      if (gpsSub) gpsSub.forEach(u => u());
      gpsDays = []; gpsAlerts = [];
      const range = (name) => query(collection(dbRef, name), where('date', '>=', p.start), where('date', '<=', p.end));
      gpsSub = [
        onSnapshot(range('gpsDays'), s => { gpsDays = s.docs.map(d => d.data()); render(); }, e => showError('Could not read the GPS miles (' + e.message + '). Reload the page.')),
        // No alerts yet (or none readable) is the plain "No GPS alerts received yet" line, not an error.
        onSnapshot(range('gpsAlerts'), s => { gpsAlerts = s.docs.map(d => d.data()); render(); }, () => { gpsAlerts = []; render(); })
      ];
    }
    let routeMiles = {};

    function board(s) {
      const t = today(), yesterday = S.scAddDays_(t, -1), days = allDays(routeMiles), ex = exceptions.map(e => Object.assign({}, e.cells || {}, { driver_id: (e.cells || {}).driver_id || e.driverId || '' }));
      const lost = (a, z) => Object.keys(unassigned).filter(d => d >= a && d <= z).sort().reduce((l, d) => l.concat(unassigned[d]), []);
      if (mode === 'week') {
        const w = S.scWeekRange_(weekStart), end = w.end < yesterday ? w.end : yesterday;
        let list = [];
        for (let d = w.start; d <= end; d = S.scAddDays_(d, 1)) list = list.concat(days[d] || []);
        const rows = w.start > yesterday ? [] : S.scScoreMonth_(list, S.scCallOffDays_(ex, w.start, end, s), s, names());
        return { rows, minDays: 99, summary: S.scSummary_(rows, s, 99), through: end < w.start ? w.start : end, days: Object.keys(days).sort(), unassigned: lost(w.start, end) };
      }
      const first = mode === 'year' ? 1 : month, last = mode === 'year' ? 12 : month, months = [];
      for (let m = first; m <= last; m++) {
        const range = S.scMonthRange_(year, m);
        if (range.start > yesterday) break;
        const end = range.end < yesterday ? range.end : yesterday;
        let list = [];
        for (let d = range.start; d <= end; d = S.scAddDays_(d, 1)) list = list.concat(days[d] || []);
        months.push({ month: m, rows: S.scScoreMonth_(list, S.scCallOffDays_(ex, range.start, end, s), s, names()) });
      }
      const rows = mode === 'year' ? S.scScoreYear_(months, s) : (months[0] ? months[0].rows : []);
      const minDays = mode === 'year' ? Math.round(s.monthMinDays * months.length / 2) : s.monthMinDays;
      const p = period();
      return { rows, minDays, summary: S.scSummary_(rows, s, minDays), through: yesterday, days: Object.keys(days).sort(), unassigned: lost(p.start, p.end < yesterday ? p.end : yesterday) };
    }

    // Replacing the page can blur a typed box, whose save asks for a redraw while this one is still running: that one waits its turn.
    let painting = false, again = false;
    function render() {
      if (painting) { again = true; return; }
      painting = true;
      try { paint(); } finally { painting = false; }
      if (again) { again = false; render(); }
    }
    function paint() {
      const s = S.scSettings_(saved), edit = canManage();
      watchGps();
      document.querySelectorAll('.tabs [data-mode]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === mode)));
      { const ml = modeLabel(edit ? '' : 'View only'); document.getElementById('sub').textContent = (ml ? ml.charAt(0) + ml.slice(1).toLowerCase() + ' · ' : '') + 'Every driver starts at 100'; }
      const k = document.getElementById('kpis'), bar = document.getElementById('bar'), sheet = document.getElementById('sheet'), foot = document.getElementById('foot');
      if (mode === 'settings') {
        k.innerHTML = '';
        bar.innerHTML = '<span class="hint">Change any number and it saves. Personal Day, vacation and Off never count.</span>';
        const n = (key) => '<input class="sc-n" data-k="' + key + '" value="' + s[key] + '"' + (edit ? '' : ' disabled') + '>';
        sheet.innerHTML = '<div class="sc-set"><section class="otr-card"><h2>What costs points</h2>' +
          '<p><b>Daily check-in</b> ' + n('checkinMiss') + ' points for each run without a check-in</p>' +
          '<p><b>Cases out vs in</b> ' + n('lostCase') + ' point per lost case, at most ' + n('lostCaseDayCap') + ' a day</p>' +
          '<p><b>Clean inspections</b> ' + n('inspectionDefect') + ' points per inspection with a defect, ' + n('inspectionMissing') + ' if none done</p>' +
          '<p><b>Attendance</b> ' + n('callOff') + ' points per call-off day</p>' +
          '<p class="later"><b>Route cuts</b> later: needs a cut mark on Daily Dispatch</p>' +
          '<h2>Driving (Verizon Fleet GPS)</h2><p class="hint">Counted on the truck, against the driver Daily Dispatch put in it that day.</p>' +
          '<p><b>Speeding</b> ' + n('speeding') + ' points per speeding alert</p>' +
          '<p><b>Hard stops</b> ' + n('hardBrake') + ' points per hard braking alert</p>' +
          '<p><b>Hard starts</b> ' + n('hardAccel') + ' points per hard acceleration alert</p>' +
          '<p><b>Idling</b> ' + n('idle') + ' points per idling alert</p>' +
          '<p><b>Most a day</b> ' + n('gpsDayCap') + ' points from driving alerts in one day (0 = no limit)</p>' +
          '<h2>Counts as a call-off</h2><div class="sc-reasons">' + CORE.REASONS.map(r => '<label><input type="checkbox" data-reason="' + r + '"' + (s.callOffReasons.indexOf(r) >= 0 ? ' checked' : '') + (edit ? '' : ' disabled') + '> ' + r.charAt(0) + r.slice(1).toLowerCase() + '</label>').join('') + '</div></section>' +
          '<section class="otr-card"><h2>Grades</h2><p><span class="sc g-A">A</span> ' + n('gradeA') + ' and up</p><p><span class="sc g-B">B</span> ' + n('gradeB') + ' and up</p><p><span class="sc g-C">C</span> ' + n('gradeC') + ' and up</p><p><span class="sc g-D">D</span> below</p>' +
          '<h2>Driver of the Month</h2><p>Highest score, worked at least ' + n('monthMinDays') + ' days</p><button type="button" data-mode-go="month">Back to the scorecard</button></section></div>';
        foot.textContent = '';
        sheet.querySelectorAll('.sc-n').forEach(inp => { inp.onchange = () => {
          const key = inp.dataset.k, before = saved[key];
          saveOptimistic('saveScorecard', { key, value: inp.value }, () => { saved = Object.assign({}, saved, { [key]: Number(inp.value) }); }, () => { saved = Object.assign({}, saved, { [key]: before }); }, render);
        }; });
        sheet.querySelectorAll('[data-reason]').forEach(c => { c.onchange = () => {
          const list = [...sheet.querySelectorAll('[data-reason]:checked')].map(x => x.dataset.reason), before = saved.callOffReasons;
          saveOptimistic('saveScorecard', { callOffReasons: list }, () => { saved = Object.assign({}, saved, { callOffReasons: list }); }, () => { saved = Object.assign({}, saved, { callOffReasons: before }); }, render);
        }; });
        sheet.querySelector('[data-mode-go]').onclick = () => { mode = 'month'; render(); };
        return;
      }
      // Review item 60 (Joe 10/13): the month reads Oct 26 (its 3-letter name and 2-digit year).
      const b = board(s), sm = b.summary, label = mode === 'year' ? String(year) : mode === 'week' ? 'Week of ' + shortDate(weekStart) : CORE.MONTHS[month - 1].slice(0, 3) + ' ' + String(year).slice(-2);
      const lostCount = b.unassigned.reduce((t, u) => t + u.alerts.length, 0);
      k.innerHTML = [[sm.drivers, 'Drivers graded'], [sm.average == null ? '–' : sm.average, 'Plant average score'], [sm.missedCheckins, 'Missed check-ins', sm.missedCheckins ? 'warn' : ''],
        [sm.lostCases, 'Cases lost on routes', sm.lostCases ? 'warn' : ''], [sm.speeding, 'Speeding alerts', sm.speeding ? 'warn' : ''], [sm.hardBrakes, 'Hard stops', sm.hardBrakes ? 'warn' : ''],
        [lostCount, 'No driver dispatched', lostCount ? 'warn' : '']].concat(mode === 'week' ? [] : [[sm.leader || 'Nobody yet', (mode === 'year' ? 'Leading for Driver of the Year' : 'Leading for Driver of the Month') + (sm.leader ? '' : ', needs ' + b.minDays + ' days worked'), sm.leader ? 'good' : 'none']])
        .map(([v, l, c]) => '<div class="' + (c || '') + '"><b>' + escapeHtml(String(v)) + '</b><span>' + l + '</span></div>').join('');
      bar.innerHTML = '<button type="button" id="prev" aria-label="Earlier">◀</button><b class="sc-period">' + escapeHtml(label) + '</b><button type="button" id="next" aria-label="Later">▶</button><span class="hint" id="gps-note">' + (alertsEver === false && !gpsAlerts.length ? 'No GPS alerts received yet: speeding, hard stops and idling count once alerts are turned on in Verizon Fleet.' : '') + '</span><span class="spacer"></span><button type="button" class="primary" id="sc-print">Print</button>';
      const cell = (bad, good, text) => '<td class="' + (bad ? 'sc-bad' : good ? 'sc-ok' : '') + '">' + text + '</td>';
      // Review item 18 (Joe 10/13): the empty Route Cuts column is hidden until it is built.
      // Joe 10/13 (GPS): driver and truck lead (the route is small under them); speeding, hard stops, idling, MPG, GPS miles and
      // the usual yard leave / return times come from Verizon Fleet.
      const clock = (m) => m == null ? '' : S.scClock_(m);
      const gpsCell = (n, extra) => cell(n, !n, (n ? n : 'None') + (extra || ''));
      sheet.innerHTML = '<table class="issues sc-board"><colgroup><col style="width:3%"><col style="width:16%"><col style="width:5%"><col style="width:8%"><col style="width:10%"><col style="width:9%"><col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:6%"><col style="width:5%"><col style="width:7%"><col style="width:9%"></colgroup>' +
        '<thead><tr><th>#</th><th>Driver &amp; Truck</th><th>Score</th><th>Daily Check-in</th><th>Cases Out vs In</th><th>Clean Inspections</th><th>Attendance</th><th>Speeding</th><th>Hard Stops</th><th>Idling</th><th>MPG</th><th>Miles</th><th>Yard Out / In</th></tr></thead><tbody>' +
        (b.rows.filter(r => r.runDays || r.callOffs).map(r => '<tr data-key="' + escapeHtml(r.driverKey) + '" class="' + (open === r.driverKey ? 'sc-open' : '') + '"><td>' + r.rank + '</td><td class="strong sc-who">' + escapeHtml(r.driver) +
          '<small>' + [r.truck ? 'Truck ' + escapeHtml(r.truck) : 'No truck', r.route ? 'Route ' + escapeHtml(r.route) : ''].filter(Boolean).join(' · ') + '</small></td>' +
          '<td><span class="sc g-' + r.grade + '">' + r.score + '</span></td>' + cell(r.missedCheckins, !r.missedCheckins, (r.runDays - r.missedCheckins) + ' of ' + r.runDays + (r.missedCheckins ? '<small>' + r.missedCheckins + ' missed</small>' : '')) +
          cell(r.lostCases, !r.lostCases && r.casesOut, r.casesOut ? r.casesOut.toLocaleString() + ' / ' + r.casesIn.toLocaleString() + (r.lostCases ? '<small>' + r.lostCases + ' lost</small>' : '') : '<small>not recorded</small>') +
          cell(r.defects, !r.defects && r.inspected, r.inspected + ' clean' + (r.defects ? '<small>' + r.defects + ' with a defect</small>' : '') + (r.notInspected ? '<small>' + r.notInspected + ' not done</small>' : '')) +
          cell(r.callOffs, !r.callOffs, r.callOffs ? r.callOffs + ' call-off' + (r.callOffs === 1 ? '' : 's') : 'Perfect') +
          gpsCell(r.speeding || 0) + gpsCell(r.hardBrakes || 0, r.hardAccels ? '<small>' + r.hardAccels + ' hard start' + (r.hardAccels === 1 ? '' : 's') + '</small>' : '') +
          gpsCell(r.idles || 0, r.idleMinutes ? '<small>' + Math.round(r.idleMinutes) + ' min</small>' : '') +
          '<td>' + (r.mpg ? r.mpg.toFixed(1) : '<small>coming</small>') + '</td>' +
          '<td>' + (r.gpsMiles ? Math.round(r.gpsMiles).toLocaleString() + '<small>GPS</small>' : r.miles ? r.miles.toLocaleString() + '<small>planned</small>' : '') + '</td>' +
          '<td>' + (r.yardOut != null || r.yardIn != null ? 'out ' + (clock(r.yardOut) || '–') + '<small>in ' + (clock(r.yardIn) || '–') + '</small>' : '<small>no GPS</small>') + '</td></tr>' +
          (open === r.driverKey ? '<tr class="sc-misses"><td></td><td colspan="12">' + (r.misses && r.misses.length ? r.misses.map(m => '<div><b>' + shortDate(m.date) + '</b> ' + escapeHtml(m.what) + ' <span class="sc-pts">−' + m.points + '</span></div>').join('') : 'No misses.') + '</td></tr>' : '')).join('') ||
          '<tr><td colspan="13" class="empty">No driving days counted for ' + escapeHtml(label) + ' yet.</td></tr>') + '</tbody></table>' +
        // Joe 10/13: an alert on a truck nobody was dispatched in is never dropped; a manager puts the driver on Daily Dispatch.
        (b.unassigned.length ? '<div id="unassigned" class="sc-lost"><h2>No driver dispatched</h2><p class="hint">These trucks had alerts on a day no driver was in them on Daily Dispatch. Put the driver in the truck on Daily Dispatch for that day and the alerts move to that driver.</p>' +
          '<table class="issues"><colgroup><col style="width:12%"><col style="width:14%"><col style="width:74%"></colgroup><thead><tr><th>Date</th><th>Truck</th><th>Alerts</th></tr></thead><tbody>' +
          b.unassigned.map(u => '<tr><td>' + shortDate(u.date) + '</td><td class="strong">' + escapeHtml(u.truck) + '</td><td class="sc-lost-list">' + u.alerts.map(a => escapeHtml(S.scAlertText_(a, ''))).join('<br>') + '</td></tr>').join('') +
          '</tbody></table></div>' : '');
      foot.textContent = 'Through ' + shortDate(b.through) + ' · green = no misses, red = cost points · days counted: ' + (b.days.length ? shortDate(b.days[0]) + ' to ' + shortDate(b.days[b.days.length - 1]) + ' (the copied Live weeks)' : 'none') + ' · GPS from Verizon Fleet: yard times are the usual leave and return' + (b.rows.some(r => r.yardFromMoves) ? ' (first and last move until Fleet sends yard times)' : '') + ' · click a driver for the misses.';
      document.getElementById('prev').onclick = () => { if (mode === 'year') year--; else if (mode === 'week') weekStart = S.scAddDays_(weekStart, -7); else if (--month < 1) { month = 12; year--; } open = ''; render(); };
      document.getElementById('next').onclick = () => { if (mode === 'year') year++; else if (mode === 'week') weekStart = S.scAddDays_(weekStart, 7); else if (++month > 12) { month = 1; year++; } open = ''; render(); };
      document.getElementById('sc-print').onclick = () => {
        let box = document.getElementById('print'); if (!box) { box = document.createElement('div'); box.id = 'print'; document.body.appendChild(box); }
        box.innerHTML = '<h2>Driver Scorecard · ' + escapeHtml(label) + '</h2>' + sheet.innerHTML; window.print();
      };
    }

    document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; open = ''; render(); } });
    document.getElementById('sheet').addEventListener('click', e => { const tr = e.target.closest('tr[data-key]'); if (tr) { open = open === tr.dataset.key ? '' : tr.dataset.key; render(); } });
    // The browser check jumps to a week with this.
    window.udScWeek = (d) => { weekStart = S.scWeekRange_(d).start; mode = 'week'; open = ''; render(); };
    window.udBack = () => { if (open) { open = ''; render(); return true; } if (mode !== 'month') { mode = 'month'; render(); return true; } return false; };

    requireSignIn(async (user) => {
      const { db } = await start();
      dbRef = db;
      watchLists(user, render);
      onSnapshot(query(collection(db, 'gpsAlerts'), limit(1)), s => { alertsEver = !s.empty; render(); }, () => { alertsEver = false; render(); });
      const NAMES = { runs: 'the dispatch runs', plantEvents: 'the plant check-ins', drivers: 'the driver list', exceptions: 'the days off', routes: 'Route Master' };
      const watch = (name, set) => onSnapshot(collection(db, name), s => { set(s.docs.map(d => Object.assign({ id: d.id }, d.data()))); render(); }, e => showError('Could not read ' + (NAMES[name] || name) + ' (' + e.message + '). The scorecard may be short; check the network and reload the page.'));
      watch('runs', v => { runs = v; });
      watch('plantEvents', v => { events = v; });
      watch('drivers', v => { drivers = v; });
      watch('exceptions', v => { exceptions = v; });
      watch('routes', v => { routeMiles = {}; L.DAYS.forEach(p => { routeMiles[p] = {}; }); v.forEach(r => L.DAYS.forEach(p => { if (r.days && r.days[p] && r.days[p].miles) routeMiles[p][r.id] = r.days[p].miles; })); });
      onSnapshot(doc(db, 'scorecard', 'settings'), s => { saved = s.exists() ? s.data() : {}; render(); }, e => showError('Could not read the scorecard settings (' + e.message + '). The scores use the standard settings until it loads; reload the page.'));
    });
  </script>
</body>
</html>
