<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <title>Shift Notes · Operations</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/plant.css">
  <script src="js/logic.js"></script>
  <script src="js/plant-rules.js"></script>
  <script src="js/pmaint-rules.js"></script>
</head>
<body class="fill issues-page plant-page quality-page shift-page">
  <div class="signin" id="signin" hidden>
    <h1>Shift Notes</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>

  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="head">
      <!-- Review item 36 (Joe 10/13): one screen, one name. The menu calls it Shift Notes, so the title does too. -->
      <div class="title"><span class="eyebrow" id="eyebrow">Plant Distribution</span><h1>Shift Notes</h1></div>
      <div class="tabs" id="panes" role="tablist" aria-label="Log view"><button type="button" role="tab" data-pane="current">Current</button><button type="button" role="tab" data-pane="history">24-Hour History</button></div>
      <div class="hstats" id="hstats"></div>
      <span class="sn-since" id="since"></span>
      <div class="badge-test"><b id="mode-text">TEST COPY</b><span>Saves stay in the Operations test copy</span></div>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="notice ok" id="saved" hidden></div>
    <div class="view">
      <div class="qc-split" id="pane-current">
        <aside class="qc-lines" aria-label="Shift note types"><h2>Shift Notes</h2><div id="lines"></div>
          <div class="sn-carry" id="carry" hidden></div>
          <div class="sn-lastrep" id="lastrep"></div>
        </aside>
        <section class="qc-form sn-form">
          <div class="qc-top"><h2 id="kind-title">Breakdowns</h2><span class="qc-last" id="kind-count"></span>
            <span class="sn-autosave" id="form-last"></span>
            <div class="qc-actions"><button type="button" class="qc-btn" id="another" hidden>Start Another Entry</button></div></div>
          <div id="open-box"></div>
          <div class="sn-sec" id="new-title">New breakdown</div>
          <div class="qc-fields" id="fields"></div>
          <div class="sn-send" id="mr-send-row" hidden><span class="sn-unsent" id="mr-unsent">Not sent yet</span><button type="button" class="qc-btn primary" id="mr-send">Send to Maintenance</button></div>
        </section>
      </div>
      <section class="sn-history" id="pane-history" hidden>
        <h2>Last 24 Hours</h2>
        <div id="history"></div>
      </section>
      <div class="foot" id="foot"></div>
    </div>
  </div>

  <script type="module">
    import { start, requireSignIn, save, escapeHtml, shortDate, shortTime, showError, dateTimeText, goLiveNote, optionTag, hoursMinutesText, maySave, watchPerson } from './js/app.js';
    import { collection, doc, query, where, onSnapshot } from './js/firebase.js';
    import { fillIn, savedText, watchRound, clockOf } from './js/autosave.js';
    import { shiftsFor, shiftAt } from './js/plant-reports.js';
    import { nowMinutes } from './js/plant-core.js';

    // Shift Notes, option A (Joe 10/10): the kinds of entry down the left with their counts; open breakdowns carry over at the
    // top until someone marks them Resolved; the new entry below them saves box by box. Send Current Report empties the entry
    // boxes; anything still open stays on the list. Joe 10/11 (review item 43): the shift is a drop-down of the plant's shifts
    // (Administration > Plant Setup > Plant Shifts) that starts on the shift now (the earlier shift during an overlap) and can be
    // changed by hand.
    const L = window.UDLogic, U = window.UDPlant;
    const params = new URLSearchParams(location.search);
    const today = () => L.operatingDay(new Date());
    const phone = window.matchMedia('(max-width: 760px)');
    // Joe 10/12: a big breakdown is fixed on the spot and only recorded here (the machine, down at, back up at, what fixed it), so it
    // goes on the machine's history and down time; an issue that can wait is a Maintenance Request, which goes on maintenance's list
    // (Plant Maintenance) and shows here what maintenance did with it.
    const KINDS = [['Handoff', 'Handoff', 'Shift to shift'], ['Breakdown', 'Breakdowns'], ['Maintenance Request', 'Maintenance Requests', 'Sent to maintenance'], ['Incident', 'Incidents'], ['Safety', 'Safety'], ['Quality', 'Quality'], ['Other', 'Other']];
    const NEW_WORD = { Handoff: 'New handoff note', Breakdown: 'New breakdown', 'Maintenance Request': 'New maintenance request', Incident: 'New incident', Safety: 'New safety note', Quality: 'New quality note', Other: 'New entry' };
    const WHY_WORD = { Breakdown: 'recorded on the machine\'s history and down time; maintenance is called in person', 'Maintenance Request': 'goes on maintenance\'s list when you press Send' };
    let pane = params.get('view') === 'history' ? 'history' : 'current', kind = 'Breakdown';
    // Manager Center (Joe 10/15) opens a kind (?kind=Handoff) and one note on it (&entry=...), shown and outlined once it loads.
    const askKind = String(params.get('kind') || '').toLowerCase();
    let askEntry = params.get('entry') || '';
    if (askKind) { const k = KINDS.find(x => x[0].toLowerCase() === askKind); if (k) kind = k[0]; }
    let maint = null;
    // Joe 10/18: a request's work order is plantWorkOrders/SN_<entry> (plantmaint.js woIdFor), so only the work orders of the
    // requests on the list are read, not every plant work order ever made. Each is kept as the whole list would have given it.
    let woDb = null;
    const woDocs = {}, woStops = {};
    function watchRequestOrders() {
      if (!woDb) return;
      const want = {};
      week().forEach(x => { if (isKind(x, 'Maintenance Request') && /^[A-Za-z0-9_-]+$/.test(x.entryId || '')) want[x.entryId] = true; });
      Object.keys(woStops).forEach(id => { if (!want[id]) { woStops[id](); delete woStops[id]; delete woDocs[id]; } });
      Object.keys(want).forEach(id => {
        if (woStops[id]) return;
        woStops[id] = onSnapshot(doc(woDb, 'plantWorkOrders', ('SN_' + id).slice(0, 200)), d => {
          const w = d.exists() ? Object.assign({}, d.data(), { id: d.id }) : null;
          // The Uniontown work orders, status as watchMaint gives it (blank is NEW).
          woDocs[id] = w && w.facilityId === 'fac_uniontown' && w.sourceEntryId === id ? Object.assign(w, { status: String(w.status || 'NEW').toUpperCase() }) : null;
          maint = { workOrders: Object.values(woDocs).filter(Boolean) };
          render();
        }, () => {});
      });
    }
    let journal = [], person = null, app = {}, drawnFor = '', entry = null, roundStart = null, lastReport = null, shifts = shiftsFor(null, 'fac_uniontown');
    const pending = [];
    const canSave = () => maySave(person, L.SAVE_ROLES.concat(['PLANT_EMPLOYEE']), app, 'plant');
    const CARRY_WORD = { Handoff: 'handoff note', Breakdown: 'breakdown', 'Maintenance Request': 'maintenance request', Incident: 'incident', Safety: 'safety note', Quality: 'quality note', Other: 'note' };
    const FOLLOW = { OPEN: 'Needs attention', MONITOR: 'Monitor', RESOLVED: 'Resolved' };
    const ST_CLASS = { OPEN: 'open', MONITOR: 'mon', RESOLVED: 'res' };
    const stamp = (v) => { const t = Date.parse(v || ''); return isFinite(t) ? dateTimeText(t) : ''; };
    const dayStamp = (v) => { const t = Date.parse(v || ''); return isFinite(t) ? shortDate(t) + ' ' + shortTime(t) : ''; };
    const clockNow = () => new Date().toLocaleTimeString('en-GB', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' });
    const opt = (value, current, label) => optionTag(value, current, label || value, { loose: true });
    const shiftWord = (s) => s ? s.charAt(0) + s.slice(1).toLowerCase() : '';
    const isKind = (r, k) => String(r.type || '').toLowerCase() === k.toLowerCase();
    const since = (at) => { const t = Date.parse(at || ''), r = Date.parse(roundStart || ''); return !isFinite(r) || (isFinite(t) && t > r); };
    const hoursAgo = (at) => { const t = Date.parse(at || ''); return isFinite(t) ? Math.round((Date.now() - t) / 3600000) : 0; };

    // A saved entry stays on screen as sent until its own record comes back from the database, then only that one shows.
    function merged() { const have = new Set(journal.map(d => d.recordId)); return journal.concat(pending.filter(p => !have.has(p.payload.entryId))); }
    // Joe 10/15: a note stays until someone marks it Resolved; a report or the clock never clears it. The screen reads 30 days.
    const KEEP_DAYS = 30;
    const week = () => U.shiftLog(merged(), Date.now(), KEEP_DAYS * 24);
    const day = () => U.shiftLog(merged(), Date.now(), 24);

    // The shift now on the plant's clock, as saved with an entry (FIRST SHIFT, ...).
    const shiftNow = () => String(shiftAt(nowMinutes(new Date()), shifts) || U.shiftAt(Date.now())).toUpperCase();
    const shiftOptions = (current) => {
      const names = shifts.map(x => x.name.toUpperCase());
      if (current && names.indexOf(current) < 0) names.push(current);
      return names.map(n => opt(n, current, shiftWord(n))).join('');
    };
    // The new entry: the type picked on the left, the shift starting on the shift now. A breakdown and a maintenance request say
    // what broke, typed (Joe 10/12: "all kind of little things. Not a list"; a machine named in it goes on its history); a breakdown has its down and back up times and what fixed it, a
    // request how long it can wait. keep: the boxes change with the Type, and what is typed stays (the same entry keeps saving).
    // Joe 10/15 ("This needs to have a send button, not automatically send. And until it's sent, can't be cleared"): a new
    // maintenance request is kept on this screen (and on this computer, so nothing typed is lost) as a draft marked Not sent yet; it
    // goes on maintenance's list only when Send to Maintenance is pressed. A report or a new shift does not empty it.
    const DRAFT_KEY = 'ud.shiftnotes.requestDraft', DRAFT_BOXES = ['sn-equip', 'sn-shift', 'sn-urgency', 'sn-entry', 'sn-notes', 'sn-follow'];
    const readDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } };
    const writeDraft = (d) => { try { if (d) localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); else localStorage.removeItem(DRAFT_KEY); } catch (e) { /* the draft still stays on screen */ } };
    const formType = () => { const t = document.querySelector('#fields .sn-type'); return t ? t.value : kind; };
    // A request typed but not sent yet (not on the log).
    const unsent = () => !!entry && !entry.mine && formType() === 'Maintenance Request' &&
      ['sn-entry', 'sn-notes', 'sn-equip'].some(c => { const x = document.querySelector('#fields .' + c); return x && x.value.trim(); });
    function sendRow() {
      const row = document.getElementById('mr-send-row'), show = canSave() && !!entry && !entry.mine && formType() === 'Maintenance Request';
      row.hidden = !show;
      document.getElementById('mr-unsent').hidden = !unsent();
      const last = document.getElementById('form-last'), word = unsent() ? 'Not sent yet' : 'Press Send to send it to maintenance';
      if (show && ['', 'Not sent yet', 'Press Send to send it to maintenance', 'Every box saves when you leave it'].indexOf(last.textContent) >= 0) { last.textContent = word; last.classList.remove('done'); last.classList.toggle('bad', unsent()); }
    }
    const layout = () => kind === 'Breakdown' ? 'B' : kind === 'Maintenance Request' ? 'R' : 'N';
    const hm = (n) => hoursMinutesText(n);
    function drawForm(keep) {
      const ck = canSave(), m = phone.matches, shift = shiftNow(), lay = layout();
      const f0 = document.getElementById('fields'), was = {};
      if (keep) f0.querySelectorAll('input,select,textarea').forEach(x => { was[x.className.split(' ')[0]] = x.value; });
      const types = '<label>Type<select class="sn-type">' + U.ENTRY_TYPES.map(t => opt(t, kind)).join('') + '</select></label>';
      const equip = lay === 'N' ? '<label' + (m ? ' class="wide"' : '') + '>Equipment / area<input class="sn-equip" maxlength="80" placeholder="Dock 3 door, Palletizer, Truck 214…"></label>'
        : '<label' + (m ? ' class="wide"' : '') + '>What broke<input class="sn-equip" maxlength="80" placeholder="Filler 4, a leaky valve…"></label>';
      const shiftBox = '<label>Shift<select class="sn-shift" id="shift-now">' + shiftOptions(shift) + '</select></label>';
      const follow = '<label>Follow-up<select class="sn-follow">' + U.FOLLOW_UPS.map(f => opt(f, 'OPEN', FOLLOW[f])).join('') + '</select></label>';
      const downAt = '<label>Down at<input class="sn-time" type="time" value="' + clockNow() + '"></label>', upAt = '<label>Back up at<input class="sn-up" type="time"></label>';
      const urgency = '<label>Can it wait?<select class="sn-urgency">' + opt('', '', '') + U.URGENCIES.map(u => opt(u, '', u)).join('') + '</select></label>';
      const area = (cls, label, max, ph, wide) => '<label class="' + (wide || 'wide') + '">' + label + '<textarea class="' + cls + '" maxlength="' + max + '" placeholder="' + ph + '"></textarea></label>';
      let html;
      if (lay === 'B') html = m
        ? types + shiftBox + equip + downAt + upAt + area('sn-entry', 'What happened?', 4000, 'What broke down, and why.') + area('sn-fix', 'What fixed it', 1000, 'Fill in when it is back up.') + follow
        : types + equip + shiftBox + downAt + area('sn-entry', 'What happened?', 4000, 'What broke down, and why.', 'half') + area('sn-fix', 'What fixed it', 1000, 'Fill in when it is back up.', 'half') +
          upAt + area('sn-notes', 'Notes / Follow-up', 1500, 'What the next shift needs to know or do', 'half') + follow;
      else if (lay === 'R') html = m
        ? types + shiftBox + equip + urgency + area('sn-entry', 'What\'s wrong?', 4000, 'What needs fixing, and where.') + '<label class="wide"><span>Next steps <i class="sn-opt">Optional</i></span><textarea class="sn-notes" maxlength="1500" placeholder="Anything else maintenance should know"></textarea></label>' + follow
        : types + equip + shiftBox + urgency + area('sn-entry', 'What\'s wrong?', 4000, 'What needs fixing, and where.') +
          '<label class="wide sn-notes-wide">Notes / Follow-up<textarea class="sn-notes" maxlength="1500" placeholder="Anything else maintenance should know"></textarea></label>' + follow;
      else html = m
        ? types + shiftBox + equip + '<label class="wide">What happened?<textarea class="sn-entry" maxlength="4000" placeholder="What happened, and what has been done."></textarea></label>' +
          '<label class="wide"><span>Next steps <i class="sn-opt">Optional</i></span><textarea class="sn-notes" maxlength="1500" placeholder="What needs attention or follow-up from the next shift?"></textarea></label>' + follow
        : types + equip + shiftBox + '<label>Reading Time<input class="sn-time" type="time" value="' + clockNow() + '"></label>' +
          '<label class="wide">Entry / Measurements<textarea class="sn-entry" maxlength="4000" placeholder="Enter readings, production status, outage details, quality results, or handoff information."></textarea></label>' +
          '<label class="wide sn-notes-wide">Notes / Follow-up<textarea class="sn-notes" maxlength="1500" placeholder="What the next shift needs to know or do"></textarea></label>' + follow;
      f0.innerHTML = html;
      if (keep) Object.keys(was).forEach(c => { const x = f0.querySelector('.' + c); if (x && !x.matches('.sn-type') && was[c] !== '') x.value = was[c]; });
      const draft = lay === 'R' && !(keep && entry && entry.mine) ? readDraft() : null;
      if (draft) DRAFT_BOXES.forEach(c => { const x = f0.querySelector('.' + c); if (x && draft[c] && !(keep && was[c])) x.value = draft[c]; });
      f0.querySelectorAll('input,select,textarea').forEach(x => { x.disabled = !ck; });
      drawnFor = (m ? 'phone' : 'desk') + '|' + ck + '|' + lay;
      if (keep && entry) return;
      // No Save button: the entry saves to the log as each box is left; Start Another Entry empties the form for the next one.
      entry = { fill: fillIn('saveShiftNote', save), mine: null, round: roundStart, shiftPicked: false };
      const last = document.getElementById('form-last');
      last.textContent = ck ? (lay === 'R' ? 'Press Send to send it to maintenance' : 'Every box saves when you leave it') : ''; last.classList.remove('bad', 'done');
      if (draft) entry.shiftPicked = true;
      document.getElementById('another').hidden = true;
      sendRow();
    }
    const formEmpty = () => !entry || (!entry.mine && ![...document.querySelectorAll('#fields .sn-entry, #fields .sn-notes, #fields .sn-equip, #fields .sn-fix')].some(x => x.value.trim()));

    // One entry on the list: open items carry their status drop-down and a review box, both saving as they are changed or left.
    function card(x, ck, tag, flag) {
      const id = escapeHtml(x.entryId), saved = x.entryId && !/^pending-/.test(x.entryId), st = x.status || 'OPEN';
      const edge = st === 'RESOLVED' ? '#1f9d55' : st === 'MONITOR' ? '#e5891a' : isKind(x, 'Handoff') ? 'var(--ud-blue)' : '#c62828';
      const status = ck && saved
        ? '<select class="st ' + ST_CLASS[st] + '" data-status="' + id + '" aria-label="Follow-up status for ' + escapeHtml(x.equipment || x.type || 'this entry') + '">' + U.FOLLOW_UPS.map(f => opt(f, st, FOLLOW[f])).join('') + '</select>'
        : '<span class="sn-status s-' + st.toLowerCase() + '">' + escapeHtml(U.followLabel(st)) + '</span>';
      return '<article class="sn-card" data-entry="' + id + '" style="border-left-color:' + edge + '"><div class="sn-card-head"><strong>' + escapeHtml([stamp(x.recordedAt) || x.readingTime, tag ? '' : (x.type || 'Note'), x.equipment, x.shift].filter(Boolean).join(' · ')) + '</strong>' +
        (tag || '') + (flag ? '<span class="tag need">STILL NEEDS REVIEW</span>' : '') + status + '</div>' +
        (x.entry ? '<p>' + escapeHtml(x.entry) + '</p>' : '') + downLine(x, ck && saved) + requestLine(x) + (x.notes ? '<p class="sn-next"><b>Notes / Follow-up:</b> ' + escapeHtml(x.notes) + '</p>' : '') +
        x.reviews.map(r => '<div class="sn-review"><b>Review ' + escapeHtml(stamp(r.recordedAt)) + '</b> · ' + escapeHtml(U.followLabel(r.followUpStatus)) + ' · ' + escapeHtml(r.entry) + '<small>' + escapeHtml(r.recordedBy) + '</small></div>').join('') +
        (ck && saved ? '<div class="sn-addreview"><input data-review="' + id + '" aria-label="Review note for ' + escapeHtml(x.equipment || x.type || 'this entry') + '" maxlength="500" placeholder="Add a review note (saves when you leave the box)"></div>' : '') +
        '<small class="sn-by">' + escapeHtml(x.recordedBy) + (saved ? '' : ' · saving…') + '</small></article>';
    }
    // A breakdown: down at, back up at, how long it was down and what fixed it; still down, the boxes to say when it was back up.
    function downLine(x, ck) {
      if (!isKind(x, 'Breakdown') || !x.readingTime) return '';
      const id = escapeHtml(x.entryId), n = U.downMinutes(x, Date.now());
      if (x.upAt) return '<div class="sn-down up"><span>Down at <b>' + escapeHtml(x.readingTime) + '</b></span><span>Back up at <b>' + escapeHtml(x.upAt) + '</b></span><span class="sn-pill green">' + hm(n) + ' down</span>' + (x.fix ? '<span>Fix: <b>' + escapeHtml(x.fix) + '</b></span>' : '') + '</div>';
      // Joe 10/18: marked Resolved with no back up time, it stops counting when it was resolved; the box stays to fill the time in.
      const pill = x.status === 'RESOLVED' ? '<span class="sn-pill amber">No back up time' + (x.resolvedAt ? ' · marked fixed ' + escapeHtml(new Date(Date.parse(x.resolvedAt)).toLocaleTimeString('en-GB', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit' })) : '') + '</span>' : '<span class="sn-pill red">Still down' + (n !== null ? ' · ' + hm(n) : '') + '</span>';
      return '<div class="sn-down"><span>Down at <b>' + escapeHtml(x.readingTime) + '</b></span>' + pill +
        (ck ? '<label>Back up at<input type="time" data-up="' + id + '" aria-label="Back up at"></label><input class="sn-fixbox" data-fix="' + id + '" maxlength="1000" placeholder="What fixed it (saves when you leave the box)" aria-label="What fixed it"' + (x.status === 'RESOLVED' && x.fix ? ' value="' + escapeHtml(x.fix) + '"' : '') + '>' : '') + '</div>';
    }
    // A maintenance request: how long it can wait, and what maintenance has done with it (its work order).
    function requestLine(x) {
      if (!isKind(x, 'Maintenance Request')) return '';
      const wo = maint ? maint.workOrders.find(w => w.sourceEntryId === x.entryId) : null, M = window.UDPlantMaint;
      const state = !wo ? '<span class="sn-pill amber">Waiting for maintenance</span>' : '<span class="sn-pill blue">Work order ' + escapeHtml(wo.woNumber) + '</span>' +
        (M.isOpen(wo) ? '<span class="sn-pill ' + (wo.status === 'PARTS' ? 'amber' : 'green') + '">' + escapeHtml(M.statusWord(wo.status)) + '</span>' : '<span class="sn-pill green">Done' + (wo.completedAt ? ' ' + escapeHtml(stamp(wo.completedAt)) : '') + '</span>' + (wo.fixedNote ? ' Fixed: ' + escapeHtml(wo.fixedNote) : ''));
      return '<div class="sn-down req">' + state + (x.urgency ? '<span>Can wait: <b>' + escapeHtml(x.urgency.toLowerCase()) + '</b></span>' : '') + '</div>';
    }
    const tagOf = (x) => since(x.recordedAt) ? '<span class="tag new">NEW SINCE REPORT</span>' : '<span class="tag carry">CARRIED OVER' + (hoursAgo(x.recordedAt) ? ' · ' + hoursAgo(x.recordedAt) + ' h' : '') + '</span>';
    const busy = (box) => box.contains(document.activeElement) && document.activeElement.matches('input') && document.activeElement.value;

    function render() {
      watchRequestOrders();
      if (phone.matches) pane = 'current'; // phones: the entry only, no history tab
      const all = week(), rows = day(), ck = canSave(), mineId = entry && entry.mine && entry.mine.payload.entryId;
      document.getElementById('hstats').innerHTML = [['Entries 24 h', rows.length, ''], ['Needs attention', all.filter(r => r.status === 'OPEN').length, 'warn'], ['Monitor', all.filter(r => r.status === 'MONITOR').length, ''], ['Resolved', rows.filter(r => r.status === 'RESOLVED').length, 'good']]
        .map(([l, n, k]) => '<div class="' + (n ? k : '') + '"><b>' + n + '</b><span>' + l + '</span></div>').join('');
      document.getElementById('since').innerHTML = roundStart ? 'Since last report <b>' + escapeHtml(clockOf(roundStart)) + '</b>' : 'No report sent yet';
      document.querySelectorAll('[data-pane]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.pane === pane)));
      // Joe 10/15: anything in the last 24 hours not yet resolved puts a badge on the 24-Hour History tab.
      const needs = rows.filter(r => r.status !== 'RESOLVED').length;
      document.querySelector('[data-pane="history"]').innerHTML = '24-Hour History' + (needs ? ' <span class="sn-need" id="need-badge">' + needs + ' need' + (needs === 1 ? 's' : '') + ' review</span>' : '');
      document.getElementById('pane-current').hidden = pane !== 'current';
      document.getElementById('pane-history').hidden = pane !== 'history';
      if (drawnFor !== (phone.matches ? 'phone' : 'desk') + '|' + ck + '|' + layout()) drawForm(true);

      // The tiles: entries of each kind in the last 24 hours, and what is still open of it.
      const tally = (k) => { const of = all.filter(r => isKind(r, k)); return { n: rows.filter(r => isKind(r, k)).length, open: of.filter(r => r.status === 'OPEN').length, mon: of.filter(r => r.status === 'MONITOR').length }; };
      document.getElementById('lines').innerHTML = KINDS.map(([k, name, sub]) => {
        const t = tally(k);
        const words = t.open ? t.open + (k === 'Breakdown' ? ' still open' : k === 'Maintenance Request' ? ' waiting' : ' open') : t.mon ? t.mon + ' monitor' : t.n ? 'resolved' : sub || '';
        const dot = t.open ? 'st-down' : t.mon ? 'st-review' : t.n ? 'st-running' : '';
        const badge = t.open ? 'red' : t.mon ? 'amber' : t.n ? 'green' : '';
        return '<button type="button" data-kind="' + k + '"' + (k === kind ? ' class="active"' : '') + '><span class="qc-dot ' + dot + '"></span><span>' + name + (words ? '<small>' + escapeHtml(words) + '</small>' : '') + '</span><b class="' + badge + '">' + t.n + '</b></button>';
      }).join('');
      // Everything not resolved from before the last report, by kind ("1 breakdown and 1 handoff note").
      const old = all.filter(r => r.status !== 'RESOLVED' && !since(r.recordedAt)), carried = old.length;
      const parts = KINDS.map(([k]) => { const n = old.filter(r => isKind(r, k)).length; return n ? n + ' ' + (CARRY_WORD[k] || 'note') + (n === 1 ? '' : 's') : ''; }).filter(Boolean);
      const carry = document.getElementById('carry');
      carry.hidden = !carried;
      carry.innerHTML = '<b>Carried over</b>' + escapeHtml(parts.length > 1 ? parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1] : parts.join('')) + ' from earlier shifts stay' + (carried === 1 ? 's' : '') + ' on this list until someone marks ' + (carried === 1 ? 'it' : 'them') + ' Resolved.';
      const fresh = all.filter(r => since(r.recordedAt)).length;
      document.getElementById('lastrep').innerHTML = (lastReport ? '<b>Last report sent</b>' + escapeHtml(dayStamp(lastReport.at)) + (lastReport.by ? ' by ' + escapeHtml(String(lastReport.by).split('@')[0]) : '') : '<b>Last report sent</b>None yet') +
        '<span>' + fresh + ' new entr' + (fresh === 1 ? 'y' : 'ies') + ' will go in the next one</span>';

      // The kind picked: what is still open of it, then the new entry. Joe 10/15: handoff notes too stay until resolved.
      const name = KINDS.find(x => x[0] === kind)[1];
      const open = all.filter(r => isKind(r, kind) && r.status !== 'RESOLVED' && r.entryId !== mineId);
      document.getElementById('kind-title').textContent = name;
      document.getElementById('kind-count').textContent = rows.filter(r => isKind(r, kind)).length + ' in the last 24 hours · ' + all.filter(r => isKind(r, kind) && r.status !== 'RESOLVED').length + ' still open';
      document.getElementById('new-title').innerHTML = escapeHtml(NEW_WORD[kind]) + ' <span class="why">' + escapeHtml(WHY_WORD[kind] || 'fills in as you type; Start Another Entry empties the boxes') + '</span>';
      const box = document.getElementById('open-box');
      if (!busy(box)) box.innerHTML = open.length
        ? '<div class="sn-sec red">Still open <span class="n">' + open.length + '</span><span class="why">stays here until someone marks it Resolved</span></div><div class="sn-open">' + open.map(r => card(r, ck, tagOf(r))).join('') + '</div>'
        : '';

      // The log is not redrawn while someone is typing a review note in it.
      const hist = document.getElementById('history');
      if (!busy(hist)) hist.innerHTML = rows.map(r => card(r, ck, '', r.status !== 'RESOLVED')).join('') || '<div class="empty">No entries in the last 24 hours.</div>';
      if (askEntry) { const el = document.querySelector('#open-box [data-entry="' + CSS.escape(askEntry) + '"]'); if (el) { askEntry = ''; el.classList.add('sn-asked'); el.scrollIntoView({ block: 'center' }); } }
      document.getElementById('foot').textContent = pane === 'current' ? (ck ? (formType() === 'Maintenance Request' && entry && !entry.mine ? 'A new maintenance request goes to maintenance only when you press Send to Maintenance; until then it stays here, marked Not sent yet. ' : 'Every box saves by itself when you leave it. ') + 'Send Current Report sends what is new since the last report and empties the entry boxes; anything not resolved stays here until it is.' : 'View only.') : rows.length + ' entr' + (rows.length === 1 ? 'y' : 'ies') + ' in the last 24 hours.';
      sendRow();
      const st = L.screenState(app, 'plant');
      goLiveNote(st.live && st.owner !== 'new');
      document.getElementById('mode-text').textContent = st.live ? (st.open ? 'LIVE' : 'VIEW ONLY') : 'TEST COPY';
    }

    const record = (values, extra) => ({ type: U.SHIFT_TYPE, recordedAt: new Date().toISOString(), recordedBy: person && person.email || '', createdInApp: true, area: 'HANDOFF', payload: Object.assign({ section: 'HANDOFF', values }, extra) });

    // A review under an entry (a new status, a note, or both): shown at once, taken off again if the save fails.
    async function review(id, note, status, up) {
      const values = Object.assign({ Entry: note, Type: 'REVIEW', ParentId: id }, up || {}), mine = record(values, { followUpStatus: status });
      pending.push(mine);
      render();
      const ok = document.getElementById('saved');
      try {
        const done = await save('saveShiftNote', { values, notes: '', readingTime: clockNow(), followUpStatus: status });
        if (done && done.entryId) { mine.payload.entryId = done.entryId; render(); }
        showError('');
        ok.textContent = savedText() + ' · review on ' + (document.querySelector('[data-entry="' + CSS.escape(id) + '"] strong') || { textContent: 'the entry' }).textContent.split(' · ').slice(1).join(' · ');
        ok.hidden = false;
        setTimeout(() => { ok.hidden = true; }, 2500);
        setTimeout(() => { const i = pending.indexOf(mine); if (i >= 0) pending.splice(i, 1); render(); }, 20000);
      } catch (e) {
        const i = pending.indexOf(mine);
        if (i >= 0) pending.splice(i, 1);
        render();
        showError(e.message || String(e));
      }
    }
    function onCards(box) {
      box.addEventListener('change', e => {
        const t = e.target, all = week();
        if (t.matches('[data-up], [data-fix]')) {
          // Back up: the time (now when only the fix is typed) and what fixed it close the breakdown's down time.
          const id = t.dataset.up || t.dataset.fix, upBox = box.querySelector('[data-up="' + CSS.escape(id) + '"]'), fixBox = box.querySelector('[data-fix="' + CSS.escape(id) + '"]');
          const up = (upBox && upBox.value) || (t.matches('[data-fix]') && t.value.trim() ? clockNow() : ''), fix = fixBox ? fixBox.value.trim() : '';
          if (!up) return;
          if (upBox) upBox.value = ''; if (fixBox) fixBox.value = '';
          review(id, fix || 'Back up at ' + up, 'RESOLVED', Object.assign({ UpAt: up }, fix ? { Fix: fix } : {}));
          return;
        }
        if (t.matches('[data-status]')) {
          const id = t.dataset.status, note = (box.querySelector('[data-review="' + CSS.escape(id) + '"]') || {}).value || '';
          const text = note.trim() || 'Marked ' + FOLLOW[t.value];
          review(id, text, t.value);
        } else if (t.matches('[data-review]')) {
          const id = t.dataset.review, note = t.value.trim();
          if (!note) return;
          const x = all.find(r => r.entryId === id), sel = box.querySelector('[data-status="' + CSS.escape(id) + '"]');
          t.value = '';
          review(id, note, sel ? sel.value : (x && x.status) || 'OPEN');
        }
      });
      box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-review], [data-fix]')) e.target.blur(); });
    }
    onCards(document.getElementById('open-box'));
    onCards(document.getElementById('history'));

    // Each box of the new entry saves as it is left, once the entry has some words: the first save puts the entry on the log,
    // later boxes fill it in.
    // Joe 10/12: the Type drop-down and the buttons on the left stay in step; the boxes keep what is typed.
    document.getElementById('fields').addEventListener('change', (e) => {
      if (!e.target.matches('.sn-type') || !KINDS.some(x => x[0] === e.target.value) || e.target.value === kind) return;
      kind = e.target.value;
      render();
    });
    async function saveEntry(e, sendNow) {
      if (!canSave() || !entry) return;
      if (e && e.target && e.target.matches('.sn-shift')) entry.shiftPicked = true;
      const f = document.getElementById('fields'), v = (c) => { const n = f.querySelector('.' + c); return n ? n.value.trim() : ''; };
      const text = v('sn-entry') || (v('sn-fix') ? 'Breakdown' : ''), notes = v('sn-notes'), mine0 = entry.mine, cur = entry;
      // A maintenance request not sent yet: what is typed is kept as the draft; nothing goes to maintenance until Send.
      if (!mine0 && v('sn-type') === 'Maintenance Request' && !sendNow) {
        const d = {}; DRAFT_BOXES.forEach(c => { d[c] = v(c); });
        writeDraft(['sn-equip', 'sn-entry', 'sn-notes'].some(c => d[c]) ? d : null);
        const last = document.getElementById('form-last');
        last.textContent = unsent() ? 'Not sent yet' : 'Press Send to send it to maintenance'; last.classList.remove('done'); last.classList.toggle('bad', unsent());
        sendRow();
        return;
      }
      if (!text && !notes) {
        if (sendNow) { const last = document.getElementById('form-last'); last.textContent = 'Type what\'s wrong first'; last.classList.add('bad'); const x = f.querySelector('.sn-entry'); if (x) x.focus(); }
        return;
      }
      // Joe 10/18: a breakdown with what fixed it, or marked Resolved, is back up: the Back up at box takes the time now when empty,
      // so its down time stops (it can be changed).
      const upBox = f.querySelector('.sn-up');
      if (upBox && !upBox.value && v('sn-type') === 'Breakdown' && (v('sn-fix') || v('sn-follow') === 'RESOLVED')) upBox.value = clockNow();
      const values = Object.assign({ Entry: text, Type: v('sn-type') || 'Handoff', Equipment: v('sn-equip') }, v('sn-up') ? { UpAt: v('sn-up') } : {}, v('sn-fix') ? { Fix: v('sn-fix') } : {}, v('sn-urgency') ? { Urgency: v('sn-urgency') } : {});
      const fields = { values, notes, shift: v('sn-shift') || shiftNow(), readingTime: v('sn-time') || clockNow(), followUpStatus: v('sn-follow') || 'OPEN' };
      const mine = mine0 || record(values, { entryId: 'pending-' + Date.now(), shift: fields.shift });
      Object.assign(mine.payload, { values, shift: fields.shift, readingTime: fields.readingTime, notes, followUpStatus: fields.followUpStatus });
      mine.status = fields.followUpStatus;
      if (!mine0) { cur.mine = mine; pending.push(mine); }
      const last = document.getElementById('form-last');
      last.textContent = 'Saving…'; last.classList.remove('bad', 'done');
      render();
      try {
        const done = await cur.fill.send(fields);
        if (done && done.entryId) mine.payload.entryId = done.entryId;
        if (done && done.shift) mine.payload.shift = done.shift;
        showError('');
        if (!mine0 && values.Type === 'Maintenance Request') writeDraft(null);
        if (entry === cur) { last.textContent = '✓ ' + (sendNow ? 'Sent to maintenance ' + clockOf(Date.now()) : savedText() + ' · on the log'); last.classList.add('done'); document.getElementById('another').hidden = false; }
        sendRow();
        render();
        setTimeout(() => { const i = pending.indexOf(mine); if (i >= 0 && journal.some(d => d.recordId === mine.payload.entryId)) { pending.splice(i, 1); render(); } }, 20000);
      } catch (e) {
        if (!cur.fill.id) { const i = pending.indexOf(mine); if (i >= 0) pending.splice(i, 1); cur.mine = null; }
        if (entry === cur) { last.textContent = sendNow ? 'Not sent' : 'Not saved'; last.classList.add('bad'); }
        sendRow();
        render();
        showError(e.message || String(e));
      }
    }
    document.getElementById('fields').addEventListener('change', (e) => saveEntry(e, false));
    document.getElementById('fields').addEventListener('input', () => { if (entry && !entry.mine && formType() === 'Maintenance Request') sendRow(); });
    document.getElementById('mr-send').onclick = () => saveEntry(null, true);
    document.getElementById('another').onclick = () => { drawForm(); render(); };
    document.getElementById('lines').addEventListener('click', e => {
      const b = e.target.closest('[data-kind]');
      if (!b) return;
      kind = b.dataset.kind;
      if (formEmpty()) drawForm();
      else {
        // Something is typed: keep it and change its Type (a saved entry saves the new Type).
        const t = document.querySelector('#fields .sn-type');
        if (t && t.value !== kind) { t.value = kind; t.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      render();
    });
    document.getElementById('panes').addEventListener('click', e => {
      const b = e.target.closest('[data-pane]');
      if (!b) return;
      pane = b.dataset.pane;
      history.replaceState(null, '', pane === 'history' ? '?view=history' : location.pathname);
      render();
    });
    phone.addEventListener('change', render);

    requireSignIn(async (user) => {
      const { db } = await start();
      const fail = (what) => (e) => showError('Could not read ' + what + ': ' + e.message);
      watchPerson(db, user, p => { person = p; render(); }, { withEmail: true });
      onSnapshot(doc(db, 'config', 'app'), s => { app = s.data() || {}; render(); });
      // Maintenance's work orders (what became of each request), read for the requests on the list (watchRequestOrders).
      woDb = db;
      // A new report empties the entry boxes for the next round; open items stay on the list.
      watchRound(db, (at, data) => { const first = roundStart === null; roundStart = at; lastReport = data; if (!first && entry && entry.round !== at && !unsent()) drawForm(); render(); });
      // 30 days of the log, so anything still open from earlier shifts stays on the list until it is resolved.
      let unsub = null, day0 = '';
      const watch = () => { const t = today(); if (t === day0) return; day0 = t; if (unsub) unsub(); unsub = onSnapshot(query(collection(db, 'plantJournal'), where('type', '==', U.SHIFT_TYPE), where('date', 'in', Array.from({ length: KEEP_DAYS }, (_, n) => L.addDays(t, -n)))), s => { journal = s.docs.map(d => d.data()); render(); }, fail('the log')); };
      watch();
      // The plant's own shifts; the drop-down follows the clock until someone picks a shift or the entry is saved.
      onSnapshot(doc(db, 'plantShifts', 'fac_uniontown'), s => { shifts = shiftsFor(s.exists() ? s.data() : null, 'fac_uniontown'); followClock(true); }, () => {});
      function followClock(redraw) {
        const box = document.getElementById('shift-now');
        if (!box || !entry || entry.shiftPicked || entry.mine) return;
        const now = shiftNow();
        if (redraw) box.innerHTML = shiftOptions(now);
        box.value = now;
      }
      setInterval(() => { watch(); render(); followClock(false); }, 60000);
      render();
    });
  </script>
</body>
</html>
