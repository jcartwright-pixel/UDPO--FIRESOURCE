name: Distribution app tests

# The new Firebase distribution app (this repository). Runs its tests against Google's local emulators with
# made-up sheets: no Firebase project, no Google Sheets and no production data are touched.
# A branch is tested once, through its pull request (its push ran the same tests a second time, on a second machine, at the
# same moment, and a red push run blocked a green pull request run); main is tested on every push, which starts the release.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: npm ci
      - name: Unit tests (dispatch rules, transfer, save checks, sign-in)
        run: npm test
      - name: Database tests on the local emulator (transfer, saves, security rules)
        run: npm run test:emulator
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Screen tests on the local emulator (Daily, Weekly, fit to one page, live update)
        # Pictures go outside functions/: the emulator reloads the server when a file appears there, which slowed
        # saves mid-test and made the Route Editor checks time out.
        # In 3 parts, fresh emulators each (tools/browser-parts.cjs): one long session ran the machine out of memory.
        # 11-9-26: the job kept being killed for memory part way through. Every 20 seconds the log shows the memory used and
        # the biggest programs (lines starting MEMORY), so the next kill shows which one grew.
        # 11-10-26: one node program jumps from about 250 MB to 12 GB within 40 seconds, about 10 minutes into a part (seen in
        # plant-station-boxing and after plant-order). Every 5 seconds now, with each program's command line, and no node
        # program may take more than 4 GB: it stops with "heap limit" and its name instead of taking the machine down.
        # 11-10-26: plant-load-numbers grew past 13 GB with the 4 GB limit on, so the memory is outside the JavaScript heap.
        # tools/memory-guard.sh now stops a screen test past 3 GB and prints where it was (lines starting STUCK).
        env:
          NODE_OPTIONS: --max-old-space-size=4096 --report-on-signal --report-signal=SIGUSR2 --report-directory=${{ runner.temp }}/node-reports
          REPORTS: ${{ runner.temp }}/node-reports
        run: |
          bash ../tools/memory-guard.sh &
          mkdir -p "$RUNNER_TEMP/shots" && SHOTS_DIR="$RUNNER_TEMP/shots" node ../tools/browser-parts.cjs 3
      - name: Keep the screen pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distribution-app-screens
          path: ${{ runner.temp }}/shots/
          if-no-files-found: ignore
          retention-days: 14
