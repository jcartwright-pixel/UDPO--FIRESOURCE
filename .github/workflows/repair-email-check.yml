name: Repair email check (read only)
# Joe 11/4 (approved): why truck 224001's Lessor email did not go. Reads the live email settings, the repair email log and
# the write-up's notes, and the server's warning lines. Writes nothing. Addresses are hidden. This branch is never merged.
on:
  push:
    branches: [claude/repair-email-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    environment: distribution-production
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Read
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}
        run: |
          set -euo pipefail
          printf '%s' "$SA" > "$RUNNER_TEMP/k.json"
          node -e "if (require('$RUNNER_TEMP/k.json').project_id !== 'ud-distribution') process.exit(1)"
          KEY="$RUNNER_TEMP/k.json" NODE_PATH="$PWD/node_modules" node ../tools/repair-email-check.cjs
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/k.json" >/dev/null 2>&1 || true
          gcloud logging read 'severity>=WARNING AND (textPayload:"Lessor" OR textPayload:"mail" OR jsonPayload.message:"Lessor" OR jsonPayload.message:"mail")' --project ud-distribution --freshness=2d --limit 30 --format='value(timestamp,severity,textPayload,jsonPayload.message)' 2>&1 | sed -E 's/[A-Za-z0-9._%+-]+@/***@/g' || true
          rm -f "$RUNNER_TEMP/k.json"
