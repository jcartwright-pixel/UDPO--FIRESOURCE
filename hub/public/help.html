<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#074c84">
  <link rel="icon" href="img/app-icon/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="img/app-icon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Help · United Dairy Hub</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/hub.css">
</head>
<body class="hub-page" data-help="home">
  <div class="signin" id="signin" hidden>
    <h1>United Dairy Hub</h1>
    <p>Sign in with your United Dairy Google account.</p>
    <button id="signin-button" type="button">Sign in with Google</button>
    <div class="notice error" id="signin-error" hidden></div>
  </div>
  <div id="screen" hidden>
    <div class="topbar">
      <span class="who" id="who"></span>
      <button id="signout" type="button">Sign out</button>
    </div>
    <div class="notice error" id="error" hidden></div>
    <div class="head"><div class="title"><span class="eyebrow">United Dairy Hub</span><h1>Help</h1></div></div>
    <div class="hub-help" id="help">Reading the help&hellip;</div>
  </div>
  <script type="module">import { requireSignIn, escapeHtml as e } from './js/shell.js';
// help.md is the one place the help words live: "## Part" with "id:" and "screens:" lines, numbered steps, "### Buttons",
// "> tip" and "!> Do not" lines.
const inline = (t) => e(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>');
function render(md) {
  let out = '', list = '';
  const close = () => { if (list) { out += '</' + list + '>'; list = ''; } };
  md.split('\n').forEach(line => {
    let m;
    if (/^(id|screens):/.test(line)) return;
    if ((m = /^# (.+)/.exec(line))) { close(); return; }
    if ((m = /^## (.+)/.exec(line))) { close(); out += '<h2>' + inline(m[1]) + '</h2>'; return; }
    if ((m = /^### (.+)/.exec(line))) { close(); out += '<h3>' + inline(m[1]) + '</h3>'; return; }
    if ((m = /^!> (.+)/.exec(line))) { close(); out += '<p class="dont">' + inline(m[1]) + '</p>'; return; }
    if ((m = /^> (.+)/.exec(line))) { close(); out += '<p class="tip">' + inline(m[1]) + '</p>'; return; }
    if ((m = /^\d+\. (.+)/.exec(line))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    if ((m = /^- (.+)/.exec(line))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    if (!line.trim()) { close(); return; }
    close(); out += '<p>' + inline(line) + '</p>';
  });
  close();
  return out;
}
requireSignIn(async () => {
  const md = await (await fetch('help.md', { cache: 'no-cache' })).text();
  const box = document.getElementById('help');
  box.innerHTML = render(md);
  // Each part gets its id, so the ? on a screen opens its own part.
  const ids = [...md.matchAll(/^## .+\nid: (\S+)/gm)].map(x => x[1]);
  box.querySelectorAll('h2').forEach((h, i) => { if (ids[i]) h.id = ids[i]; });
  const want = location.hash.slice(1);
  if (want && document.getElementById(want)) document.getElementById(want).scrollIntoView();
});</script>
</body>
</html>
